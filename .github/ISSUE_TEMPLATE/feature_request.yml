name: Feature request
description: Propose a new F-Layer capability or contract
title: ""
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible after this feature exists?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which core/provider/deployment/integration boundary does this affect?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable evidence would prove the feature complete?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing approaches, workarounds, or related contracts.
