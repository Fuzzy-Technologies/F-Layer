name: Bootstrap issue metadata

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/bootstrap-issue-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Apply issue metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          PRIORITY_FIELD = 22639629
          EFFORT_FIELD = 22639632
          PRIORITY = {"High": 39613419, "Medium": 39613420, "Low": 39613421}
          EFFORT = {"High": 39613422, "Medium": 39613423, "Low": 39613424}

          features = {
              1:  ("High", "Medium", 1),
              4:  ("High", "High",   1),
              5:  ("High", "High",   1),
              6:  ("High", "High",   1),
              7:  ("High", "Medium", 1),
              12: ("High", "High",   1),
              13: ("High", "Medium", 1),
              3:  ("High", "Medium", 2),
              9:  ("High", "High",   2),
              14: ("High", "Medium", 2),
              8:  ("Medium", "High", 3),
              15: ("Medium", "Medium", 3),
              10: ("Medium", "High", 4),
              11: ("Medium", "High", 4),
              16: ("Medium", "High", 4),
          }

          tasks = {
              2:  ("High", "Medium", 1),
              17: ("High", "Medium", 1),
              18: ("High", "Medium", 1),
              19: ("High", "High",   1),
              20: ("High", "High",   1),
              21: ("High", "Medium", 1),
              22: ("High", "High",   1),
              23: ("High", "Medium", 1),
              24: ("High", "Medium", 2),
              25: ("High", "Medium", 2),
              26: ("High", "High",   2),
              27: ("Medium", "High", 3),
              28: ("Medium", "Medium", 3),
              29: ("Medium", "High", 4),
              30: ("Medium", "Medium", 4),
              31: ("Medium", "High", 4),
          }

          parents = {
              1: [17],
              4: [2, 18],
              5: [19],
              6: [20],
              7: [21],
              12: [22],
              13: [23],
              14: [24],
              3: [25],
              9: [26],
              8: [27],
              15: [28],
              10: [29],
              11: [30],
              16: [31],
          }

          def Request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"{api}/{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(request) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          for name in ("feature", "task"):
              try:
                  Request("POST", f"repos/{repo}/labels", {
                      "name": name,
                      "color": "ededed",
                  })
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise

          for issueType, mapping, label in (
              ("Feature", features, "feature"),
              ("Task", tasks, "task"),
          ):
              for number, (priority, effort, milestone) in mapping.items():
                  Request("PATCH", f"repos/{repo}/issues/{number}", {
                      "type": issueType,
                      "milestone": milestone,
                      "labels": [label],
                      "issue_field_values": [
                          {"field_id": PRIORITY_FIELD, "value": PRIORITY[priority]},
                          {"field_id": EFFORT_FIELD, "value": EFFORT[effort]},
                      ],
                  })

          for parent, children in parents.items():
              for child in children:
                  childIssue = Request("GET", f"repos/{repo}/issues/{child}")
                  try:
                      Request("POST", f"repos/{repo}/issues/{parent}/sub_issues", {
                          "sub_issue_id": childIssue["id"],
                      })
                  except urllib.error.HTTPError as exc:
                      if exc.code != 422:
                          raise

          print("F-Layer issue metadata bootstrap completed.")
          PY
