name: Release artifact validation

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-artifacts:
    name: Release artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed revision and local tag history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Restore the remote annotated tag after checkout
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Install the pinned development and build tools
        run: python -m pip install -e '.[dev]'
      - name: Validate the complete release candidate on tag pushes
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/validate.py
      - name: Build and audit reproducible wheel and source distributions
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" = "tag" ]; then
            python tools/release_validation.py --tag "$RELEASE_TAG"
          else
            python tools/release_validation.py
          fi
      - name: Resolve VPN dependency wheels for an isolated installation
        run: |
          wheels=(_build/release/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip download --only-binary=:all: \
            --dest "$RUNNER_TEMP/flayer-vpn-wheels" "${wheels[0]}[vpn]"
      - name: Test the audited wheel as an installed application
        env:
          FLAYER_DISTRIBUTION_DIRECTORY: _build/release/dist
          FLAYER_DISTRIBUTION_WHEELHOUSE: ${{ runner.temp }}/flayer-vpn-wheels
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m pytest tests/integration/test*distribution.py --no-cov
      - name: Upload audited distribution preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flayer-release-preview
          path: _build/release/dist
          if-no-files-found: error
      - name: Upload reproducibility and ownership evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flayer-release-evidence
          path: _build/release/build-evidence.json
          if-no-files-found: error
