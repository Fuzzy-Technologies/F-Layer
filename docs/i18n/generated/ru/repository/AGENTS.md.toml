body = '''
# AGENTS.md

## Назначение

Этот файл — обязательная отправная точка для ИИ-агентов, сессий Codex, помощников в IDE, автоматизации и других программных агентов, работающих с F-Layer.

Прежде чем изменять код или документацию, прочитайте [DEVELOPMENT_PROTOCOL.md](DEVELOPMENT_PROTOCOL.md) и соблюдайте его требования. Это основной протокол разработки репозитория.

## Границы репозитория

- Работайте только внутри этого репозитория, если владелец явно не разрешил использовать другой репозиторий или внешнюю систему для текущей задачи.
- Не просматривайте и не изменяйте родительские каталоги, соседние репозитории, домашние данные пользователя, подключённые общие ресурсы и другие локальные данные, не относящиеся к задаче.
- Наличие учётных данных или инструментов само по себе не даёт разрешения на доступ к инфраструктуре.
- Читайте только необходимые для задачи файлы; используйте целевой поиск и небольшие фрагменты вместо бесконтрольной выгрузки содержимого.

## Безопасность инфраструктуры

F-Layer управляет инфраструктурой. Во время тестирования и разработки нельзя изменять реальные облачные ресурсы, если владелец явно не разрешил именно эту операцию.

По умолчанию:

- тесты провайдеров используют имитации, тестовые данные или изолированные ресурсы, определённые в репозитории;
- операции создания, изменения и удаления ресурсов в реальных аккаунтах запрещены;
- учётные данные и секреты не передаются в контекст модели и не попадают в коммиты;
- очистка, откат, идемпотентность и поведение при ошибках входят в обязательные требования к компонентам.

## Язык

- Исходный код, комментарии, docstrings, сообщения коммитов, ADR, основная документация, схемы, команды CLI и метаданные репозитория пишутся только на английском.
- Файлы локализации могут содержать текст на соответствующем языке.
- Общение с пользователем может вестись на его языке.

## Обязательные правила разработки

- Соблюдайте `DEVELOPMENT_PROTOCOL.md`.
- Изменения, влияющие на архитектуру, требуют ADR или явно зафиксированного проектного решения.
- Если на вопрос могут ответить воспроизводимые инструменты и тесты, используйте их.
- Делайте изменения небольшими, удобными для ревью и ограниченными одной целью.
- Не смешивайте изменения поведения с посторонним форматированием или очисткой.
- Не объявляйте работу завершённой без необходимых тестов и подтверждённых результатов.
- Не добавляйте в отслеживаемые файлы идентификаторы частной инфраструктуры, локальные пути, учётные данные, токены и секреты.

## Работа с Git

- `master` — стабильная, выпущенная версия.
- `develop` — интеграционная ветка.
- Обычная работа ведётся в ветках `feature/*`, `fix/*`, `release/*` или `hotfix/*`.
- Не отправляйте обычные изменения реализации напрямую в `master` или `develop`.
- Автоматизированные агенты могут готовить ветки, коммиты и pull requests в рамках разрешённой работы, но не должны сливать собственные PR без явной команды владельца.
- Не выполняйте force push в защищённые ветки и не переписывайте опубликованную историю.

## Защищённые файлы правил

`AGENTS.md` и `DEVELOPMENT_PROTOCOL.md` находятся под управлением владельца. Агенты могут читать их и ссылаться на них, но не могут изменять, заменять, удалять или ослаблять их требования без явного разрешения владельца.

## Завершение работы

Прежде чем сообщить о завершении:

1. просмотрите точный diff;
2. выполните целевые тесты;
3. выполните полный стандартный набор проверок, если он доступен;
4. убедитесь, что в изменения не попали секреты, частные идентификаторы и посторонние файлы;
5. при необходимости обновите документацию;
6. сообщите фактические результаты, ошибки и оставшуюся неопределённость.

Если обязательную проверку выполнить не удалось, так и укажите. Никогда не отмечайте невыполненную проверку как PASS.
'''
