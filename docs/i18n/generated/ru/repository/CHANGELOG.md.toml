body = '''# История изменений F-Layer

Хронологическая история выпущенных возможностей F-Layer, совместимости, документации и требований безопасности. Записи релизов оформляются по [ADR 0014](docs/adr/0014-scoped-releases-and-changelog.md).

# Основная версия 2

Развёртывание собственного VPN и профили устройств через установленный CLI.

## Минорная версия 2.0

### Исправление 0 — v2.0.0 — 2026-10-11

#### Кратко

- Разверните AmneziaWG 3.1 и VLESS Reality на своём сервере Yandex Cloud из одной приватной конфигурации. Экспортируйте существующие профили устройств и нативные QR-коды AmneziaVPN без изменения ключей и сервера.

#### Добавлено

- Инициализация, подготовка, развёртывание, проверка состояния, восстановление и удаление приватного проекта VPN через установленный CLI.
- Настройка размера сервера, доступа администратора, идентификаторов устройств и полной либо раздельной маршрутизации IPv4.
- Локальный `vpn export --qr` для обоих протоколов с проверкой принадлежности артефактов, приватными правами на выходные файлы и нативными профилями AmneziaVPN.
- VPN Quick Start и инструкции для ИИ-оператора на английском, русском и китайском.

#### Исправлено

- Развёртывание/восстановление установленным пакетом и проверки идентичности SSH-сервера/готовности служб.
- Совместимость импорта нативных профилей AmneziaVPN и QR-кодов.

#### Изменено

- Собственный VPN стал основным сценарием версии 2.0; существующие команды инфраструктуры, SSH-шлюза и диагностики сохранены.
- Разовые расследования, служебные журналы и временные аудиты исключены из опубликованной документации и архивов исходников релиза.

# Основная версия 1

Первая версионная основа управления инфраструктурой. Проверка работы с реальным облачным аккаунтом остаётся ответственностью оператора.

## Минорная версия 1.2

### Исправление 1 — v1.2.1 — 2026-10-09

#### Кратко

- Практические инструкции по началу работы и более понятные руководства на английском, русском и китайском. Написанные переводы проверены АИной и больше не показывают уведомления о черновике. Исполняемый код и CLI остаются совместимыми с 1.1.0.
- Завершение release-1.2 с проверкой закрытого майлстоуна перед публикацией; предварительный тег v1.2.0 и его файлы сохранены.

#### Добавлено

- Quick Start на трёх языках с локальными проверками без сети, справкой и переходом к развёртыванию.
- Фирменный слайд в README и документации, компактный логотип в шапке и иконка сайта.
- Записи редакторского и технического ИИ-ревью всех 18 написанных страниц RU/ZH-CN, связанные с текущими английскими исходниками и проверенными текстами переводов.

#### Изменено

- Поддерживаемые сценарии облачного сервера, защищённого SSH-шлюза и диагностики объясняются непосредственно инженерам и потенциальным покупателям.
- Для стабильной публикации требуется завершённый и закрытый штатный майлстоун.
- Сведения о ревью одобренных страниц хранятся в метаданных без видимого уведомления; отсутствующие и устаревшие переводы по-прежнему явно показывают английский текст.

#### Исправлено

- Обрезание слайдов документации и чрезмерный размер логотипа в шапке.
- Русские формулировки о принадлежности ресурсов, китайская терминология виртуальных машин, локализованные ссылки и единые инструкции установки v1.2.1.
- Неавторизованное ИИ-одобрение отклоняется; изменение исходника или перевода делает одобрение неактуальным.

### Исправление 0 — v1.2.0 — 2026-10-08

#### Кратко

- Предварительная публикация: преждевременный статус стабильного релиза отозван 2026-10-08, поскольку приёмка release-1.2 ещё не завершена. Существующий тег v1.2.0 и файлы сохранены; последним стабильным релизом на тот момент остаётся v1.1.0.
- Полная документация репозитория и маршруты EN/RU/ZH-CN с явным состоянием перевода, исправленная зависимость сборки документации. Существующее поведение исполняемого кода и CLI 1.1.0 поддерживается; тексты RU/ZH-CN пока остаются черновыми.

#### Добавлено

- Пофайловый реестр документации с явной категорией и обоснованием для каждого отслеживаемого файла, включая будущие файлы установленных категорий.
- Навигация по основному Markdown: введению в репозиторий, правилам, архитектуре, ADR и шаблонам, руководствам разработчика и истории релизов.
- Покрытие API установленного wheel для исполняемого модуля CLI и вызываемых протоколов, а также записи о приватных определениях, доступных только в исходниках.
- Справочник реализованной архитектуры со схемами состава, жизненного цикла и восстановления, документации и распространения.
- Строгие сборки EN/RU/ZH-CN, локализованная навигация, 18 написанных черновых страниц, явная подстановка английского текста и материалы для ревью, связанные с хешами исходников.

#### Исправлено

- Генерируемые страницы репозитория сохраняют ссылки на черновики RU/ZH-CN как ссылки на исходники вместо переходов к несуществующим основным страницам. Регрессионные проверки охватывают оба языка и сохранение фрагментов заголовков.
- Примеры установки снимка на всех трёх языках выбирают `v1.2.0`, а не отправляют читателя в опережающую ветку разработки.

#### Изменено

- Для всего пакета требуется точное соответствие перечня файлов и байтов исходников установленному wheel, включая приватные модули и исполняемую точку входа.
- Перед публикацией проверяются отображаемые якоря API, все локальные ссылки, достижимость страниц репозитория, выравнивание Markdown-таблиц и явная классификация файлов.
- Текущие черновые переводы связаны с фактическими хешами английских исходников. Состояния draft, stale, missing, review и approved различаются; переводы генерируемого API явно остаются отсутствующими.

#### Безопасность

- Зафиксированная версия setuptools для документации обновлена с `80.9.0` до исправленной `83.0.0` для GHSA-h35f-9h28-mq5c / CVE-2026-59890. Остальные версии зависимостей документации и сборщик пакетов Hatchling не изменены.
- Сохранены статическое обнаружение API и запрет выполнения импортов, проверка принадлежности исходников, ограниченные изменения в облаке и публикация Pages только из `master`. Этот релиз не подразумевает человеческого одобрения переводов, готовности реального облака или загрузки в PyPI.

## Минорная версия 1.1

### Исправление 0 — v1.1.0 — 2026-10-05

#### Кратко

- Установка F-Layer как типизированного пакета Python с командой `flayer`, практические руководства по настройке и шлюзу, проверенные воспроизводимые релизные пакеты. Поведение исполняемого кода 1.0.0 сохраняется.

#### Добавлено

- Метаданные типов PEP 561, устанавливаемая консольная команда и единый явно заданный источник версии для исполняемого кода и метаданных пакета.
- Проверки установки пакета без сети и повторной сборки из архива исходников.
- Аудит воспроизводимости wheel и архива исходников, проверка метаданных и RECORD, принадлежности отслеживаемым исходникам и доступный для скачивания отчёт сборки.
- Предварительные файлы сборок CI и отдельный защищённый ручной workflow PyPI, требующий явной настройки и подтверждения владельца.
- Руководства по установке, конфигурации провайдера, выводу CLI и первому развёртыванию защищённого шлюза с явной принадлежностью ресурсов.

#### Изменено

- Семейство логотипов FL в стиле FuzzyRoutines и более понятная навигация руководства.
- Столбцы Markdown-таблиц выравниваются по содержимому; форматирование проверяется в CI.
- Описаны установка стабильного тега и выпущенная консольная команда; история релизов включена в архивы исходников и генерируемую документацию.

#### Безопасность

- Отклоняются постороннее, изменённое, отсутствующее и опасное содержимое архивов, а также распознаваемые учётные данные; changelog включён как один из явно разрешённых корневых файлов.
- Сохранены требования 1.0.0 к принадлежности ресурсов и разрешению на изменения. Публикация GitHub Release не включает загрузку в PyPI и не подтверждает доступ к реальному облаку.

## Минорная версия 1.0

### Исправление 0 — v1.0.0 — 2026-10-05

#### Кратко

- Первая версионная основа F-Layer для явно управляемых сред Yandex Cloud: конфигурация, проверка, создание и удаление инфраструктуры, подготовка защищённого SSH-шлюза и диагностика с ограничением нагрузки.

#### Добавлено

- Строгая конфигурация TOML, явная принадлежность стека, надёжное сохранение состояния и отдельные интерфейсы желаемого и наблюдаемого состояния ресурсов.
- Инвентаризация Yandex Cloud и жизненный цикл шести типов ресурсов: сетей, подсетей, групп межсетевого экрана, публичных адресов, загрузочных дисков и виртуальных машин.
- Восстанавливаемые операции create/status/destroy с разрешением на изменения в заданной области, идемпотентностью, восстановлением прерванных действий и очисткой в обратном порядке.
- Профиль защищённого SSH-шлюза, конфигурация гостевой системы с владельцем root, явные правила доступа администраторов и устройств, а также проверяемые файлы управляемого проекта.
- Локальные команды status/check и HTTP-проверки health/benchmark, запускаемые по разрешению, с ограничениями времени, числа запросов и размера ответа.
- Английская документация API из установленного wheel, фирменный стиль Fuzzy Technologies, явные маршруты отсутствующих переводов RU/ZH и публикация Pages только из `master`.
- Изоляция тестов от сети, воспроизводимый Python CI, завершение связанных Task и безопасная очистка слитых веток.

#### Изменено

- Начальные метаданные версии заменены явной версией исходников и пакета 1.0.0. Changelog и пример шлюза включены в архивы исходников.
- ADR 0014 описывает выбор изменений релиза по майлстоуну и понятные человеку changelogs; в описаниях релизов фиксируются точные принятые изменения исходников.

#### Безопасность

- Перед изменениями в облаке требуются явная принадлежность ресурсов и разрешение; чужие ресурсы и небезопасная подмена файлов отклоняются.
- Сохраняются только идентификаторы ресурсов, необходимые для восстановления и очистки. Учётные данные, закрытые ключи, созданные комплекты файлов и локальное состояние не отслеживаются Git.
- Диагностика не выбирает цели неявно. Облачный статус RUNNING не подтверждает готовность сервисов гостевой системы. Тесты используют изолированные имитации вместо реальных изменений в облаке; живое развёртывание и SSH-доступ не входят в подтверждения релизных проверок.

