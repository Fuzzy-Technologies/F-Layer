body = '''
# Участие в разработке F-Layer

В F-Layer принят процесс разработки Fuzzy Technologies.

Прежде чем начать:

1. прочитайте [AGENTS.md](AGENTS.md) и [DEVELOPMENT_PROTOCOL.md](DEVELOPMENT_PROTOCOL.md);
2. создайте отдельную ветку `feature/*` или `fix/*` от `develop`;
3. свяжите реализацию с задачей GitHub типа Task;
4. добавьте проверки и результаты тестирования, соответствующие изменённому компоненту;
5. откройте pull request в `develop`, используя шаблон репозитория.

Не добавляйте в коммиты учётные данные, идентификаторы частной инфраструктуры, локальные абсолютные пути и секреты конкретного окружения.

Если изменение затрагивает архитектуру, вместе с реализацией необходимо подготовить соответствующий ADR.
'''
