body = "# Протокол разработки F-Layer\n\n## Статус и полномочия\n\nВерсия протокола: `0.1`  \nПроект: **F-Layer by Fuzzy Technologies**\n\nЭтот документ закрепляет постоянные правила разработки репозитория. Его должны соблюдать разработчики, ИИ-агенты, скрипты и задания CI.\n\n## 1. Основной принцип\n\nРазработка ведётся в следующем порядке:\n\n```text\narchitecture / contract\n→ implementation\n→ tests\n→ evidence\n→ documentation\n→ review\n```\n\nПравдоподобный вид кода ещё не означает, что работа завершена. Для завершения нужны применимые тесты и подтверждённые результаты.\n\n## 2. Назначение проекта\n\nF-Layer — модульная платформа автоматизации инфраструктуры для развёртывания, управления и интеграции защищённых облачных сред.\n\nЯдро не должно зависеть от одного облачного провайдера, транспортного или сетевого протокола, профиля развёртывания, клиентского приложения либо частной и локальной инфраструктуры Fuzzy Technologies.\n\nОсобенности провайдеров, способов развёртывания и интеграций реализуются через явно определённые интерфейсы, а не встраиваются в ядро.\n\n## 3. Язык репозитория\n\nОсновной язык репозитория — английский: это относится к исходному коду, комментариям, docstrings, документации, ADR, коммитам, workflows, схемам, именам CLI/API, issues и pull requests. Обычное исключение — файлы локализации.\n\n## 4. Планирование в GitHub\n\nИспользуйте штатные метаданные GitHub как основной источник сведений о плане.\n\n```text\nMilestone\n└── Feature\n    ├── Task\n    └── Task\n```\n\nУ каждой запланированной Feature и Task должны быть штатные поля Type, Priority, Effort, Milestone, штатная связь родительской и дочерней задачи, а во время активной работы — Assignee.\n\nЗаголовки описывают работу. Не дублируйте в них метаданные планирования.\n\n## 5. Ветки и выпуск релизов\n\nОсновные ветки:\n\n- `master` — стабильное, выпущенное состояние;\n- `develop` — интеграционная ветка следующего релиза;\n- `feature/<name>` — реализация фичи или задачи от `develop`;\n- `fix/<name>` — исправление вне релизной процедуры от `develop`;\n- `release/<version>` — стабилизация релиза;\n- `hotfix/<name-or-version>` — срочное исправление от `master`.\n\nОбычный процесс:\n\n```text\nfeature/* or fix/* → develop → release/X.Y.Z → master → tag vX.Y.Z\n                                           └──────────→ develop\n```\n\nНе отправляйте обычные изменения реализации напрямую в `master` или `develop`. Для обычных PR в `develop` по умолчанию используется squash merge.\n\nПодробные правила описаны в [docs/RELEASE_WORKFLOW.md](docs/RELEASE_WORKFLOW.md).\n\n## 6. Pull requests\n\nУ каждого PR с реализацией должны быть:\n\n- целевая ветка `develop`, кроме явно выделенных процедур release, hotfix или публикации;\n- исполнитель;\n- штатный Milestone, совпадающий с основной задачей реализации;\n- подходящая метка PR, если она доступна;\n- явная закрывающая ссылка на каждую выполненную Task;\n- описание изменений и результаты проверки;\n- сведения о безопасности и совместимости, если они применимы.\n\nДля закрытия Task поддерживаются ключевые слова `Closes`, `Fixes`, `Resolves` и `Implements`.\n\nПо умолчанию слияние требует ревью человеком. Автоматизированные агенты не должны сливать собственные PR без явной команды владельца.\n\n## 7. Стиль Python\n\nОсновные правила Python приведены в [docs/development/PYTHON_CODE_STYLE.md](docs/development/PYTHON_CODE_STYLE.md).\n\nОбязательные соглашения:\n\n- функции и методы — `PascalCase`;\n- классы, протоколы и перечисления — `PascalCase`;\n- переменные, параметры и поля — `snake_case`;\n- константы — `UPPER_SNAKE_CASE`;\n- код, комментарии, docstrings, тесты и сообщения проверок — только на английском;\n- `ruff format` не является стандартным форматтером проекта и не должен применяться как общая проверка форматирования.\n\nИмена, заданные внешними интерфейсами, важнее косметического единообразия.\n\n## 8. Архитектура и ADR\n\nДля работы, затрагивающей архитектуру, требуется явно сформулированное проектное решение до реализации или вместе с ней.\n\nХраните ADR в [docs/adr/](docs/adr/). Они описывают контекст, решение, последствия, альтернативы и, при необходимости, влияние на совместимость и миграцию.\n\nНе вводите абстракции на всякий случай. Добавляйте абстракцию, когда она отражает реальный устойчивый интерфейс либо имеет как минимум двух обоснованных потребителей.\n\n## 9. Конфигурация и состояние\n\nКонфигурация, желаемое состояние, наблюдаемое состояние у провайдера и созданные файлы — разные сущности.\n\n- учётные данные не должны находиться в отслеживаемой конфигурации;\n- сохранённое состояние содержит только минимальные идентификаторы, необходимые для управления ресурсами;\n- для создаваемых файлов явно определяются принадлежность и жизненный цикл;\n- поведение при очистке и откате задаётся явно;\n- частичное развёртывание и прерванные операции должны безопасно завершаться с ошибкой и оставлять возможность диагностики.\n\n## 10. Границы провайдеров и развёртывания\n\nКод конкретного провайдера отвечает за облачный API, адаптеры аутентификации, определение доступных возможностей и преобразование описаний ресурсов.\n\nПрофили развёртывания объединяют возможности провайдеров для получения нужной пользователю инфраструктуры.\n\nЯдро отвечает за общие интерфейсы и правила выполнения операций. Оно не должно предполагать конкретного провайдера, регион, сетевой протокол или локальное окружение.\n\n## 11. Тесты\n\nСтандартный инструмент запуска Python-тестов — `pytest`.\n\n```text\ntests/\n├── unit/\n├── contract/\n├── functional/\n├── integration/\n└── e2e/\n```\n\nНачальный каркас проекта может включать только `tests/unit/`. Для инфраструктуры, очистки, отката, управления ресурсами и обработки ошибок обязательны воспроизводимые тесты без обращения к реальной рабочей инфраструктуре.\n\n## 12. Стандартный полный набор проверок\n\n```bash\npython -m compileall -q src tests tools\npython -m ruff check .\npython -m mypy\npython -m pytest\n```\n\nЛюбое последующее изменение отслеживаемого файла делает прежний результат полного набора проверок неактуальным; перед объявлением готовности его требуется выполнить снова.\n\n## 13. Безопасность и секреты\n\nНе добавляйте в коммиты учётные данные, токены, закрытые ключи, cookies, данные сессий, идентификаторы частной инфраструктуры и локальные секреты.\n\nДля изменений в реальном облаке нужно явное разрешение владельца на конкретную задачу. Операции провайдера, способные менять или удалять ресурсы, требуют ограниченной области действия, определённого поведения при очистке и тестов сценариев ошибок.\n\n## 14. Локальные и частные данные\n\nНе добавляйте в коммиты виртуальные окружения, метаданные IDE, кэши, отчёты покрытия, локальные базы и состояние, сгенерированные отчёты, журналы, учётные данные, результаты сборки, локальные абсолютные пути и ссылки на NAS.\n\n## 15. Документация\n\nИспользуйте:\n\n- `README.md` — краткое введение в проект;\n- `docs/architecture/` — архитектура;\n- `docs/adr/` — решения;\n- `docs/development/` — инженерные правила;\n- будущую локализованную документацию — руководства EN/RU/ZH.\n\nДокументация должна отличать реализованное поведение от планов развития.\n\n## 16. Автоматизация после слияния\n\nПосле фактического слияния PR автоматизация может разобрать явные ссылки на закрываемые задачи, проверить штатный тип `Task`, добавить комментарий о выполнении, закрыть Task как выполненную и безопасно удалить слитую ветку того же репозитория, если она не защищена.\n\nFeature не закрывается автоматически только потому, что слита одна дочерняя Task.\n\n## 17. Критерии завершения\n\nРабота завершена, когда её объём и интерфейсы понятны, реализация и необходимые тесты готовы, обработка ошибок продумана, в diff нет секретов и частных или локальных данных, документация обновлена при необходимости, а обязательные проверки пройдены.\n\nЕсли обязательная проверка не выполнена или не прошла, сообщите об этом прямо.\n\n## 18. Согласование с владельцем\n\nОстановитесь и запросите решение владельца перед разрушительными или неоднозначными действиями, выходом в другую систему, ещё не разрешённым изменением реального облака, изменением политики безопасности, нарушением публичной совместимости, решениями о лицензии, товарном знаке или продукте, а также изменениями `AGENTS.md` или этого протокола.\n"
