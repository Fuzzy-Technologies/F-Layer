# F-Layer

![F-Layer и АИна в инженерной лаборатории Fuzzy Technologies](https://raw.githubusercontent.com/Fuzzy-Technologies/F-Layer/master/docs/site/content/en/assets/brand/FTech-card-F-Layer.png)

**Ваша облачная инфраструктура под управлением одной конфигурации.**

F-Layer — открытая платформа автоматизации инфраструктуры для инженеров,
небольших команд и приложений, которым нужны воспроизводимые развёртывания.
Опишите окружение, создайте его ресурсы, проверьте состояние и удалите ресурсы
этого развёртывания через единый CLI или Python API.

Основной сценарий **F-Layer 2.0** — собственный VPN в **Yandex Cloud**:
один сервер с **AmneziaWG 3.1** и **VLESS Reality**, отдельные файлы подключения
для каждого устройства. Облачный аккаунт, сервер и ключи принадлежат вам;
ресурсы и трафик оплачиваются облачному провайдеру.

[Документация](https://fuzzy-technologies.github.io/F-Layer/) ·
[English](https://fuzzy-technologies.github.io/F-Layer/en/) ·
[Русский](https://fuzzy-technologies.github.io/F-Layer/ru/) ·
[简体中文](https://fuzzy-technologies.github.io/F-Layer/zh-CN/) ·
[Релизы](https://github.com/Fuzzy-Technologies/F-Layer/releases)

## Что вы получаете

- **VPN под вашим управлением:** создание ВМ, сети, межсетевого экрана, публичного IP
  и диска, установка обоих сервисов, приватные профили клиентов и QR-коды AmneziaVPN для VLESS.
- **Настраиваемые ресурсы:** CPU, RAM, платформа, гарантированная доля CPU,
  размер и тип диска HDD/SSD задаются в `project.toml`.
- **Единый жизненный цикл:** проверка состояния, восстановление прерванных облачных
  операций и удаление своего развёртывания с использованием сохранённого локального состояния.
- **Возможности помимо VPN:** подготовка SSH-шлюзов с ограниченным доступом,
  проверки доступности и времени ответа HTTP, интеграция инфраструктурных API в приложения.

## Быстрый старт

### Развёртывание с ИИ-ассистентом

Передайте ассистенту с доступом к терминалу это задание:

> Разверни мой собственный VPN через F-Layer: https://github.com/Fuzzy-Technologies/F-Layer.
> Прочитай инструкцию для ИИ-оператора и используй документацию установленной версии пакета.
> Уточни облако, регион и устройства. Установи проверенный пакет, подготовь приватный
> проект и покажи ресурсы, правила доступа, стоимость и план удаления.
> Получи моё согласие перед созданием платных ресурсов. Разверни сервер через публичный
> CLI F-Layer, помоги импортировать профили клиентов и проверь реальный трафик.
> Храни секреты локально; сообщи результаты проверок, что осталось непроверенным
> и как удалить развёртывание.

Полный процесс описан в [инструкции для ИИ-оператора](https://fuzzy-technologies.github.io/F-Layer/ru/guide/ai-operator/).
Ассистент передаёт ваши настройки и запускает F-Layer; F-Layer обеспечивает
конфигурацию, жизненный цикл развёртывания и клиентские артефакты.

### Развёртывание вручную

**Результат:** сервер в вашем каталоге Yandex Cloud и приватные файлы подключения
для импорта на устройства. Завершите настройку проверкой реального трафика через каждый протокол.

**Потребуются:** Linux или пользовательский дистрибутив WSL Linux, Python 3.11+,
OpenSSH (`ssh` и `ssh-keygen`) и авторизованный профиль
[Yandex Cloud CLI](https://yandex.cloud/en/docs/cli/quickstart) с правами в выбранном каталоге.
Для сервера используйте образ Ubuntu 24.04 **amd64**.
Для запуска пакета Git и Docker не нужны. В Windows доступны локальные проверки
пакета; развёртывание VPN выполняется внутри Linux/WSL.

#### 1. Установите и проверьте

Создайте и активируйте виртуальное окружение в Linux/WSL:

```bash
python3 -m venv ~/.venvs/flayer
source ~/.venvs/flayer/bin/activate
```

**Статус релиза:** версия 2.0 готовится к выпуску. Команда PyPI ниже предназначена
для использования **после публикации 2.0.0**; до этого установите проверенный тестовый wheel.

```bash
python -m pip install "f-layer[vpn]==2.0.0"
```

<details markdown="1">
<summary>Установка тестового wheel до публикации</summary>

Выберите успешный запуск **Release artifact validation** для нужного коммита
в [GitHub Actions](https://github.com/Fuzzy-Technologies/F-Layer/actions/workflows/release-validation.yml).
Скачайте и распакуйте `flayer-release-preview` и `flayer-release-evidence`.
Сверьте коммит и SHA-256 wheel с `build-evidence.json`, затем выполните в каталоге с wheel:

```bash
python -m pip install "./f_layer-2.0.0-py3-none-any.whl[vpn]"
```

Команда устанавливает выбранную сборку локально и не публикует релиз.

</details>

```bash
flayer --help
flayer check --format json
```

Ожидаемый результат: `"status": "ok"` и код выхода `0`. Это локальная проверка
установки без обращения к облаку и без проверки VPN-соединения.

#### 2. Создайте проект

```bash
flayer project init ~/flayer-vpn
```

Отредактируйте `~/flayer-vpn/project.toml` перед подготовкой:

- В `identity.scope_id` укажите ID облачного каталога, выберите имена проекта, стека и владельца.
- Заполните `cloud.yc_profile`, `zone_id` и `image_id` реальными профилем,
  зоной и образом. Выберите подсеть без пересечения с другими вашими сетями.
- В `cloud.management_cidrs` укажите публичный IPv4 администратора с маской `/32`.
- Перечислите `devices` с уникальными туннельными адресами; в шаблоне уже есть
  `laptop`. В `[routes]` выберите полную или раздельную маршрутизацию IPv4.
- В `vless.target_host` и `server_name` задайте доступный узел TLS 1.3 / HTTP/2
  с соответствующим сертификатом; замените пример имени узла.

Чтобы явно задать ресурсы сервера, раскомментируйте весь блок `[resources]` в шаблоне:

```toml
[resources]
platform_id = "standard-v3"
cores = 2
core_fraction = 50
memory_gib = 2
disk_size_gib = 10
disk_type = "network-hdd"
```

Проверьте доступность в регионе и минимальный размер диска образа. Без этого блока
сохраняются настройки по умолчанию: 2 vCPU, 2 GiB RAM и 20 GiB SSD.
Допустимые сочетания описаны в [конфигурации](https://fuzzy-technologies.github.io/F-Layer/ru/guide/configuration/).
Храните проект вне Git и общих каталогов; в WSL используйте файловую систему Linux,
а не `/mnt/c`.

#### 3. Подготовьте и разверните

`prepare` создаёт локальные ключи и артефакты без обращений к облаку.
После этого сохраняйте конфигурацию неизменной и не удаляйте каталог проекта.

```bash
flayer vpn prepare --project ~/flayer-vpn
```

Проверьте выбранные ресурсы и стоимость. **Следующая команда создаёт платные
облачные ресурсы.** Замените `YOUR_FOLDER_ID` на тот же `identity.scope_id`:

```bash
flayer vpn deploy --project ~/flayer-vpn --allow-mutation --scope-confirm YOUR_FOLDER_ID
flayer vpn status --project ~/flayer-vpn
```

Ожидаемый результат: облачные ресурсы вашего развёртывания, статус обоих серверных
сервисов `services-active` и файлы устройств в `~/flayer-vpn/artifacts/`.
Сам по себе статус сервера не доказывает доступ клиента к Интернету.

#### 4. Подключите устройство

В клиентской инструкции используется **AmneziaVPN 5.0.3.0 на Android**.
Для устройства `laptop` из шаблона найдите внутри проекта следующие файлы:

- **AmneziaWG:** импортируйте `artifacts/device-laptop-amneziawg/amneziawg.conf`.
- **VLESS Reality:** импортируйте `artifacts/device-laptop-vless-reality/amnezia.vpn`
  либо откройте `amnezia-qr-01.svg` из того же каталога на другом экране
  и отсканируйте сканером AmneziaVPN. Если нумерованных QR-файлов несколько,
  отсканируйте их все в одной сессии импорта.

Подключайте протоколы по очереди. Откройте HTTPS-сайт по имени, проверьте публичный
IPv4 сервера как выходной адрес, DNS, маршруты и настройки VPN/TUN.
Эта версия маршрутизирует **IPv4**; отключите IPv6 на клиенте/устройстве,
чтобы исключить обход туннеля. Настройка IPv6 в проекте не меняет настройки устройства.
Храните файлы клиентов и QR-коды приватно: они дают доступ к VPN.

Подробности импорта и проверки протоколов приведены в
[инструкции для клиента](https://fuzzy-technologies.github.io/F-Layer/ru/guide/).

## Управление развёртыванием

Проверяйте сервер командой `flayer vpn status --project ~/flayer-vpn`.
При прерывании облачной операции сохраните проект и следуйте
[инструкции восстановления](https://fuzzy-technologies.github.io/F-Layer/ru/guide/).
Чтобы удалить облачные ресурсы этого проекта:

```bash
flayer vpn destroy --project ~/flayer-vpn --allow-mutation --scope-confirm YOUR_FOLDER_ID
```

Проверьте удаление по отчёту и в облачном каталоге. Локальные ключи, артефакты
и состояние остаются на диске. Отключение клиента не удаляет оплачиваемые облачные ресурсы.

**Текущие ограничения:** реализован провайдер Yandex Cloud. Подготовленные проекты
неизменяемы; VPN CLI пока не поддерживает изменение мощности существующей ВМ,
добавление/отзыв устройств и ротацию ключей. Для изменения этих настроек нужен
новый проект и документированный жизненный цикл старого развёртывания.

