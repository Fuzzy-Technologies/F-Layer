# F-Layer

![F-Layer и АИна в инженерной лаборатории Fuzzy Technologies](https://raw.githubusercontent.com/Fuzzy-Technologies/F-Layer/master/docs/site/content/en/assets/brand/FTech-card-F-Layer.png)

**Развёртывайте облачные серверы, управляйте ресурсами и проверяйте доступность из Python или командной строки.**

F-Layer создаёт облачные ресурсы по конфигурации развёртывания и сохраняет
локальную запись о созданном. С её помощью можно проверить развёртывание,
восстановить прерванную операцию и удалить ресурсы своего проекта.
Используйте F-Layer для автоматизации окружения сервиса или управления
инфраструктурой из приложения, чтобы не поддерживать отдельные скрипты
развёртывания для каждого случая.

**F-Layer 2.0** развёртывает корпоративный VPN в Yandex Cloud с
**AmneziaWG 3.1** и **VLESS Reality** и готовит отдельные настройки подключения
для каждого устройства. Установите пакет, создайте приватный проект, заполните
настройки облака и запустите развёртывание из CLI. Также доступны защищённый
SSH-шлюз и HTTP-проверки. Для других облачных провайдеров нужен адаптер.
Облачные ресурсы оплачиваются провайдеру; исходный код F-Layer открыт по
лицензии Apache 2.0.

[Документация](https://fuzzy-technologies.github.io/F-Layer/ru/) ·
[Быстрый старт](https://fuzzy-technologies.github.io/F-Layer/ru/guide/) ·
[Первое развёртывание](https://fuzzy-technologies.github.io/F-Layer/ru/guide/first-deployment/) ·
[Справочник API](https://fuzzy-technologies.github.io/F-Layer/ru/api/) ·
[История изменений](https://github.com/Fuzzy-Technologies/F-Layer/blob/master/CHANGELOG.md) ·
[Релизы](https://github.com/Fuzzy-Technologies/F-Layer/releases)

## Развёртывание с ИИ-ассистентом

Есть ассистент с доступом к терминалу? Передайте ему задание ниже. Он подготовит
окружение и конфигурацию, уточнит недостающие параметры и получит ваше согласие
перед созданием платных ресурсов. Вход в аккаунт и настройка клиента могут
потребовать вашего участия. Установка, развёртывание и проверка описаны в
[инструкции для ИИ-оператора](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/docs/site/content/ru/guide/ai-operator.md).

> Помоги развернуть корпоративный VPN для организации безопасной сети через
> F-Layer: https://github.com/Fuzzy-Technologies/F-Layer.
> Прочитай инструкцию для ИИ-оператора по ссылке из README и используй документацию
> F-Layer 2.0, соответствующую установленному пакету. Уточни моё
> облако, регион и клиентские устройства, затем выбери поддерживаемый адаптер.
> Установи проверенный пакет и подготовь приватный проект. Покажи ресурсы, правила
> доступа, оценку стоимости и план удаления; дождись моего согласия перед созданием
> платных ресурсов. Разверни сервер через F-Layer, помоги подключить устройства
> и проверь трафик. Храни секреты локально. В конце сообщи фактические результаты,
> продолжающиеся расходы и способ удаления.

Для самостоятельного выполнения команд доступен
[ручной Quick Start](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/docs/site/content/ru/guide/index.md).

## Установка

Нужен Python 3.11 или новее. Установите wheel-файл релиза в виртуальное окружение;
Git и Docker не нужны:

```bash
python -m venv .venv
```

Активируйте окружение командой `source .venv/bin/activate` в Linux/macOS,
`.venv\Scripts\Activate.ps1` в PowerShell или
`.venv\Scripts\activate.bat` в командной строке Windows. Скачайте
`f_layer-2.0.0-py3-none-any.whl` и `build-evidence.json` из
[файлов релиза](https://github.com/Fuzzy-Technologies/F-Layer/releases), сверьте
SHA-256 wheel с отчётом сборки и выполните в каталоге скачанных файлов:

```bash
python -m pip install "./f_layer-2.0.0-py3-none-any.whl[vpn]"
python -m flayer --help
python -m flayer check --format json
```

Ожидаемый результат: локальная проверка выводит `"status": "ok"` и завершается
с кодом `0`. Она проверяет Python и доступность пакета без облачных учётных
данных и сетевого доступа. Это первая проверка установки, а не развёртывание
сервера.

## Быстрый старт

Следуйте [быстрому старту](https://fuzzy-technologies.github.io/F-Layer/ru/guide/):
создайте приватный проект, разверните сервер в Yandex Cloud и импортируйте
созданные настройки клиентов. Руководство охватывает оба протокола, проверку
DNS и маршрутов и удаление облачных ресурсов. Для ограниченных SSH-пробросов
используйте [инструкцию по SSH-шлюзу](https://fuzzy-technologies.github.io/F-Layer/ru/guide/first-deployment/).

## Возможности

- **Управляемое облачное окружение:** создание, проверка, восстановление и удаление
  ресурсов своего развёртывания с одной конфигурацией и файлом состояния.
- **Корпоративный VPN-сервер:** совместное развёртывание
  AmneziaWG и VLESS Reality с отдельными файлами клиентов и управляемым удалением
  облачных ресурсов.
- **SSH-шлюз с ограниченным доступом:** подготовка серверной конфигурации и локальных
  SSH-пробросов для устройств только к разрешённым адресам.
- **Эксплуатационные проверки:** проверка HTTP-адреса, измерение времени ответа
  и передачи данных с заданными ограничениями; JSON-отчёты для автоматизации.
- **Интеграция с приложениями:** использование Python API конфигурации, провайдеров
  и управления ресурсами в своих инструментах.

В [описании архитектуры](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/docs/architecture/README.md)
показано, как связаны эти части. Стабильные релизы отмечаются тегами в `master`;
их состав записан в истории изменений. В `develop` также находится принятая
работа для следующих релизов.

## Участие в разработке

Прочитайте [AGENTS.md](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/AGENTS.md)
и [DEVELOPMENT_PROTOCOL.md](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/DEVELOPMENT_PROTOCOL.md).
Справочник API по установленному wheel собирается командой
`python tools/build_api_reference.py`; см.
[настройку документации](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/docs/site/README.md).

