body = '''
# Политика безопасности

## Сообщить об уязвимости

Не публикуйте в открытых issues подробности, позволяющие использовать уязвимость, учётные данные, токены, закрытые ключи и конфиденциальные сведения о провайдере.

Если в GitHub включена приватная отправка сообщений об уязвимостях, используйте её. Пока этот канал недоступен, свяжитесь с владельцем репозитория по закрытому каналу Fuzzy Technologies.

## Область применения

Сообщение должно описывать уязвимость самого F-Layer: его кода, создаваемых файлов, интеграции с провайдерами, операций жизненного цикла, обработки конфигурации и состояния либо релизных пакетов.

Ошибочная настройка или взлом инфраструктуры, которой пользователь управляет самостоятельно, сами по себе не означают уязвимость F-Layer. Однако о воспроизводимых небезопасных настройках по умолчанию и ошибках в создаваемой конфигурации следует сообщать.

## Ограничения при разработке

Тесты не должны изменять или проверять реальную стороннюю инфраструктуру без явного разрешения. По умолчанию используйте подготовленные в репозитории тестовые данные, имитации компонентов и изолированные тестовые ресурсы.
'''
