body = '''
# Документация F-Layer

- [`site/`](site/README.md) — фирменная документация MkDocs Material, генерируемая из установленного wheel;
- [`architecture/`](architecture/) — принятые архитектурные границы и интерфейсы исходного кода;
- [`adr/`](adr/) — записи архитектурных решений;
- [`development/`](development/) — инженерные соглашения и стиль Python;
- [`RELEASE_WORKFLOW.md`](RELEASE_WORKFLOW.md) — работа с ветками, релизами и тегами;
- [`i18n/`](i18n/project.toml) — стабильные единицы английского текста, согласованная терминология и состояние переводов.

Английская версия является основной. Рядом с ней публикуются проверенные русские и китайские страницы. Если перевода нет или он устарел, показывается актуальный английский текст с уведомлением. Записи ревью содержат имя проверившего и хеши исходника и перевода; проект разрешает документированное ИИ-ревью по [ADR 0015](adr/0015-accountable-ai-translation-review.md).
Сборщик включает актуальные архитектурные документы и ADR в сайт и статически находит публичные модули API в установленном пакете.
Сгенерированный HTML хранится как временный результат в `_build/` и не добавляется в Git.
'''
