body = '''
# Работа с ветками и выпуск релизов

Этот документ определяет работу с ветками, слияниями, релизами и тегами F-Layer.

Он дополняет `DEVELOPMENT_PROTOCOL.md`. Если документы противоречат друг другу, остановите работу над релизом и сначала разрешите противоречие.

## Назначение веток

| Шаблон ветки        | Назначение                                                     | Обычный источник           | Обычная цель    |
| ------------------- | -------------------------------------------------------------- | -------------------------- | --------------- |
| `master`            | Стабильное выпущенное и публичное состояние                    | release/hotfix/publication | tag/publication |
| `develop`           | Интеграционная ветка следующего релиза                         | `feature/*`, `fix/*`       | `release/*`     |
| `feature/<name>`    | Продуктовые, архитектурные, организационные изменения и задачи | `develop`                  | `develop`       |
| `fix/<name>`        | Исправления вне релизной процедуры                             | `develop`                  | `develop`       |
| `release/<version>` | Стабилизация релиза                                            | `develop`                  | `master`        |
| `hotfix/<name>`     | Срочное исправление выпущенной версии                          | `master`                   | `master`        |

## Защищённые ветки

Предполагается, что `master` и `develop` защищены. Обычные изменения проходят через pull requests; обсуждения ревью разрешаются до слияния; защищённые ветки нельзя удалять и переписывать через force push; стабильные проверки CI становятся обязательными после появления соответствующих контекстов. Обход ограничений владельцем или администратором предназначен для восстановления после сбоев.

## Обычная разработка

```text
Task
  ↓
feature/* or fix/* from develop
  ↓
PR → develop
  ↓
CI + human review
  ↓
merge
```

Для обычных PR в `develop` по умолчанию используется squash merge.

## Выпуск релиза

F-Layer использует семантические версии без номеров сборки:

```text
v1.0.0
v1.0.1
v1.1.0
v1.1.1
v2.0.0
```

Релиз готовится из принятых изменений `develop`:

```text
develop
  ↓
release/X.Y.Z
  ↓
validation + version/release metadata
  ↓ PR
master
  ↓
annotated tag vX.Y.Z
  ↓
back-merge to develop
```

Релизные теги неизменяемы. Тег, версия пакета, описание релиза и версия распространяемых файлов должны совпадать.

## Срочное исправление

```text
master
  ↓
hotfix/<name>
  ↓ PR
master → next patch tag
  ↓
back-merge to develop
```

Нельзя исправить только `master`, оставив `develop` в расходящемся состоянии.

## Завершение задач

Объём релиза и правила карточек определены в [ADR 0014](adr/0014-scoped-releases-and-changelog.md). Каждый релиз завершается и получает тег в `master` до переноса следующего кандидата; изменения, сделанные только для выпуска, возвращаются в `develop` через PR. Функции более поздних майлстоунов остаются в `develop`. [ADR 0015](adr/0015-accountable-ai-translation-review.md) определяет полномочия проверки переводов и требования к хешам исходника и перевода. Полные регрессионные проверки выполняются в CI; локально проверяются затронутые файлы.

Во время реализации и ревью Task остаются открытыми. После слияния PR автоматизация репозитория может закрыть явно связанные штатные Task. Feature закрывается только после выполнения обязательных дочерних Task и собственных критериев приёмки. Успешный CI не заменяет приёмку майлстоуна.

## Для стабильной публикации нужен завершённый майлстоун

Перед публикацией стабильного GitHub Release или загрузкой в PyPI владелец должен проверить критерии приёмки всех Task, Feature и майлстоуна, затем закрыть штатный майлстоун `release-X.Y`. Его счётчик `open_issues` должен быть равен нулю. Команда завершить релиз не отменяет невыполненные критерии. Автоматизация не должна закрывать плановые задачи или выдумывать одобрение человеком ради прохождения публикации.

Для предварительной проверки используйте GitHub CLI с доступом на чтение основного репозитория:

```bash
python tools/release_validation.py --check-milestone 4
```

Пример проверяет release-2.0 относительно версии пакета в текущей рабочей копии. Для другого релиза замените номер майлстоуна. Проверка читает штатное состояние GitHub, сверяет репозиторий, номер и минорную версию и завершается ошибкой при открытом или незавершённом майлстоуне, недоступных или некорректных данных. Она не собирает пакеты, не публикует релиз и не изменяет план. Выполняйте её непосредственно перед стабильной публикацией в GitHub вместе с проверками CI точного коммита `master`, тега и файлов релиза. Прямая публикация через интерфейс GitHub остаётся действием владельца; эта проверка не ограничивает права в интерфейсе GitHub.
Workflow PyPI выполняет её перед полным набором проверок и повторяет при подготовке подтверждений публикации.

Заголовок релиза имеет вид `F-Layer vX.Y.Z — <short user-facing digest>`; аннотированный тег — `vX.Y.Z`, а версия пакета — `X.Y.Z`. Порядок разделов карточки определяется ADR 0014. У кандидата могут быть страницы с черновыми переводами или английской подстановкой и отметка GitHub **Pre-release**, но его нельзя объявлять последним стабильным релизом.

Слайд АИны остаётся в README и документации. В карточке релиза место под Digest зарезервировано для итогового майлстоуна release-2.0; карточки 1.2.x не содержат слайда.

## Реализованные проверки и результаты сборки

`Release artifact validation` запускается без прав записи и OIDC для pull requests, push в `develop`/`master` и тегов `v*`. Этот workflow ничего не публикует. CI загружает wheel, архив исходников и `build-evidence.json`, содержащий коммит исходников, версию, фиксированное время сборки, точную версию сборщика, размеры файлов, SHA256 и результаты проверок воспроизводимости и повторной сборки.

Ту же проверку пакетов можно выполнить из чистой рабочей копии с закоммиченными изменениями:

```bash
python -m pip install -e '.[dev]'
python tools/release_validation.py
```

Создаваемые файлы появляются только в `_build/release`. Инструмент отказывается использовать уже существующий выходной каталог; перед намеренным повтором удалите этот сгенерированный каталог. Игнорируемые и неотслеживаемые файлы никогда не входят в снимок сборки. Содержимое пакета должно соответствовать отслеживаемым исходникам проекта; Hatchling может добавить только ожидаемые метаданные упаковки. Проверка отклоняет выход за пределы каталога, повторяющиеся элементы, ссылки, пути частных и сгенерированных данных, распознаваемые закрытые ключи и токены, чрезмерный распакованный размер, несовпадающие метаданные и неверные хеши `RECORD` wheel. Это проверка состава и упаковки; она не способна обнаружить любой возможный секрет в допущенном исходном файле. Ревью отслеживаемого кода остаётся необходимым.

Две сборки выполняются одной зафиксированной версией Hatchling с `SOURCE_DATE_EPOCH` коммита. Wheel и архив исходников должны побайтно совпасть. Дополнительная сборка wheel из проверенного архива исходников должна содержать те же элементы. Поэтому архив исходников включает всю написанную документацию, тесты, инструменты проверки, workflows, лицензию и метаданные пакета, необходимые для повторной сборки.

Начальные метаданные (`0.0.0` без `flayer.__version__`) допустимы для предварительной сборки PR. Проверки релиза по тегу и публикации требуют явного значения `flayer.__version__`, отличного от начального. Статическая версия проекта должна совпадать с ним; динамические метаданные Hatch должны читать `src/flayer/__init__.py` напрямую.

Для настоящего релиза проверьте существующий тег после получения `master` и тегов:

```bash
git fetch origin master --tags
python tools/validate.py
python tools/release_validation.py --tag vX.Y.Z
```

Тег должен быть аннотированным, иметь стабильный вид `vX.Y.Z` без ведущих нулей, суффикса предварительной версии и номера сборки, совпадать со всеми версиями пакета и указывать одновременно на точный коммит рабочей копии и `origin/master`. Тег на `develop`, старом коммите `master`, лёгкий тег или отсутствие версии в исходниках блокируют выпуск. Теги не создают GitHub Releases и не закрывают Feature или Milestone.

## Публикация в PyPI под контролем владельца

Публикация отключена, пока владелец не настроит нужный проект PyPI и переменные репозитория GitHub. PR с реализацией не создаёт аккаунты, секреты, окружения, теги, GitHub Releases и публикации пакетов.

| Настройка                     | Требуемое значение                                                              |
| ----------------------------- | ------------------------------------------------------------------------------- |
| Проект PyPI                   | `f-layer`; перед включением проверить доступность имени и право владения        |
| Владелец Trusted Publisher    | `Fuzzy-Technologies`                                                            |
| Репозиторий Trusted Publisher | `F-Layer`                                                                       |
| Workflow Trusted Publisher    | `release-publish.yml`                                                           |
| Окружение Trusted Publisher   | Пустое; workflow не требует окружения GitHub                                    |
| `FLAYER_RELEASE_OWNER`        | Точный логин GitHub владельца, которому разрешён выпуск                         |
| `FLAYER_PYPI_ENABLED`         | `true`, только после настройки нужного Trusted Publisher                        |
| Версия workflow               | `master` с прошедшей ревью реализацией релиза                                   |
| Тег запуска                   | Существующий аннотированный `vX.Y.Z`, совпадающий с текущей `master` и версиями |
| Майлстоун запуска             | Штатный номер `release-X.Y`; майлстоун закрыт, открытых пунктов нет             |
| `confirm_publication`         | Явно установлен для конкретного ручного запуска                                 |

Владелец должен настроить обычный Trusted Publisher для своего существующего проекта PyPI или ожидающий публикации publisher, если имя доступно. Используется рабочий сервер PyPI; workflow нельзя перенаправить на произвольный индекс, он не принимает токен или пароль. Официальные инструкции:

- [Создание проекта через Trusted Publishing](https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/)
- [Добавление publisher в существующий проект](https://docs.pypi.org/trusted-publishers/adding-a-publisher/)
- [Публикация через Trusted Publisher](https://docs.pypi.org/trusted-publishers/using-a-publisher/)

После ревью и проверки тега настроенный владелец выбирает `master` в **Actions → Publish an owner-approved PyPI release**, вводит точный существующий тег и отмечает `confirm_publication`. Также требуется штатный номер майлстоуна релиза. Открытый или незавершённый майлстоун, отсутствие разрешения, другой владелец, ветка или репозиторий, некорректный тег, начальная версия, провал полного набора проверок либо аудита пакетов блокируют публикацию. При успехе только проверенные файлы данного запуска передаются отдельному заданию. Оно получает OIDC-разрешение и запускает зафиксированный publisher PyPA без checkout и выполнения сборочного кода проекта. PyPI независимо проверяет настроенную идентичность репозитория и workflow. Локальные тесты не подтверждают доступность имени пакета, настройку аккаунта Trusted Publisher и фактическую загрузку. При успешной доверенной загрузке Action создаёт аттестации PyPI.

Push тега ничего не публикует. Подтверждение ручного запуска означает намерение опубликовать пакет именно в этом запуске. Повторная публикация использует тот же неизменяемый тег; если такая версия PyPI уже существует, операция завершается ошибкой, а не незаметно пропускает загрузку. Отключение `FLAYER_PYPI_ENABLED` блокирует будущие задания публикации. Администраторы репозитория отвечают за то, кому разрешено изменять workflows и переменные релиза.

## Завершение и очистка

Существующая автоматизация после слияния проверяет факт слияния PR и штатный тип Task, прежде чем закрывать явно связанные задачи и удалять допустимые слитые ветки реализации. Релизные workflows не ослабляют это правило и не закрывают Feature и Milestone. Владелец должен отдельно проверить их критерии приёмки.
