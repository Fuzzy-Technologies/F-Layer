# ADR 0000: Название решения

- Статус: предложено
- Дата: YYYY-MM-DD
- Связанная задача: #NN

## Контекст

Опишите проблему, ограничения и обстоятельства, из-за которых требуется решение.

## Решение

Чётко сформулируйте выбранную архитектуру или контракт.

## Последствия

Опишите преимущества, недостатки, влияние на совместимость, эксплуатацию и миграцию.

## Рассмотренные альтернативы

Перечислите реалистичные варианты и объясните, почему они не выбраны.

## Проверка

Опишите, как при реализации будет проверено, что решение работает согласно замыслу.
'''
