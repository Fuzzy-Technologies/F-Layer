# ADR 0001: Разделить конфигурацию развёртывания и состояние принадлежащих ему ресурсов

- Статус: принято к реализации
- Дата: 2026-10-04
- Связанные задачи: #2, #18

## Контекст

F-Layer создаётся на основе рабочей автоматизации для конкретного приложения. В её конфигурации объединены настройки провайдера и шлюза, региональные значения по умолчанию, пути к учётным данным и пути к артефактам на конкретном компьютере. Файл состояния ресурсов полезен, но у него нет версионируемой схемы и явной проверки принадлежности ресурсов при сохранении и чтении.

Чтобы коннекторы провайдеров и операции развёртывания могли безопасно работать вместе, ядру нужны стабильные идентификаторы. Отсутствующая или повреждённая конфигурация не должна приводить к неявному выбору другого окружения. Сохранение нового снимка состояния не должно перезаписывать перечень ресурсов другого стека.

## Решение

Реализовать ядро `flayer.core` средствами стандартной библиотеки, разделив его на три части:

- `contracts` проверяет версию схемы, определяет неизменяемый `StackIdentity` и общие для провайдеров метки принадлежности ресурсов.
- `config` строго проверяет TOML и загружает его в неизменяемые модели `DesiredConfig`, `DesiredResource` и `SecretReference`.
- `state` строго проверяет JSON и загружает его в неизменяемые модели `StackState` и `ResourceState`, а также обеспечивает атомарное сохранение на локальном диске.

Конфигурация и сохранённое состояние явно указывают версию схемы `1`. Неизвестные версии и поля, неверные типы и неполные идентификаторы считаются ошибками. Нет неявного выбора провайдера, проекта, региона, учётных данных, переопределений из окружения или пути хранения. Пустой массив требуемых ресурсов допустим: он не приводит к созданию инфраструктуры по умолчанию.

Идентификатор стека содержит `project`, `stack`, `provider`, `scope_id` и `owner_id`. При чтении, записи и удалении состояния все пять полей должны совпадать с ожидаемыми значениями, явно переданными вызывающим кодом. Адаптеры провайдеров устанавливают на реальные ресурсы определённые ядром метки принадлежности и проверяют их независимо. Локальный перечень помогает найти ресурсы, но не доказывает ни актуальное право доступа к облаку, ни принадлежность облачных ресурсов.

В конфигурации учётных данных разрешены только именованные ссылки `env` или `file`. Ядро не читает их значения; это делают адаптеры аутентификации. Состояние содержит только версию схемы, идентификатор стека, логические типы ресурсов и их идентификаторы у провайдера. В него не копируются конфигурация, учётные данные, ответы провайдера, адреса подключения или созданные артефакты.

Для сохранения состояния использовать эксклюзивную блокировку и уникальный временный файл в том же каталоге, сброс буферов, `fsync` и атомарный `os.replace`. На POSIX после завершённой замены или удаления синхронизировать каталог. Запрещать символьные ссылки в пути, переход к родительским каталогам и объекты, не являющиеся обычными файлами. Не перезаписывать и не удалять повреждённый снимок или снимок другого стека. При ошибке до замены сохранять предыдущий снимок. Если ошибка синхронизации произошла после точки фиксации, сообщать, что новый снимок уже может быть доступен.

## Последствия

- Модули ядра не импортируют облачный SDK, не запускают CLI, не обращаются к сети и не выбирают реализацию шлюза.
- Настройкам провайдера и развёртывания нужны собственные типизированные контракты и преобразование в идентификаторы ядра. Произвольные словари намеренно исключены из начальной схемы.
- Добавление поля или миграция схемы требуют явного архитектурного решения и управления версиями. Загрузчик не пытается угадать способ миграции исходного приложения.
- После успешной записи на POSIX доступ к файлу имеет только владелец. В Windows конфиденциальность зависит от ACL каталога, которым управляет вызывающая сторона.
- Аварийное завершение процесса может оставить блокировку записи. Для восстановления нужно убедиться, что запись больше не выполняется, проверить сохранившийся снимок и только затем удалить локальную блокировку. Реализация не перехватывает чужую блокировку.
- Пути должны находиться в доверенном хранилище вызывающей стороны. Эти проверки не защищают от локального злоумышленника, который одновременно меняет записи каталога. Все процессы записи должны использовать один API состояния.
- Атомарная замена локального файла не является распределённой транзакцией или реализацией облачного жизненного цикла. При частичном развёртывании можно сохранить уже полученные идентификаторы ресурсов; согласование состояния и откат остаются отдельной работой.

## Рассмотренные альтернативы

1. **Перенести конфигурацию приложения без изменений.** Отклонено: это закрепило бы в общем ядре конкретного провайдера, набор компонентов шлюза, региональные значения по умолчанию и предположения о частном хранилище.
2. **Принимать произвольные словари конфигурации и ответов провайдера.** Отклонено: незамеченные опечатки в полях и неограниченное сохранение ответов ослабляют проверки принадлежности ресурсов и исключение секретов.
3. **Использовать одно фиксированное имя временного файла без блокировки.** Отклонено: параллельные процессы могут обрезать или заменить незавершённые снимки друг друга, нарушив связь между проверкой принадлежности и фиксацией записи.
4. **Добавить базу данных или зависимость для распределённой межплатформенной блокировки.** Отложено до появления подтверждённой потребности работать с одним состоянием с нескольких машин.

## Проверка

Детерминированные тесты проверяют схему и типы, неизвестные и повторяющиеся поля, изоляцию ссылок на учётные данные, неизменяемость моделей, каждое поле идентификатора стека, частичные и пустые снимки, идемпотентное локальное удаление, сохранение повреждённого состояния, запрет символьных ссылок и обхода каталогов, занятую блокировку, права доступа и ошибки до и после атомарной замены. Тесты не читают учётные данные и не меняют облачные ресурсы. Проверки ошибок также контролируют владение файловым дескриптором при сбое создания потока и явное сообщение о неудачной очистке артефактов.

До передачи на ревью реализация проходит принятые в репозитории проверки компиляции, Ruff, mypy и pytest.
'''
