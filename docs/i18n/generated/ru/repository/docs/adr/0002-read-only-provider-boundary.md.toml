# ADR 0002: Выделить интерфейс чтения ресурсов провайдера с явным выбором облачного каталога

- Статус: принято
- Дата: 2026-10-04
- Связанная задача: #19

## Контекст

В A-VPN объединены обнаружение ресурсов через Yandex SDK, аутентификация, правила развёртывания и изменение ресурсов. F-Layer нужен независимый от провайдера интерфейс получения сведений, прежде чем оркестрация жизненного цикла сможет безопасно работать с облачными ресурсами. Диагностика и будущее планирование развёртываний используют эти сведения для разных целей. Первая параллельная волна реализации не должна зависеть от ещё не завершённых контрактов конфигурации ядра и профилей развёртывания.

Инициализация провайдера не должна неявно читать учётные данные или обращаться к инфраструктуре. Ссылки на ресурсы должны сохранять провайдера и область доступа; ошибки не должны раскрывать захваченный вывод CLI. Доступ к реальному облаку и изменение его ресурсов не разрешены в рамках проверки этой реализации.

## Решение

Создать `flayer.providers.contracts`: неизменяемые идентификаторы и ссылки на ресурсы, нормализованные сведения о них, объявления поддерживаемых возможностей, результаты проверок, безопасные ошибки и структурный протокол `CloudProvider`.

Первый адаптер реализовать поверх существующей CLI Yandex Cloud с внедряемым `CommandRunner` на стандартной библиотеке. Требовать явный идентификатор облачного каталога и профиль CLI. Использовать уже настроенную аутентификацию CLI, не экспортируя и не сохраняя учётные данные. Ограничивать длительность дочернего процесса, закрывать stdin, отключать браузерную аутентификацию и повторные попытки CLI; запускать команды без оболочки.

Предоставить только проверку локальной доступности, проверку доступа к каталогу, получение списков по типу ресурса, поиск по ссылке и сбор полного перечня ресурсов. Поддержать виртуальные машины, диски, сети, подсети, зарезервированные адреса и группы безопасности. Сохранять только нормализованные идентификаторы, имена, состояния, зоны, метки принадлежности и публичные IPv4-адреса. Не включать исходные метаданные провайдера в объекты ресурсов.

До поиска проверять ссылку на ресурс, а после каждого чтения — каталог возвращённого ресурса: поиск по ID в CLI может находить объекты в других доступных каталогах. Отклонять списки, которые могли быть усечены, не выдавая их за полные. Возвращать стабильные категории ошибок без stdout/stderr провайдера и цепочек исключений дочернего процесса или JSON-парсера.

## Последствия

- Провайдеры не зависят от конфигурации ядра, профилей развёртывания, учётных данных и операций изменения ресурсов.
- Детерминированные тестовые реализации проверяют аргументы реальных команд и обработку ошибок без обращения к инфраструктуре.
- Для первого интерфейса не нужны SDK провайдера и protobuf.
- Адаптер зависит от отдельно установленной CLI `yc` с настроенной аутентификацией. Эта работа не включает проверку совместимости с реальным аккаунтом.
- Совместимость с JSON и признаками ошибок CLI требует сопровождения. Для нераспознанных ошибок остаётся безопасная общая категория.
- Перечень, достигший предела выдачи, отклоняется из предосторожности; последовательный сбор сведений не является атомарным снимком.
- Имена ресурсов и метки остаются общедоступными сведениями. Владельцы не должны хранить в этих полях учётные данные.
- Создание, изменение, очистка, откат, разрешение разрушительных операций, идемпотентность и опрос выполнения требуют отдельных будущих контрактов в задаче #20.

## Рассмотренные альтернативы

- **Сразу выделить адаптер SDK:** подходит для жизненного цикла, но добавляет работу с аутентификацией и токенами, зависимости сгенерированного API и вопросы изменения ресурсов до стабилизации интерфейса ядра.
- **Скопировать менеджер A-VPN:** сохранит в адаптере предположения о принадлежности ресурсов и профилях конкретного развёртывания.
- **Создать только тестовый провайдер:** не позволит проверить выбор области доступа и преобразование вызовов в команды рабочего коннектора.
- **Возвращать исходный JSON как состояние ресурсов:** передаст всем потребителям нестабильную структуру провайдера и потенциально секретные метаданные.
- **Неявно брать каталог из профиля:** скроет выбор области доступа и не позволит подтвердить, что вызывающая сторона намеревалась работать именно в ней.

## Проверка

Unit-тесты проверяют неизменяемость идентификаторов, недопустимые параметры выбора, объявления возможностей, команды всех поддерживаемых ресурсов, доступность CLI и каталога, полноту перечня, поиск по ID, запрет выхода за выбранный каталог, достижение предела выдачи, повреждённый JSON, неверные ресурсы и адреса, повторяющиеся ID, тайм-ауты, безопасные аргументы процессов и безопасные сообщения об ошибках. Все операции выполняются через тестовые реализации или подмены. До ревью запускаются принятые в репозитории проверки компиляции, Ruff, mypy и pytest.
'''
