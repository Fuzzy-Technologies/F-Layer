# ADR 0003: Безопасная диагностика с явными источниками данных

- Статус: принято
- Дата: 2026-10-04
- Связанная задача: #23

## Контекст

В исходном A-VPN объединены обнаружение облачных ресурсов, самопроверка гостевой ОС, SSH, адреса сервисов и измерения передачи данных. F-Layer нужна общая диагностика ещё до стабилизации интерфейсов конфигурации, провайдера и жизненного цикла. Перенос всей этой связки закрепил бы предположения о VPN и частной инфраструктуре, а также мог бы вызвать нежелательные сетевые обращения или раскрыть исходный вывод провайдера и команд.

## Решение

Добавить `flayer.diagnostics` со структурированными версионируемыми контрактами `CheckResult` и `DiagnosticReport`. Различать успешные результаты, предупреждения, ошибки, устаревшие данные и отсутствие поддержки проверки. Отсутствие данных не считается успехом: результат помечается как неподдерживаемый.

Получать сведения о работоспособности и ресурсах провайдера через внедряемые интерфейсы, выполняющие только чтение. Проверять схему и время предоставленного отчёта отдельно от содержащегося в нём результата проверки. Диагностика сама не обнаруживает инфраструктуру и не выдаёт разрешение на доступ к ней.

Первоначальная CLI: `python -m flayer status/check/health/benchmark`. Проверки локального окружения работают без сети. Удалённые проверки и измерения требуют явно заданного HTTP(S)-адреса и ограничений времени, количества запросов и объёма данных. Стандартный HTTP-транспорт запускает отдельный изолированный рабочий процесс: родительский процесс может остановить зависшее разрешение DNS, соединение, TLS-обмен или чтение по общему сроку выполнения. Переходы по перенаправлениям и автоматическое обнаружение прокси отключены; проверка TLS включена.

Отчёты содержат только безопасные результаты измерений. Тело ответа, идентификаторы адресов подключения, учётные данные и исходный текст исключений в отчёт не попадают. Структурированный вывод рекурсивно очищается; исходные значения неверных аргументов CLI скрываются. Авторы адаптеров должны передавать только разрешённые поля: одного маскирования недостаточно, чтобы считать произвольный внешний текст безопасным.

## Последствия

- Диагностику можно реализовывать и проверять независимо от задач провайдера и жизненного цикла.
- Коды завершения отражают неполные или неуспешные результаты; локальный `status` без сети сейчас завершается с кодом 4.
- Скорость HTTP-передачи — ограниченное сквозное измерение; она не выдаётся за пропускную способность туннеля или канала.
- Запуск рабочего процесса требует дополнительного времени. В измеренную длительность HTTP он не входит, но учитывается в жёстком общем сроке родительского процесса. Завершение и очистка процесса могут занять ещё не более двух секунд.
- Собственные внедряемые проверки и транспорты отвечают за соблюдение своих ограничений.
- Подключение CLI провайдера и проверок гостевой ОС конкретного развёртывания выполняется позднее.

## Альтернативы

Копирование связки облака и SSH из A-VPN привязало бы диагностику к нестабилизированному интерфейсу провайдера и конкретному развёртыванию. Тайм-аут сокета сам по себе не ограничивает общую длительность DNS-запроса и медленного потокового чтения. Отмена только на уровне потоков могла бы оставить сетевую операцию выполняться после возврата управления вызывающему коду. Отдельный процесс позволяет назначить ответственного за принудительное завершение в заданный срок.

## Совместимость и миграция

Контракт добавляется к начальному пакету. Уже развёрнутых интерфейсов жизненного цикла, которые нужно заменить, нет. Частная конфигурация A-VPN и созданные им артефакты не переносятся. Публичный JSON содержит версию схемы 1, чтобы последующие изменения можно было вводить явно.

## Проверка

Детерминированные unit-тесты проверяют валидацию результатов, сводный статус, актуальность данных, скрытие чувствительных значений, конфиденциальность ввода CLI, ограничения HTTP-данных и перенаправлений, завершение по сроку и очистку. Проверки, транспорты и процессы подменяются тестовыми реализациями. До ревью должны пройти принятые проверки компиляции, Ruff, mypy и pytest. Тесты не обращаются к реальной инфраструктуре и внешним сервисам.
'''
