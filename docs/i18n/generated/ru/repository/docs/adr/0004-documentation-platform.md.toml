body = '''
# ADR 0004: Статическая документация по установленному пакету

- Статус: принято
- Дата: 2026-10-04
- Задача: [#33](https://github.com/Fuzzy-Technologies/F-Layer/issues/33)
- Связанное внедрение: [#27](https://github.com/Fuzzy-Technologies/F-Layer/issues/27)

## Контекст

Документация нужна F-Layer с первой волны реализации. В FuzzyRoutines уже есть общий подход Fuzzy Technologies к генерации API, фирменному оформлению, связи переводов с исходниками, достоверному статусу проверки и безопасной публикации. Ещё один стек документации создал бы лишнюю работу по сопровождению.

## Решение

Использовать MkDocs Material, mkdocstrings-python и Griffe. Строить документацию по чисто установленному wheel-пакету, отключив импорт исполняемых модулей и независимо проверяя этот запрет. Полностью закрепить прямые и транзитивные зависимости документации в lock-файле. Каноническими считать английские docstring в стиле Google. Для фирменного тёмного оформления с фиолетовыми и зелёными акцентами использовать собственную SVG-символику F-Layer и поддерживаемые настройки CSS и темы.

Генерировать страницы модулей и перечни публичных символов из установленного wheel. Тогда независимый PR документации будет работать с начальным пакетом и автоматически включать модули, добавленные последующими PR. Для написанных вручную английских разделов хранить отслеживаемые метаданные проверки. Временные сгенерированные разделы API используют хеши `fuzzy-doc-unit-v1` и стабильные ID из общего подхода; состояние RU/ZH явно задаётся как `missing`. Сгенерированный реестр не объявляет переводы проверенными.

Повторно использовать валидатор локализации из общего подхода, приведя имена идентификаторов к стилю проекта и сохранив правила хеширования и проверки. Английский остаётся каноническим. Русские и китайские маршруты показывают английский текст, пока проверка человеком не выполнит те же требования к хешу исходника и ответственным ролям. Автоматизация не должна ослаблять схему проверки и хеширования.

Публиковать Pages только при событии `push` с `github.ref == refs/heads/master`. Workflow не утверждает наличие защиты веток и не настраивает её. Для pull request и `develop` собирать временные артефакты в строгом режиме с правами только на чтение репозитория. Публикация пакета остаётся отдельным workflow.

## Последствия

Справочник API соответствует установленному пакету, а не дублирующему описанию. Исходники, локальные ссылки, точные якоря, правила работы с результатами генерации, хеши исходников и происхождение wheel проверяются детерминированно. Документация и перечни API доступны для скачивания как результаты CI. Подстановка английского текста показывает недостающие переводы и не выдаёт его за проверенный перевод.

Проверка переводов сгенерированного API намеренно не реализуется в этой волне. Будущие проверенные переводы должны использовать отслеживаемые метаданные и тот же валидатор. Типизированная заглушка описывает интерфейс перенесённого валидатора без изменения правил проверки. Новые инструменты проекта следуют принятому стилю Python.

## Альтернативы

Отдельная реализация на pdoc или Sphinx продублировала бы существующий стек. Интроспекция во время выполнения могла бы запустить код провайдера или потребовать учётные данные. Вручную написанные страницы API могли бы устаревать при объединении независимых PR. Хранение сгенерированного HTML в Git смешало бы исходники и временные результаты сборки.

## Совместимость и миграция

Решение вводит новые маршруты документации без изменения публичного Python API. Обновляемый справочник отражает раннюю стадию разработки. Маршруты стабильных версий появятся только после выпуска соответствующих стабильных артефактов.
