# ADR 0005: Устойчивый к сбоям жизненный цикл ресурсов стека

- Статус: принято
- Связанная работа: задача #20, фича #6
- Дата: 2026-10-04

## Контекст

Команду провайдера и замену локального файла нельзя объединить в одну атомарную транзакцию. Прерванное создание может оставить ресурс без записи его идентификатора, а прерванное удаление — запись уже отсутствующего ресурса. Автоматический повтор создания с неизвестным результатом способен породить дубликаты. При откате необходимо сохранить ресурсы, существовавшие до начала текущей операции.

## Решение

Общее ядро принимает неизменяемый `DeploymentPlan` и внедряемый `LifecycleProvider`. План содержит не более 128 уникальных логических ресурсов, точный `StackIdentity`, неизменяемые параметры провайдера и ациклический граф зависимостей. Построение плана, топологическая сортировка и проверка параметров выполняются без сети. Типы ресурсов ядра имеют переносимые имена с дефисами; `security-group` явно преобразуется в значение перечисления провайдера `security_group`.

Создание, получение статуса, удаление и восстановление выполняются последовательно благодаря согласованной блокировке операции рядом с явно заданным файлом состояния. Существующая блокировка записи независимо защищает каждую атомарную замену снимка. Блокировка операции не координирует внешние программы, игнорирующие этот контракт, и не является распределённой арендой блокировки.

Перед каждым изменением ядро сохраняет журнал упреждающей записи. В нём находятся только принадлежность стеку, SHA-256-отпечаток плана, случайный ID операции, действие, исходные и вновь полученные идентификаторы ресурсов и текущий логический ресурс с незавершённой операцией. Снимок сохраняет схему версии 1 и содержит только принадлежность стеку, логические ID, типы и ID провайдера. Ни в один файл не попадают требуемые параметры, учётные данные, метаданные виртуальных машин и вывод команд. Атомарная замена и синхронизация каталога используют существующий контракт хранения состояния. Снимок и журнал читаются через дескрипторы обычных файлов с ограничением объёма; где доступно, открытие неблокирующее, чтобы подмена файла на FIFO после проверки не привела к зависанию. Чтение JSON и запись снимка ограничены 1 МиБ.

Перед созданием ядро находит и проверяет существующие ресурсы с точно совпадающей принадлежностью. Если у такого ресурса отсутствует зависимость, операция останавливается до изменений. Новые ресурсы создаются по порядку зависимостей. Каждое подтверждённое создание записывается в журнал до помещения минимального идентификатора в снимок. При достоверной ошибке до отправки команды откатываются только ресурсы, созданные текущей операцией, в обратном порядке. Существовавшие ранее ресурсы остаются в снимке и сохраняются.

При ошибке провайдера с неопределённым результатом незавершённое действие остаётся в журнале, а операция завершается с ненулевым результатом. Восстановление ищет текущий логический ресурс по всем меткам принадлежности и стабильным меткам спецификации. Когда ресурс найден, восстановление записывает его и либо продолжает создание, либо выполняет явно запрошенный откат. Перед включением ресурса в набор для отката ответ на создание или найденный при восстановлении ресурс должен содержать одноразовую метку `flayer-operation` из этого журнала. При откате она повторно проверяется точным поиском; адаптер ещё раз проверяет её непосредственно перед удалением. Ресурс другой операции нельзя считать созданным текущей. Если обнаружился ранее существовавший ресурс, зависящий от удаляемого при откате, очистка блокируется. Отсутствие ресурса после отправки команды с неизвестным результатом остаётся неопределённостью: восстановление не предполагает, что отправка не удалась, и не повторяет создание автоматически.

Удаление работает только с точно записанными идентификаторами и идёт в обратном порядке зависимостей. Ядро и адаптер оба проверяют область доступа и полную принадлежность перед удалением по ID. Подтверждённое отсутствие считается идемпотентным успехом. Каждое подтверждённое удаление сохраняется до перехода к следующему. Частичное удаление можно продолжить, но его нельзя откатить пересозданием уже удалённой инфраструктуры.

## Контракт CLI

`python -m flayer lifecycle` предоставляет `create`, `status`, `destroy` и `recover`. Каждая команда требует явно переданные план, состояние и профиль `yc` с уже настроенной аутентификацией. Команды изменения также требуют `--allow-mutation` и значение `--scope-confirm`, точно совпадающее с ID облачного каталога из плана. Для прерванного создания восстановление принимает `--rollback`. Справка и проверка аргументов не обращаются к инфраструктуре. Вызывающий API код отвечает за разрешение запрошенных операций провайдера; флаги CLI не заменяют политику безопасности или облачный IAM.

## Восстановление и ограничения

Обычное исключение или корректно обработанное прерывание освобождает блокировку операции, сохранив зафиксированный прогресс. Аварийное завершение может оставить эксклюзивную блокировку операции или записи состояния. Перед удалением соответствующей локальной блокировки и запуском восстановления оператор должен убедиться, что предыдущий процесс завершён. Другой процесс никогда не удаляет блокировку автоматически и не считает её истёкшей. Разные пути состояния не блокируют друг друга: для одного точного идентификатора принадлежности стека нужно использовать один основной путь состояния. Одноразовые ID создания защищают от отката ресурсов другой операции, но не образуют распределённую облачную блокировку.

Прежде чем ядро сможет безопасно продолжить работу, провайдер должен установить результат неопределённого создания. Текущий журнал не сохраняет ID операций провайдера и не отказывается автоматически от незавершённого действия. Одни имена не доказывают принадлежность. Наличие ресурса — факт о состоянии инфраструктуры; оно не подтверждает готовность гостевой ОС или успешное развёртывание приложения. Обновление и исправление отклонений от конфигурации не реализованы.

## Альтернативы

- Повторять каждое неудачное создание нельзя: тайм-аут не доказывает отсутствие ресурса.
- Удалять при сбое все совпадающие ресурсы нельзя: это уничтожает ранее существовавшую инфраструктуру и ошибочно приравнивает найденные ресурсы к допустимым для отката.
- Хранить прогресс только в памяти нельзя: принятые провайдером изменения должны оставаться восстанавливаемыми после локальных сбоев.
- Оркестрация под конкретного провайдера в ядре отклонена: синтаксис облачных команд и допустимые параметры ресурсов относятся к адаптеру.

## Совместимость и подтверждение работоспособности

Существующие контракты конфигурации и схемы снимка не меняются. Планы жизненного цикла — отдельный строго проверяемый TOML версии 1 с необязательными параметрами ресурсов и зависимостями. Детерминированные тесты с тестовым провайдером проверяют порядок, принадлежность, идемпотентность, сохранение ранее существовавших ресурсов, частичную очистку, прерванные, но принятые операции создания и удаления, неопределённое отсутствие и ошибки снимка. Реальные облачные операции в эти тесты не входят.
