# ADR 0006: Ограничить операции Yandex Cloud выбранным каталогом и явно учитывать загрузочный диск

## Статус

Принято для реализации жизненного цикла в задаче #20.

## Контекст

Первый адаптер провайдера намеренно предоставляет только обнаружение ресурсов. Теперь оркестрации нужны создание в заданных пределах, удаление точно принадлежащих стеку ресурсов и восстановление после прерванного изменения. Тайм-аут CLI не доказывает, что удалённая операция была отклонена. Повтор создания после неоднозначной ошибки способен породить дубликат ресурса без идентификатора для его последующей очистки.

CLI виртуальных машин Yandex умеет неявно создавать загрузочный диск. Эта составная операция не предоставляет отдельного запроса на создание диска с метками, соответствующего журналу жизненного цикла. Поэтому ошибка между выделением диска и созданием виртуальной машины может оставить неучтённый диск.

Два процесса с разными локальными файлами состояния также могут работать с одним стеком. Одной принадлежности стеку недостаточно, чтобы определить, какая операция создала ресурс, и разрешить его удаление при откате.

## Решение

1. Сохранить `YandexCloudProvider` в режиме только чтения. Добавить отдельный адаптер изменений `YandexLifecycleProvider`, объявляющий возможности создания и удаления. Оба используют общие нормализованные сведения, ограниченные областью доступа.
2. Использовать неизменяемые запросы `ResourceSpec` и явный контракт `LifecycleProvider`. До изменений отклонять неподдерживаемые типы, параметры, привязки зависимостей и некорректные запросы.
3. Поддержать ограниченный граф из шести типов: сеть, подсеть, группа безопасности, статический IPv4-адрес, диск и виртуальная машина. Привязывать зависимости по точным ссылкам с проверенной принадлежностью, а не по именам или произвольным аргументам CLI.
4. Создавать загрузочный диск отдельным ресурсом с метками. Подключать его через `--use-boot-disk` с `auto-delete=false`; удалением в обратном порядке зависимостей управляет журнал ядра. Не использовать `--create-boot-disk`.
5. Устанавливать полные метки принадлежности стеку, логический ID ресурса, ограниченный по размеру хеш требуемой спецификации и сохранённый одноразовый ID операции. При поиске проверять хеш спецификации; при откате дополнительно проверять ID операции непосредственно перед удалением по точному ID.
6. По умолчанию считать ошибки отправленной команды изменения `MutationError(outcome_unknown=True)`. Уточнение задачи #95 распознаёт только два точных отказа парсера до RPC при коде выхода 1 и пустом stdout: отсутствие портов в правиле группы безопасности и неизвестный флаг, присутствующий в аргументах команды создания. При таком ограниченном доказательстве возвращать `outcome_unknown=False`, чтобы ядро выполнило штатный откат. Сохранять только безопасные стабильные коды ошибок. Не повторять изменение автоматически, не выводить отказ из общей ошибки квоты/RPC или одного отсутствия ресурса в списке.
7. Проверять точный каталог и принадлежность в результатах чтения и ответах на создание. Удалять только после свежего поиска по точному ID, затем подтверждать отсутствие одним ограниченным поиском. Неподтверждённое удаление остаётся неопределённым.
8. Принимать только явно указанный вызывающей стороной JSON-файл cloud-init без секретов вместе с SHA256 его содержимого. До обращения к облаку отклонять небезопасные файлы и несовпадение хеша. Передавать закрытую временную копию через `--metadata-from-file`, удалять её после выполнения и не сохранять содержимое в состоянии или сообщениях об ошибках.

## Последствия

Каждый явно созданный ресурс имеет доступные для поиска метки и порядок очистки, определённый журналом. При потере ответа на создание можно установить точную операцию, не принимая ресурс другой операции за кандидата на откат.

Адаптер намеренно не предоставляет обновление, импорт, автоматическое принятие ресурсов без меток, произвольные метаданные, учётные данные, подключение сервисного аккаунта и пересылку произвольных команд провайдера. Наличие ресурса и статус провайдера не подтверждают инициализацию гостевой ОС, готовность туннельного сервиса и сквозную доступность.

Метки принадлежности ограничивают разрешённые действия приложения, но не являются транзакционной блокировкой на стороне провайдера. В CLI нет условного удаления, атомарно сравнивающего метки. Независимые удалённые участники с правом менять метки остаются вне модели согласованной локальной блокировки. Если принадлежность операции или удалённый результат не определены, восстановление действует консервативно.

Реализация проверяется детерминированными подменами команд. Это решение не включает изменение ресурсов реального аккаунта или пробный запуск настоящей CLI для проверки совместимости.

## Альтернативы

- Неявное создание загрузочного диска отклонено: промежуточный ресурс нельзя независимо записать и восстановить в учёте.
- Удаление по имени отклонено: имя не доказывает принадлежность и каталог ресурса.
- Автоматический повтор после тайм-аута отклонён: тайм-аут не доказывает, что запрос не был отправлен.
- Считать все ресурсы стека созданными текущей операцией нельзя: при параллельном обнаружении это привело бы к удалению чужих ресурсов при откате.

## Совместимость

Существующие контракты и возможности только чтения сохраняются. Возможности изменения добавляются к ним. Новые вызовы создания требуют сохранённого ID операции. Удаление поддерживает необязательный ID операции для отката и полную принадлежность стеку для явно запрошенного уничтожения.

