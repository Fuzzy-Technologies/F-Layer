body = '''
# ADR 0007: Явный профиль защищённого шлюза и принадлежность артефактов

## Статус

Принято для первой реализации профиля защищённого шлюза.

## Контекст

В рабочем исходном варианте объединены создание облачных ресурсов, усиление защиты ОС, установка транспорта, выпуск учётных данных и экспорт клиентских конфигураций. Прежде чем сделать эти возможности повторно используемыми в F-Layer, нужно отдельно определить, кто ими управляет. Одна защищённая виртуальная машина ещё не обеспечивает работу шлюза.

Первый профиль должен передавать реальный полезный трафик, не завися от конкретного VPN-продукта, частной инфраструктуры, неявного выбора размещения или сгенерированных закрытых ключей в облачных метаданных. Сведения облачного провайдера не подтверждают инициализацию гостевой ОС и готовность транспорта.

## Решение

Реализовать версионируемый профиль `secure-gateway` с явным контрактом гостевой системы `ubuntu-24.04-cloud-init` и транспортом `ssh-local-forward`. Он объединяет шесть отдельно учитываемых ресурсов: сеть, подсеть, группу безопасности, зарезервированный адрес, загрузочный диск и виртуальную машину. Диск задаётся явно, чтобы прерванное создание машины не оставило без меток и учёта диск, неявно созданный составной операцией.

`CompileGateway()` возвращает проверенную неизменяемую модель профиля. `RenderPlan()` формирует TOML для жизненного цикла после проверки точного экспортированного серверного артефакта и его полного манифеста принадлежности. Пакет профилей не импортирует реализации изменений провайдера или жизненного цикла. Их совместная работа проверяется при интеграции.

Сервер разделяет администрирование и передачу трафика:

- Администратор использует явно заданный открытый ключ Ed25519 и ограниченный список исходных CIDR.
- Каждое объявленное устройство имеет уникальный открытый ключ и ограниченные исходные CIDR.
- Отдельная учётная запись с заблокированным паролем и без sudo разрешает локальную переадресацию TCP только к перечисленным адресатам. Оболочка, подсистемы, TTY, удалённая переадресация, перенаправление агента, Unix-сокетов и туннельные интерфейсы SSH запрещены.
- Ключи авторизации устройств дополнительно ограничивают исходные CIDR и адресатов.
- Для обеих ролей используются конкретные файлы разрешённых ключей, принадлежащие root; поиск ключей в домашнем каталоге исключён. Первоначальная настройка подтверждает отсутствие туннельной учётной записи перед созданием её собственной группы и блокировкой пароля. Ошибка поиска или создания останавливает активацию сервиса.
- Клиентские конфигурации привязывают переадресацию к `127.0.0.1`, требуют явную ссылку на закрытый ключ и независимо проверенный файл known-hosts, а также включают строгую проверку ключа сервера. Генерация не читает ни один из этих файлов и не принимает ключи сервера автоматически.

Начальная облачная конфигурация содержит открытые ключи и заданные настройки защиты, но никогда не содержит закрытые ключи или значения учётных данных. План жизненного цикла включает явный `user_data_file` и SHA-256 его ожидаемого содержимого. Перед отправкой провайдер проверяет и копирует файл; механизм загрузки относится к провайдеру.

Сгенерированные артефакты хранятся отдельно от облачного состояния. Новые наборы создаются без перезаписи существующих; доступ к ним получает только владелец. Содержимое проверяется по точным хешам, а манифест записывается последним. До удаления любого файла очистка проверяет полный идентификатор принадлежности и все заявленные файлы. Неизвестные файлы, изменённое содержимое, повреждённые манифесты, символьные и жёсткие ссылки, чужая принадлежность и конфликты останавливают операцию. Очистка никогда не удаляет каталог рекурсивно и не затрагивает ресурсы провайдера.

Перед очисткой, откатом и освобождением блокировки повторно проверяются зафиксированные inode, данные об изменении и хеши. Чтение артефакта возвращает проверенный неизменяемый снимок. Эти проверки обнаруживают конкретные подмены от имени того же пользователя; закрытые каталоги и эксклюзивные блокировки по-прежнему предполагают согласованную работу процессов записи. В POSIX нет атомарного условного удаления по идентификатору и хешу. Активно враждебный процесс того же пользователя или привилегированный администратор находятся вне границ изоляции этого хранилища.

## Последствия

Первый профиль обеспечивает работающий прикладной TCP-шлюз, а не полноценный IP-VPN. Маршрутизация IPv4-пакетов остаётся отключённой; IPv6 не входит в контракт этой гостевой системы. Дополнительные разрешения сервисных портов не устанавливают слушающие сервисы.

Подготовка профиля и проверка синтаксиса без сети не доказывают успешное выполнение cloud-init, доступность адресата, SSH-аутентификацию или готовность гостевой ОС. Поэтому локальное описание устройства сохраняет статус `prepared-unverified`. До подключения оператор должен получить ключ сервера через независимо доверенный канал. `ExitOnForwardFailure` проверяет создание переадресации, а не работоспособность конечного адресата.

Хранение артефактов сейчас требует POSIX-системы с принадлежащими вызывающей стороне каталогами `0700` и файлами `0600`. Клиентские конфигурации могут ссылаться на POSIX-пути или абсолютные пути Windows с прямыми косыми чертами. Хранилище артефактов с учётом ACL Windows не реализовано. Экспортированные из других систем закрытые транспортные профили остаются чувствительными данными, передаваемыми в памяти в `BuildDeviceBundle()`; корректность самого транспорта для них не утверждается.

Прерванная запись обычно удаляет только собственные новые файлы. Сбой очистки или освобождения блокировки может потребовать явного локального восстановления; существующая блокировка никогда не удаляется автоматически. Если финальное освобождение блокировки не удалось, опубликованный набор может остаться доступен. Локальная очистка отличается от уничтожения инфраструктуры и не должна выполняться одновременно с активным развёртыванием.

## Альтернативы

Повторное использование VPN-контейнеров сохранило бы зависимость от продукта и потребовало бы в одной работе реализовать выпуск и отзыв секретов, закрепление версий и проверки конкретного транспорта. Серверная основа без транспорта не дала бы работающего шлюза. Неограниченная SSH-переадресация или доверие при первом использовании ослабили бы явные ограничения доступа и проверки.

## Совместимость и миграция

Существующая схема требуемой конфигурации и интерфейсы обнаружения ресурсов не меняются. У профиля появляется собственная явная схема TOML. Неявной миграции прежней частной конфигурации, состояния, учётных данных устройств или адресов подключения нет.

