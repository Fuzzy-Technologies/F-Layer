# ADR 0008: Воспроизводимые дистрибутивы и явная публикация владельцем

## Статус

Принято к реализации; настройка аккаунта PyPI остаётся действием владельца.

## Контекст

В F-Layer уже есть локальные и CI-проверки Python и документации, а также безопасное закрытие задач и удаление веток после мерджа. Для релиза пакета дополнительно нужны доказательства того, что wheel и исходный дистрибутив содержат только принятые файлы проекта, имеют одну согласованную версию, воспроизводимо собираются и соответствуют стабильной ветке. Публикация начального пакета или автоматическая загрузка по каждому тегу вышла бы за рамки этого контракта. Владение пакетом в PyPI ещё не настроено и не проверено.

## Решение

Для PR и push в интеграционную ветку собирать предварительные артефакты без публикации из чистых снимков отслеживаемых файлов. Брать время из исходного коммита, требовать закреплённую версию Hatchling, побайтово сравнивать две независимые сборки и повторно собирать wheel из проверенного исходного архива. Проверять пути, типы и ограничения элементов архивов, принадлежность исходников проекту, метаданные, типовые признаки учётных данных и все хеши wheel `RECORD`. Сохранять SHA256 и сведения об исходнике, версии и сборке вместе с проверенными артефактами в игнорируемом каталоге `_build`.

Статическую начальную версию принимать только для предварительных сборок. Релиз по тегу требует буквальной версии пакета, отличной от начальной, и совпадения статических и динамических метаданных. Требовать аннотированный стабильный тег `vX.Y.Z`, указывающий точно на текущий checkout и актуальную полученную `origin/master`. Публикация дополнительно требует ручного запуска из `master` в основном репозитории назначенным владельцем релизов, положительного подтверждения для конкретного запуска и явного включения через переменную репозитория.

Разделить задания сборки/проверки и загрузки. Только задание загрузки получает разрешение OIDC, скачивает проверенные артефакты данного запуска и вызывает закреплённую версию издателя PyPA для фиксированного рабочего адреса PyPI. Оно никогда не получает checkout кода проекта. Использовать PyPI Trusted Publishing; не настраивать автоматически токены, аккаунт, окружение или предварительные условия защиты веток. Проверка PR и тегов никогда не загружает пакет в реестр.

## Последствия

- Проверка артефактов без публикации работает без аккаунта PyPI.
- Версии метаданных и исходников могут перейти от начальных статических метаданных к каноническому источнику Hatch без изменения релизных проверок.
- Включение публикации требует осознанной настройки владельцем и ручного запуска. До этого доступность имени, владение аккаунтом и совместимость реальной загрузки через OIDC остаются непроверенными.
- Стабильный релиз нельзя выпустить из старого коммита master или напрямую из `develop`.
- Проверка исходников по-прежнему отвечает за секреты с произвольными значениями, которые не совпадают с ограниченным набором сигнатур. Ни один сканер не может доказать отсутствие всех возможных секретов.
- Существующие механизмы задач и веток не меняются. Завершение фичи и майлстоуна, а также создание GitHub Release остаются отдельными явными операциями.

## Альтернативы

Автоматическая публикация по тегу убрала бы подтверждение владельца для каждого релиза. Загрузка по токену добавила бы постоянные учётные данные. Сборка из текущего рабочего каталога могла бы случайно включить игнорируемые или частные файлы. Проверка только метаданных не обнаружила бы небезопасные имена элементов архива, изменённые исходники пакета или неполный `RECORD`.

