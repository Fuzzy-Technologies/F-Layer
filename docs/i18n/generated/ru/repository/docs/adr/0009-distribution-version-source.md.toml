# ADR 0009: Единый источник версии дистрибутива и установленного пакета

- Статус: принято
- Дата: 2026-10-04
- Задача: [#25](https://github.com/Fuzzy-Technologies/F-Layer/issues/25)

## Контекст

F-Layer нужны собираемые дистрибутивы и консольная команда ещё до включения автоматизации релизов. Дублирование версии в метаданных пакета и исходниках усложнило бы проверку соответствия артефактов и релизного тега.

## Решение

Хранить буквальное значение `__version__` в модуле верхнего уровня пакета. Hatchling читает его регулярным выражением, не выполняя код пакета. Объявить версию проекта динамической и сохранить существующий формат релизов `X.Y.Z`. Оставить начальное значение `0.0.0` до явного изменения версии, прошедшего ревью.

Предоставить консольную команду `flayer` через существующую CLI `Main()`, сохранить отсутствие зависимостей времени выполнения и включить маркер типов PEP 561. Добавить метаданные дистрибутива, не утверждая, что пакет уже опубликован в PyPI.

## Последствия

Метаданные wheel, метаданные sdist и версия установленного пакета имеют один источник. Тесты без сети устанавливают настоящий wheel и повторно собирают его из sdist, поэтому отсутствие исходников, данных пакета или точек входа становится ошибкой проверки. Примеры репозитория добавляются в явный список включения sdist.

## Альтернативы

Дублируемая статическая версия может рассинхронизироваться. Версия, вычисляемая по Git, привязывает повторную сборку к метаданным Git и не подходит для чистого экспортированного sdist. Плагин, выполняющий код для получения версии, способен импортировать код провайдера или приложения во время упаковки.

## Совместимость

Существующие Python-модули и `python -m flayer` остаются доступны. `flayer` добавляется как устанавливаемая точка входа, а `__version__` — как метаданные. Эта работа не создаёт тег, релиз или реальную публикацию пакета.
'''
