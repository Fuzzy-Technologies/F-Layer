# ADR 0010: Явная проверка полноты документации репозитория

- Статус: принято
- Дата: 2026-10-04
- Задача: [#28](https://github.com/Fuzzy-Technologies/F-Layer/issues/28)
- Основано на [ADR 0004](0004-documentation-platform.md)

## Контекст

Первая версия сборщика обнаруживает общедоступные Python-модули установленного пакета. При этом фильтр путей исключает `flayer.__main__`, хотя именно этот модуль предоставляет поддерживаемую команду CLI. Сравнение только найденных общедоступных модулей не обнаружит внутренний модуль, пропущенный в wheel, или другие расхождения между исходниками и установленным пакетом. Копирование отдельных каталогов документации оставляет за пределами навигации другие Markdown-файлы, в том числе правила разработки и руководства проекта.

Для требования «документация по всем файлам» нужно точно определить охват. Автоматическая публикация тестов, инженерных инструментов и внутренних вспомогательных функций как API ошибочно представит их поддерживаемыми интерфейсами. Если же молча исключить эти файлы, проверить полноту будет невозможно.

## Решение

Хранить отдельный манифест правил охвата. Каждый отслеживаемый Git файл должен соответствовать ровно одному правилу с указанной категорией и причиной. При сборке создавать перечни файлов и определений в JSON и Markdown с навигацией; эти результаты можно пересоздать. Новые файлы известных категорий включаются автоматически. Отсутствующие, неоднозначные или неподдерживаемые категории останавливают сборку. Количество модулей не задаётся вручную.

Требовать полного совпадения состава и байтов пакета в исходниках и установленном wheel, исключая байткод интерпретатора. Явно включать исполняемый модуль CLI. Публиковать общедоступные модули, определения, методы и вызываемые протоколы; внутренние, вложенные и прочие специальные методы отмечать как доступные только в исходном коде. Конструкторы представлять через сигнатуры классов и исходники.

Публиковать все канонические Markdown-файлы под контролем Git, включая шаблон ADR, правила, руководства по релизам и разработке, входные страницы репозитория и шаблон PR. Существующие адреса авторских страниц сохранять, для остальных файлов создавать страницы репозитория. Ссылки между скопированными Markdown-файлами направлять на опубликованные страницы; ссылки на файлы, не являющиеся страницами, оставлять ссылками на исходники. При генерации не изменять правила, которыми управляет владелец проекта.

Проверять наличие страниц и возможность перейти к ним с английской главной страницы, точность якорей API, ссылки, выравнивание таблиц, правила охвата и правила хранения результатов генерации. Не менять полномочия проверяющих перевод и не считать полноту структуры доказательством проверки человеком. Добавить описание реализованной архитектуры и указатель ADR.

## Последствия

Сборка сможет обоснованно подтверждать охват всех файлов, отличая поддерживаемый API от инженерных материалов, доступных через исходный код. Новые файлы известных категорий появляются автоматически; для новой категории требуется правило, которое можно проверить в PR. Пропущенные внутренние модули wheel и страницы без входящих ссылок становятся ошибками. Машиночитаемый отчёт фиксирует решение по каждому файлу и происхождение wheel.

Полнота структуры не доказывает полноту объяснений или качество перевода. Импортированные псевдонимы, поля, константы и унаследованные члены представлены через определяющий модуль или класс; отдельные дублирующие якоря для них не требуются. Для включения модуля с именем, начинающимся с подчёркивания, в поддерживаемый API нужно отдельное решение.

## Альтернативы

Безусловная генерация API для всех Python-файлов превращает внутренние детали в обещания пользователю. Перечни и количества файлов, обновляемые вручную, устаревают при слиянии независимых веток. Копирование только каталогов и проверка одного лишь существования файлов не выявляют страницы без навигационных ссылок. Импорт модулей при сборке по-прежнему создаёт недопустимый риск выполнения кода и обращения к учётным данным.

## Совместимость и переход

Поведение публичного Python API и адреса авторских страниц не меняются. Страница CLI API, страницы репозитория и перечень охвата добавляются к существующей документации. В отчёт сборки добавляются поля полноты. При изменении английского оригинала необходимо обновить его хеши; до проверки соответствующие переводы остаются отсутствующими или устаревшими.
