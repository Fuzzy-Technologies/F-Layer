# ADR 0011: Статическое обнаружение расширений и явная загрузка

## Статус

Принято для [задачи #29](https://github.com/Fuzzy-Technologies/F-Layer/issues/29).

## Контекст

Адаптер чтения Yandex, отдельный адаптер жизненного цикла и профиль защищённого шлюза уже используют механизм расширений. Их контракты разделяют наблюдение за ресурсами, изменение ресурсов с проверкой принадлежности и компиляцию профиля. Требование общего интерфейса изменения ресурсов от каждого провайдера нарушило бы это разделение.

Установленные entry points указывают на исполняемый Python-код. Обнаружение доступных расширений не должно импортировать их модули, выполнять фабрики, обращаться к инфраструктуре или запускать установленные обработчики поиска метаданных. Поиск в произвольных каталогах и сетевых адресах также неявно расширял бы область доступа и доверия.

## Решение

Добавить `flayer.extensions` с неизменяемыми описателями и явным реестром. Встроенные описатели указывают на пригодные к использованию адаптеры существующих реализаций. Поиск внешних расширений читает только ограниченные по размеру `METADATA`, `entry_points.txt` и `RECORD` из конкретных каталогов `.dist-info`, выбранных вызывающей стороной. Он не перечисляет установленные дистрибутивы и не обходит пути поиска. Версионируемые группы: `flayer.providers.v1` и `flayer.profiles.v1`. До регистрации проверяются идентификаторы расширений, названия дистрибутивов, точные стабильные версии, группы и цели импорта. Дубликаты и неподдерживаемые группы F-Layer вызывают отказ.

Загрузка внешнего расширения — отдельная явно запрошенная операция. Для неё нужны точный зарегистрированный описатель и список разрешённых описателей, включающий цель импорта. Файлы метаданных привязываются к хешам и повторно проверяются перед импортом: изменившийся результат обнаружения не даёт права загрузить код. Точные хеши и размеры из `RECORD` связывают выбранный модуль и все родительские пакеты с обычными файлами исходников внутри выбранного каталога установки. Зарезервированное пространство имён `flayer` запрещено для внешних целей. Загрузчик выполняет проверенные снимки исходников из памяти; временный обработчик обслуживает только выбранную цепочку импортов, чтобы родительские импорты не выполнили устаревший байткод. Для уже закешированных модулей нужны сохранённые загрузчиком сведения об объекте, пути и хеше исходника. При загрузке проверяются протокол фабрики и точное совпадение заявленных идентификаторов расширения. Это явное решение доверить выполнение коду, а не песочница или проверка подлинности пакета.

Фабрики провайдеров возвращают существующий протокол `CloudProvider`. Отдельный `LifecycleProviderExtension` возвращает существующий протокол `LifecycleProvider`. Профили компилируют явно переданную конфигурацию в контексте точного `StackIdentity` и возвращают адаптер создания серверного комплекта и плана жизненного цикла. Ограниченный контекст провайдера содержит область ресурсов, внешнюю ссылку на способ аутентификации и ограничения выполнения; самих учётных данных в нём нет. Конфигурация профиля по-прежнему проверяется по его строгой схеме.

## Последствия

Импорт пакета расширений и обнаружение метаданных не выполняют код плагинов. Оператор может изучить каталог, прежде чем разрешить запуск конкретной внешней фабрики. Существующие CLI и ядро жизненного цикла не меняются. Создание объекта провайдера и компиляция встроенного профиля не изменяют инфраструктуру.

На первом этапе поддерживаются только стабильные версии из трёх числовых компонентов, обычные Python-пакеты с исходниками и entry points без дополнительных зависимостей extras. Для другого ABI нужна новая группа и явное решение о совместимости. Оператор передаёт выбранные каталоги метаданных; автоматическая установка, разрешение пакетов и зависимостей, управление учётными данными, динамический поиск модулей и изоляция процессов в этот контракт не входят. Закрепление хешей не проверяет подписи, подлинность издателя и принадлежность зависимостей. До загрузки нужно доверять выбранному окружению и внешнему пакету. Внешние зависимости также входят в область разрешённого выполнения. Очистка не может отменить произвольные побочные эффекты плагина: удаляются только модули и проверочные записи, созданные этой попыткой загрузки.

## Альтернативы

Автоматический обход обработчиков `importlib.metadata` может выполнить установленный код поиска и расширяет область обнаружения. Импорт модулей ради изучения возможностей запускает ещё не разрешённый код. Универсальный фреймворк плагинов, решатель зависимостей или замена жизненного цикла потребовали бы новых контрактов, не нужных существующим реализациям.

## Совместимость и переход

Контракты провайдеров, жизненного цикла, профилей, состояния, артефактов и CLI остаются прежними. Встроенные адаптеры расширений дополняют их. Существующие потребители могут продолжать вызывать API напрямую; перенос конфигурации или сохранённого состояния не нужен.

