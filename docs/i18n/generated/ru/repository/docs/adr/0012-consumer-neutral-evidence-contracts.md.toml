# ADR 0012: Независимые от потребителя контракты передачи результатов наблюдений

- Статус: принято
- Дата: 2026-10-04
- Связанная задача: #30

## Контекст

1337 и другим клиентам экосистемы Fuzzy нужен ограниченный интерфейс запроса и получения наблюдений F-Layer. Модели анализируют информацию; ядро F-Layer управляет выполнением, сохранённым состоянием, принадлежностью ресурсов и результатами проверок. Разбор сообщения, обнаружение возможности или указание имени стека не должны давать ИИ- или MCP-клиенту право управлять инфраструктурой.

Существующие модели диагностики, состояния и жизненного цикла полезны как источники результатов, но их полное содержимое нельзя передавать через внешний интерфейс. Адреса ресурсов, произвольные подробности диагностики и строки состояния провайдера могут раскрывать сведения об инфраструктуре. Проверенной работающей интеграции с 1337 в этом репозитории нет.

## Решение

Добавить независимый пакет `flayer.integrations` с форматами запросов и ответов версии 1. Каждое сообщение привязывать к точному `StackIdentity`, ограниченному идентификатору запроса и явной операции только для чтения. Для разбора требуется независимо переданный ожидаемый идентификатор стека; для разбора ответа также нужен исходный запрос. Неподдерживаемые версии, дублирующиеся и неизвестные поля, слишком большой ввод и любые имена операций изменения ресурсов отклоняются.

Преобразовывать уже полученные диагностические отчёты, снимки принадлежащего стеку состояния и отчёты жизненного цикла в разрешённый набор результатов. Сохранять исходы диагностики, ограниченные числовые измерения, количество локально записанных ресурсов, действие и исход жизненного цикла, необходимость восстановления и количество ресурсов по статусам. Исключать идентификаторы ресурсов и логические идентификаторы, названия и сообщения диагностики, адреса подключения, строки провайдера, необработанные ошибки, конфигурацию, учётные данные и произвольное содержимое.

Строки вызывающей стороны допускаются только в идентификаторах стека, необходимых для маршрутизации и в идентификаторе запроса. Это обязательные несекретные метаданные для разрешённого канала передачи. Проверка формата не является аутентификацией или универсальным поиском секретов. Вызывающая сторона не должна помещать секреты в эти поля. В примерах используются только демонстрационные значения.

Эти сообщения сами не запускают операции. Приложение, принимающее запросы, отдельно разрешает чтение, выбирает доверенные источники результатов и получает явные ограничения адресов и транспорта через существующие API. Результат изменения инфраструктуры можно передать как сведения о ранее выполненной операции; это не создаёт путь запроса, одобрения или выполнения такого изменения.

## Последствия

- F-Layer получает единый формат результатов, независимый от транспорта и потребителя.
- Привязка к владельцу обязательна; проверка происхождения данных и аутентификация канала остаются обязанностью принимающего приложения.
- Разбор и адаптеры не обращаются к провайдеру, не записывают файлы и не запускают операции.
- Сводные результаты намеренно не содержат подробностей, нужных для диагностики отдельного ресурса.
- Числа в состоянии описывают записанную принадлежность ресурсов, а не их наличие или работоспособность в облаке.
- Снимки не гарантируют актуальность, защиту от повторной передачи или наличие разрешения.
- Для нового вида операций нужно явное изменение контракта и его ревью.

## Альтернативы

Встраивание оркестрации 1337 в ядро связало бы F-Layer с одним потребителем и добавило бы преждевременную логику планирования. Полная сериализация существующих моделей раскрыла бы адреса ресурсов и произвольный текст. Приём запросов изменения ресурсов как универсального содержимого скрыл бы границы полномочий. Одно удаление известных секретов не доказывает безопасность внешних строк; поэтому выбран узкий список разрешённых полей.

## Совместимость и переход

Это дополнительный контракт на стороне F-Layer. Он не заявляет проверенную совместимость с работающими 1337 или MCP. Версия 1 использует строгие схемы; несовместимые расширения требуют новой версии. Существующие CLI, ядро, провайдер и защищённый шлюз не меняются.

## Проверка

Детерминированные фикстуры проверяют ограниченный обмен запросами и ответами, точное совпадение владельца и запроса, неизвестные поля и версии, повреждённый JSON и дубликаты полей, исключение содержащих секреты данных и отказ для запросов изменения ресурсов. Примеры процессов соединяют существующие локальные источники результатов с адаптерами. Перед ревью требуются основной полный набор проверок и строгая сборка документации.
'''
