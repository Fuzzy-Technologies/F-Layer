# ADR 0013: Проверка расширяемости профилей на примере простого статического сайта

- Статус: принято для реализации второго конкретного профиля развёртывания
- Связанная задача: [#31](https://github.com/Fuzzy-Technologies/F-Layer/issues/31)

## Контекст

По одному профилю нельзя доказать, что общие контракты жизненного цикла и провайдера работают независимо от прикладного SSH-шлюза. Второй профиль должен давать другой реальный результат, не добавляя в ядро предположений о новом провайдере и не превращаясь в универсальный исполнитель команд на виртуальной машине.

Существующий адаптер жизненного цикла Yandex уже реализует шесть ресурсов с независимой проверкой принадлежности, явно заданными идентификаторами и размещением, неизменяемыми хешами инициализации и отдельной приватной копией загружаемых метаданных. Хранилище артефактов уже обеспечивает ограниченную публикацию без перезаписи и проверяемую локальную очистку. Эти контракты позволяют реализовать статический сайт, не меняя оба слоя.

## Решение

Добавить профиль `static-site` версии 1 для явно выбранного чистого образа `ubuntu-24.04-cloud-init` и размещения в Yandex. Он создаёт одну HTTP-страницу nginx из ограниченных по размеру обычных заголовка и текста, экранированных внутри фиксированной HTML-разметки. Заданная конфигурация cloud-init содержит только открытые ключи, публикуемый текст страницы и фиксированные операции на гостевой системе. Профиль не принимает произвольные команды, шаблоны, пакеты, пути файлов или настройки веб-сервера.

Схема требует явно указать провайдера, каталог облака, владельца, зону, образ, приватную подсеть, имя администратора, его открытый ключ и разрешённые адреса, а также источники HTTP-запросов. Для HTTP на порту 80 разрешены явно заданные сети IPv4 от `/0` до `/32`; для административного SSH на порту 22 требуется отдельный набор сетей от `/24` до `/32`. В каждом наборе не более шестнадцати непересекающихся канонических сетей. Фиксированный путь открытого ключа с владельцем root, отключённые альтернативные источники ключей и центры сертификации, полная конфигурация SSH и постоянное включение службы сохраняют ограничения доступа чистой гостевой системы.

`CompileStaticSite()` проверяет неизменяемые настройки. `BuildStaticSiteBundle()` использует существующее хранилище серверных артефактов с проверкой принадлежности. `RenderStaticSitePlan()` проверяет весь комплект на отсутствие изменений и точное совпадение сгенерированных байтов, затем создаёт существующий граф ресурсов: сеть, подсеть, группу безопасности, адрес, диск и виртуальную машину. Разборщик и движок жизненного цикла работают с этим планом без новых правил. Существующий провайдер проверяет и передаёт cloud-init, привязанный к хешу.

`PrepareStaticSite()` и CLI модуля сохраняют cloud-init и TOML-план жизненного цикла в отдельных приватных комплектах внутри явно указанного корневого каталога артефактов. Уже существующие файлы не заменяются. Если публикация плана завершилась ошибкой, очистка привязывается к исходному сгенерированному комплекту через новый необязательный аргумент `expected_bundle` существующего API удаления. До удаления хранилище под блокировкой проверяет полные байты ожидаемых файлов и метаданные манифеста. Поэтому допустимый комплект с той же принадлежностью, но другим содержимым не удаляется лишь потому, что принадлежит тому же стеку. Для прежних вызовов очистки поведение сохраняется. Точное совпадение с уже опубликованным планом сохраняет указанный в нём серверный комплект; обнаруженные замены остаются для явного восстановления. Комплекты с одинаковыми байтами и метаданными манифеста считаются одинаковым ожидаемым содержимым. Этот аргумент не хранит историю inode и не обещает изоляции от враждебного процесса того же пользователя.

Публичные функции разбора, компиляции, создания артефактов и плана позволят позже подключить профиль через адаптер расширения. Этот профиль не зависит от обнаружения расширений, ещё не принятого пакета расширений или импортов изменения ресурсов провайдера. Существующая реализация защищённого шлюза, основной CLI и контракты провайдера не меняются.

## Последствия

Второй профиль доказывает, что публикация веб-страницы использует существующие контракты принадлежности, жизненного цикла, преобразования провайдера и артефактов, при этом не является переименованным шлюзом. Он не создаёт учётных записей для туннелей или устройств, не маршрутизирует пакеты и не принимает секретные учётные данные. Разрешённые источники HTTP и SSH независимы.

Фиксированная инициализация проверяет конфигурации SSH, nftables и nginx перед явным включением служб. Установка пакетов дистрибутива может запускать службы отдельно. Локальная подготовка файлов и наличие виртуальной машины у провайдера не доказывают успешное выполнение гостевой настройки или готовность сервера. Маркер готовности не создаётся, готовность не заявляется. Реальное поведение гостевой системы проверяется отдельно с разрешения владельца.

Профиль намеренно не включает TLS, автоматизацию доменов, несколько страниц, загрузку материалов, динамические приложения, IPv6, хранение артефактов в Windows и произвольные настройки сервера. Публичный текст страницы не предназначен для передачи секретов. Сгенерированные планы содержат абсолютную локальную ссылку на файл инициализации и не должны попадать в Git как переносимая конфигурация. Пока восстановлению жизненного цикла нужны оба комплекта, оператор сохраняет их.

Существующее хранилище сохраняет ограничения при гонках между процессами одного пользователя и частичных сбоях файловой системы. Локальная очистка не заменяет удаление ресурсов в облаке.

## Рассмотренные альтернативы

Переименование шлюза с необязательным открытием HTTP-порта не доказало бы нового результата: оно не устанавливает и не настраивает веб-сервер. Универсальная передача cloud-init или shell-команд открыла бы произвольное выполнение на гостевой системе и размыла бы ограниченный контракт профиля. Новый облачный провайдер расширил бы задачу до преобразования ресурсов и разрешений вместо проверки повторного использования профиля.

Немедленное выделение общего генератора из шлюза связало бы независимые ветки разработки и изменило бы работающий профиль ради устранения небольшого дублирования. Компактный генератор статического сайта использует существующий стабильный набор ресурсов. Позднее необходимость общего сериализатора можно обосновать фактической работой двух профилей.

## Совместимость и переход

Существующие конфигурации, API шлюза, состояние, идентификаторы провайдера, команды жизненного цикла и смысл ресурсов не меняются. TOML статического сайта имеет отдельную явную схему без автоматического переноса настроек. Оба профиля работают независимо и не требуют механизма обнаружения расширений.

## Проверка

Детерминированные тесты соединяют реальные разборщик и движок жизненного цикла и адаптер Yandex с подставным исполнителем CLI. Проверяются создание, статус, повторное создание, удаление в обратном порядке зависимостей, повторное удаление, отказ при неверном хеше инициализации, откат и очистка подготовленных файлов. Проверяются строгие отказы, ограничение UTF-8 текста, экранирование HTML, ограничения приватных путей, коллизии и ошибки публикации. Проверки shell и инициализации используют изолированные подставные команды; доступные средства проверки синтаксиса гостевой системы запускаются только в автономном режиме. Облачные ресурсы и службы рабочей машины не изменяются.

Подготовка, использование, очистка и точные реализованные ограничения описаны в [контракте статического сайта](../architecture/static-site.md).
'''
