# ADR 0014: Релизы по майлстоунам и понятные описания изменений

## Статус

Принято для разрешённых владельцем релизов 1.0.0 и 1.1.0.

## Контекст

В принятых изменениях `develop` уже есть завершённые задачи 1.0 и 1.1 вместе с работами 1.2/2.0. Перенос всей вершины ветки незаметно включил бы поздние задачи в ранние релизы. Для каждого запрошенного релиза нужны точный состав кода, неизменяемый тег, воспроизводимые пакеты и понятное пользователю описание.

В проекте 1337 иерархия changelog задана протоколом разработки, а шаблон карточки релиза — процессом выпуска. Отдельного ADR о changelog среди принятых ADR этого проекта не найдено. Адаптированное решение F-Layer явно фиксируется здесь.

## Решение

Для этой последовательности публикаций создать `release/1.0.0` от выпущенного состояния `master` и выбрать принятые коммиты release-1.0. Ветку `release/1.1.0` создать от полученного выпущенного состояния master и выбрать принятые коммиты release-1.1. Записать исходные PR, идентификаторы коммитов и ограниченные изменения, необходимые только для релиза. Не включать поздние функции лишь потому, что они уже есть в `develop`.

Последовательно переносить оба кандидата через PR. Локально выполнять проверки изменённых файлов; полный набор регрессий, документацию и необходимые проверки пакетов выполняет CI. Каждая стабильная версия имеет явно заданную версию в исходниках, совпадающие метаданные пакета, аннотированный неизменяемый тег `vX.Y.Z` на точном коммите master и GitHub Release с проверенными файлами. Сначала опубликовать 1.0.0, затем продвигать master к 1.1.0. Вернуть релизные метаданные и решения в develop через PR. Временные административные workflows держать в отдельных ветках и удалять после работы. GitHub Release сам по себе не разрешает публикацию в PyPI или изменение реальной инфраструктуры.

Стабильная публикация требует выполненной приёмки и закрытого нативного майлстоуна `release-X.Y` без открытых пунктов. Успешный CI реализации или просьба закончить релиз не отменяют критерии приёмки. Владелец проверяет эти критерии до закрытия; автоматизация проверяет нативное состояние майлстоуна, но не закрывает его.

Использовать иерархию changelog Fuzzy Technologies:

```text
# F-Layer Changelog
# Major N
## Minor N.M
### Patch P — vN.M.P — YYYY-MM-DD
#### Digest
#### Added
#### Fixed
#### Changed
#### Removed
#### Security
```

Неприменимые разделы опускать, сохраняя этот порядок. Новые major-, minor- и patch-версии идут первыми внутри своего уровня. Опубликованные записи сохраняются как история; исправление доказанной фактической ошибки требует разрешения владельца. Свободный раздел Unreleased не добавлять. Digest кратко описывает результат для пользователя; подробные разделы объясняют конкретное поведение, а не последовательность коммитов.

Названия GitHub Release имеют вид `F-Layer vX.Y.Z — <short user-facing digest>`. Карточка начинается с `## Digest`; далее следуют `## What's Changed`, `## Validation`, `## Breaking Changes`, `## Try it from source` и при необходимости `## Notes`. Если несовместимых изменений нет, явно указывать None. Различать выпущенную функциональность, фактические результаты тестов и ещё не выполненную эксплуатационную проверку. Сохранять команды получения точного тега; давать ссылки на подробный changelog и происхождение исходников, не превращая дайджест в перечень коммитов.

## Дополнение об объёме release-1.2 — 2026-10-08

Применить тот же отбор по майлстоуну к запрошенной владельцем публикации 1.2.0: начать с выпущенной 1.1.0 и выбрать принятые PR #46, #48, #59 и #60. Включить ограниченную стабилизацию ссылок локализаций на исходники, примеров установки конкретной версии, хешей исходного текста и релизных метаданных. Обнаружение плагинов, контракты интеграции с экосистемой и профиль статического сайта оставить для следующих майлстоунов.

В документации кандидата показывать реальные состояния черновика и возврата к оригиналу там, где нет записей о человеческом одобрении. До стабильной публикации должны быть завершены задача #27, фича #8 и release-1.2, включая фактическую проверку человеком и подтверждение публикации из master в Pages. Вернуть изменения релиза в develop через PR, сохранив все принятые работы следующих майлстоунов.

Прежнее дополнение ошибочно разрешало стабильную публикацию до завершения майлстоуна. Владелец не разрешал это исключение; оно отменено. 2026-10-08 преждевременный релиз v1.2.0 переведён в Pre-release, в название возвращён префикс `v`, а неизменяемый тег и файлы релиза сохранены.

## Последствия

- Состав релизов соответствует майлстоунам, даже если ветка интеграции ушла вперёд.
- Теги, версии исходников и пакетов, примечания и хеши файлов можно проверять вместе.
- Полные регрессии выполняет CI; локальная разработка не повторяет эти наборы.
- Changelog включён в исходные дистрибутивы и сгенерированную документацию.
- Поэтапный выпуск требует явных обратных слияний; опубликованная история не переписывается.
- Стабильный тег не подтверждает проверку реального облака, готовность гостевой системы, одобрение перевода или успешную публикацию в PyPI.

