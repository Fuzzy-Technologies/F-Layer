# ADR 0015: Явная проверка перевода ИИ с привязкой к исходному тексту

- Статус: принято
- Дата: 2026-10-09
- Принято в проверенном владельцем [PR #66](https://github.com/Fuzzy-Technologies/F-Layer/pull/66)
- Связано с [задачей #27](https://github.com/Fuzzy-Technologies/F-Layer/issues/27) и [фичей #8](https://github.com/Fuzzy-Technologies/F-Layer/issues/8)

## Контекст

ADR 0004 разрешал одобрение перевода только человеком. Позднее владелец попросил АИну заново проверить русскую и китайскую документацию и убрать надписи, называющие эти страницы черновиками перевода. Это поручение разрешает фактическую проверку ИИ, а не вымышленное одобрение человеком. Успешная сборка сама по себе по-прежнему не доказывает качество перевода.

## Решение

F-Layer явно выбирает `reviewerTypes = ["human", "ai"]` в проектном манифесте под контролем Git. Для проектов без такого выбора сохраняется правило проверки только человеком. Проверка ИИ указывает `reviewerType = "ai"`, фактического проверяющего, редакторскую или техническую роль, время UTC и актуальный `reviewedSourceHash`. Дополнительно требуется `reviewedTranslationHash`: SHA-256 текста UTF-8 с нормализованными переводами строк. Изменение оригинала или перевода отменяет действительность одобрения ИИ. Существующие требования к ролям, исходному основанию перевода и схема `fuzzy-doc-unit-v1` сохраняются.

AIna-Dev сверяет все девять авторских английских страниц с обеими локализованными версиями: смысл, терминологию, требования к принадлежности и согласию, команды, код, пути, якоря и навигацию. Записи одобрения получают только эти 18 действительно проверенных переводов. Для сгенерированного API и непереведённых справочных страниц репозитория остаётся явно обозначенный английский оригинал. Проверенные страницы сохраняют машиночитаемые сведения о происхождении без видимой плашки проверки. Черновики, отсутствующие и устаревшие переводы сохраняют соответствующие уведомления. Отчёт сборки отличает завершённую проверку авторских страниц от проверки человеком.

Это дополняет решение о полномочиях проверки из ADR 0004. Ревью PR человеком и проверка завершения майлстоуна перед стабильным релизом остаются обязательными. Задача #27 по-прежнему требует успешной публикации из точного коммита master, принятого для релиза; до стабильного выпуска майлстоун должен быть завершён, закрыт и не содержать открытых пунктов.

## Последствия

Пользовательские руководства можно публиковать без вводящих в заблуждение пометок черновика, сохраняя проверяемые сведения об участии ИИ. Проверка ИИ может ошибаться и не называется независимой сертификацией человеком. Последующие правки требуют новой фактической проверки, а не механического обновления хешей. Кандидат получает номер v1.2.1; v1.2.0 остаётся неизменяемым.

## Альтернативы

Скрытие уведомлений при сохранении чернового статуса искажает состояние публикации. Добавление вымышленных проверяющих людей подделывает подтверждения. Ожидание других людей-рецензентов не выполняет порученную владельцем проверку АИной.

## Совместимость

Поведение программы и CLI совместимо с прежним. Существующие записи человеческой проверки по умолчанию получают `reviewerType = "human"`. Явное разрешение расширяет только полномочия проверки документации. Облачные ресурсы, загрузка пакетов в индекс и правила доступа к репозиторию не меняются.
