# ADR 0016: Общие контракты развёртывания VPN и приватные артефакты

- Статус: предложено
- Дата: 2026-10-09
- Связано с [задачей #56](https://github.com/Fuzzy-Technologies/F-Layer/issues/56) и [фичей #55](https://github.com/Fuzzy-Technologies/F-Layer/issues/55)

## Контекст

SSH-шлюз из ADR 0007 перенаправляет выбранные TCP-соединения. Для VPN дополнительно нужны ключи устройств, маршруты, установка сервера, клиентские настройки и отзыв доступа. Эти задачи должны быть отделены от общего создания облачных ресурсов и сохранения идентификаторов провайдера.

AmneziaWG и VLESS Reality нуждаются в одинаковых правилах принадлежности и хранения файлов, но обрабатывают трафик по-разному. IP-туннель может передавать трафик операционной системы; локальный прикладной прокси передаёт лишь трафик, явно направленный в него. Создание клиентского файла не доказывает, что сервер развёрнут, клиент импортировал настройки или пакеты проходят через туннель.

## Решение

Добавить `flayer.profiles.vpn` как публичный контракт профиля, независимый от протокола VPN. Его схема содержит `StackIdentity`, объявленные устройства, маршруты IPv4, адреса DNS и именованные точки приёма TCP/UDP. Он не импортирует конкретные протоколы и не вызывает облачного провайдера. Существующие интерфейсы конфигурации, жизненного цикла, состояния, артефактов и диагностики остаются совместимыми.

`ParseVpnProfile()` принимает только эти публичные поля. Неизвестные поля, включая встроенные секретные учётные данные, вызывают ошибки, не содержащие переданных значений. `LoadVpnProfile()` читает не более 64 КиБ явно указанного TOML и не обращается к переменным окружения, учётным данным, DNS или облачным аккаунтам. Прямое создание dataclass проверяется столь же строго, как разобранный ввод.

| Контракт               | Значение                                                                                 |
| ---------------------- | ---------------------------------------------------------------------------------------- |
| `VpnDevice`            | Постоянное имя устройства и необязательный приватный IPv4-адрес туннеля.                 |
| `VpnRoutes`            | Полные или выборочные маршруты IPv4, явно заданный DNS и условие использования IPv6.     |
| `VpnEndpoint`          | IPv4-адрес или DNS-имя в нижнем регистре и явно заданный порт.                           |
| `VpnListener`          | Именованный транспорт, порт TCP/UDP и разрешённые сети источников.                       |
| `VpnCapabilities`      | Поддерживаемые режимы маршрутизации и область трафика: IP-туннель или прикладной прокси. |
| `VpnProfile`           | Публичные настройки с точной привязкой к проекту, стеку, области ресурсов и владельцу.   |
| `PreparedVpnTransport` | Приватные серверные и клиентские файлы с точной проверкой принадлежности.                |

Профиль допускает не более 16 устройств и восьми точек приёма транспорта. Имена устройств, назначенные адреса туннеля, имена транспортов и пары «протокол/порт» должны быть уникальны. К моменту подготовки каждому устройству IP-туннеля нужен явно заданный приватный IPv4-адрес RFC1918. Конкретный адаптер отвечает за проверку принадлежности адреса подсети, конфликта с адресом сервера, форматов открытых ключей, UUID и других параметров протокола.

### Маршрутизация и семейства адресов

`full` требует ровно `0.0.0.0/0`; `split` — канонические непересекающиеся CIDR, которые вместе не покрывают всё пространство IPv4. DNS-адреса должны быть одноадресными IPv4-адресами, включёнными в объявленные маршруты. Неявного обращения к DNS напрямую, в обход этих маршрутов, контракт не предусматривает.

Набор маршрутов и охват трафика — разные вещи. При `network_mode="ip-tunnel"` полная маршрутизация описывает IPv4-трафик, направленный в туннель. При `network_mode="application-proxy"` она означает все IPv4-направления для приложений, использующих этот прокси. Это не настраивает таблицу маршрутов ОС и не перехватывает другие приложения. Адаптеры, описатели, вывод CLI и руководства должны сохранять это различие.

Первая схема поддерживает только IPv4. IPv6-направления и заявления о доступности IPv6 отклоняются. `ipv6_policy="disabled"` фиксирует явное условие для клиента: оператор должен отключить IPv6 на клиенте или применить отдельно проверенные клиентские правила, исключающие обход VPN. Это значение не доказывает, что F-Layer изменил настройки компьютера, установил kill switch или проверил отсутствие утечек. Схема намеренно отклоняет политику `block`: общий контракт не может обеспечить её исполнение операционной системой. Для DNS-имени сервера конкретному адаптеру ещё нужно получить IPv4-адрес и проверить доступность.

### Секреты и связь с жизненным циклом

Закрытые ключи и клиентские учётные данные хранятся в специальных объектах конкретного протокола и содержимом сгенерированных `Artifact`. Они не становятся полями профиля, общего `ResourceState`, диагностического вывода CLI или текста исключений. Объекты секретов скрывают содержимое в `repr`; вызывающая сторона не должна сериализовать их универсальным сериализатором или записывать содержимое в журнал. Память Python не является защищённым хранилищем.

`BuildVpnServerBundle()` и `BuildVpnDeviceBundle()` требуют помечать всё непрозрачное содержимое протокола как чувствительное. Серверные комплекты именуются `{stack}-{transport}`, клиентские — `{device_id}-{transport}`. Это исключает конфликт двух протоколов у одного стека или устройства. Существующее хранилище артефактов ограничивает доступ средствами POSIX, создание без перезаписи, полные манифесты, хеши содержимого и проверяемую локальную очистку.

`PreparedVpnTransport` требует ровно один чувствительный серверный комплект и по одному чувствительному комплекту на каждое объявленное устройство. Принадлежность и имена транспортов всех комплектов должны точно совпадать с профилем. Подготовка файлов сама по себе не создаёт статуса готовности или успешной аутентификации.

Инициализация облачной машины остаётся без секретов, как требует ADR 0007. План жизненного цикла может создать сеть, зарезервированный адрес, диск, виртуальную машину и публичную инициализацию. Отдельный компонент настройки гостевой системы передаёт чувствительный серверный комплект по явно аутентифицированному каналу после проверки доверия к узлу и принадлежности ресурсов. Эти приватные файлы нельзя помещать в метаданные провайдера или cloud-init. Статус running у облачной машины не доказывает работу VPN.

Диагностика должна отдельно отражать наблюдения за облачными ресурсами, установкой на гостевой системе, состоянием службы, экспортом клиентских файлов и сквозной связностью. Контракт не формирует успешные результаты проверок, которые не выполнялись.

### Замена, отзыв доступа и очистка

`VpnProfile.Fingerprint()` вычисляет хеш публичных настроек. Отпечаток подготовленного транспорта дополнительно включает конкретные возможности и точные хеши файлов, не раскрывая их содержимого. `ValidateVpnReplacement()` требует ожидаемый предыдущий отпечаток от вызывающей стороны и требует совпадения всех идентификаторов стека и имя транспорта. Он допускает явно изменённый состав устройств или настройки после проверки обоих полных комплектов. Это только проверка предусловий: она не записывает данные, не отзывает удалённый доступ и не разрешает перезаписать существующий каталог артефактов.

Перед изменением удалённых ключей компонент настройки должен проверить ожидаемое текущее развёртывание. Удаление устройства требует обновить конфигурацию сервера и проверить итоговое состояние службы. Удаление локального клиентского файла или отсутствие его в новом комплекте не отзывают доступ на сервере. Старые клиентские данные остаются чувствительными до успешного отзыва. При ошибке или прерывании обновления нужно сохранить достаточно несекретных сведений для явного восстановления и не сообщать о завершении.

Локальная замена комплектов использует существующие правила публикации без перезаписи и очистки. Неизвестные файлы, изменённые байты, другой владелец и неполные манифесты запрещают автоматическое удаление. Явно одобренные старые артефакты удаляются лишь после проверки полного сохранённого манифеста; затем новые публикуются с ожидаемой принадлежностью. Это отдельные операции файловой системы, а не атомарная транзакция нескольких комплектов и гостевой системы. После сбоя может потребоваться восстановление оператором. Удаление ресурсов в облаке остаётся отдельно управляемой операцией жизненного цикла и никогда не следует из локальной очистки файлов.

## Проверка

Тематические детерминированные тесты проверяют полные и выборочные маршруты, достижимость DNS через эти маршруты, неподдерживаемый IPv6, неверные типы, повторяющиеся устройства и точки приёма, чувствительность файлов, раздельные имена комплектов двух протоколов, полноту наборов и ожидаемый предыдущий отпечаток при замене. Также проверяется отказ существующего хранилища очищать чужие или изменённые файлы, запрет ключей протокола в общем состоянии инфраструктуры и отсутствие переданного ввода в ошибках.

Эти тесты создают лишь временные локальные файлы. Они не подтверждают реальное развёртывание облака, установку гостевой системы, совместимость протоколов, импорт в клиент, отзыв доступа на работающем сервере или сквозное соединение. Такие проверки относятся к конкретным реализациям и явно разрешённой приёмке развёртывания.

## Последствия

Два конкретных транспорта могут разделять публичные настройки и безопасное локальное хранение, не добавляя в общее состояние приватные данные и не вводя особые типы облачных ресурсов для протоколов. Новые реализации обязаны заявлять реальный охват трафика и не могут молча расширять маршруты или обещать недоступную поддержку IPv6.

Первый контракт требует явных мер предосторожности для IPv6 на клиенте и не реализует общий kill switch. Хранилище артефактов остаётся только для POSIX до появления отдельной реализации с учётом ACL Windows. Конкретные адаптеры по-прежнему должны реализовать и проверить выпуск ключей, проверку конфигурации, установку, состояние службы, откат и отзыв доступа.

## Альтернативы

Передача закрытых ключей через cloud-init нарушает существующее ограничение метаданных. Хранение ключей в общем состоянии провайдера расширяет доступ к ним и связывает очистку ресурсов с секретами транспорта. Представление прикладного прокси как VPN для всей ОС искажает реальное поведение клиента. Имена комплектов только по устройству конфликтуют при включении обоих протоколов.

## Совместимость

Добавляются схема VPN версии 1 и новый модуль. Существующий профиль SSH-шлюза, профиль статического сайта, параметры провайдера, сохранённое состояние ресурсов и формат хранилища артефактов не меняются. Существующие публичные импорты остаются прежними.
'''
