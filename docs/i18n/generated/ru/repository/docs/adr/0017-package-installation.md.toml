# ADR 0017: Установка пакета и необязательная зависимость для VPN

## Статус

Предложено для релиза 2.0.

## Контекст

F-Layer уже собирает воспроизводимые wheel-пакеты и исходные дистрибутивы. Однако пользовательские инструкции всё ещё требуют копию исходников, из-за чего непонятно, как пользоваться установленным приложением. Для сценария шлюза в release-2.0 также нужна локальная генерация ключей VPN, тогда как диагностике и другим потребителям ядра криптографическая зависимость не нужна. Автоматизация публикации в PyPI существует, но принадлежность аккаунта и первая загрузка пока не проверены.

## Решение

Использовать существующий дистрибутив `f-layer` и команду `flayer` как основной способ установки и запуска. Для команды рекомендовать pipx, для использования из Python — pip в виртуальном окружении. Непосредственно доступный канал установки — официальные wheel-файлы GitHub Release. Установка по имени пакета из PyPI становится документированным поддерживаемым способом только после подтверждённой публикации.

Добавить необязательный extra `vpn` с закреплённой зависимостью `cryptography==50.0.2` — актуальной выпущенной версией, проверенной по changelog разработчиков 2026-10-09. Минимальное ядро сохраняет отсутствие обязательных сторонних зависимостей времени выполнения; код VPN импортирует криптографическую библиотеку только при необходимости. Добавить ту же зависимость в существующий extra `dev`, чтобы стандартное тестовое окружение проверяло VPN. Это расширяет решение об отсутствии зависимостей из ADR 0009, не меняя установку ядра.

До загрузки предварительных файлов релиза и до публикации в PyPI выполнять интеграционные проверки установки именно тех wheel и sdist, которые прошли аудит. Обязательны совпадение повторных сборок, изолированная установка ядра, запуск консольной команды и проверка зависимостей. VPN-extra устанавливать в отдельное чистое окружение из заранее загруженных бинарных wheel; проверять генерацию ключей, необходимых протоколам. Проверки установки не должны использовать editable-импорты исходников или обращаться к реальному облачному аккаунту.

Сохранить явное управление публикацией через OIDC владельцем проекта из ADR 0008. Не назначать владельца аккаунта, не загружать пакет и не рекламировать непроверенное имя PyPI как побочный эффект реализации. Первоначально контроллер шлюза поддерживается в Linux и WSL, поскольку приватные файлы защищаются правами POSIX. Образ контейнера не входит в это решение о распространении.

## Последствия

Пользователь сможет установить проверенный релиз без Git и зависимостей для разработки. Для VPN он явно устанавливает криптографический extra; решатель зависимостей выбирает совместимые бинарные wheel для платформы. Исходный дистрибутив остаётся доступным для пересборки. Контролируемые проверки CI охватывают оба варианта установки, используя те же файлы, которые будут опубликованы.

Первая публикация в PyPI остаётся отдельной конкретной релизной задачей: нужно проверить владение проектом и настроить издателя. Наличие wheel не доказывает успешное развёртывание в реальном облаке или совместимость VPN-клиента; это отдельные критерии приёмки release 2.0.

## Альтернативы

Исходники как основной способ установки заставляют каждого пользователя работать с инструментами сборки. Обязательная криптографическая зависимость добавляет ненужный код потребителям ядра. Контроллер только в Docker усложняет доступ к профилю облачного CLI и приватным файлам проекта пользователя. Автоматическая загрузка по каждому тегу убрала бы существующий контроль публикации владельцем.

