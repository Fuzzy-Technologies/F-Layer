# ADR 0018: Проверенные переводы сгенерированной документации

## Статус

Предложено. Связано с [задачей #75](https://github.com/Fuzzy-Technologies/F-Layer/issues/75).

## Контекст

Авторские руководства переведены, но сгенерированные страницы API, руководства репозитория и перечень охвата всё ещё показаны по-английски. Перевод одних названий навигации не переводит содержимое страниц. В документации релиза 2.0 нужно перевести весь текст для читателя, сохранив без изменений имена вызываемых объектов, команды, пути и листинги исходного кода.

## Решение

- Обнаруживать каждый публикуемый Markdown-документ репозитория, docstring общедоступного модуля, общедоступное определение и docstring конструктора, включённые генератором API.
- Хранить переводы в TOML-каталогах `docs/i18n/generated/<locale>/`. Каждую проверку связывать с существующим каноническим хешем `fuzzy-doc-unit-v1` и точным хешем перевода. Требовать редакторскую и техническую проверку, имя и тип проверяющего, дату с часовым поясом и полномочия проекта по ADR 0015.
- Сохранять все заголовки Markdown, их канонические якоря, блоки кода и адреса ссылок на исходники. Переведённые документы сохраняют существующие адреса языковых страниц.
- Через статическое расширение Griffe заменять только объекты документации. Wheel, идентификаторы Python, сигнатуры, исходные листинги и запрет импорта остаются без изменений. Модуль считается переведённым, только когда весь выводимый пояснительный текст прошёл проверку.
- Формировать пояснения перечня из проверенных локализованных сообщений по фактическому составу отслеживаемых файлов и определений. Код, представленный только исходниками, явно отмечать в классификации; его байты не считать непереведённым пояснительным текстом.
- Отсутствующий или изменённый перевод по-прежнему явно показывать как отсутствующий или устаревший и записывать фактическое состояние в отчёт сборки. Для версий пакета 2.0 и новее сборщик документации отклоняет неполный перевод. При стабилизации эту же проверку можно включить явно через `--require-complete-translations`.

## Последствия

Добавление документации или изменение описаний API требует проверки соответствующих переводов перед публикацией 2.0. Проверка ИИ остаётся подписанной проверкой ИИ и никогда не превращается в заявление об одобрении человеком. Строгая сборка, точные ссылки, статическое обнаружение, охват репозитория и совпадение с установленным wheel проверяются независимо.

## Альтернативы

Копирование английского текста в файлы локализаций скрывало бы отсутствие перевода. Перевод файлов исходного кода изменил бы документируемый код. Оба варианта отклонены.
'''
