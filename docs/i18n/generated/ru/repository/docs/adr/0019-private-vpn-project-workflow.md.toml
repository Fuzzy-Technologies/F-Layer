# ADR 0019: Приватные VPN-проекты и настройка гостевой системы по проверенному каналу

- Статус: предложено
- Дата: 2026-10-09
- Связано с [задачей #71](https://github.com/Fuzzy-Technologies/F-Layer/issues/71) и [фичей #55](https://github.com/Fuzzy-Technologies/F-Layer/issues/55)

## Контекст

После установки пакета F-Layer пользователю нужен полный рабочий сценарий: создать локальный проект, указать облако и устройства, подготовить ключи, создать ресурсы, установить оба транспорта и получить готовые клиентские файлы. При этом должны сохраняться границы между публичными настройками, минимальным состоянием облачных ресурсов, приватными файлами и фактически выполненными проверками.

Для первого соединения с новым сервером также нужен проверенный ключ узла SSH. Автоматическое принятие любого ключа, ответившего на публичном адресе, подвергло бы приватные серверные файлы риску перехвата. Ключ можно скопировать вручную, но это неоправданно усложняет первое развёртывание.

## Решение

Добавить `flayer project init DIRECTORY` и следующие команды проекта:

```bash
flayer vpn prepare --project DIRECTORY
flayer vpn deploy --project DIRECTORY --allow-mutation --scope-confirm FOLDER_ID
flayer vpn status --project DIRECTORY
flayer vpn destroy --project DIRECTORY --allow-mutation --scope-confirm FOLDER_ID
flayer vpn recover --project DIRECTORY --allow-mutation --scope-confirm FOLDER_ID
```

`recover --rollback` явно запрашивает откат через существующий движок жизненного цикла. Команда не пытается угадать результат облачной операции с неизвестным исходом.

### Локальный проект и ключи

Контроллер работает на POSIX-системах, включая Linux и WSL. Для инициализации нужны новый каталог и OpenSSH `ssh-keygen`. Создаётся каталог с правами `0700`, административный ключ Ed25519 с правами `0600`, редактируемый `project.toml` и локальное исключение для Git. Существующие каталоги никогда не перезаписываются. Если инициализация частично завершилась и упала, результат сохраняется для разбора.

Публичная схема проекта содержит точную принадлежность стека, существующий авторизованный профиль `yc`, каталог Yandex, зону и образ Ubuntu 24.04 amd64, приватную облачную подсеть, ограниченные административные CIDR, адреса устройств, маршруты и явные настройки AmneziaWG/VLESS. Неизвестные поля и встроенные секретные учётные данные отклоняются. Облачная и туннельная подсети не должны пересекаться. TCP-порт 22 используется только для администрирования.

Подготовка создаёт ключи протоколов один раз. Учётные данные контроллера хранятся в отдельном чувствительном комплекте с проверкой принадлежности. Закрытые клиентские ключи AmneziaWG не передаются серверу. Серверные файлы содержат только ключи, необходимые соответствующему протоколу. Отпечаток публичного проекта предотвращает случайное повторное использование ключей после изменения настроек. Изменённые ключи или манифесты вызывают отказ, а не неявную замену ключей.

Локальная подготовка проверяет оба генератора протоколов. Она сохраняет серверные файлы и публичную инициализацию, но не создаёт клиентские файлы с подставным адресом сервера. Клиентские файлы появляются только после подтверждения точного зарезервированного IPv4-адреса на конкретной принадлежащей стеку виртуальной машине.

### Жизненный цикл облачных ресурсов

Специальная инициализация VPN и шесть типизированных ресурсов соединяются с существующим `LifecycleEngine`: сеть, подсеть, группа безопасности, зарезервированный адрес, загрузочный диск и виртуальная машина. Общее состояние облака по-прежнему хранит только идентификаторы принадлежащих стеку ресурсов у провайдера. В метаданные облака входят открытый ключ администратора и несекретная инициализация; приватные данные протоколов не попадают в параметры жизненного цикла и cloud-init.

Инициализация настраивает администрирование от непривилегированного пользователя только по ключу, ограниченную фильтрацию входящих соединений и отключает IPv6 гостевой системы. Она не создаёт запрещающую маршрутизацию цепочку forward из профиля SSH-шлюза. AmneziaWG управляет собственными правилами перенаправления и NAT для своего интерфейса и включает IPv4-forwarding при старте службы.

Для deploy, destroy и recover CLI требует одновременно `--allow-mutation` и точный ID каталога в `--scope-confirm` ещё до подготовки файлов или создания провайдера. Журналы жизненного цикла сохраняют операции с неизвестным результатом и частичную очистку. Обычный повтор развёртывания не может незаметно создать заново ресурс, если результат предыдущего запроса на его создание пока неизвестен.

### Независимая проверка доверия к серверу

После успешной публичной инициализации гостевая система выводит открытый ключ узла Ed25519 в последовательную консоль вместе с точным публичным отпечатком проекта. Сначала контроллер получает сохранённую виртуальную машину и зарезервированный адрес по точным ID, проверяет все метки принадлежности и область ресурсов и требует совпадения их публичных IPv4-адресов.

Затем он вызывает аутентифицированный API чтения последовательной консоли Yandex Cloud для этой конкретной машины через выбранный профиль `yc`. Объём разбора ограничен, посторонний вывод отбрасывается, конфликтующие подходящие ключи вызывают отказ. Если вывод инициализации ещё не появился, допускается ограниченное ожидание, затем выводится понятная просьба повторить попытку. Полное содержимое последовательной консоли не печатается и не сохраняется.

Ключ сохраняется как принадлежащий проекту приватный артефакт known-hosts. Изменившийся ключ или адрес не могут перезаписать существующую привязку. OpenSSH использует строгую проверку ключа сервера, конкретный закрытый ключ, отключённые агент, пользовательскую конфигурацию SSH, proxy command и совместное использование соединений; допускаются только ключи узла Ed25519. Доверие основано на уже авторизованном облачном аккаунте и конкретной принадлежащей проекту машине, а не на первом неаутентифицированном сетевом ответе.

### Установка на гостевую систему и наблюдения

Приватные серверные комплекты передаются через стандартный ввод SSH, а не аргументы командной строки. Гостевой приёмник проверяет всё ограниченное по размеру сообщение до создания файлов. Для каждого установщика создаются временный каталог root с правами `0700` и обычные файлы с правами `0600`; задаётся явный рабочий каталог и запускается только выбранный установщик протокола. Каждый установщик отвечает за свою службу, закреплённые зависимости, проверку, откат и очистку гостевой системы.

Вывод установщика подавляется на границе контроллера, чтобы не напечатать ключи. Приёмник возвращает только фиксированный маркер завершения. Временные файлы удаляются и после успеха, и после ошибки. Если один транспорт уже установился, а следующий завершился ошибкой, облачные ресурсы и ключи контроллера сохраняются. Повторная попытка использует те же ключи и проверки повторного запуска установщиков.

`status` отдельно показывает существование облачных ресурсов и состояние конкретных гостевых служб. Успешная установка или активная служба не выдаются за соединение клиента. Отчёт явно просит импортировать настройки в клиент и проверить прохождение трафика. VLESS остаётся прикладным прокси, пока пользователь не настроит режим TUN или системную маршрутизацию совместимого клиента. Начальный IPv4-контракт по-прежнему требует клиентских мер для IPv6 из ADR 0016.

### Замена и удаление

Первоначальный CLI поддерживает новое развёртывание и полностью совпадающие повторные попытки. Команд замены ключей и отзыва доступа устройства в нём нет. Изменение подготовленного проекта или его ключей требует отдельного явного процесса замены. Удаление локального клиентского файла не отзывает доступ на сервере. Перед изменениями будущая команда замены должна сверить развёртывание на сервере с сохранёнными данными о результате предыдущего развёртывания.

`destroy` удаляет только облачные ресурсы, записанные в состоянии жизненного цикла с проверенной принадлежностью. Приватные локальные файлы намеренно сохраняются; CLI сообщает об этом. Команда не удаляет рекурсивно каталог проекта, не удаляет чужие файлы и не заявляет, что локально экспортированные ключи стёрты. Изменение адреса или закреплённого ключа сервера при следующем развёртывании требует явного восстановления артефактов либо нового приватного проекта.

## Проверка

Детерминированные тесты запускают реальные компилятор, журналы жизненного цикла, хранилище артефактов и оба генератора протоколов с подставными облаком и гостевой системой. Проверяются create/status/destroy, точные повторы, отказ при отсутствии согласия до изменений, определённый отказ облака и откат, создание с неизвестным результатом и явное восстановление, ошибка гостя с сохранением ключей, неактивные службы, чужая принадлежность, несовпадение адресов, смена ключа сервера, приватные права файлов и отсутствие секретов в инициализации, состоянии и ошибках.

Тест дистрибутива устанавливает настоящий wheel с VPN-extra вне рабочей копии исходников, вызывает `flayer project init` и готовит оба серверных комплекта. Тесты SSH проверяют точные параметры и передачу приватного содержимого только через стандартный ввод. Тесты гостевой подготовки проверяют реальные права временных файлов с подставными процессами установщиков. Ни один тест этого изменения не изменяет реальное облако.

## Последствия и ограничения

Установленный пакет теперь предоставляет исполняемый путь от редактируемых настроек проекта до двух серверных служб и приватных клиентских файлов. Каждая внешняя операция отделена явным интерфейсом, который детерминированный тест может заменить.

Для развёртывания по-прежнему нужны авторизованный аккаунт Yandex Cloud, облачные квоты, правильные разрешённые адреса администратора, доступ гостевой системы к пакетам и доступный целевой узел Reality с TLS 1.3 и HTTP/2. Реальная облачная инициализация, установка пакетов ОС, совместимость VPN-клиентов, передача трафика, работа DNS и защита от обхода через IPv6 требуют отдельного разрешённого приёмочного развёртывания. Результаты автономных тестов нельзя выдавать за такую проверку.

В начальный сценарий не входят поддержка ACL нативной Windows, автоматическая настройка клиентского TUN на всех платформах, удалённая замена и отзыв ключей или перенос произвольного существующего сервера.

## Альтернативы

Помещение секретов в cloud-init нарушает ADR 0007. Доверие при первом подключении или один лишь `ssh-keyscan` не подтверждают подлинность первой гостевой машины. Повторное использование ограниченного профиля SSH-перенаправления заблокировало бы маршрутизацию VPN. Новые общие типы ресурсов провайдера для каждого протокола связали бы облачное состояние с гостевыми секретами.

