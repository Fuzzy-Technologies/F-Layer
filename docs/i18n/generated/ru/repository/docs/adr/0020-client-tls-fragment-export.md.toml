body = '''# ADR 0020: Опциональные транспортные настройки экспорта VLESS

- Статус: Предложено
- Дата: 2026-11-06
- Задача: [#114](https://github.com/Fuzzy-Technologies/F-Layer/issues/114)

## Контекст

Установленная VPN-служба сама по себе не подтверждает, что сеть конкретного
клиента пропускает рукопожатие и прикладной трафик. Существующие приватные проекты
должны поддерживать явный выбор транспортных настроек клиента с сохранением
учётных данных, идентичности сервера, подготовленных манифестов и обычного экспорта.

## Решение

Добавить в локальный `flayer vpn export` независимые опции `--tls-fragment` и
`--allow-quic` для клиентов VLESS Reality TCP Vision. В Python используются
`tlsFragment` и `allowQuic`; по умолчанию обе опции отключены. Существующие флаги CLI,
форматы файлов, идентификаторы устройств и побайтное копирование при обычном
экспорте сохраняют совместимость.

До формирования вывода проверить все исходные файлы устройства по манифесту
принадлежности. Требовать ровно одно исходящее подключение VLESS, один адрес
назначения и одного пользователя. Отклонять неподдерживаемые транспорты и flow,
повторяющиеся теги исходящих подключений, а также уже заданные цепочки
`proxySettings` или `sockopt.dialerProxy` выбранного подключения. Подробности
ошибок разбора приватной конфигурации не выводить.

Фрагментация TLS добавляет исходящее подключение Freedom с зарезервированным
тегом `tls-fragment` и направляет на него только `sockopt.dialerProxy` транспорта
VLESS. Использовать `packets = tlshello`, `length = 100-200` и `interval = 10-20`.
Сохранить существующие параметры сокетов, остальные исходящие подключения,
аутентификацию, Reality, DNS и маршруты. При занятом теге вспомогательного
подключения отклонять операцию, а не заменять другое подключение.

Выбор QUIC меняет только flow выбранного клиента на `xtls-rprx-vision-udp443`.
Суффикс разрешает UDP 443 на клиенте и удаляется до отправки запроса Vision
серверу. Существующие flow и учётные данные сервера остаются действительными.
Эту опцию можно совместить с фрагментацией; по умолчанию обычный Vision
по-прежнему перехватывает UDP 443.

Производный экспорт содержит точный клиентский JSON и полный нативный профиль
AmneziaVPN `.vpn`, а по запросу — пронумерованные нативные QR-кадры. При любой
из двух опций не создавать обычный URI VLESS: каждый поддерживаемый способ
импорта должен сохранять всю производную политику. Если выбранные байты или
состав файлов отличаются, требовать другую выходную папку; существующий экспорт
не перезаписывать и не очищать. Обращения к облаку или серверу, запись в исходные
файлы, генерация ключей и заявления о подтверждённой связности устройства
не вводятся.

## Совместимость и проверка

Сохранить формат фрагментации Freedom, который используют поддерживаемые
существующие клиенты. Xray 26.10.31 ещё реализует его, но помечает устаревшим
в пользу FinalMask. Перевод существующих клиентов на другой формат выходит
за рамки этого изменения экспорта. Проверки разбора закреплёнными версиями
Xray 26.9.30 и 26.10.31 покрывают обычный экспорт, независимые опции и их
сочетание. Нативные оболочки содержат точный производный JSON, а QR-кадры
восстанавливают те же байты, сжатые в формате Qt.

Детерминированные тесты покрывают некорректные и неоднозначные данные, отказ
для существующих цепочек прокси, проверку флагов, полные и разделённые маршруты,
неизменность исходников, приватные права доступа, повторный экспорт, конфликты
вывода, нативный цикл кодирования и декодирования и передачу опций через публичный
CLI. Тесты используют синтетические идентификаторы; приёмка на реальном
устройстве фиксируется отдельно.

## Последствия

Оператор может выбрать транспортную политику с сохранением принадлежности
проекта и сервера и существующих учётных данных. Клиент должен поддерживать
выбранные возможности Xray и импортировать полный профиль. Фрагментация
влияет на рукопожатие от клиента до VPN; доступность назначения со стороны
сервера проверяется отдельно. Ни одна опция не гарантирует доступность
приложений или медиаконтента.

