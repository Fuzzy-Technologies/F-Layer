body = '''
# ADR 0021: Имена Python и стабильные форматы данных

- Статус: Предложено
- Дата: 2026-11-04
- Задача: [#116](https://github.com/Fuzzy-Technologies/F-Layer/issues/116)

## Контекст

Владелец требует camelCase для собственных переменных, параметров и полей,
PascalCase для функций, методов и типов и UPPER_SNAKE_CASE для констант.
В начальном каркасе ошибочно записан snake_case для переменных, и CI не проверял
предполагаемое соглашение. Имена полей dataclass участвуют также в JSON,
приватных манифестах и отпечатках проектов; одно переименование атрибутов Python
нарушило бы контракты сохранённых данных.

## Решение

По явной команде владельца исправить только положения политики об именах.
Последовательно переименовать привязки, поля и именованные аргументы Python,
включая тесты, стабы, фикстуры и примеры документации. Импортированные внешние
имена, зарегистрированные хуки, внешние именованные аргументы и названия
CLI/TOML/JSON сохраняют своё внешнее написание.

Сохранить все существующие внешние схемы и отпечатки принадлежности. На границах
сериализации внутренний адаптер dataclass преобразует собственные camelCase-поля
в прежние snake_case-имена. Ключи обычных словарей, включая camelCase-ключи
протоколов, сохраняются. Публичные парсеры и кодеки остаются поддерживаемым
интерфейсом сохранения данных. Прямые обращения Python к именованным аргументам
и атрибутам нужно мигрировать; это изменение исходной совместимости указано явно.

Добавить детерминированный этап проверки имён по AST в полный локальный набор
и CI. Исключения внешних интерфейсов проверять по точному пути и полному имени
определения, не вводя общих исключений для каталогов и подчёркиваний. Проверять
нарушения и исключения тестами, а сериализацию сравнивать с независимыми
записями прежнего формата.

## Последствия

Это рефакторинг исходников всего репозитория без изменений развёртывания,
сети, ключей или профилей VPN. Перед ревью отдельный PR должен пройти полные
Linux-проверки качества, дистрибутивов и документации на точной ревизии.
Рефакторинг сам по себе не означает слияния, релиза или приёмки в эксплуатации.
'''
