body = '''# ADR 0022: Явное обновление Xray с восстановлением

- Статус: Предложено
- Дата: 2026-11-05
- Связано: [Задача #118](https://github.com/Fuzzy-Technologies/F-Layer/issues/118), [Задача #103](https://github.com/Fuzzy-Technologies/F-Layer/issues/103)

## Контекст

Xray 26.10.31 отключает MPTCP по умолчанию, уменьшая поверхность атаки для CVE-2026-98432.
Новые установки должны использовать файлы релиза с закреплёнными SHA-256.
Существующие проекты сохраняют неизменяемые приватные наборы файлов, записи
владения и клиентские экспорты. Замена константы в пакете не разрешает менять
работающий исполняемый файл, перевыпускать ключи или переписывать старый манифест.

Ядро Linux требует отдельной проверки и обслуживания по данным поставщика.
Обновление Xray и активные службы не доказывают исправление ядра, передачу
клиентского трафика или воспроизведение YouTube.

## Решение

Добавить команду чтения `flayer vpn runtime-status` и явные операции `upgrade`,
`rollback-upgrade` и `recover-upgrade`. Они повторно проверяют принадлежность
конкретных облачных ВМ и адреса, а также подлинность SSH, не создавая, не меняя
и не удаляя облачные ресурсы. Изменения требуют `--allow-mutation`, точного
`--scope-confirm`, `--expected-version` и `--expected-receipt-sha256`.
Ожидаемый хеш связывает всю прежнюю серверную запись состояния, включая хеши
бинарника, приватной конфигурации и службы. Неожиданное состояние блокирует
операцию до изменения управляемых служб или файлов.

Поддерживаемый переход — с 26.9.30 на 26.10.31. Байты архивов и SHA-256 закреплены
отдельно для amd64 и arm64. Обычное развёртывание не выполняет неявную миграцию.
Известные старые подготовленные установщики распознаются по точным хешам
исходного текста с нормализованными переводами строк после проверки манифестов.
Приватные файлы и манифесты сохраняются. При работе со старым набором текущий
доверенный установщик передаётся через память.

### Транзакция и восстановление

Перед остановкой единственной принадлежащей развёртыванию службы VLESS операция
подготавливает новый бинарник и проверяет его синтаксис на неизменённой конфигурации.
Полный приватный каталог транзакции с двумя бинарниками и точными старой и новой
записями состояния публикуется атомарно до замены исполняемого файла. Журнал
связывает владельца и все сохранённые хеши. Конфигурация, unit systemd, данные
устройств, AWG, облачные ресурсы, межсетевой экран и локальная сеть вне транзакции.

После замены бинарника и записи состояния перезапускается только эта служба VLESS.
Проверяются её узел Reality, синтаксис, активность и локальный слушающий порт.
При ошибке выполняется попытка отката с проверкой принадлежности. Неудачный откат
или принудительное прерывание сохраняют проверенный журнал для явной
`recover-upgrade`, восстанавливающей старую версию. Обычная установка и удаление
отклоняют незавершённую транзакцию, не угадывая результат.

Завершённая транзакция сохраняет прежнюю версию для явного отката. Повторное
обновление с исходным ожидаемым хешем проверяет результат без нового перезапуска.
Откат требует текущую новую запись состояния; восстановление прерванной операции —
исходную старую. Обе операции проверяют каждый текущий и сохранённый управляемый
файл до записи. Обычное удаление также проверяет и удаляет точные принадлежащие
транзакции файлы. Посторонние файлы, символические и жёсткие ссылки, неподдерживаемые
версии, изменения конфигурации или службы блокируют эти операции.

Записи каталогов и атомарные замены файлов синхронизируются для устойчивости.
Процесс, завершённый до публикации, может оставить неактивный временный каталог.
Он не считается принадлежащим развёртыванию и не удаляется по предположению.

### Наблюдение и совместимость

Состояние версии содержит ограниченные несекретные версии и хеши, состояние
транзакции, выпуск работающего ядра и версию его установленного пакета, если она
доступна. Статус исправления ядра остаётся `not-assessed`: сравнение upstream-версий
не учитывает исправления, перенесённые поставщиком. Обновление пакетов, перезагрузка
и защитное правило межсетевого экрана не применяются неявно. Для них нужен отдельный
ограниченный план обслуживания в рамках #103.

Содержимое `.vpn`/QR, политика VLESS TCP Reality/Vision, DNS, маршруты и MTU AWG
не меняются. Контрактные тесты сверяются с моделью импорта AmneziaVPN 5.1.0.6.
Импорт на Android/десктопе и воспроизведение проверяются отдельно в #73.
Сохраняется контракт POSIX-контроллера и приватного хранения. Windows-проверки
используют изолированные фикстуры; команды не запускают WSL или локальный VPN.

## Проверка

Детерминированные тесты покрывают новую установку, повторы старых проектов,
явное разрешение, точные хеши записей, идемпотентность, сбой проверки состояния,
прерванные записи, откат, восстановление, повреждение журналов и подавление
приватного вывода. Linux CI проверяет конфигурацию настоящими закреплёнными
бинарниками и композицию CLI установленного пакета без производственной
инфраструктуры. Полный канонический гейт, документация и воспроизводимые
артефакты проверяются для точного коммита PR.

## Последствия и альтернативы

Обслуживание версии становится отдельной аутентифицированной операцией.
Требуются короткий перерыв VLESS и временное место для двух проверенных
исполняемых файлов. Перезагрузка ядра прервёт оба протокола и вынесена отдельно.

Пересоздание ВМ, перевыпуск ключей, выбор изменяемого latest, ручное редактирование
записей, принятие произвольных старых установщиков и копирование Docker/firewall
скриптов Amnezia нарушили бы эти границы. Для проверенного внутреннего wheel
публичный релиз F-Layer не требуется.
'''
