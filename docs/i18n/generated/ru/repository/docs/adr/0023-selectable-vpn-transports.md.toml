body = '''# ADR 0023: Выбор VPN-протоколов и изолированная совместная работа

- Статус: Предложено
- Дата: 2026-11-06
- Задачи: [#127](https://github.com/Fuzzy-Technologies/F-Layer/issues/127), [#121](https://github.com/Fuzzy-Technologies/F-Layer/issues/121)

## Контекст и состояние реализации

Существующие приватные проекты развёртывают AmneziaWG и VLESS Reality вместе.
Для добавления обычного WireGuard и OpenVPN нужны явный выбор, отдельные учётные
данные и сети, а также безопасное развитие уже подготовленных проектов. Обычное
развёртывание сейчас отклоняет изменённые подготовленные настройки. Этот отказ
сохраняется, пока отдельная операция перехода не сможет подтвердить принадлежность
ресурсов и восстановиться после прерывания.

ADR задаёт контракт реализации для релиза 2.1. Описанные ниже новая схема, команды
и протоколы запланированы: принятие решения само по себе их не реализует и не
развёртывает. Реализация сервера и экспорта, автоматические гейты, документация
и приёмка установленного клиента остаются отдельными задачами фич #120 и #119.

## Выбор и совместимость

Сохранить побайтную совместимость схемы проекта 1, её неявной пары AWG/VLESS,
отпечатков, имён файлов, учётных данных, манифестов, доверия к серверу и облачного
состояния. Обычные подготовка, развёртывание и экспорт не мигрируют старый проект.

Схема проекта 2 добавляет явный непустой массив `protocols`. Допустимы
`amneziawg`, `vless-reality`, `wireguard` и `openvpn`. Неизвестные и повторяющиеся
значения отклоняются; для отпечатков выбор приводится к этому фиксированному
порядку. Настройки выбранных протоколов обязательны, таблицы невыбранных запрещены.
Старые пакеты отклоняют схему 2 до изменений: это явная граница совместимости
с будущими версиями, а не разрешение пересоздать ВМ.

Идентичность, размещение в облаке, маршруты и именованные устройства сохраняют
смысл. `devices.ipv4_address` остаётся адресом только AWG. У каждого дополнительного
IP-туннеля есть таблица `device_addresses`: точные объявленные идентификаторы
устройств сопоставляются явным приватным IPv4-адресам. Устройства не переименовываются,
адреса не выделяются по порядку перечисления. VLESS не получает туннельных адресов.
Новый протокол не использует ключ AWG, UUID VLESS или сертификат другого протокола.

Фрагмент показывает будущие поля схемы 2; это не полный проект и не конфигурация,
которую принимает текущий пакет:

```toml
schema_version = 2
protocols = ["amneziawg", "vless-reality", "wireguard", "openvpn"]

[wireguard]
port = 51821
tunnel_cidr = "10.67.0.0/24"
mtu = 1280

[wireguard.device_addresses]
laptop = "10.67.0.2"
phone = "10.67.0.3"

[openvpn]
port = 1194
protocol = "udp"
tunnel_cidr = "10.68.0.0/24"
mtu = 1280

[openvpn.device_addresses]
laptop = "10.68.0.2"
phone = "10.68.0.3"
```

Проверять все выбранные настройки до генерации материала или создания облачного
адаптера. Пары транспорт/порт уникальны; TCP 22 зарезервирован для администрирования.
Отклонять пересечения облачных и туннельных сетей, адреса сервера/сети/broadcast,
повторы адресов клиентов и недостаточную ёмкость подсети. Первый адрес узла каждой
туннельной сети резервируется серверу. MTU проверяется в допустимых пределах;
начальное значение — 1280. DNS и полные/разделённые IPv4-маршруты следуют прежнему
строгому контракту. Нативный экспорт поддерживает максимум два DNS-сервера и
отклоняет усечение. На сервере IPv6 явно отключён; меры на совместимом клиенте
и проверка утечек обязательны при приёмке и не выводятся из активности службы.

## Принадлежность и жизненный цикл перехода

Общий `state.json` остаётся в схеме 1 с теми же шестью локаторами облачных ресурсов.
Новые дескрипторы протоколов и журналы операций — отдельные приватные версионируемые
файлы. Они связаны с точной идентичностью стека, исходным отпечатком проекта,
желаемым отпечатком протокола, хешами манифестов материала/артефактов и наблюдаемой
квитанцией сервера. В них нет ключей, сертификатов и текстов конфигурации.
При явной миграции артефакты схемы 1 и закреплённое доверие сохраняются неизменными.

Будущий `flayer vpn protocol` включает читающий `plan`, явные `enable` и `disable`,
а также `recover`. Для изменений нужны прежние `--allow-mutation` и точный
`--scope-confirm` вместе с ожидаемым базовым хешем плана. База связана с текущими
принадлежащими стеку облачными входящими правилами, квитанциями сервера и локальным
материалом. Перед первой записью повторить наблюдение; отклонять чужую принадлежность,
изменённое доверие, дрейф, просроченный план, незавершённый журнал и неожиданный
старый хеш. Добавление/удаление протокола не является побочным эффектом `deploy`.

Подготовить и проверить приватный материал, конфигурацию и подтверждённый runtime
до активации. До каждого удалённого изменения записать в журнал старый и новый
хеши. Сохранить SSH и остальные выбранные протоколы. Облачные входящие правила
меняются после проверки принадлежности и точного старого набора с последующим
чтением результата у провайдера; неопределённый исход API требует восстановления,
а не повторной мутации наугад. Атомарно менять только подтверждённую входящую цепочку
сервера: accept в более ранней базовой цепочке nftables не отменяет drop в следующей.
Никогда не выполнять `flush ruleset`.

Новый протокол владеет своей службой, интерфейсом, каталогом runtime, входящими
правилами и таблицей forwarding/NAT для своего интерфейса. Имена выводятся из
полной идентичности стека: `flayer-wg-<12hex>` / `fwg<12hex>` и
`flayer-ovpn-<12hex>` / `fov<12hex>`; интерфейсы укладываются в лимит Linux 15 байт.
Разрешены только объявленные источники/назначения клиентов, ответный established
трафик и masquerading своего интерфейса. Межтуннельная пересылка запрещена.
Чужие таблицы, службы, маршруты хоста, DNS и сетевые адаптеры вне операции.
Не сбрасывать глобальный forwarding, от которого может зависеть другой туннель.

Повтор идентичной операции проверяет и использует установленную квитанцию без
скачивания, установки пакетов, генерации учётных данных и перезапуска службы.
Сбой до активации сохраняет действующие службы; после ограниченного изменения
откатывает только его по проверенным приватным резервным копиям. Прерывание или
неопределённый исход оставляет долговечное состояние recovery-required.
Восстановление сверяет точное старое/новое наблюдаемое состояние; неизвестное
отклоняется. Деактивация удаляет только подтверждённые свои службу, интерфейс,
файлы и правила ingress/NAT. Приватный материал контроллера остаётся для аудита,
его стирание требует отдельного явного действия. Нельзя удалять ВМ, диск,
зарезервированный адрес, общую сеть или ресурсы другого протокола.

## Runtime WireGuard и материал клиентов

Использовать ядерную реализацию WireGuard Ubuntu 24.04 amd64. Upstream рекомендует
ядро на Linux; не добавлять второй Go-runtime и не включать неявную подмену
пользовательской реализацией. До установки проверить платформу, возможности ядра
и политику поддерживаемого исправленного ядра. Записать точные версии работающего
ядра/пакетов. Обновление безопасности ядра и разрешение перезагрузки относятся
к #103, а не к активации протокола. Отсутствующее/неодобренное ядро отклоняется
до изменений.

Собрать приватный `wg` из upstream `v1.0.20260223`, коммит
`49ce333da02056ae7b22ee2aeb6afe8aaed79b19`. Реализация закрепляет и проверяет SHA256
архива исходников, сохраняет уведомления upstream, записывает сборку/toolchain
и хеши установленных бинарников в квитанцию принадлежности. Не устанавливать
плавающую версию WireGuard и не менять системные службы `wg-quick`. Обновление
runtime — явная операция с ожидаемой квитанцией, подготовкой, проверкой и откатом.

Локально создать отдельный серверный ключ X25519, по паре X25519 и случайному
предварительно согласованному ключу на устройство. Приватные каталоги — `0700`,
обычные файлы — `0600`; действуют прежние проверки путей, ссылок и манифестов.
На сервер передаются только его закрытый ключ и открытые/предварительно
согласованные ключи клиентов. Закрытые ключи клиентов остаются на контроллере
и в приватном экспорте соответствующего устройства. Сохранять материал однократно,
при повторе проверять точную принадлежность устройства/адреса. В обычном WireGuard
нет полей обфускации AWG.

Регистрация подготавливает одного нового клиента с сохранением всех прежних
ключей и адресов. Отзыв атомарно удаляет его из своей конфигурации и работающего
интерфейса; удаление экспорта не является отзывом. Явная ротация связана с ожидаемым
старым материалом и квитанцией и перечисляет профили для повторного импорта.
Ротация серверного ключа затрагивает все профили WireGuard: это сообщается явно.

## Runtime OpenVPN и жизненный цикл учётных данных

Собирать upstream OpenVPN `2.7.9`, коммит
`7b60c2aa34992639691e3a2d651fe27301e2e9d5`, на Ubuntu 24.04 amd64 с OpenSSL 3.
Закрепить и проверить SHA256 исходников релиза, сохранить уведомления и записать
компилятор, аутентифицированные сборочные зависимости дистрибутива и хеши бинарников
в квитанцию. Не заменять системный бинарник/службу OpenVPN. Изначально отключить
DCO, чтобы изменение модулей ядра не входило в фичу. Обслуживание runtime следует
тому же контракту подготовки, ожидаемого старого состояния и восстановления.

Поддержать один явно выбранный UDP- или TCP-слушатель, по умолчанию UDP 1194.
TCP — выбранный оператором запасной вариант с соответствующим клиентом, а не
автоматический второй слушатель. Использовать `topology subnet`, статические CCD-
адреса, связанные с сертификатами, `ccd-exclusive` и разные роли сертификатов
сервера/клиента. Повторы common name и аутентификация только паролем запрещены.

Локально создавать приватный CA ECDSA P-256, ключ/сертификат сервера и ключ/сертификат
на устройство через криптографическую зависимость VPN. При повторе проверять
basic constraints и signing usage CA, usage конечных ключей, EKU сервера/клиента,
случайные положительные серийные номера, подписи издателя и соответствие ключей.
Стабильные имена сертификатов выводятся из идентичности стека/устройства.
Закрытый ключ CA и закрытые ключи устройств не передаются на сервер. Сервер получает
только сертификат CA, свой ключ/сертификат, CRL, статический ключ канала управления
и минимальные CCD-записи. В обычном состоянии и диагностике этих данных нет.

Использовать TLS 1.2 или новее, взаимную проверку сертификатов, точную проверку
ожидаемого имени сервера, AEAD-шифры `AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305`
и `tls-crypt` с локально созданным статическим ключом 256 байт. Запретить сжатие,
устаревший fallback шифра, произвольные скрипты/плагины и неограниченную push-политику.
Ключ управления общий для этой службы OpenVPN и не заменяет отдельный сертификат
устройства. Его ротация требует повторного импорта всех OpenVPN-профилей.
Индивидуальный `tls-crypt-v2` возможен позже и сейчас не обещается неявно.

Срок CA — 3650 дней; серверных и клиентских сертификатов — 365 дней с ограничением
по сроку издателя. Допуск not-before — пять минут. Проверять UTC-сроки в prepare,
plan и status. Просроченный/некорректный материал отклоняется без скрытой регенерации.
Сообщать о необходимости продления за 30 дней. CRL имеет next-update через 30 дней,
предупреждение о продлении — за семь дней. Продление явно, сохраняет имена/ключи,
если отдельно не выбрана ротация, и устанавливает только проверенную замену.
Ротация CA — отдельная миграция всех клиентов с явным описанием последствий
и отката; она не выполняется при развёртывании.

Отзыв фиксирует точный серийный номер устройства, публикует подписанный CA список
CRL и исключает CCD-запись. После установки CRL перезапускается только выбранная
служба OpenVPN, чтобы завершить действующие сеансы и отклонять будущие подключения.
Сообщать, что ограниченная операция прерывает и другие сеансы OpenVPN; AWG,
WireGuard и VLESS сохраняются. Просроченный CRL не считается здоровым состоянием.
История отзыва сохраняется при продлении и повторах; серийные номера не переиспользуются.

## Клиентские артефакты и приёмка

Сохранить имена принадлежащих стеку наборов `device-<deviceId>-<protocol>` и
безопасный повторный экспорт. Обычный WireGuard содержит `wireguard.conf` и
нативный `amnezia.vpn`; OpenVPN — самодостаточный `client.ovpn` и `amnezia.vpn`.
Включать только учётные данные выбранного устройства, адрес сервера, точные
маршруты/DNS и необходимую открытую идентичность CA/сервера. Не экспортировать
ключ подписи CA, закрытый ключ сервера, административные учётные данные
или материал другого устройства.

Прежняя опция `--qr` создаёт только полные кадры нативного сканера Amnezia
с существующим qCompress/QDataStream и лимитом числа кадров. Обычный QR WireGuard —
другой контракт импортёра; для него нужен будущий явный селектор формата.
Не называть нативные кадры универсально совместимыми. У OpenVPN также нет
универсального контракта обычного QR-профиля. Экспорт файлов по умолчанию
не импортирует опциональный QR-рендерер.

Целевые клиенты для обоих новых нативных профилей — AmneziaVPN 5.1.0.6 на Android
и Windows. Соответствовать закреплённой исходной схеме: `amnezia-wireguard` /
`wireguard` и `amnezia-openvpn` / `openvpn`; сторонний `last_config` содержит
структурированный JSON протокола и точный нативный `config`, а не сырой текст
вместо структурированного объекта. Идентификаторы устройств, поля клиентов,
проверка CA/имени, транспорт, маршруты и DNS согласованы в обоих представлениях.

Обычные клиенты WireGuard на Android/Windows получают `.conf`; community-клиенты
OpenVPN 2.6/2.7 и OpenVPN Connect проверяются с выбранным AEAD/TLS-профилем.
Это целевые матрицы, а не утверждение о завершённой совместимости. В #132/#126
фиксировать точные версии клиентов и поведение импорта. Синтаксис, цикл кодирования
или активная служба не подтверждают DNS, меры IPv6, роуминг, переподключение,
Интернет и воспроизведение медиа.

Гейты реализации покрывают эталонные отпечатки/артефакты схемы 1, выбор поднабора,
коллизии, изолированную проверку ядра/tools/OpenVPN, нативные файлы и QR, сокрытие
чувствительных данных диагностики, принадлежность и прерванный откат/восстановление. Установленный wheel
тестируется на моках или изолированных ресурсах. Живое развёртывание, платные ресурсы,
перезагрузка хоста и переключение VPN компьютера требуют отдельного ограниченного
разрешения владельца. Существующие телефонные/десктопные профили сохраняют действие.

