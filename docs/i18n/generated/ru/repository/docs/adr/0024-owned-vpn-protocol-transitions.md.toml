body = '''# ADR 0024: Управляемые переходы VPN-протоколов и неизменяемые эпохи

- Статус: Proposed
- Дата: 2026-11-07
- Задачи: [#128](https://github.com/Fuzzy-Technologies/F-Layer/issues/128), [#122](https://github.com/Fuzzy-Technologies/F-Layer/issues/122)
- Дополняет: [ADR 0023](0023-selectable-vpn-transports.md)

## Контекст и граница реализации

Жизненный цикл проекта с явным выбором протоколов сохраняет неизменяемый план создания шести облачных ресурсов. Ревизии клиентов WireGuard уже позволяют изменять один развёрнутый протокол, сохраняя серверный ключ, остальных клиентов, runtime и облачную политику. Добавление или отключение целого протокола также меняет входящие правила хоста и облака. Требуется сохранять исходную идентичность ресурсов и отзывать полномочия устаревших операций при изменениях клиентов и протоколов.

Решение определяет интеграцию переходов протоколов. Приватный код уже предоставляет
планировщик `IngressDelta`, ограниченные асинхронные облачные операции входа, общие
серверные резервации, транзакции своих входящих правил, чтение завершённых графов,
подготовку кэша поколений и приватные native-переходы WG. Публичный CLI протоколов,
миграция старых проектов, полный координатор контроллера и публикация эпох недоступны до интеграции и
тестирования. Обычный deploy по-прежнему отклоняет изменённый набор протоколов; приватные
backend не обходят эту границу допуска.

## Исходная идентичность создания и эпохи протоколов

Не заменять исходные шесть `ResourceSpec`, метки создания, байты/путь/хеш bootstrap, подключения ВМ или отпечаток доверия serial console планом, собранным по новым слушателям. Облачный `state.json` остаётся прежним. База создания постоянна; действующее состояние протоколов задаётся отдельным наложением.

Использовать неизменяемые эпохи протоколов. Каждая новая эпоха связана с точной предыдущей эпохой, конечным указателем/дайджестом её сегмента ревизий клиентов WireGuard, настроенным намерением протоколов, закреплёнными значениями активных протоколов и сохранёнными ограниченными ссылками на материалы/серверные пакеты, статическим отпечатком выбора, действующими серверными квитанциями/историями и полными квитанциями входящих правил облака/хоста. Все закрытые сегменты и исходные файлы сохраняются. Секретные тела ключей не входят в метаданные эпох или журналов.

Нулевая эпоха — существующая база создания и исходное размещение ревизий WireGuard. Зафиксированный переход начинает отдельный сегмент клиентов, исходной точкой которого служит точный дайджест новой эпохи. Записи клиентов по-прежнему связаны с исходным дайджестом создания. Следующие эпохи закрывают текущий сегмент до начала нового. Этот порядок исключает циклы и не позволяет старым планам клиентов вновь получить полномочия после изменения протокола. Отсутствие родителей, сегментов, ссылок или доказательств принадлежности блокирует действие; отдельный осиротевший артефакт не позволяет угадать потерянную голову.

Действующие закрепления протоколов разрешаются через проверенную эпоху и её текущий сегмент клиентов. Ссылка на источник может выбирать исходные байты, закрытый запрос клиента или запрос протокола только по принадлежащему проекту манифесту и полному дайджесту. Не генерировать установщик заново для чтения истории. Обход несекретных метаданных и полное удаление облачных ресурсов должны работать при потере закрытых клиентских файлов; чтение действующих ключей всё равно требует полные приватные манифесты.

Схема проекта 2 сохраняет непустое объявление настроенных `protocols` и их настройки/материалы. Эпоха отдельно хранит активное подмножество, которое может быть пустым. Отключение последнего активного протокола сохраняет ВМ, адрес, SSH и профили, сообщая, что активных протоколов нет. Обычный deploy не должен возвращать отключённые протоколы. Операции клиентов требуют активный целевой протокол; повторное включение явно называет сохранённых клиентов, которых активирует.

## Планирование и координация изменений

Будущий публичный процесс включает `plan`/`status` только для чтения, явные `enable`/`disable` и `recover`. Краткоживущий план связывается с желаемым намерением, точной головой эпохи/клиентов, полными текущими облачными правилами/подключениями, существующим аутентифицированным ключом хоста, всеми затронутыми серверными квитанциями/историей и дайджестами приватных запросов. Нужны явное разрешение изменения, точный scope и ожидаемая база. Перед отправкой повторить наблюдение; истечение срока или дрейф нельзя исправить редактированием одного аргумента CLI.

Существующая блокировка проекта охватывает все кооперирующие локальные точки входа. Надёжно сохранённый журнал протокола блокирует обычные deploy, runtime, export и изменение клиентов до завершения восстановления. Серверный журнал резервирования также отклоняет второй контроллер с копией проекта: локальная advisory-блокировка не сериализует две машины. Status только для чтения сообщает лишь проверенные префиксы старого/нового состояния. Полное облачное удаление сохраняет отдельный явный scope и принимает только полный известный зафиксированный либо ожидающий облачный префикс, но не произвольные правила.

Общая координация серверных входящих правил предшествует блокировкам отдельных протоколов в одном фиксированном порядке. Ожидаемые полномочия проверяются под той блокировкой, которая действительно защищает изменение. До разрешения облачной записи сохраняются резервирование, целевые хеши и nonce операции. При неизвестном облачном результате резервирование остаётся. Завершение или отмена надёжно отзывает прежние серверные полномочия, поэтому задержавшаяся SSH-команда процесса перехода протокола не активируется после объявленного отката. Повтор восстановления сохраняет точное завершение, а не создаёт новую эпоху полномочий при каждом повторе.

## Точные изменения входящих правил облака

Перед планированием контроллер доказывает полный исходный облачный граф и действующую политику относительно базы создания и зафиксированных наложений. Самостоятельно переданный снимок не доказывает, что живое правило было разрешено ранее.

Чистый `IngressDelta` связывает замороженный spec security group, полную идентичность стека, активный ресурс, сеть, точные исходные ID/метаданные правил, один слушатель и ID операции. Исходные метки `flayer-spec` сохраняются. Описание нового разрешения строится из полного хеша владельца, протокола и ID операции. Разрешается ровно один TCP- или UDP-порт с полным объявленным списком IPv4-источников. Настоящего ID правила нет до проверенного чтения результата провайдера. Любое уже существующее широкое или узкое разрешение этого порта блокирует новый план включения.

Удаление требует ровно все ID разрешений целевого порта из проверенной квитанции, точную семантику слушателя/источников и либо исходную семантику создания, либо полный тег принадлежащей операции. Для исходного правила без тега дополнительно нужна отдельно аттестованная `creationListener` с именем исходного протокола, совпадающая с целью. До создания delta контроллер получает эту привязку из исходной роли протокола, проверенной по манифесту, либо из эпохи, а не по равенству портов или желаемому имени вызывающей стороны. Общий spec создания сам по себе не содержит принадлежности протоколу. Отклоняются широкие диапазоны, произвольные описания, повторные разрешения источников, посторонние ID и TCP 22. Остальные правила, описания и метки должны полностью совпадать после нормализации. Целевые правила с метками пока не удаляются: планируемый CLI-адаптер не может гарантировать точное восстановление меток. Это не означает отбрасывание меток других правил или трактовку неизвестной цели как пустой.

Необязательные метки правил соответствуют ограниченному неизменяемому map-контракту провайдера и входят в полное сравнение политики. Отсутствующие и пустые метки нормализуются одинаково; неизвестные поля и неподдерживаемые цели остаются ошибкой. [Ответ security group](https://yandex.cloud/en/docs/vpc/api-ref/SecurityGroup/get) документирует метки и различает активную и обновляемую политику.

Документированный [API update-rules](https://yandex.cloud/en/docs/vpc/api-ref/SecurityGroup/updateRules) принимает явные ID удаления/spec добавления и возвращает длительную операцию. В запросе не документировано предусловие ожидаемого поколения. Поэтому проверки до/после следует считать оптимистической конкурентностью, а не гарантией provider compare-and-swap. Используются только доказанные ID, без полной замены группы, способной стереть чужие записи.

Будущий [CLI-адаптер записи](https://yandex.cloud/en/docs/cli/cli-ref/vpc/cli-ref/security-group/update-rules) использует явные ID группы, scope, `--async` и `--retry 0`. Действующий scoped-адаптер уже отключает повторы CLI. До опроса сохранить возвращённый ID операции, затем проверить привязку к ресурсу и конечный исход до чтения политики. При потере результата/ID требуется восстановление: снимок, похожий на прежний, не доказывает невозможность отложенной операции. Не повторять отправку вслепую и не угадывать операцию по времени. Внешний дрейф останавливает согласование.

При откате повторно добавленное целевое правило может получить новый ID провайдера и явно запланированное описание принадлежности. Проверить восстановленную семантику слушателя и сохранить каждый посторонний ID/поле метаданных, затем записать полный фактический результат чтения в облачную квитанцию эпохи без изменения активного набора. Исторические `BeforeSha256` и прежний снимок доказывают исходное состояние, но не восстановленные ID.

## Входящая политика хоста и поколения протоколов

Для изменения слушателя не повторять исходный bootstrap и не вызывать `flush ruleset`. Проверить исходный загрузочный файл и точные зафиксированные наложения, атомарно заменить только доказанно свою input-таблицу и сохранить соответствующее изменение загрузочного файла. Сохранить SSH и все остальные протоколы. Дополнительная принимающая base chain не отменяет существующую отбрасывающую chain; вторая разрешающая цепочка сама по себе не реализует активацию.

Порядок включения: однократно сохранить приватные ключи; подготовить и проверить runtime/конфигурацию при закрытом облачном и серверном входе; активировать свою службу; разрешить вход хоста; разрешить вход облака; проверить все квитанции; зафиксировать эпоху. Порядок отключения: запретить вход облака; запретить вход хоста; остановить/удалить только свою службу/интерфейс и таблицу forwarding/NAT; проверить остальные протоколы; зафиксировать эпоху.

До удаления сохранить проверенные приватные резервные копии runtime/unit/конфигурации. Откат использует прежний закреплённый бинарник и ключи без скачивания, сборки или повторной генерации. Не сбрасывать глобальный forwarding, пока им пользуется другой туннель. Сетевая операция с неизвестным результатом оставляет журнал и не может заявлять завершённый откат.

Отключение/повторное включение WireGuard создаёт новое поколение установки с новым принадлежащим nonce, сохраняя серверные/клиентские ключи и объявленные адреса. Архивирование/сброс прежнего аудита допускается только этой явной транзакцией с ожидаемыми квитанцией/историей; обычная установка при отсутствующем каталоге и сохранённом аудите остаётся запрещена. Пока каталог отсутствует, сохраняется подтверждение отзыва полномочий; новое поколение и новая история публикуются под существующей блокировкой WireGuard, без видимого состояния «каталог отсутствует, история начальная», способного разрешить старый установщик.

Приватный backend кэша поколения связывает составной запрос схемы 2: хеш облачного плана,
точную дельту WG-входа, закреплённые источник/файлы и полные сохранённую/новую квитанции.
Под открытой общей резервацией и отзывом полномочий WG журнал подготовки сохраняется
до копирования байтов для отката/runtime. Пути кэша определяют только полный владелец
и хеш квитанции. Проверяются все приватные файлы и предки, синхронизируются inode и границы
каталогов, квитанция публикуется последней. Записанная preparing-операция может дописать
только доказанно совпадающий суффикс источника или известные пропуски после сбоя каталога.
Отсутствие журнала не разрешает восстановление оборванных файлов. Готовый кэш неизменяем;
повтор проверяет/синхронизирует его без удалённых временных источников. Read-only status
не исправляет публикацию и не заявляет активность сервиса.

Схема записи поколения 2 дополнительно требует заранее запланированного нового кандидата
с квитанцией схемы 2 при отключении WG: это идентичность восстановления, а не второй
активный сервис. Конфигурация, ключи, бинарник, лицензия и доказательства исполняющегося
ядра сохраняются точно, а nonce операции, helper, unit и доказательство сети — новые.
После неопределённой остановки нельзя восстанавливать старую идентичность unit, которую
ещё может выбрать запоздалая команда. Запись поколения схемы 1 остаётся читаемой для
восстановления только кэша; открытый хеш её плана не получает кандидата или полномочий
входящих правил без нового явного плана/резервации.

Backend входа принимает версионный составной запрос только с точным готовым журналом
поколения и обоими полными кэшами восстановления под блокировками общая → WG.
Повторно проверяется исходное фактическое состояние/история WG; проверенные дескрипторы
файлов/каталогов кэша удерживаются при публикации boot, замене native-входа и публикации
конечного журнала входа. Потеря кэша, подмена inode, скопированное намерение/история или
неготовая подготовка блокируют дальнейшее изменение входа; read-only status ничего не
исправляет. Составной запрос только входа схемы 1 сохраняет прежний приватный контракт.

Схема записи native-поколения 3 добавляет явный ABI callback. До первого native-журнала
хеш helper обязан совпасть с явно утверждёнными байтами текущей приватной программы
receiver. Планы кэша схем 1/2 не получают эти полномочия под старыми хешами. Идентичность
допущенного helper сохраняется в native-журнале; более новый утверждённый receiver,
поддерживающий тот же ABI, может восстановить эту операцию, не подменяя неизменяемые
helper или кандидат. Неизвестный ABI отклоняется.
Открытие входа схемы 3 требует исправной native-записи даже до появления runtime-журнала;
подготовка и закрытие сохраняют допустимые пути до native-изменений.

Исходный корень закрывается под WG до освобождения WG для задания остановки. Старый
драйвер клиентов, знающий только WG-блокировку, не может получить новое подтверждение
исправного старого корня во время передачи. Точные приватные кэши сохраняются, новая
история installed-кандидата отзывается до публикации заменяющего корня. Откат отключения
потребляет исходный отзыв резервации и новый отзыв поколения; прежние история и имя
отставленного unit не восстанавливаются. Удаление установленного корня требует точных
клиентов/адресов; частичная активация допустима только для staged-кандидатов. Очистка
выбирает лишь уже проверенные имена файлов и сохраняет неожиданные новые записи.

Перед отправкой задания синхронизируется точное файловое определение загруженного unit.
До reload допустима неактивная ошибка разбора в кэше, но после него идентичность должна
проверяться строго.
До удаления unit или подтверждения активации нужны пустой Job, нулевые main/control PID
и пустое поддерево cgroup v2; наследование дескриптора клиентом не доказывает завершение
заданий PID1. Повторная остановка точного навсегда отставленного unit восстанавливает
сбой между записью намерения и отправкой. Ожидающее/неизвестное задание сохраняет журнал.
Дескрипторы и идентичности фактических файлов корня, unit, ссылки включения и каталогов
удерживаются/синхронизируются при публикации и конечном подтверждении; намеренная замена
квитанции staged/installed имеет отдельные области проверки. Совпавшие байты нового
несинхронизированного inode не достаточны.

Полный известный временный журнал следующей фазы может требовать явного завершения
публикации после перезагрузки, помешавшей запуску защищённого callback. Только точные
файлы/история установленного кандидата, полное отсутствие его ядерного пространства и
завершённый unit допускают записанные фазы перезапуска. Частичный дрейф установленных
клиентов/адресов отклоняется. Read-only status сообщает о необходимости восстановления,
не исправляя файлы и не выдавая это состояние за активное.

Эти правила используют [вывод Job systemd 255](https://github.com/systemd/systemd/blob/v255/src/systemctl/systemctl-show.c),
[свойства unit/процессов systemd](https://www.freedesktop.org/software/systemd/man/255/org.freedesktop.systemd1.html)
и [рекурсивный populated cgroup v2](https://docs.kernel.org/admin-guide/cgroup-v2.html#un-populated-notification).
В systemctl show --all отсутствие задания представлено пустым Job, а не числовым нулём.

Сама подготовка кэша не меняет активный корень, unit, входящие правила или облако.
Native-переходы приватны и оставляют общую резервацию открытой. Порядок облачных действий,
общее завершение, публикация эпох с поколениями и публичный CLI ещё требуют интеграции
контроллера. Одна подготовка кэша или входа не разрешает команду сервиса и не закрывает
открытую резервацию.

Изменение другого протокола сохраняет ключи, конфигурацию и квитанцию активного WireGuard, но до первой записи протокола обязано отозвать полномочия его истории клиентов под той же существующей блокировкой WireGuard. Используется существующий допустимый формат аудита отмены с равными квитанциями для публикации новой связанной головы истории. Уже отправленные старые байты драйвера клиентов увидят отличающуюся ожидаемую историю и откажут в изменении; одного резервирования, понятного только новому коду, недостаточно. До этого подтверждения отклоняется ожидающая транзакция клиентов. Новая история записывается в следующей эпохе. Если изменение протокола затем откатывается, публикуется завершение эпохи с прежними активными закреплениями/семантикой доступа, обновлённой полной облачной квитанцией и записью отозванных полномочий. При откате нельзя восстанавливать старую историю. Это требует точную здоровую квитанцию активного WireGuard. Если WireGuard неактивен/отсутствует, вместо этого проверяются отдельные полное отсутствие его пространства имён и сохранённая история; нельзя выдумывать квитанцию работающей службы только ради отзыва полномочий.

Явный новый корень WG использует схему квитанции 2: исходные `install.py`, deployment,
ключи, бинарник и лицензия сохраняются, добавляется отдельно закреплённый `lifecycle.py`.
Обе команды unit связываются с точным nonce поколения. Под существующей блокировкой WG
повторно читаются полные метаданные; старый nonce отклоняется до любой записи в сеть.
Дочерние команды наследуют дескриптор и сохраняют защиту после потери родителя.
Конечные callback не получают общую входную блокировку после блокировки WG.

Имя unit systemd схемы 2 также включает nonce поколения; схема 1 сохраняет прежнее
постоянное имя. Запоздалая команда start/stop, указывающая старый unit, не должна выбирать
загруженный новый unit с его новыми аргументами callback. Пути корня и транзакции клиентов
постоянны. Активный unit выбирается по ограниченным метаданным своей квитанции, после
чего проверяются все файлы, канонический путь поколения и runtime. Исправность и полное
отсутствие не подтверждаются при сохранённых unit других поколений, неизвестных именах
владельца или оборванных ссылках включения. Не принимать и не удалять такие записи неявно.

Синхронный callback systemd под удерживаемой контроллером блокировкой WG вызвал бы
взаимную блокировку, поэтому занятость отклоняется. Native-родитель удерживает общую
блокировку входа и освобождает только WG вокруг клиента systemctl; конечный callback
получает WG и никогда не получает общую. Ожидающая резервация допускает лишь полный
защищённый native-контекст точного поколения, текущей головы/запроса и отозванной истории.
Обычные remove/recover по-прежнему отклоняют поколения схемы 2. Текущая подготовка
кэша записывает только неопубликованного приватного кандидата: не отзывает историю,
не публикует корень, не разрешает переход и не подтверждает активность. Повторное
использование кэша проверяет все хеши файлов/квитанции и прежние факты исполняющегося
ядра без скачивания, сборки или генерации ключей. Первая подготовка runtime по-прежнему
требует исходный vendor/build-гейт.

## Явная миграция старого проекта

Миграция — отдельная планируемая операция, а не побочный эффект prepare/deploy. До сохранения базы создания читаются проверенные конфигурация схемы 1, манифесты, исходный bootstrap и наблюдения. Сохраняются все шесть фактических spec и прежний путь bootstrap внутри проекта, исходный serial-маркер, host pin, имена файлов, клиентские экспорты и прежние отпечатки. Ссылки на материалы отдельных протоколов выводятся из существующих объединённых ключей без выпуска ключей или изменения серверных байтов.

До атомарной замены `project.toml` журналируются точные старый/новый публичные TOML-снимки и хеши, неизменяемые метаданные и граница публикации. Восстановление читает любую записанную схему без реконструкции потерянного намерения. Старые и новые точки входа должны распознавать ожидающую/завершённую миграцию до создания ключей или адаптеров. Старый пакет отклоняет схему 2 до изменений. Сама миграция меняет только проверенные метаданные контроллера с облачной/серверной аттестацией только для чтения; она не меняет метки, входящие правила, службы и не создаёт платный ресурс.

## Связывание намерения и завершения

Разрешающее намерение эпохи отделяется от завершённого неизменяемого пакета.
Каноническое намерение связывает постоянное создание, предыдущую эпоху и закрытие
сегмента клиентов, настроенные и активные источники, резервацию и хеши полных
облачных, входных и сервисных свидетельств. Завершение гостя схемы 2 расходует nonce
и предыдущий общий указатель, связывая хеш намерения. Итоговый пакет содержит
намерение и точное завершение; его полный хеш становится началом следующего сегмента
клиентов. Так исключается циклическая зависимость хешей завершения и итоговой эпохи.
Полный ожидаемый кандидат сохраняется и журналируется до запроса завершения гостя;
локальный указатель эпохи публикуется только после проверки точного завершения.
Прежняя отмена схемы 1 до внешней отправки может закрыть только эпоху без изменения
активного состояния, с неизменными входными правилами и без отправленной облачной
операции, сохраняя хеш резервации.

Сохраняются полные подтверждённые терминальные облачные операции и снимки, а также
каждый артефакт исходного или компенсирующего намерения входящих правил. Компенсация
имеет отдельно связанное окно действия и записывает фактические восстановленные ID
и метки провайдера. До отправки резервируется ёмкость полного восстановления и эпохи.
Совпадение снимка с прежними правилами не превращает неизвестную отправку в отмену
до отправки. Локальный граф проверяет объявленные свидетельства и происхождение;
аутентифицированная живая аттестация, завершение гостя, восстановление публикации и
допуск публичных точек входа остаются отдельными обязанностями координатора.

## Последствия и проверка

Нужны дополнительные ограниченные метаданные и пути восстановления, но исходная принадлежность остаётся независима от желаемых слушателей, а непрерывность устройств сохраняется. Отказ при неоднозначном состоянии предпочтительнее молчаливого принятия правил или возвращения отозванного клиента. Блокировки проекта и сервера остаются advisory для внешних облачных администраторов; распределённая атомарность или исправление произвольного дрейфа не обещаются.

Детерминированные тесты обязаны проверять полную идентичность/метки правил, сохранение SSH и остальных служб, коллизии портов/источников, устаревшие планы, задержанные команды, каждую границу публикации, известные/неизвестные исходы провайдера, откат без ротации ключей, потерю приватных ключей при полном облачном удалении и миграцию из любого TOML-снимка. Использовать моки и изолированную Linux-проверку, не локальный VPN владельца. Ручная проверка установленного клиента/живого облака требует отдельного разрешения.

Отклонённые альтернативы: пересобирать/перемечать исходный облачный план; заменять security group целиком; повторять bootstrap; выводить успех из похожего на прежний API-снимка; хранить только последнюю голову клиентов без закрытия родительского сегмента; перевыпускать ключи при миграции; считать вторую nftables accept chain достаточной.
