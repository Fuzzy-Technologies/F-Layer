# Архитектурные решения

F-Layer ведёт записи архитектурных решений (ADR), когда решение существенно влияет на архитектуру, публичные контракты, совместимость, границы безопасности, сохранение данных, интерфейсы провайдеров или устройство расширений.

## Именование

```text
0000-template.md
0001-short-decision-name.md
0002-another-decision.md
```

Присвоенные номера ADR не меняются.

## Жизненный цикл

1. Зафиксировать контекст и решение до реализации или вместе с ней.
2. Указать связанную фичу или задачу и соответствующие PR.
3. Описать последствия и отклонённые альтернативы.
4. Не переписывать принятое ADR молча под другое решение; при необходимости заменить его новым ADR.

Для новой записи используйте [0000-template.md](0000-template.md).

