# Архитектура

Начните с [обзора реализованной архитектуры](reference.md): в нём есть схемы
компонентов, управления ресурсами и сборки документации. Точный список
публичных модулей определяется по установленному wheel, а
[правила покрытия](../development/documentation-coverage.md) учитывают каждый
файл репозитория.

| Компонент                                         | Подробное описание                                     |
| ------------------------------------------------- | ------------------------------------------------------ |
| Конфигурация и состояние ресурсов                 | [Конфигурация и состояние](configuration-state.md)     |
| Чтение данных облачного провайдера                | [Интерфейс провайдера](provider-contract.md)           |
| Выполнение операций и восстановление              | [Жизненный цикл](lifecycle.md)                         |
| Создание и удаление ресурсов Yandex Cloud         | [Адаптер жизненного цикла Yandex](yandex-lifecycle.md) |
| Профиль развёртывания и создаваемые файлы         | [Защищённый шлюз](secure-gateway.md)                   |
| Диагностика и измерения без чувствительных данных | [Диагностика](diagnostics.md)                          |

Эти документы описывают уже реализованные правила. Планы дальнейшего развития
указываются отдельно. Существенные решения, альтернативы и последствия для
совместимости фиксируются в [ADR](../adr/README.md).
'''
