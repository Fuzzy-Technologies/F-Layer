# Профиль развёртывания AmneziaWG

F-Layer подготавливает сервер AmneziaWG 3.1 и отдельный файл `.conf` для каждого
устройства. Сервер работает на Ubuntu 24.04 x86-64 с systemd и доступным
`/dev/net/tun`. Используется официальная реализация в пространстве пользователя,
поэтому сторонний модуль ядра не нужен.

Пример: [`examples/vpn/amneziawg.toml`](../../examples/vpn/amneziawg.toml).
Адреса устройств находятся в `10.66.0.0/24`, а `10.66.0.1` зарезервирован
для сервера. Выберите другую частную подсеть, если эта пересекается с вашей сетью.

## Трафик и поддержка клиентов

В режиме full через туннель идут все **IPv4**-назначения; в split — только
перечисленные. Адреса DNS должны входить в эти маршруты. Сервер разрешает
пересылку по тому же списку назначений и использует IPv4 NAT. Клиенты не могут
пересылать трафик другим VPN-клиентам или в диапазон метаданных облака.

IPv6 профиль не поддерживает. Прежде чем использовать полный туннель,
отключите IPv6 на клиентском подключении. `ipv6_policy = "disabled"` записывает
это требование, но не меняет ОС клиента. F-Layer не добавляет `::/0` для
сервера, работающего только с IPv4. Kill switch и отключение IPv6 настраиваются
на клиенте отдельно и проверяются на реальном устройстве.

Используйте клиент AmneziaWG с поддержкой протокола 3.1:

- [AmneziaWG для Windows 3.1.0](https://github.com/amnezia-vpn/amneziawg-windows-client/releases/tag/3.1.0).
- [AmneziaWG для Android v3.1.20260814](https://github.com/amnezia-vpn/amneziawg-android/releases/tag/v3.1.20260814).

Импортируйте файл устройства `amneziawg.conf` командой **Import from file**,
затем включите туннель. Для каждого устройства нужен свой файл. Обычный
WireGuard и старые версии AmneziaWG не читают все настройки 3.1.
См. [официальную инструкцию импорта](https://docs.amnezia.org/documentation/instructions/awg-app/).

## Подготовка и работа с ключами

`GenerateAmneziaWgSecrets()` создаёт ключи Curve25519 с необязательной
зависимостью `cryptography` и отдельный 32-байтный ключ защиты заголовка.
`PrepareAmneziaWg()` формирует серверные и клиентские наборы из проверенного
профиля, адреса, настроек и этих ключей. Формирование выполняется без файловых,
сетевых или облачных операций. Одинаковые входные данные дают одинаковые байты.

В серверном наборе пять файлов:

| Файл              | Назначение                                                             |
| ----------------- | ---------------------------------------------------------------------- |
| `server.conf`     | Закрытый ключ сервера, настройки обфускации и открытые ключи клиентов. |
| `install.sh`      | Установка закреплённых версий, проверка состояния, замена и удаление.  |
| `firewall.nft`    | Ограничения IPv4-пересылки для интерфейса и NAT.                       |
| `network.sh`      | Адрес туннеля, MTU, пересылка и включение своего межсетевого экрана.   |
| `service.service` | Постоянный systemd-сервис пользовательского туннеля.                   |

Все файлы набора считаются чувствительными. Закрытые ключи клиентов находятся
только в наборах соответствующих клиентов и закрытом хранилище контроллера.
В `server.conf` их нет. Закодированное хранилище ключей контроллера нельзя
передавать на сервер, в cloud-init, общее состояние ресурсов, логи или Git.

`EncodeAmneziaWgSecrets()` и `DecodeAmneziaWgSecrets()` поддерживают ограниченное
закрытое хранилище контроллера. Ключи можно подготовить до получения IP-адреса,
затем создать клиентские файлы с реальным адресом и теми же ключами.
Сохраняйте эти данные по существующим правилам закрытых файлов проекта.

Для добавления или удаления устройства измените открытые настройки и вызовите
`GenerateAmneziaWgSecrets(profile, previous)` с сохранёнными ключами. У прежних
устройств и сервера ключи сохранятся. Для замены одного скомпрометированного
ключа явно передайте `rotate_device_ids=("phone",)`.
Одна подготовка не отзывает устройство. Первый установщик принимает только
новое развёртывание или полностью одинаковый повтор. Изменённый существующий
набор отклоняется, пока весь процесс не поддерживает явное подтверждение
ожидаемого прежнего развёртывания. Сейчас для смены ключей нужно контролируемо
удалить и создать развёртывание заново. Проверьте сервер после этого и только
затем удаляйте старые локальные клиентские файлы.

## Установка на гостевую систему

Адаптер должен проверить SSH-ключ сервера и передать пять серверных файлов
в закрытый временный каталог нужной ВМ. Файлы должны быть обычными, принадлежать
root, иметь права `0600` и ровно одну жёсткую ссылку. Выполните:

```bash
sudo bash ./install.sh
sudo bash ./install.sh --check
```

Установщик проверяет Ubuntu 24.04 и x86-64, устанавливает стандартные средства
сборки и сети из аутентифицированных APT-репозиториев и собирает закреплённый
официальный исходник. Перед распаковкой проверяется SHA-256 архива Go,
перед сборкой — обе Git-ревизии; требуется база контрольных сумм модулей Go
и неизменяемый граф зависимостей. При первой установке нужен HTTPS-доступ
к GitHub, `go.dev`, прокси модулей Go и сервису контрольных сумм.

| Компонент       | Закреплённая версия                                                |
| --------------- | ------------------------------------------------------------------ |
| AmneziaWG Go    | `v3.1.20260828`, коммит `b5928efb6ca19f0153958460c3d141f04abc5c2e` |
| AmneziaWG tools | `v3.1.20260812`, коммит `ee0f0a9aa34ff0a0da4b3433b9512781cfe02843` |
| Компилятор Go   | `1.27.2`, официальный архив Linux amd64 с закреплённым SHA-256.    |

Имена сервиса и интерфейса выводятся из полного набора идентификаторов
развёртывания. Установка отказывается работать с чужими путями и символическими
ссылками. Повтор неизменённой исправной установки завершается без переустановки
зависимостей. Изменённая или отсутствующая запись о прежнем содержимом
останавливает работу до загрузок и изменения сервисов. Неисправную идентичную
установку можно восстановить: сначала копируются старые файлы, а при неудачном
запуске они возвращаются с попыткой запустить прежний сервис. Systemd запускает
туннель и его правила экрана после перезагрузки.

Начальная настройка ВМ должна разрешать выбранный входящий UDP-порт и путь
пересылки этого профиля. Старый SSH-шлюз с политикой forwarding `drop` нельзя
использовать без изменений: `accept` в другой базовой цепочке nftables
не отменяет этот запрет. Установщик не очищает чужие правила.
`network.sh` включает IPv4 forwarding при запуске сервиса.

`--check` проверяет systemd, порт туннеля, назначенный IPv4, forwarding и свою
таблицу nftables. Это не подтверждает handshake клиента, доступ в интернет,
DNS или обход фильтрации конкретной сети. Проверяйте это с настоящего клиента.

`sudo bash ./install.sh --remove` удаляет только сервис с проверенной
принадлежностью и его закрытые файлы. Пакеты ОС и общая настройка forwarding
остаются, поскольку могут использоваться другими профилями. Удаление облачной
ВМ выполняет адаптер жизненного цикла.

## Проверки и официальные источники

Точечные тесты проверяют разные ключи устройств, исключение секретов из вывода,
разбор клиентского INI, воспроизводимость наборов, маршруты full/split, замену
клиентов, неверные входные данные, кодирование закрытого хранилища, имена
по владельцу и shell-синтаксис. Официальный закреплённый парсер AmneziaWG tools
также принял созданную серверную конфигурацию в локальной проверке без подключения.
Оба закреплённых инструмента и Go-демон были собраны локально с выбранными
зависимостями. Это не заменяет испытание облака и туннеля устройства.

- [Официальная конфигурация AmneziaWG 3.1](https://docs.amnezia.org/documentation/amnezia-wg/).
- [Установка пользовательской реализации](https://docs.amnezia.org/documentation/instructions/install-amneziawg-go/).
- [Закреплённые исходники демона](https://github.com/amnezia-vpn/amneziawg-go/tree/b5928efb6ca19f0153958460c3d141f04abc5c2e).
- [Закреплённые исходники инструментов](https://github.com/amnezia-vpn/amneziawg-tools/tree/ee0f0a9aa34ff0a0da4b3433b9512781cfe02843).
- [Официальные загрузки и контрольные суммы Go](https://go.dev/dl/).
'''
