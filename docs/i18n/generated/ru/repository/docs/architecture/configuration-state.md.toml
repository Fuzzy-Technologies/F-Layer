# Конфигурация и состояние

Ядро F-Layer отделяет описание требуемых ресурсов от минимального списка ID,
по которым можно найти ресурсы своего развёртывания. Эти правила реализованы
в `flayer.core`. Создание облачных ресурсов, управление операциями и настройки
профилей находятся в отдельных компонентах. См. [ADR 0001](../adr/0001-config-state-contracts.md).

## Границы модулей

| Компонент               | Отвечает за                                                                   | Не отвечает за                                                                   |
| ----------------------- | ----------------------------------------------------------------------------- | -------------------------------------------------------------------------------- |
| `flayer.core.contracts` | Проверку формата, идентификаторы развёртывания, метки принадлежности.         | Аутентификацию и облачный API.                                                   |
| `flayer.core.config`    | Список требуемых ресурсов, ID профиля, ссылки на учётные данные, чтение TOML. | Чтение секретов, регион по умолчанию, параметры ресурсов конкретного провайдера. |
| `flayer.core.state`     | Ссылки на ресурсы, строгое чтение JSON, атомарное локальное сохранение.       | Результаты запросов к облаку, авторизацию, удаление ресурсов, создаваемые файлы. |
| Адаптеры провайдеров    | Настройки провайдера, аутентификацию, вызовы API и проверку принадлежности.   | Общую политику хранения состояния.                                               |
| Профили развёртывания   | Объединение возможностей провайдера и настройки профиля.                      | Неявный выбор провайдера в ядре.                                                 |
| Диагностика             | Проверки и отчёты с заданными ограничениями выполнения.                       | Требуемое состояние или право управления ресурсами.                              |

## Требуемая конфигурация

Файл TOML использует версию формата `1`. Отсутствующий или некорректный файл,
неизвестные поля, неподдерживаемая версия и неверные типы приводят к ошибке.
Загрузчик не подставляет настройки текущей машины или облачные значения по
умолчанию. Имена начинаются с буквы, содержат строчные латинские буквы, цифры
и дефисы, длина — не более 63 символов. `scope_id` и ID ресурсов провайдера
считаются строками печатных ASCII-символов без пробелов длиной до 256 символов.

```toml
schema_version = 1
profile = "secure-gateway"

[identity]
project = "example"
stack = "demo"
provider = "example-cloud"
scope_id = "example-scope"
owner_id = "example-owner"

[[resources]]
logical_id = "gateway"
kind = "instance"
name = "demo-gateway"

[[credentials]]
name = "cloud-auth"
source = "env"
reference = "EXAMPLE_AUTH"
```

`resources` и `credentials` можно не указывать или оставить пустыми. Логические
ID ресурсов и имена учётных записей должны быть уникальны. Подробные настройки
проверяют адаптеры провайдера и профиля; версия `1` не допускает произвольных
дополнительных полей в этих таблицах ядра.

`SecretReference` принимает `env` с именем переменной окружения в верхнем
регистре либо `file` с непустым путём ограниченной длины. При загрузке значение
переменной или содержимое файла не читаются. Их чтение и правила относительных
путей определяет адаптер аутентификации. Конфигурация содержит только ссылки,
а не токены, пароли или закрытые ключи. Ядро не может проверить содержимое
произвольной ссылки; вызывающая сторона должна защищать файлы учётных данных
и не добавлять приватные пути в Git.

```python
from flayer.core.config import LoadConfig

config = LoadConfig("./stack.toml")
ownershipLabels = config.identity.OwnershipLabels()
```

Полученные модели — неизменяемые dataclass. При прямом создании объектов
проверяются те же поля и уникальность, что и при чтении файла. Описание
требуемых ресурсов содержит логические имена, без присвоенных облаком ID.

## Состояние ресурсов развёртывания

`StackState` хранит полный `StackIdentity` и кортеж значений
`ResourceState(logicalId, kind, resourceId)`. После прерывания снимок может
содержать только успевшие появиться ресурсы; отсутствующие ID не угадываются.
ID провайдера должны быть уникальны внутри типа, логические ID — во всём списке.

```python
from flayer.core.state import LoadState, ResourceState, SaveState, StackState

state = StackState(
    identity=config.identity,
    resources=(ResourceState("gateway", "instance", "example-instance"),),
)
SaveState("./runtime/state.json", state, expectedIdentity=config.identity)
loadedState = LoadState("./runtime/state.json", expectedIdentity=config.identity)
```

JSON содержит ровно `schema_version`, `identity` и `resources`. В нём нет ссылок
на учётные данные или их значений, полной конфигурации, ответов провайдера,
журналов, отчётов о доступности, созданных файлов или публичных адресов.
Если файл отсутствует, возвращается `None`; повреждённый или чужой файл вызывает
`StateError`. Повторяющиеся поля JSON отклоняются. Размер чтения и записи
ограничен 1 MiB. Открытый дескриптор должен указывать на обычный файл;
неблокирующее открытие, где доступно, не даёт подмене на FIFO подвесить чтение.
Проверяются и исходный размер, и объём прочитанных данных, поэтому рост файла
во время чтения не обходит предел. Слишком большая запись отклоняется до замены.

Для чтения, сохранения и удаления нужно передать ожидаемые идентификаторы
развёртывания. Все пять полей должны совпадать. Перед заменой `SaveState`
также проверяет существующий снимок под блокировкой записи. Метки принадлежности:
`managed-by=f-layer`, `flayer-project`, `flayer-stack`, `flayer-owner`.
Перед реальным облачным изменением адаптер отдельно проверяет каталог и текущие
метки ресурса. Сам файл состояния не даёт права менять инфраструктуру.

`RemoveState(path, expectedIdentity)` удаляет только совпадающий локальный
снимок и возвращает признак удаления. Отсутствие файла не считается ошибкой;
облачные ресурсы не удаляются. Когда можно безопасно удалить список после
очистки облака, решает код жизненного цикла.

## Сохранение и восстановление

Используйте доверенный каталог, принадлежащий вашему пользователю ОС. Избегайте
символических ссылок в родительских каталогах и компонентов `..`. Все процессы
записи должны использовать этот API. Реализация отклоняет символическую ссылку
или необычный тип конечного файла и использует `O_NOFOLLOW`, если он доступен.
Она не может защитить от враждебного локального пользователя, меняющего каталоги
в подконтрольном ему хранилище одновременно с операцией.

Запись захватывает соседнюю блокировку `.state.json.lock`, создаёт уникальный
временный файл в том же каталоге, выполняет flush и `fsync`, затем атомарно
заменяет целевой файл. Права временного файла POSIX разрешают доступ только
владельцу. В POSIX синхронизируется и родительский каталог; в Windows используются
`os.replace` и ACL каталога, заданные вызывающей стороной. Повреждённые и чужие
снимки блокируют сохранение и удаление и остаются для разбора проблемы.

Ошибка до замены сохраняет прежний снимок. После замены новый целый снимок уже
может быть виден, хотя его сохранность после сбоя ещё не гарантирована. В таком
случае сначала прочитайте и проверьте состояние, затем повторяйте операцию.
Атомарная замена не гарантирует долговечность на любой сетевой файловой системе
и не является облачной транзакцией.

Занятая или оставшаяся от сбоя блокировка сразу вызывает `StateError`.
При нормальном завершении удаляются блокировка и временный файл. После сбоя
процесса убедитесь, что запись больше не выполняется, проверьте итоговый снимок
и уцелевший временный файл, затем вручную восстановите работу с блокировкой.
API не перехватывает чужие блокировки, не принимает чужое состояние, не чинит
повреждённые файлы и не преобразует неизвестные версии формата автоматически.

Если файловая система мешает удалить временный файл или блокировку, API сообщает
`StateError` о незавершённой очистке и сохраняет цепочку исходной ошибки. Эти
файлы требуют такого же ручного восстановления. При невозможности создать
текстовый поток дескриптор закрывается до передачи ошибки, поэтому неудачная
запись не оставляет открытый дескриптор.
'''
