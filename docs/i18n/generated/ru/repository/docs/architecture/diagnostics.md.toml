# Диагностика, доступность и измерения

Диагностика F-Layer доступна через `flayer.diagnostics` и командную строку и
не изменяет ресурсы. Из A-VPN перенесены структурированные результаты проверок,
контроль свежести отчётов и ограниченные измерения загрузки. Код не содержит
встроенного провайдера, гостевой ОС, транспортного профиля, каталога сервисов
или настроек частной инфраструктуры.

## Реализованные команды

```bash
python -m flayer --help
python -m flayer check --format json
python -m flayer status --format text
python -m flayer health --endpoint https://your-controlled-endpoint.example/health --timeout 3
python -m flayer benchmark --endpoint https://your-controlled-endpoint.example/sample \
  --timeout 3 --count 3 --bytes 65536 --format json
```

Используйте адрес, обращения к которому вам разрешены. Для сетевых проверок
обязателен `--endpoint`. Команды не выбирают сервис по умолчанию, не ищут
облачные ресурсы, не читают учётные данные, не запускают SSH и не меняют
инфраструктуру.

| Команда     | Что проверяет                                     | Без сетевого адреса                                                   |
| ----------- | ------------------------------------------------- | --------------------------------------------------------------------- |
| `check`     | Совместимость локального Python.                  | Сообщает только о локальном выполнении.                               |
| `status`    | Среду Python и общий интерфейс данных провайдера. | Облачная проверка не поддерживается, пока адаптер не передаст данные. |
| `health`    | Ответ HTTP 2xx от указанного сервиса.             | Возвращает unsupported.                                               |
| `benchmark` | Несколько HTTP-загрузок ограниченного размера.    | Возвращает unsupported.                                               |

`health` проверяет доступность адреса, но не состояние облачного развёртывания,
настройки безопасности гостевой системы, установление туннеля или правильность
приложения. `benchmark` учитывает загруженное содержимое и длительность HTTP-запроса,
включая DNS, соединение, TLS и получение ответа. Это не измерение скорости
отправки и не оценка предельной пропускной способности канала.

## Результаты и коды завершения

JSON содержит `schema_version: 1`, `command`, общий `status` и упорядоченный
массив `checks`. У проверки есть `name`, `status`, `message` и объект `details`.
Ключи JSON отсортированы; тела ответов и исходные тексты исключений исключены.
Текстовый вывод использует те же очищенные данные, по строке на проверку.

| Статус                 | Код | Значение                                                              |
| ---------------------- | --- | --------------------------------------------------------------------- |
| `ok`                   | 0   | Все запрошенные проверки успешны.                                     |
| `warning`              | 1   | Переданные данные говорят об ухудшении или незавершённом состоянии.   |
| `failed`               | 1   | Проверка не пройдена или структура данных неверна.                    |
| `stale`                | 3   | Данные устарели или имеют время из будущего.                          |
| `unsupported`          | 4   | Не переданы адаптер, данные или адрес; либо формат не поддерживается. |
| Неверные аргументы CLI | 2   | Неверны параметры команды, адрес или пределы.                         |

При объединении приоритет такой: `failed`, `stale`, `unsupported`, `warning`,
`ok`. Пустой отчёт имеет статус unsupported. Успешная локальная проверка
не скрывает отсутствие данных об удалённом сервисе.

## Интерфейс адаптера

`RunChecks()` принимает функции `HealthProbe`, возвращающие `CheckResult`
без изменения ресурсов. Адаптеры отвечают за разрешение доступа и соблюдение
таймаута. Сборщик превращает исключения или неверные возвращаемые значения
в ошибку проверки, не копируя тексты исключений.

`ProviderStatus()` принимает словарь с `state`, равным `ready`, `pending`,
`failed` или `absent`; только это разрешённое значение попадает в отчёт.
Функция не вызывает SDK провайдера. Адаптер преобразует сюда собственные статусы.

`EvaluateHealthReport()` принимает уже полученные данные: целочисленный
`schema_version: 1`, конечное число Unix `timestamp` и `status`, равный `ok`,
`warning` или `failed`. Неверные поля отклоняются, время вне диапазона
`[now - max_age_seconds, now]` считается устаревшим. Функция не разбирает
вывод serial console и не загружает файлы гостевой системы.

`EndpointTransport` можно подменить для офлайн-тестов и будущих адаптеров.
Стандартный `MeasureEndpoint()` использует HTTP-клиент стандартной библиотеки
в отдельном запускаемом процессе. Общий срок охватывает запуск процесса, DNS,
соединение, TLS и чтение ответа. После истечения процесс завершается; ожидания
при terminate и kill ограничены одной секундой каждое.

## Ограничения трафика и вывода

- Адрес HTTP(S) задаётся явно, без имени пользователя, параметров запроса и фрагмента.
- Таймаут каждого запроса больше нуля и не превышает 30 секунд.
- Измерение содержит от 1 до 10 запросов; на запрос читается от 1 до 1 048 576 байт содержимого. По умолчанию: 3 запроса, 3 секунды, 65 536 байт.
- Используются `GET` и заголовок `Range`. Предел чтения действует, даже если сервер игнорирует заголовок. Он относится к данным, прочитанным клиентом, а не к служебному трафику или объёму, который сервер успел отправить до закрытия соединения.
- Перенаправления считаются ошибкой и не выполняются. Настройки прокси окружения не читаются. HTTPS использует стандартную проверку сертификатов Python.
- Публичный вывод не содержит адресов сервисов, тел ответов, заголовков и исходных текстов ошибок. Сериализация рекурсивно скрывает ключи, похожие на учётные данные, bearer-токены, закрытые ключи, URL и текст IPv4. Произвольные объекты и двоичные данные заменяются, а не преобразуются в строки. Небезопасные ключи словаря очищаются; совпадения получают определённые суффиксы. Вложенность ограничена 16 уровнями, чтобы циклические данные не ломали вывод.

Очистка — дополнительная защита, а не детектор всех возможных секретов.
Адаптер должен возвращать только разрешённые диагностические сведения.
Не прикладывайте сырые ответы провайдера, serial console и значения учётных
данных как обычные поля. Подставленный транспорт обязан соблюдать таймаут и
предел байт; сборщик проверяет метрики, но не может отменить произвольный код
вызывающей стороны.

## Проверки и дальнейшая интеграция

Unit-тесты проверяют объединение статусов, свежесть, рекурсивную очистку,
неверные данные адаптера, защиту входных параметров CLI, предел размера,
ошибки перенаправления, таймауты, завершение и очистку без внешнего сетевого
трафика. Справку CLI и локальные проверки можно использовать для проверки установки.

Состояние провайдера в CLI и проверки конкретной гостевой системы требуют
отдельной интеграции адаптеров. Эти интерфейсы можно подключать после
стабилизации соответствующих контрактов провайдера и конфигурации.
См. [ADR 0003](../adr/0003-safe-diagnostics.md).
'''
