# Интеграция с экосистемой

`flayer.integrations` реализует общий формат наблюдений версии 1 для 1337,
инструментов Fuzzy и других клиентов. Это сторона F-Layer в интеграции.
Поведение пакета показано на тестовых данных и офлайн-сценарии; реальная
интеграция с 1337 или MCP пока не проверена.

Архитектурный принцип: модели рассуждают, а ядро управляет выполнением,
состоянием, принадлежностью ресурсов и результатами проверок. Приложения ИИ
и MCP выступают клиентами. Модель, прочитанное сообщение, список возможностей
или адаптер не дают скрытого разрешения на действия. Решение записано в
[ADR 0012](../adr/0012-consumer-neutral-evidence-contracts.md).

## Сообщения и принадлежность ресурсов

Запрос и ответ содержат ровно эти метаданные. В ответе дополнительно есть
`evidence`; в запросе нет параметров операции или полезной нагрузки результатов.

| Поле             | Правило                                                                                    |
| ---------------- | ------------------------------------------------------------------------------------------ |
| `schema_version` | Целое `1`; логические значения и другие версии отклоняются.                                |
| `envelope`       | `request` или `result`, в соответствии с вызванным парсером.                               |
| `identity`       | Полный точный `StackIdentity`, без пропусков и значений по умолчанию.                      |
| `request_id`     | 1–64 ASCII-буквы, цифры, точки, подчёркивания или дефисы; первый символ — буква или цифра. |
| `operation`      | Одна из пяти операций чтения, перечисленных ниже.                                          |
| `evidence`       | Только в ответе; строгий формат определяется операцией.                                    |

`identity` включает `project`, `stack`, `provider`, `scope_id`, `owner_id`.
Все пять должны совпадать с независимо выбранными ожидаемыми значениями.
Адаптер состояния сверяет идентификаторы из `StackState`. Отчёты диагностики
и жизненного цикла не содержат identity, поэтому их адаптеры требуют
`observed_identity` от приложения, выбравшего источник. Это проверяет привязку
формата к проекту, но не является удалённой аттестацией и не подтверждает
происхождение данных.

`ParseRequest(payload, expected_identity)` возвращает проверенный запрос.
`ParseResult(payload, expected_request)` дополнительно требует совпадения
операции, ID запроса, версии, каталога и владельца. Сопоставление ответа
не аутентифицирует отправителя, не подтверждает свежесть, не предотвращает
повторное воспроизведение и не доказывает готовность сервера. Прочитанные
сообщения остаются недоверенными данными. Приложение должно аутентифицировать
транспорт и отдельно разрешать доступ к источникам результатов.

Идентификаторы проекта и запроса — открытые метаданные маршрутизации, а не
поля произвольного содержимого. Не помещайте туда секреты. Точные идентификаторы
сохраняются: их скрытие сделало бы проверку принадлежности неоднозначной.
В примерах используются только учебные значения.

## Поддерживаемые наблюдения

| Операция           | Адаптер            | Данные                                                                                  |
| ------------------ | ------------------ | --------------------------------------------------------------------------------------- |
| `status`           | `AdaptDiagnostics` | Сводный статус и результаты отдельных проверок по порядку.                              |
| `health`           | `AdaptDiagnostics` | Сводный статус и результаты отдельных проверок по порядку.                              |
| `benchmark`        | `AdaptDiagnostics` | Результаты проверок и разрешённые числовые измерения.                                   |
| `state`            | `AdaptState`       | Число записанных ресурсов развёртывания.                                                |
| `lifecycle-report` | `AdaptLifecycle`   | Выполненное действие, исход, необходимость восстановления и числа ресурсов по статусам. |

Имя команды отчёта диагностики должно точно совпадать с операцией запроса.
Статусы `ok`, `warning`, `failed`, `stale`, `unsupported` сохраняют прежний
смысл и приоритет. Пустой список имеет `unsupported`. Парсер отклоняет общий
статус, не соответствующий отдельным проверкам. У каждой проверки остаются
только `status` и объект `metrics`; порядок сохраняется, ключи метрик
нормализуются, имена и сообщения диагностики исключаются.

Метрики необязательны. Адаптеры пропускают неизвестные подробности; неизвестные
поля метрик в передаваемом сообщении и неверные значения известных метрик
отклоняются. Строки, логические значения, байты учётных данных, содержимое
ответов и неструктурированные ошибки не могут быть метриками.

| Метрика            | Допустимое значение                                 |
| ------------------ | --------------------------------------------------- |
| `duration_seconds` | Конечное число от 0 до 30.                          |
| `received_bytes`   | Целое от 0 до 1 048 576.                            |
| `byte_limit`       | Целое от 1 до 1 048 576.                            |
| `http_status`      | Целое от 100 до 599 либо `null`.                    |
| `throughput_mbps`  | Конечное число от 0 до 1 000 000 000 000 либо null. |

`resource_count` описывает локально записанные ресурсы. Это не подтверждает,
что они ещё существуют в облаке или что развёртывание исправно. Результат
жизненного цикла содержит `action`, `status`, `recovery_required` и массив
`resources` из категорий `{status, count}`. Действия: `status`, `create`,
`destroy`, `recover`; исходы: `complete`, `incomplete`, `uncertain`,
`rolled-back`, `rollback-incomplete`; категории ресурсов: `recorded`, `present`,
`missing`, `not-recorded`. Категории не повторяются, сумма не больше 4 096.

Отчёт может описывать уже выполненное изменение. Его обобщение не запрашивает,
не разрешает, не повторяет и не выполняет операцию. Имена `create`, `destroy`,
`recover`, `apply`, `execute` запрещены как операции запроса. Будущая
интеграция для изменения ресурсов требует отдельного проверенного контракта
авторизации, исполнения и восстановления.

## Ограничения и сериализация

- Входной UTF-8 и сериализованный вывод ограничены 65 536 байтами.
- После декодирования допустимы восемь уровней вложенности и 4 096 значений.
- Диагностика содержит не более 128 проверок, по пять уникальных метрик на каждую.
- Число ресурсов в состоянии и отчёте жизненного цикла ограничено 4 096.
- Дубли JSON-ключей, нестандартные числовые константы, неизвестные поля, неверные типы и версии отклоняются без повторения исходного содержимого в ошибке.
- `SerializeRequest` и `SerializeResult` формируют воспроизводимый стандартный JSON.

Эти пределы относятся к разбору и преобразованию данных внутри процесса.
Они не задают сетевой таймаут, не разрешают адрес и не ограничивают произвольную
функцию приложения. Обработчиков отправки команд в пакете нет. Диагностика
сама ограничивает запросы и измерения, а ядро жизненного цикла управляет
состоянием операций и восстановлением.

## Пример без внешних подключений

1. Приложение с разрешённым доступом выбирает точные идентификаторы развёртывания и доверенный источник данных. Клиент создаёт запрос с ID для сопоставления ответа.
2. Приложение проверяет запрос по независимо выбранным идентификаторам. Разбор не вызывает провайдер, не ищет учётные данные и не пишет состояние.
3. Приложение отдельно получает результаты через API F-Layer. Например, `LifecycleEngine.Status()` читает наличие своих ресурсов в облаке; транспорт HTTP-проверок и измерений выбирается и ограничивается явно.
4. Адаптер оставляет только допустимые данные. Он не вызывает провайдер, методы жизненного цикла и не сохраняет состояние.
5. Получатель проверяет ответ относительно исходного запроса и учитывает подтверждённый источник и правила свежести приложения.

```python
from flayer.core.contracts import StackIdentity
from flayer.core.state import StackState
from flayer.integrations import (
    AdaptState, IntegrationOperation, IntegrationRequest, ParseRequest,
    ParseResult, SerializeRequest, SerializeResult,
)

identity = StackIdentity("example", "sandbox", "fake", "scope-example", "example-owner")
request = IntegrationRequest(identity, "example-001", IntegrationOperation.STATE)
parsed = ParseRequest(SerializeRequest(request), identity)
result = AdaptState(parsed, StackState(identity))
observed = ParseResult(SerializeResult(result), request)
```

См. [примеры сообщений](https://github.com/Fuzzy-Technologies/F-Layer/tree/develop/examples/integrations)
и [офлайн функциональный тест](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/tests/functional/test_ecosystem_reference.py).
В тесте используются API status, health, benchmark, сохранённое состояние
и lifecycle status с локальными данными и поддельным провайдером. Проверяется,
что парсеры и адаптеры не отправляют облачных команд и не меняют состояние.
Контрактные тесты проверяют примеры всех операций, чужую принадлежность,
неверное сопоставление, ошибочные и слишком большие сообщения, исключение
приватных данных и запрет имён изменения. Это подтверждает сторону F-Layer,
но не совместимость реализации внешнего клиента.

## Граница расширения

Размещение транспорта, регистрация MCP-инструментов, аутентификация клиента,
правила повторного воспроизведения и свежести, а также совместимость внешних
клиентов находятся вне пакета. Ядро не знает имя потребителя; слои
оркестрации, планировщика и выполнения агентов заранее не добавляются. Версия 1 отклоняет
расширение схемы, а не молча пропускает его. Несовместимые новые поля и операции
требуют явной версии и решения по совместимости.
'''
