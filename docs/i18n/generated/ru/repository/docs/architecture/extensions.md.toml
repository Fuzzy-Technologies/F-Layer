# Интерфейсы расширений и их обнаружение

`flayer.extensions` добавляет Python API для явной регистрации провайдеров
и профилей развёртывания. Существующие правила жизненного цикла, CLI,
конфигурации, принадлежности ресурсов, состояния и файлов не меняются.
[ADR 0011](../adr/0011-explicit-extension-discovery.md) описывает обнаружение и загрузку.

## Реализованные интерфейсы

| Интерфейс                    | Назначение                                                                  |
| ---------------------------- | --------------------------------------------------------------------------- |
| `ExtensionDescriptor`        | Неизменяемые тип, ID, дистрибутив, точная версия, группа и фабрика.         |
| `ProviderExtension`          | Создание существующего `CloudProvider` для чтения из `ProviderContext`.     |
| `LifecycleProviderExtension` | Необязательное создание отдельного `LifecycleProvider`.                     |
| `ProfileExtension`           | Компиляция строгой конфигурации профиля с точными данными `ProfileContext`. |
| `CompiledProfile`            | Идентификаторы, формирование серверного набора и проверенный план TOML.     |
| `ExtensionRegistry`          | Регистрация, выбор и явная загрузка проверенных описаний.                   |

`ProviderContext` содержит только `scope_id`, имя внешнего источника CLI
`authentication_reference`, таймаут и предел размера списка. Он не читает
учётные данные, не принимает их содержимое, не выбирает исполняемые файлы
и не содержит произвольного словаря опций. Имя аутентификации обозначает уже
настроенный внешний источник; токен или ключ нельзя передавать вместо имени.
`ProfileContext` содержит проверенный `StackIdentity`. Значения конфигурации
проверяются выбранным профилем: неизвестные поля отклоняются, закрытые учётные
данные не включаются в серверные настройки.

Объект расширения предоставляет свой точный `Descriptor`. Внешняя entry point
указывает фабрику без аргументов, возвращающую этот объект. Он должен
соответствовать протоколу группы и вернуть исходное описание, включая выбранный
снимок метаданных. Фабрика может получить его через статическое чтение своего
явно указанного `.dist-info` с помощью `DiscoverExtensions`. Структурная проверка
контролирует обязательные методы и идентификаторы; за смысл методов и результаты
отвечает доверенная реализация.

## Встроенные расширения

| Тип       | ID                 | Адаптер                                                   |
| --------- | ------------------ | --------------------------------------------------------- |
| Провайдер | `yandex-read-only` | `YandexCloudProvider`: список и поиск точного ресурса.    |
| Провайдер | `yandex-lifecycle` | Отдельные фабрики чтения и `YandexLifecycleProvider`.     |
| Профиль   | `secure-gateway`   | Строгий парсер шлюза, компилятор, серверный набор и план. |

Все встроенные расширения используют точную версию пакета. Чтение списка
и создание адаптеров не выполняют облачных операций. Расширение провайдера
только для чтения не реализует необязательную фабрику жизненного цикла.
Для изменения ресурсов вызывающая сторона должна выбрать её отдельно.

```python
"""Select a real scoped read-only adapter without performing cloud operations."""

from flayer.extensions import (
    ExtensionKind,
    ExtensionRegistry,
    ProviderContext,
    ProviderExtension,
)

registry = ExtensionRegistry()
descriptor = registry.Get(ExtensionKind.PROVIDER, "yandex-read-only")
extension = registry.Load(descriptor)
assert isinstance(extension, ProviderExtension)
provider = extension.CreateProvider(ProviderContext("example-folder", "external-profile"))
```

Для шлюза выберите `ExtensionKind.PROFILE` и `secure-gateway`, затем вызовите
`CompileProfile(configuration, ProfileContext(identity))`. Несовпадение
принадлежности отклоняется. `BuildServerBundle()` создаёт набор в памяти.
Сохраните его через `WriteArtifactBundle()` до вызова
`RenderPlan(user_data_file=...)`: тот проверит точные байты и манифест.
Создание плана не развёртывает сервер и не подтверждает работу транспорта.

## Статическое обнаружение метаданных

`DiscoverExtensions(metadata_directories)` принимает явно ограниченный список
абсолютных каталогов `.dist-info` без перенаправлений. В каждом читаются только
`METADATA`, `entry_points.txt` и `RECORD`. Функция не обходит пути поиска Python,
не перечисляет установленные пакеты, не вызывает hooks поиска метаданных,
не сканирует модули, не следует конечным символьным ссылкам, не импортирует
плагины, не обращается к сети, не устанавливает пакеты и не проверяет
инфраструктуру. Ограничены число каталогов и файлов, размеры, имена, цели и версии.

Поддерживаются группы `flayer.providers.v1` и `flayer.profiles.v1`.
Например, `entry_points.txt` установленного пакета может содержать:

```ini
[flayer.providers.v1]
example = example_plugin.plugin:CreateExtension
```

Группы других экосистем игнорируются. Неизвестные группы F-Layer, версии ABI,
неверные цели, extras, повторяющиеся поля метаданных и ID расширений приводят
к отказу. Имена — ограниченные идентификаторы в нижнем регистре. Имена
дистрибутивов нормализуются к нижнему регистру с дефисами; принимаются только
стабильные версии из трёх чисел. Внешний пакет не может называться `f-layer`
или указывать модуль из пространства `flayer`. Повтор `(kind, plugin_id)`,
включая попытку заменить встроенное расширение, отклоняется.

Описание содержит SHA-256 трёх файлов метаданных. Это проверяемое объявление
идентификаторов, но не проверка издателя, подписи, происхождения установки
или подлинности пакета.

## Явная загрузка и проверка исходников

Зарегистрируйте найденные описания через `ExtensionRegistry(descriptors)`.
Обнаружение не загружает код. `Load(descriptor, allowed=(exact_descriptor,))`
отдельно разрешает выполнение выбранного внешнего кода. Описание должно точно
совпадать с записью реестра и списком разрешённого: дистрибутив, версия, группа,
цель, место установки и хеш метаданных. Решение о доверии принимает приложение
до заполнения списка. Встроенные расширения ограничены известными точными записями.

Перед импортом снова проверяются метаданные, а по `RECORD` — SHA-256 и размер
целевого модуля и всех родительских пакетов. Каждый исходник должен быть
обычным файлом без ссылок внутри выбранного корня установки. Поддерживаются
исходные Python-модули и обычные пакеты. Namespace-пакеты, двоичные расширения,
отсутствие данных о родителях, неоднозначные цели пакет/модуль, слабые или
отсутствующие хеши и изменённые файлы приводят к отказу.

Загрузчик выполняет проверенные неизменяемые байты. Временный import hook
обслуживает только выбранную цепочку, чтобы импорт из родителя использовал те
же байты, а не старый байткод или посторонний путь. Hook удаляется и при ошибке.
Уже загруженный модуль с тем же именем отклоняется, даже если путь совпадает,
кроме случая, когда загрузчик хранит запись, связывающую точный объект модуля,
путь и хеш выполненного кода. Такой собственный модуль можно использовать снова;
изменение уже загруженной цепочки требует нового процесса. Повторный запрос
к реестру возвращает проверенное расширение без повторного запуска фабрики.

Зависимости и фабрика выполняются только после согласия и входят в решение
о доверии пакету и среде. Загрузчик не является песочницей, валидатором
зависимостей или защитой от враждебного процесса. При ошибке удаляются только
модули и записи текущей попытки; побочные эффекты плагина и импорты зависимостей
откатить невозможно. Ошибки очищаются, несовпадение описания или протокола
блокирует загрузку.

## Результаты проверок

Детерминированные тесты покрывают обнаружение без выполнения finder или модулей,
неверные метаданные, ABI, дубли и подмену встроенных расширений, точное согласие
на загрузку, изменение метаданных и кода, принадлежность по RECORD, старые
модули и байткод в кеше, очистку ошибок, ограничения контекста, создание
настоящего адаптера Yandex и полный локальный путь от набора шлюза к плану.
Тесты не используют реальное облако или учётные данные.
'''
