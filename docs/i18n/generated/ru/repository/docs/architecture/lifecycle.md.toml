# Управление жизненным циклом ресурсов

`flayer.core.lifecycle.LifecycleEngine` реализует создание, проверку состояния,
удаление и явное восстановление. Облачные команды предоставляет
`flayer.providers.lifecycle.LifecycleProvider`. Первая реализация —
[адаптер Yandex Cloud](yandex-lifecycle.md).

## План и сохраняемые данные

| Объект           | Назначение                                                  | Содержимое                                                                          |
| ---------------- | ----------------------------------------------------------- | ----------------------------------------------------------------------------------- |
| `DeploymentPlan` | Неизменяемый граф требуемых ресурсов, не более 128 записей. | Идентификаторы развёртывания, неизменяемые параметры и зависимости.                 |
| `StackState`     | Минимальные ссылки на ресурсы развёртывания.                | Идентификаторы развёртывания, логический ID, тип и ID провайдера.                   |
| Журнал операций  | Незавершённое действие и возможность безопасного отката.    | Идентификаторы развёртывания, хеш плана, случайный ID операции и ссылки на ресурсы. |
| Ответ провайдера | Проверенные сведения о ресурсе в нужном каталоге.           | Нормализованная ссылка, статус и метки принадлежности.                              |

Журнал называется `.<state filename>.operation.json`, а общая блокировка операции —
`.<state filename>.operation.lock`. Для записи снимка используется отдельная
блокировка хранилища состояния. Файлы находятся рядом с выбранным пользователем
файлом состояния; их имена относятся к локальному восстановлению, а не к облаку.

Незавершённый журнал блокирует новое создание или удаление. Другой хеш плана
или другой владелец блокируют восстановление. Параметры ресурсов и учётные
данные в файлы состояния не копируются. Типы ресурсов в TOML пишутся через
дефис: `security-group` соответствует `ResourceKind.SECURITY_GROUP`.

## Командная строка

Вся справка работает без сети. Команды используют уже настроенный профиль
`yc`; F-Layer не читает, не выводит и не сохраняет его учётные данные.

```bash
python -m flayer lifecycle create --config plan.toml --state stack.json \
  --yc-profile sandbox --allow-mutation --scope-confirm example-folder --format json
python -m flayer lifecycle status --config plan.toml --state stack.json \
  --yc-profile sandbox --format json
python -m flayer lifecycle destroy --config plan.toml --state stack.json \
  --yc-profile sandbox --allow-mutation --scope-confirm example-folder --format json
python -m flayer lifecycle recover --config plan.toml --state stack.json \
  --yc-profile sandbox --allow-mutation --scope-confirm example-folder --rollback
```

Это примеры команд. Создание, удаление и восстановление могут изменять ресурсы
выбранного аккаунта; подставьте собственные имя профиля и ID каталога.
Отсутствие согласия или несовпадение подтверждения с `identity.scope_id`
блокируют команду до обращения к провайдеру. Обычная команда диагностики
`status` работает как раньше; для развёртывания используется `lifecycle status`.

## Общий план развёртывания

План жизненного цикла отделён от исходной модели `DesiredConfig`. Все поля
проверяются; неизвестные поля и неподдерживаемые параметры отклоняются до
создания ресурсов. Необязательное поле `profile` служит описанием и само по
себе не загружает профиль.

```toml
schema_version = 1
profile = "generic"

[identity]
project = "example"
stack = "sandbox"
provider = "yandex-cloud"
scope_id = "example-folder"
owner_id = "example-owner"

[[resources]]
logical_id = "network"
kind = "network"
name = "example-network"

[[resources]]
logical_id = "subnet"
kind = "subnet"
name = "example-subnet"
dependencies = ["network"]

[resources.parameters]
network_dependency = "network"
zone_id = "ru-central1-a"
ipv4_cidr = "10.23.0.0/24"
```

В параметрах допустимы только неизменяемые скалярные значения, массивы и таблицы.
Адаптер определяет допустимые ключи, пределы и связи. Здесь должны находиться
параметры развёртывания без секретов; поля для секретов в плане нет.

## Поведение операций

Перед изменениями `create` проверяет существующие ресурсы с точным совпадением
принадлежности и принимает их под управление. Нарушенный граф существующих
зависимостей блокирует создание. Новые ресурсы создаются по порядку зависимостей,
записываются в журнал, затем в минимальный снимок состояния. Если создание завершилось подтверждённой
ошибкой, откат удаляет только новые ресурсы, сохранившие ID `flayer-operation`
текущей операции; старые ресурсы остаются. Этот ID проверяют и ядро, и адаптер.
Если ранее существовавший ресурс зависит от кандидата на откат, удаление
блокируется. Для каждого развёртывания используйте один основной файл состояния:
локальные блокировки не являются распределённой блокировкой облака.

Если результат создания неизвестен, операция остаётся незавершённой, даже когда
ресурс пока отсутствует в списке. Восстановление продолжает работу или откат
только после нахождения точно соответствующего ресурса. Неопределённый запрос
не повторяется вслепую. Частичное удаление продолжается по сохранённым ID;
подтверждённое отсутствие считается успешным удалением. Ненулевой результат
и `recovery_required` отличают незавершённую работу от успеха.

`lifecycle status` показывает `present`, `missing` или `not-recorded` для
каждого ресурса плана и нормализованный `provider_status` для существующего.
Команда не меняет снимок, не ищет постороннюю инфраструктуру и не подтверждает
готовность гостевой системы. Наличие ресурса не означает, что работает SSH,
завершены настройки безопасности или доступно приложение.

После аварийного завершения процесса проверьте блокировки операции и записи
состояния. Убедитесь, что старый процесс остановлен, прежде чем удалять его
блокировку. Сохраните журнал и снимок, затем запустите восстановление. Если
исход создания остаётся неоднозначным, нужна проверка на стороне провайдера;
F-Layer не отменяет автоматически операцию, результат которой остаётся неизвестным.

[ADR 0005](../adr/0005-durable-owned-lifecycle.md) описывает порядок действий
при ошибках, альтернативы и решения по совместимости.
