# Интерфейс провайдера

Провайдеры F-Layer преобразуют аутентификацию и сведения об облачных ресурсах в
общий интерфейс. Этот интерфейс поддерживает **чтение ресурсов Yandex Cloud**.
Создание, принятие под управление, откат и удаление выполняет отдельный
[адаптер жизненного цикла Yandex](yandex-lifecycle.md).

## Реализованный интерфейс

Общие типы находятся в `flayer.providers.contracts`, первый адаптер —
в `flayer.providers.yandex`.

| Публичный API                | Поведение                                                                             |
| ---------------------------- | ------------------------------------------------------------------------------------- |
| `CloudProvider.Identity`     | ID провайдера, заданный каталог ресурсов и имя источника аутентификации без секретов. |
| `CloudProvider.Capabilities` | Реализованные операции списка и поиска; не зависят от прав текущего аккаунта.         |
| `CheckAvailability()`        | Локальная проверка запуска CLI; состояние аутентификации остаётся неизвестным.        |
| `CheckAuthentication()`      | Проверка чтения выбранного каталога с существующими учётными данными CLI.             |
| `ListResources(kind)`        | Проверенный и отсортированный список ресурсов одного поддерживаемого типа.            |
| `GetResource(reference)`     | Поиск по ID с проверкой переданной ссылки и каталога в ответе.                        |
| `DiscoverInventory()`        | Список всех поддерживаемых типов или ошибка без частичного результата.                |

`ResourceReference` связывает ID провайдера, каталог, тип и ID ресурса.
`ProviderResource` содержит эту ссылку, имя, статус провайдера, необязательную
зону, неизменяемые метки принадлежности и публичные IPv4-адреса. Неизвестное
состояние обозначается `UNKNOWN`. Исходный JSON провайдера, метаданные
виртуальной машины и учётные данные в эти поля не включаются.

Поддерживаются `INSTANCE`, `DISK`, `NETWORK`, `SUBNET`, `ADDRESS` и
`SECURITY_GROUP`. Внутри типа результаты сортируются по ID; полный список
следует порядку перечисления. Само присутствие в списке не подтверждает
принадлежность ресурса. `HasLabels()` сравнивает непустой набор меток.
Разрешение на изменение проверяется по полным правилам отдельного адаптера
жизненного цикла.

## Аутентификация и выбор каталога

В `YandexCloudSettings` обязателен ID каталога; каталог по умолчанию из профиля
не используется. Можно также задать имя профиля, исполняемый файл CLI, таймаут
команды и предел размера списка. Настройки не содержат токенов, ключей,
файлов учётных данных или предположений о локальной инфраструктуре.

Адаптер использует уже настроенную аутентификацию CLI. Он не создаёт профили,
не читает файлы учётных данных, не экспортирует токены, не вызывает
`iam create-token` и не меняет настройки входа. `CheckAuthentication()` проверяет
доступ к выбранному каталогу. Ошибка может означать неверные учётные данные,
недостаток прав или недоступность инфраструктуры. Успех не подтверждает права
на все типы ресурсов.

Каждая облачная команда передаёт `--profile`, `--folder-id`, `--format json`,
`--no-browser` и `--retry 0`. `SubprocessCommandRunner` использует список
аргументов, `shell=False`, закрытый stdin и заданный таймаут. Создание адаптера,
чтение идентификаторов и списка возможностей не имеют побочных эффектов.
Проверка доступности запускает только `yc --version`.

CLI может находить ID во всех доступных каталогах. Поэтому адаптер проверяет
`folder_id` каждого ответа и отклоняет ссылку с другим провайдером или каталогом
ещё до поиска. Успешного завершения команды недостаточно для подтверждения
нужного каталога.

## Полнота результатов и ошибки

Адаптер явно ограничивает размер списка: по умолчанию 10 000 ресурсов каждого
типа. Ответ с числом элементов, равным пределу или превышающим его, отклоняется
как `INCOMPLETE_INVENTORY`. Это может отклонить и полный список, содержащий
ровно столько элементов. Чтобы устранить неоднозначность, увеличьте предел
в допустимом диапазоне. Позднее постраничное чтение может заменить это правило,
сохранив требование полноты результата.

Неверный JSON, неожиданная структура, неверные или повторяющиеся ID, ошибочные
адреса и неподтверждённый каталог приводят к отказу. Ошибка одного типа прерывает
`DiscoverInventory()` без частичного снимка. Список не является атомарным
снимком облака: между запросами ресурсы могут измениться.

`ProviderError` содержит постоянный `ProviderErrorCode`, название операции
и рекомендацию о повторе. Таймауты и ограничение частоты запросов допускают
повтор; автоматического повтора нет. Известные сообщения CLI сопоставляются
с категориями аутентификации, прав, отсутствия ресурса, таймаута, ограничения
частоты и конфликта. Остальные ненулевые коды дают `COMMAND_FAILED`.

Вывод stdout/stderr временно сохраняется для разбора JSON или определения
категории ошибки, но не включается в сообщения об ошибках. Цепочки исключений
подпроцесса и JSON скрываются. Представление `CommandResult` не показывает
stdout/stderr. Имена и метки ресурсов считаются публичными полями: владельцы
инфраструктуры не должны размещать в них секреты.

## Пример

```python
from flayer.providers.contracts import ResourceKind
from flayer.providers.yandex import YandexCloudProvider, YandexCloudSettings

provider = YandexCloudProvider(
    YandexCloudSettings(folder_id="example-folder", profile="example")
)

# These calls access the selected account; construction alone does not.
status = provider.CheckAuthentication()

if status.authenticated:
    instances = provider.ListResources(ResourceKind.INSTANCE)
```

Для тестов передайте `CommandRunner`, чей `Run(command, timeout)` возвращает
`CommandResult`. В unit-тестах используются тестовые идентификаторы и адреса для
документации. Тесты не запускают CLI, не читают учётные данные и не обращаются
к реальному облаку.

## Решения и проверка

[ADR 0002](../adr/0002-read-only-provider-boundary.md) описывает зависимости и
правила доступа. Адаптер переносит из A-VPN чтение Compute/VPC в выбранном
каталоге и сравнение меток принадлежности, отделяя их от профилей развёртывания
и операций изменения ресурсов.

Официальная документация:

- [Список виртуальных машин и общие параметры CLI](https://yandex.cloud/ru/docs/compute/cli-ref/instance/list)
- [Поиск ресурса по ID](https://yandex.cloud/ru/docs/compute/operations/vm-info/get-info)
- [Список дисков](https://yandex.cloud/ru/docs/cli/cli-ref/compute/cli-ref/disk/list)
- [Список групп безопасности](https://yandex.cloud/ru/docs/vpc/cli-ref/v0/security-group/list)
- [Список адресов](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/v0/address/list)
