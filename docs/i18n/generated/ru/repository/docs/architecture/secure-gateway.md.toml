# Профиль защищённого шлюза

Первый профиль `secure-gateway` готовит SSH-шлюз для выбранного образа Ubuntu
24.04 с cloud-init. Зашифрованный TCP-проброс разрешён только к заданным адресам.
Полноценную IP-VPN этот профиль не настраивает.

Пример хранится в [secure-gateway.toml](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/examples/secure-gateway.toml).
Перед развёртыванием замените идентификаторы, исходные CIDR и открытые
ключи из примера. Пример содержит адреса для документации, без реальной инфраструктуры.

## Правила и ограничения

| Граница            | Требование                                                                   |
| ------------------ | ---------------------------------------------------------------------------- |
| Формат профиля     | Версия 1; неизвестные поля и встроенные закрытые учётные данные запрещены.   |
| Размещение         | Явно заданы провайдер, каталог, владелец, зона и образ.                      |
| Подсеть            | Каноническая IPv4-подсеть RFC1918 с префиксом от `/16` до `/28`.             |
| Администрирование  | Открытый ключ администратора; 1–16 исходных CIDR от `/24` до `/32`.          |
| SSH-транспорт      | Отдельный пользователь без sudo; 1–8 точных TCP-адресов назначения.          |
| Устройства         | 1–16 устройств с разными открытыми ключами; всего не более 32 исходных CIDR. |
| Межсетевой экран   | Не более 63 входящих правил и одного явного правила исходящего IPv4.         |
| Ресурсы            | 2–32 ядра, 1–64 GiB RAM, отдельный загрузочный диск 10–256 GiB.              |
| Набор файлов       | 1–8 файлов, до 1 MiB каждый и 2 MiB суммарно.                                |
| Локальное хранение | Каталоги текущего POSIX-пользователя `0700`, обычные файлы `0600`.           |
| Замена и очистка   | Создание без перезаписи; проверка полной принадлежности и хешей.             |

Открытые ключи — канонические Ed25519 без комментариев. У администратора
и каждого устройства отдельный ключ. Закрытые ключи в формате профиля не
принимаются. CIDR должны быть каноническими; дубли и пересечения внутри
одного набора исходных адресов отклоняются.

В графе ресурсов сеть создаётся раньше подсети и группы безопасности.
ВМ зависит от подсети, группы безопасности, зарезервированного адреса и диска.
Для диска используется `auto-delete=false`, поэтому жизненный цикл управляет
его удалением отдельно.

## Подготовка

Подготовка выполняет только локальные файловые операции:

```python
from flayer.profiles import (
    BuildServerBundle,
    CompileGateway,
    LoadGatewayProfile,
    RenderPlan,
    WriteArtifactBundle,
)

profile = LoadGatewayProfile("gateway.toml")
server_directory = WriteArtifactBundle("generated-artifacts", BuildServerBundle(profile))
plan_text = RenderPlan(
    CompileGateway(profile),
    user_data_file=server_directory / "server-cloud-init.json",
)
```

Сохраняйте `plan_text` только в закрытом локальном хранилище. Абсолютный путь
к cloud-init нужен для запуска на этой машине и не является переносимой
конфигурацией репозитория. План читается обработчиком TOML жизненного цикла;
создание облачных ресурсов запускается отдельными командами. Вызовы выше
ничего не создают в облаке.

`server-cloud-init.json` начинается с `#cloud-config`, затем содержит JSON,
допустимый и как YAML. Создаются заблокированные для пароля пользователи
с входом по ключам, устанавливаются nftables и автоматические обновления,
записывается полная конфигурация SSH, запрещается пересылка пакетов.
Перед включением сервисов проверяется синтаксис SSH и межсетевого экрана.
Полная замена настроек SSH предназначена для новой гостевой системы, а не
для изменения произвольного существующего сервера.

Пользователь туннеля до начальной настройки должен отсутствовать. Если он уже
есть, поиск завершился ошибкой или создать его не удалось, работа останавливается
до включения сервисов. Выбираются конкретные файлы ключей администратора и
устройств, принадлежащие root; посторонние ключи образа или домашнего каталога
не добавляются. Пользователь туннеля получает свою основную группу, без sudo.
После отключения socket activation включается `ssh.service` для последующих
загрузок. Это однократная настройка новой системы: ручной повтор после создания
пользователя нарушает предусловие и завершается ошибкой.

`RenderPlan()` отклоняет чужие, изменённые и неполные наборы и привязывает
точный хеш начальной настройки к описанию ВМ. Провайдер повторно проверяет хеш
при отправке. Одного пути недостаточно, чтобы разрешить изменённое содержимое.

## Конфигурация устройства

Независимо получите и проверьте ключ сервера, затем сохраните его в выбранном
доверенном файле known_hosts. Закрытый ключ устройства передаётся ссылкой на
файл и должен соответствовать открытому ключу профиля. Генератор не читает
и не проверяет эти файлы и не принимает ключ сервера автоматически.

```python
from flayer.profiles import BuildSshDeviceBundle, WriteArtifactBundle

device_directory = WriteArtifactBundle(
    "generated-artifacts",
    BuildSshDeviceBundle(
        profile,
        "laptop",
        endpoint="203.0.113.42",
        identity_file="/path/to/laptop-key",
        known_hosts_file="/path/to/trusted-known-hosts",
        local_ports=(8443,),
    ),
)
```

Локальные порты соответствуют целям в порядке перечисления. Они должны быть
уникальны и находиться в диапазоне `1024..65535`; привязка всегда к IPv4 loopback.
В Windows пути клиентских файлов задаются абсолютно, например `C:/Keys/laptop-key`.

Запустите созданную конфигурацию в OpenSSH:

```bash
ssh -F generated-artifacts/device-laptop/ssh-client.conf -N laptop
```

Пример направляет `127.0.0.1:8443` через шлюз к `example.org:443`. Строка
удалённого назначения должна точно совпадать с `PermitOpen` сервера. Проброс
обеспечивает TCP-соединение, не меняя HTTP-имя хоста, TLS-имя, маршруты приложения
или маршрут ОС по умолчанию.

Клиент строго проверяет ключ сервера, использует аутентификацию открытым ключом,
одну попытку соединения, ограниченный таймаут и отказ при ошибке привязки порта.
Отключены agent, X11, shell, proxy command и local command.
`ExitOnForwardFailure` не подтверждает доступность конечного сервиса.
В описании записывается `prepared-unverified`, а не «развёрнуто» или «исправно».

`BuildDeviceBundle()` отдельно принимает чувствительные транспортные файлы,
выданные внешней системой. Их содержимое исключено из repr, манифеста, состояния
и отслеживаемой конфигурации. Функция не выпускает учётные данные и не проверяет
реализацию другого транспорта.

## Принадлежность и очистка

```python
from flayer.profiles import RemoveArtifactBundle

RemoveArtifactBundle(
    "generated-artifacts", profile.identity, kind="device", name="laptop"
)
RemoveArtifactBundle(
    "generated-artifacts", profile.identity, kind="server", name=profile.identity.stack
)
```

Перед очисткой проверяются весь манифест, точные идентификаторы развёртывания,
каждый хеш, ограничения прав доступа и полный состав каталога. Чужие или изменённые
файлы сохраняются. Символические и жёсткие ссылки не принимаются; рекурсивного
удаления каталогов нет. Удаление локальных файлов не уничтожает облачные ресурсы.

При очистке сохраняются проверенные inode и содержимое; они сверяются снова
перед каждым удалением, в том числе откатом и снятием блокировки. Чтение возвращает
проверенный неизменяемый снимок, а не перечитывает имя файла без привязки.
Обнаруженные подмены тем же пользователем или изменения содержимого сохраняются
для восстановления.

Закрытые каталоги и эксклюзивные блокировки рассчитаны на согласованно работающие
процессы. POSIX не даёт атомарного условного unlink по inode и содержимому:
процесс с тем же UID может вклиниться после последней проверки или обойти
блокировку. Это хранилище не защищает от активно враждебного процесса того же
пользователя или привилегированного администратора.

Существующие наборы не перезаписываются. Занятая блокировка сохраняется для
явного восстановления. При ошибке записи откатываются только собственные файлы;
ошибка файловой системы может оставить полный или частичный набор. Прерванное
удаление может оставить манифест и часть файлов; повторная автоматическая
очистка отклонит неполный набор. Храните серверные файлы, пока не завершатся
все использующие их операции развёртывания и восстановления.

## Проверки и оставшиеся ограничения

Тесты проверяют строгий формат и размеры, сериализацию графа ресурсов,
принадлежность файлов, различие открытых и закрытых ключей, коллизии,
символические и жёсткие ссылки, FIFO, изменение прав, проверку перед удалением
и ошибки частичного сохранения или очистки. Доступные инструменты OpenSSH
проверяют синтаксис клиента и сервера без сети. Действие `Match User` проверяется
через `sshd -T`, только если среда разработки позволяет его запустить.

Офлайн-проверки не подтверждают выполнение cloud-init, реальный вход по SSH,
получение ключа сервера, доступность цели или готовность системы.
Cloud-init и nftables не являются зависимостями среды выполнения F-Layer.
Статус провайдера остаётся сведением из облака. Для хранилища файлов не реализованы
Windows ACL; DNS-имя назначения разрешается на шлюзе во время соединения.
Разрешённое DNS-имя не гарантирует неизменную принадлежность IP-адреса.

Решение описано в [ADR 0007](../adr/0007-secure-gateway-profile.md).
'''
