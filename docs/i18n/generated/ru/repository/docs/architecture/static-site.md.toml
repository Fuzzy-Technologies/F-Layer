# Профиль статического сайта

Второй профиль, `static-site`, настраивает nginx для выдачи одной HTML-страницы
по HTTP на порту 80. Он принимает обычный текст ограниченного размера и
безопасно вставляет его в фиксированную разметку. Используются те же правила
принадлежности ресурсов и файлов, что у [защищённого шлюза](secure-gateway.md),
но результатом служит веб-страница без учётных записей устройств и SSH-транспорта.

Профиль явно выбирает размещение в Yandex Cloud и новую гостевую систему
`ubuntu-24.04-cloud-init`. Провайдер, каталог, владелец, зона и образ не
подставляются из окружения. Выбранный образ должен действительно поддерживать
эти требования; локальная проверка не проверяет его содержимое.
[Пример](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/examples/static-site.toml)
не содержит реальных параметров размещения или пригодных закрытых учётных данных.
Перед развёртыванием замените владельца, размещение, адреса доступа и открытый
ключ Ed25519 из примера.

## Правила и ограничения

| Граница               | Требование                                                                          |
| --------------------- | ----------------------------------------------------------------------------------- |
| Формат                | Версия 1, `static-site`; неизвестные поля и команды запрещены.                      |
| Размещение            | Явные идентификаторы Yandex, каталог, владелец, зона, образ и подсеть.              |
| Подсеть               | Каноническая IPv4-подсеть RFC1918 от `/16` до `/28`.                                |
| Администратор         | Имя не root и один канонический открытый ключ Ed25519.                              |
| Адреса администратора | 1–16 канонических IPv4 CIDR от `/24` до `/32`.                                      |
| Адреса HTTP           | 1–16 явных канонических IPv4 CIDR; `/0` допустим только для HTTP.                   |
| Уникальность адресов  | Дубли и пересечения внутри набора запрещены.                                        |
| Страница              | Непустой заголовок до 160 байт UTF-8; текст до 8192 байт UTF-8.                     |
| Управляющие символы   | Запрещены вместе с неверными значениями Unicode; в тексте допустимы переводы строк. |
| Ресурсы               | 2–32 ядра, 1–64 GiB RAM, отдельный загрузочный диск 10–256 GiB.                     |
| Межсетевой экран      | Не более 32 входящих правил и одного явного правила исходящего IPv4.                |
| Входной файл          | Обычный TOML UTF-8 до 32768 байт, без переходов пути и символических ссылок.        |
| Хранение файлов       | Существующие каталоги текущего POSIX-пользователя `0700` и файлы `0600`.            |

Все символы заголовка и текста экранируются для HTML, включая кавычки.
HTML, шаблонные конструкции и похожий на shell текст становятся текстом страницы.
Формат не позволяет задавать произвольный путь, HTML-шаблон, shell-команду,
директиву nginx, список пакетов, секрет, аккаунт устройства или VPN-маршрутизацию.
Используйте только предназначенный для публикации текст: его увидят разрешённые
HTTP-клиенты.

Публичный ключ содержит только `ssh-ed25519` и полный канонический публичный
блок, без комментариев и параметров ключа. Профиль не читает закрытый ключ
и не создаёт секретных файлов. Адреса HTTP и администратора могут пересекаться,
но доступ к HTTP не разрешает SSH на порту 22. Имена администратора `root`,
`www-data` и `nginx` запрещены; пользователь веб-сервера отделён от
привилегированного администратора.

## Локальная подготовка

После установки F-Layer подготовьте оба локальных набора файлов:

```bash
python -m flayer.profiles.static_site site.toml --artifact-root generated-artifacts
```

Команда выводит JSON со `status: prepared-unverified` и абсолютным `plan_file`.
Она работает только с локальными файлами и не создаёт объект провайдера.
Для имени развёртывания `site` результат такой:

| Набор              | Файл                          | Назначение                                                |
| ------------------ | ----------------------------- | --------------------------------------------------------- |
| `server-site`      | `static-site-cloud-init.json` | Точная начальная настройка гостевой системы без секретов. |
| `server-site-plan` | `deployment-plan.toml`        | План существующего механизма жизненного цикла.            |

Каждый каталог содержит `manifest.json` с принадлежностью и хешами.
Повторная подготовка завершается ошибкой, не перезаписывая существующие файлы.
Переходы пути и символические ссылки запрещены. План остаётся внутри выбранного
корня и ссылается на абсолютный путь cloud-init. Такая ссылка относится к
этой машине и не является переносимой конфигурацией репозитория.

Та же подготовка доступна через Python API:

```python
from flayer.core.lifecycle import LoadDeploymentPlan
from flayer.profiles.static_site import LoadStaticSiteProfile, PrepareStaticSite

profile = LoadStaticSiteProfile("site.toml")
prepared = PrepareStaticSite(profile, artifact_root="generated-artifacts")
plan = LoadDeploymentPlan(prepared.PlanFile)
```

`ParseStaticSiteProfile()`, `CompileStaticSite()`, `BuildStaticSiteBundle()`
и `RenderStaticSitePlan()` предоставляют отдельные этапы разбора, проверки,
генерации и формирования плана. Последний требует точного имени файла и
проверяет полный манифест, все хеши и совпадение байтов с подготовленным
профилем, затем привязывает SHA-256 к описанию ВМ.

## Использование существующего жизненного цикла

План содержит шесть существующих типов: сеть, подсеть, группу безопасности,
зарезервированный адрес, загрузочный диск и ВМ. Подсеть и группа безопасности
зависят от сети; ВМ — от подсети, группы, адреса и диска. Диск управляется
отдельно, с прежним `auto-delete=false`. Профиль не меняет восстановление,
поведение провайдера, облачные значения по умолчанию или формат состояния.

Готовый план принимает обычный CLI жизненного цикла. После выбора реального
размещения и настроенного профиля `yc` можно выполнить следующие команды;
подготовка сама их не запускает:

```bash
python -m flayer lifecycle create \
  --config generated-artifacts/server-site-plan/deployment-plan.toml \
  --state site-state.json --yc-profile YOUR_PROFILE \
  --allow-mutation --scope-confirm YOUR_FOLDER_ID

python -m flayer lifecycle status \
  --config generated-artifacts/server-site-plan/deployment-plan.toml \
  --state site-state.json --yc-profile YOUR_PROFILE

python -m flayer lifecycle destroy \
  --config generated-artifacts/server-site-plan/deployment-plan.toml \
  --state site-state.json --yc-profile YOUR_PROFILE \
  --allow-mutation --scope-confirm YOUR_FOLDER_ID
```

Храните оба набора, пока не завершатся развёртывание, удаление и требуемое
восстановление с этим планом. Адаптер Yandex повторно сверяет байты настройки
с хешем перед отправкой закрытой временной копии метаданных.
`RUNNING` означает состояние ресурса в облаке, но не подтверждает cloud-init,
вход по SSH, содержимое HTTP или готовность гостевой системы.

## Настройка новой гостевой системы

Начальная конфигурация содержит `#cloud-config` и JSON, который допустим как YAML.
Создаётся один администратор с отключённым паролем и правами sudo, устанавливаются
nginx, nftables и автоматические обновления, записываются фиксированные файлы
root. Полностью заменяются настройки SSH и nginx для новой системы. Это не
операция обновления произвольного существующего сервера.

SSH использует только `/etc/ssh/f-layer-static-admin-keys`, конкретный файл root.
Ключи из домашних каталогов и образа, команды получения ключей и SSH CA
не становятся дополнительными источниками доступа. `AllowUsers` ограничивает
единственного администратора его CIDR. Отключены вход root и по паролю,
проброс SSH, agent, Unix-сокетов и туннельных интерфейсов. HTTP отдельно
ограничивается облачной группой безопасности и входящим экраном гостевой ОС.
Пересылка пакетов запрещена, IPv6 отключён.

Nginx выдаёт только `/` и `/index.html` из фиксированного корня. Другие URL
возвращают 404; нет списка каталогов и исполнения динамического кода.
Страница и каталог принадлежат root. HTTP не шифруется; профиль не выпускает
TLS-сертификаты, не настраивает HTTPS и домены, не принимает загрузки и не
предоставляет динамический backend.

Фиксированный bootstrap работает с `set -eu`, выполняет `sshd -t`,
`nft --check --file` и `nginx -t` до своего явного включения сервисов,
отключает socket activation, включает постоянный `ssh.service` и nginx.
Менеджер пакетов может запустить сервисы при установке; эти проверки этого
не исключают. Профиль не создаёт маркер готовности и не объявляет успешное
выполнение гостевой настройки по локальному результату.

## Очистка и ошибки

Удаляйте набор плана и серверные файлы только после окончания их использования:

```python
from flayer.profiles.artifacts import RemoveArtifactBundle

RemoveArtifactBundle(
    "generated-artifacts", profile.identity,
    kind="server", name=profile.identity.stack + "-plan",
)
RemoveArtifactBundle(
    "generated-artifacts", profile.identity,
    kind="server", name=profile.identity.stack,
)
```

Очистка использует существующие проверки полного манифеста, идентификаторов,
ограничений прав доступа, состава файлов, хешей и сохранённых данных проверки.
Изменённые и чужие файлы сохраняются; ссылки, специальные файлы и конфликты
отклоняются. Рекурсивного удаления каталогов и удаления облачных ресурсов нет.

При ошибке подготовки плана очистка привязана к исходному серверному набору,
если на него ещё не ссылается точно проверенный сохранённый план. Под блокировкой
перед любым удалением хранилище проверяет ожидаемые файлы вызывающей стороны,
точные байты и метаданные манифеста. Корректная замена с тем же владельцем,
но другим содержимым сохраняется: одной принадлежности недостаточно.
Поздняя ошибка после сохранения плана оставляет проверенную пару для явного
восстановления. Обнаруженная подмена сервера сохраняется, отказ очистки сообщается.
Ошибка файловой системы может оставить часть файлов или блокировку; чужая
блокировка автоматически не удаляется. Это согласованная работа процессов
одного пользователя, а не изоляция от враждебного процесса с тем же UID или root.
Замена на побайтно одинаковое содержимое с теми же метаданными считается
эквивалентной; необязательная привязка содержимого не хранит историю inode.

## Проверки и оставшиеся ограничения

Детерминированные тесты используют настоящий парсер, ядро жизненного цикла
и адаптер Yandex с исполнителем CLI в памяти. Проверяются создание шести
ресурсов, статус, идемпотентность, удаление в обратном порядке зависимостей,
отказ по хешу до изменения ВМ, откат и очистка обоих наборов. Другие тесты
проверяют формат, пределы UTF-8, экранирование, структуру ключа, разделение
адресов доступа, приватные пути, конфликты сохранения и сохранение подмен.

Синтаксис shell и порядок bootstrap проверяются изолированными заглушками,
без изменения пользователей, файлов или сервисов хоста. OpenSSH разбирает
конфигурацию офлайн, если доступен. Проверка схемы cloud-init и тестовый режим
nginx необязательны для локальной разработки; недоступная проверка пропускается,
а не объявляется пройденной. Тест nginx перенаправляет записываемые пути и
слушающий адрес в свой временный каталог и Unix-сокет, поскольку тестовый режим
может открывать сокеты. Правила server/location и `default_server` сохраняются;
производственный порт HTTP 80 проверяется отдельным утверждением.
Привилегированный или публичный TCP-порт не открывается. Здесь не проверяются
реальное облако, установка гостевой ОС и nginx, перезапуск сервисов, выпуск
учётных данных, HTTP-соединение и фактическая готовность сервера.

Решение о расширяемости описано в [ADR 0013](../adr/0013-static-site-profile.md).
'''
