# Шлюз VLESS Reality

F-Layer готовит сервер Xray и отдельный профиль импорта для каждого устройства.
VLESS проверяет устройство по его собственному UUID. Reality шифрует соединение
с помощью серверного ключа X25519, выбранного имени TLS-сервера и короткого ID.
Профиль использует TCP и режим `xtls-rprx-vision`.

Это **прокси для приложений**. Созданный клиент Xray слушает
`127.0.0.1:10808`; приложения должны обращаться к этому SOCKS5-прокси. Сам по себе
импорт VLESS-ссылки в графический клиент не перенаправляет трафик операционной
системы. Для всего устройства включите режим VPN/TUN по инструкции клиента
и проверьте его настройки маршрутизации и DNS.

## Требования к серверу

Используйте Ubuntu 24.04 на amd64 или arm64. На ВМ нужны Python 3, systemd,
исходящий HTTPS-доступ к файлам релизов GitHub и доступ к выбранному узлу Reality.
F-Layer устанавливает официальный **стабильный релиз Xray 26.3.27** с отдельной
зафиксированной SHA-256-суммой для каждой архитектуры. Установщик не запускает
скачанный shell-скрипт, не использует контейнер без фиксированной версии и
не выбирает изменяемый релиз `latest`.

Облачная группа безопасности и межсетевой экран ВМ должны разрешать выбранный
TCP-порт для указанных сетей клиентов. Установщик VLESS не очищает правила
межсетевых экранов, не расширяет доступ по SSH и не меняет другие транспорты.

Задайте `target_host`, `target_port` и `server_name`. Нужен доступный сервер
TLS 1.3 с сертификатом, действительным для `server_name`; см.
[рекомендации Project X по выбору узла Reality](https://github.com/XTLS/REALITY#readme).
F-Layer проверяет формат этих настроек. Прежде чем менять службу на ВМ,
установщик проверяет доступ к узлу именно с этой ВМ: TLS 1.3-соединение с
проверкой сертификата должно согласовать HTTP/2. Если это не удалось,
установка останавливается с ошибкой предварительной проверки узла.
Повторите проверку при изменении узла или условий сети.

## Файлы с закрытыми данными

`GenerateVlessMaterial()` создаёт одну пару ключей X25519 и отдельный UUID
для каждого устройства. `EncodeVlessMaterial()` и `DecodeVlessMaterial()`
позволяют сохранить эти данные в закрытом наборе файлов контроллера ещё до
выдачи облаком IP-адреса. Используйте те же данные при подготовке клиентов
для фактического адреса сервера. Создание новых ключей и UUID на контроллере
не меняет настройки работающего сервера и не отключает старые клиенты.
Установщик отклоняет попытку заменить конфигурацию существующего развёртывания.
Этот процесс пока не поддерживает смену или отзыв учётных данных на сервере
через замену конфигурации.

`PrepareVless()` создаёт следующие файлы:

| Набор      | Файл              | Назначение                                                                |
| ---------- | ----------------- | ------------------------------------------------------------------------- |
| Сервер     | `server.json`     | Закрытый ключ Reality и разрешённые UUID устройств                        |
| Сервер     | `deployment.json` | Принадлежность, хеш конфигурации, порт и фиксированная версия             |
| Сервер     | `install.py`      | Установка в заданных границах, локальная проверка и удаление своих файлов |
| Устройство | `client.json`     | Настройки локального SOCKS-клиента для одного устройства                  |
| Устройство | `import.txt`      | Ссылка импорта VLESS Reality для одного устройства                        |

Все файлы помечены как содержащие закрытые данные и сохраняются через
существующий механизм записи приватных файлов. Набор устройства не содержит
закрытый ключ сервера и UUID других устройств. Сохранённые учётные данные
контроллера остаются на контроллере. Эти данные не попадают в описание
конфигурации, cloud-init, состояние облачных ресурсов, диагностику и журналы.

Установщик запускается через отдельно аутентифицированное SSH-соединение.
Команды: `sudo python3 install.py`, `sudo python3 install.py --check` и
`sudo python3 install.py --remove`; необходимые закрытые файлы находятся
рядом со скриптом. CLI проверяет ключ SSH-сервера перед передачей файлов.

## Маршрутизация и импорт в клиент

Созданный JSON клиента поддерживает два режима IPv4:

- `full`: отправлять через прокси запросы приложений ко всем IPv4-адресам;
- `split`: отправлять через прокси только запросы к указанным IPv4-сетям,
  а остальные отклонять. Прямое соединение в обход списка не устанавливается.

DNS-серверы задаются IPv4-адресами. Сервер и созданный клиент используют эти
серверы с `queryStrategy: UseIPv4`, в том числе при разрешении имён для выбора
маршрута. Поэтому наличие AAAA-записи у домена с рабочим IPv4 не приводит к его
блокировке правилом запрета IPv6. Для `split` адреса DNS-серверов должны входить
в разрешённые сети. Сервер блокирует частные, loopback, link-local, multicast и IPv6-адреса,
включая сеть облачных метаданных. Этот транспорт предназначен для доступа
в Интернет, а не во внутреннюю сеть облачной ВМ.

Первая версия не маршрутизирует IPv6. При проверке приватности всего устройства
отключите IPv6 в профиле VPN/TUN выбранного клиента или на самом устройстве.
Настройки SOCKS не могут заблокировать трафик приложений, которые обходят прокси.

Ссылка импорта содержит UUID устройства, адрес и порт сервера, открытый ключ
Reality, короткий ID, имя сервера, fingerprint, транспорт и flow. Стандартные
VLESS-ссылки **не содержат** полную политику маршрутов и DNS проекта. После импорта
в [v2rayN](https://github.com/2dust/v2rayN) или
[v2rayNG](https://github.com/2dust/v2rayNG) задайте эти параметры и выберите
системный прокси либо режим VPN. Созданный `client.json` сохраняет всю политику
F-Layer для работы Xray как прокси приложений.

Для локальной проверки клиента Xray выполните закреплённой версией программы
`xray run -test -config client.json`, затем `xray run -config client.json`.
Приложение может использовать `socks5h://127.0.0.1:10808`; буква `h` означает
разрешение имён на удалённой стороне. Проверьте HTTPS-запрос через этот прокси
и сравните видимый внешний адрес с адресом развёрнутого шлюза.

## Установка, обновление и удаление

Установщик управляет только `/opt/flayer/vless/<ownership-hash>` и соответствующей
службой `flayer-vless-<ownership-hash>.service`. Он:

1. проверяет точный хеш закрытых входных файлов и описание их принадлежности,
   затем проверяет сертификат узла, TLS 1.3 и поддержку HTTP/2;
2. проверяет закреплённую контрольную сумму архива до его просмотра;
3. извлекает только обычный исполняемый файл `xray`, без извлечения путей архива;
4. проверяет созданную конфигурацию этим исполняемым файлом;
5. устанавливает ограниченную службу systemd с динамическим непривилегированным
   пользователем; `LoadCredential` передаёт конфигурацию, доступную для чтения root;
6. проверяет синтаксис конфигурации, работу службы systemd и локальный TCP-порт.

Блокировка отдельного развёртывания запрещает параллельные операции. Повторное
применение неизменных данных проверяет работающую службу, не меняя учётные данные.
Иное содержимое конфигурации существующего развёртывания отклоняется до изменения
файлов или служб. Для ротации и отзыва учётных данных потребуется отдельное
разрешение с проверкой ожидаемой старой конфигурации; этот механизм ещё не
реализован. Незаметно заменить работающую конфигурацию нельзя. Если первая
установка завершается ошибкой, созданные этой попыткой файлы удаляются.

Принудительное завершение процесса или отключение питания при первой установке
может оставить неполную запись о её выполнении. Следующие операции в таком случае
останавливаются, а не пытаются угадать, какие файлы удалять или перезаписывать.
Проверьте файлы этого развёртывания и восстановите его исходный набор файлов
с ключами и настройками перед повторной попыткой; автоматического восстановления после такого прерывания
пока нет. Удаление отклоняет неизвестные файлы, символические ссылки, изменённые
учётные данные и чужие ресурсы. Пустые файлы блокировок сохраняются, чтобы избежать
гонки при смене inode блокировки.

## Проверки и подтверждение готовности релиза

Unit-тесты проверяют разделение учётных данных, поля импорта, split-маршрутизацию,
ошибочные настройки, хеши, опасные элементы архива, запрет неразрешённой замены,
очистку после неудачной установки, запрет ссылок для закрытых файлов и команды
установщика. Переменная `FLAYER_XRAY_BINARY` включает отдельный тест: созданные
конфигурации сервера и клиента проверяются настоящим Xray 26.3.27 с проверенной
контрольной суммой.
CI также проверяет настоящий маршрутизатор со статическими DNS-ответами и
локальными тестовыми обработчиками: публичные домены с A/AAAA и IPv4 проходят,
частные адреса, metadata и IPv6 блокируются. Эти тесты не проверяют соединение
Reality и внешние DNS-серверы.

Эти проверки подтверждают обработку конфигурации и поведение установщика.
Они не доказывают работоспособность внешнего VPN-соединения. Для приёмки релиза
по-прежнему нужны разрешённое развёртывание в облаке, подключение настоящего
клиента, проверка DNS и маршрутов и удаление созданного развёртывания.

