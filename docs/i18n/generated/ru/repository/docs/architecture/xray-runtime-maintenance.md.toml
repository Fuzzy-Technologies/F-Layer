body = '''# Обслуживание версии Xray

Для обслуживания существующего VLESS используйте установленный и проверенный
кандидат F-Layer. Публичный релиз не нужен: сохраните точный коммит кандидата,
SHA-256 wheel и доказательства CI/сборки. Не устанавливайте произвольное рабочее
дерево и не заменяйте бинарник вручную.

## Область действия и требования

Поддерживается переход **Xray с 26.9.30 на 26.10.31** на Ubuntu 24.04 amd64 или
arm64. Нужны существующий приватный проект, полное состояние принадлежащих ему
облачных ресурсов, ключ администратора и проверенный SSH-ключ сервера.
Контроллер сохраняет контракт POSIX-хранилища. Эти команды не запускают WSL,
VPN-клиент и не меняют локальную сеть контроллера.

Меняются только принадлежащие развёртыванию исполняемый файл Xray и запись его
состояния. Конфигурация, ключи Reality, UUID устройств, short ID, адрес, DNS,
маршруты, AWG, клиентские экспорты и идентификаторы облачных ресурсов сохраняются.
Существующий проект оставляет исходный дескриптор версии и манифесты артефактов.

Операции лишь читают облачные данные для проверки принадлежности и SSH-доверия;
они не создают, не меняют и не удаляют ресурсы. Используйте стабильное соединение
управления, независимое от обслуживаемого VLESS. Запланируйте короткий перерыв
VLESS и заранее сохраните порядок отката.

## Проверка текущей версии

```bash
flayer vpn runtime-status --project ~/flayer-vpn --format json
```

Отчёт содержит `version`, `receipt_sha256`, `binary_sha256`,
`previous_receipt_sha256`, `upgrade_status`, `kernel_release`,
`kernel_package_version` и `kernel_patch_status`. Версия относится к проверенной
записи состояния на диске; это не доказательство версии работающего процесса или
передачи трафика. `kernel_patch_status` остаётся `not-assessed`: поставщик может
перенести исправления без смены upstream-версии ядра.

`upgrade_status` принимает `none`, `rollback-available` или `interrupted`.
Прерванная транзакция даёт неполный отчёт, ненулевой код завершения и
`recovery_required: true`. До обновления сохраните полный старый `receipt_sha256`.
Пока транзакция существует, статус также возвращает его в
`previous_receipt_sha256`. Не вставляйте приватные конфигурации или профили
подключения в диагностику.

## Явное обновление

Проверьте точный кандидат, область доступа, старую версию, хеш записи,
управляющее соединение и порядок отката. Замените оба заполнителя своими
сохранёнными значениями:

```bash
flayer vpn upgrade --project ~/flayer-vpn \
  --allow-mutation --scope-confirm YOUR_FOLDER_ID \
  --expected-version 26.9.30 --expected-receipt-sha256 OLD_RECEIPT_SHA256 \
  --format json
```

До подключения к ВМ контроллер проверяет принадлежность сохранённых артефактов
и настройки проекта. До переключения версии сервер отклоняет несовпадения
разрешения, версии, записи состояния, приватной конфигурации и службы, посторонние
файлы и неполную установку. Сначала проверяются SHA-256 скачанного архива и
синтаксис кандидата на неизменённой конфигурации.

Полная приватная транзакция публикуется атомарно до остановки VLESS и содержит
точные старые и новые бинарники и записи состояния. После замены исполняемого
файла и записи запускается только эта служба VLESS; проверяются узел Reality,
синтаксис, активность и локальный порт. Прежняя версия сохраняется для явного
отката. Повтор успешно выполненной команды с исходным ожидаемым хешем проверяет
результат без перезапуска службы.

Обычный `deploy` не обновляет старую версию и не понижает уже обновлённую.
Распознанные старые проекты работают без перезаписи приватных наборов.
Произвольный или изменённый исторический установщик не принимается.

## Откат и восстановление

Для намеренного отката завершённого обновления возьмите **текущую новую запись
состояния** из `runtime-status`:

```bash
flayer vpn rollback-upgrade --project ~/flayer-vpn \
  --allow-mutation --scope-confirm YOUR_FOLDER_ID \
  --expected-version 26.10.31 --expected-receipt-sha256 NEW_RECEIPT_SHA256 \
  --format json
```

При ошибке обновление пытается автоматически восстановить прежнее состояние.
Если процесс принудительно завершён, SSH-соединение потеряно или восстановление
не удалось, проверьте `runtime-status`. Для **прерванной** транзакции используйте
**исходную старую запись состояния**:

```bash
flayer vpn recover-upgrade --project ~/flayer-vpn \
  --allow-mutation --scope-confirm YOUR_FOLDER_ID \
  --expected-version 26.9.30 --expected-receipt-sha256 OLD_RECEIPT_SHA256 \
  --format json
```

Восстановление возвращает точные сохранённые старые бинарник и запись состояния,
не предполагая работоспособность новой версии. До записи обе операции проверяют
текущие конфигурацию, службу, бинарник и каждый файл журнала. Неожиданное состояние
блокирует восстановление. Восстановите управление и проверьте известное приватное
развёртывание перед повтором; не редактируйте запись состояния для обхода проверки.

Обычная установка и удаление отклоняют прерванную транзакцию. Проверенная резервная
копия завершённого обновления входит в ограниченное удаление службы. Принудительное
завершение до публикации журнала или во время очистки отсоединённого каталога может
оставить неактивный приватный временный каталог. Неизвестные каталоги не удаляются
по предположению об их принадлежности.

## Ядро и приёмка

Xray 26.10.31 отключает MPTCP по умолчанию, уменьшая поверхность атаки для
CVE-2026-98432. Он **не исправляет ядро Linux**. Определите вариант работающего
ядра и установленный пакет, затем сверьтесь с актуальными
[данными Ubuntu](https://ubuntu.com/security/CVE-2026-98432) и
[релизом безопасности Xray](https://github.com/XTLS/Xray-core/releases/tag/v26.10.31).
Не определяйте наличие исправления по одной строке версии и не запускайте
безусловное обновление дистрибутива, скопированное правило межсетевого экрана
или перезагрузку. Если исправленный пакет доступен, подготовьте явно разрешённое
окно обслуживания с откатом и проверкой после перезагрузки. Перезагрузка ядра
прерывает оба протокола VPN.

После обслуживания вручную проверьте оба протокола с существующими профилями:
HTTPS по имени и IPv4, DNS, выходной адрес, Telegram, переподключение и реальное
воспроизведение медиа. Запишите точные версии клиента, кандидата и использованную
сеть. Проверка схемы импорта AmneziaVPN 5.1.0.6 и тесты синтаксиса/транзакции
с закреплёнными бинарниками в CI не доказывают трафик на Android или десктопе.
Приёмка YouTube/Shorts остаётся отдельной от базовой связности.
'''
