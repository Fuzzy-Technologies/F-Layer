# Адаптер жизненного цикла Yandex

`YandexLifecycleProvider` добавляет к адаптеру чтения Yandex строго ограниченные
операции изменения. Создание объекта, определение возможностей и `ValidateSpec`
работают без сети. Тесты подменяют команды предсказуемыми ответами и не выполняют
реальных облачных операций.

## Запросы и возможности

`ResourceSpec` содержит неизменяемый логический ID, тип ресурса, имя, именованные
параметры и логические зависимости. Для вложенных значений ограничены глубина,
размер и диапазон целых чисел со знаком до 64 бит. Параметры скрыты в строковом
представлении запроса.

Адаптер для создания и удаления ресурсов объявляет `create_resource` и `delete_resource` в дополнение
к списку и поиску. Это реализованные возможности, а не права текущего аккаунта.
Исходный `YandexCloudProvider` по-прежнему объявляет только чтение.

| Тип                 | Обязательные параметры                                                                                                                             | Необязательные параметры                             | Зависимости по типам                       |
| ------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------- | ---------------------------------------------------- | ------------------------------------------ |
| Сеть                | Нет                                                                                                                                                | Нет                                                  | Нет                                        |
| Подсеть             | `zone_id`, `ipv4_cidr`, `network_dependency`                                                                                                       | Нет                                                  | Сеть                                       |
| Группа безопасности | `network_dependency`, `rules`                                                                                                                      | Нет                                                  | Сеть                                       |
| Адрес               | `zone_id`                                                                                                                                          | Нет                                                  | Нет                                        |
| Диск                | `zone_id`, `image_id`, `size_gib`                                                                                                                  | `type`: `network-ssd` или `network-hdd`              | Нет                                        |
| Виртуальная машина  | `zone_id`, `cores`, `memory_gib`, `boot_disk_dependency`, `subnet_dependency`, `security_group_dependency`, `address_dependency`, `ssh_public_key` | `ssh_username`, `user_data_file`, `user_data_sha256` | Диск, подсеть, группа безопасности и адрес |

`dependencies` должен точно совпадать с набором логических ID, указанных в
параметрах зависимостей. Перед созданием каждая зависимость перечитывается по ID
провайдера; проверяются тип, каталог, принадлежность и при необходимости зона.
Выделенный адрес должен содержать ровно один публичный IPv4 до создания ВМ.

Допустимы 2–32 ядра, 1–128 GiB памяти и 10–1024 GiB загрузочного диска. Группы
безопасности принимают 1–64 уникальных IPv4-правила с направлением ingress/egress,
протоколом TCP/UDP/any, точной записью CIDR и корректными диапазонами TCP/UDP-портов.
Произвольные описания, параметры провайдера и IPv6-правила здесь не поддерживаются.

Открытый SSH-ключ должен иметь корректную структуру OpenSSH Ed25519 или RSA.
Размер модуля RSA — 2048–16384 бит. Необязательный комментарий не передаётся
в метаданные CLI. Закрытый ключ не принимается ни в одном параметре.

## Принадлежность и восстановление

Адаптер добавляет метки `managed-by`, `flayer-project`, `flayer-stack`,
`flayer-owner`, `flayer-resource`, `flayer-spec`, `flayer-operation`.
Стабильный хеш описания ресурса — 40-символьная метка на основе SHA256.
ID операции — случайный 32-символьный шестнадцатеричный идентификатор
в нижнем регистре из журнала ядра.

`FindResource` проверяет полную принадлежность развёртыванию и логический ID.
Несколько совпадений приводят к отказу. Другой хеш настроек, имя или запрошенная
зона конфликтуют с созданием: изменившаяся конфигурация не обновляется и не
принимается молча. ID операции сохраняется в метках, чтобы ядро отличало новый
ресурс от ранее существовавшего или созданного параллельно.

`CreateResource` выполняет не более одной команды создания после проверки и
поиска. Каждая команда явно передаёт каталог и профиль, выбирает JSON,
запрещает браузерную аутентификацию, задаёт `--retry 0` и запускается без
оболочки с таймаутом. Успешный ответ должен совпадать по каталогу,
принадлежности, операции, имени и зоне.

Любая ошибка после отправки запроса оставляет результат неопределённым:
это касается таймаута, неверного успешного ответа и ошибки транспорта.
Одно отсутствие в списке после таймаута не разрешает новое создание.
Сохраняемый журнал ядра управляет восстановлением и не допускает слепого
повторного создания ресурса с неизвестным состоянием.

Ошибки предварительного чтения обозначаются как «запрос не отправлен», поэтому
ядро может безопасно откатить более ранние создания. При неопределённой ошибке
изменения рекомендация `retryable` принудительно равна false; сама категория
таймаута не разрешает повторять запрос вслепую.

`DeleteResource` перечитывает точный сохранённый ID и проверяет все метки
принадлежности и логический ID. Для отката дополнительно передаётся ID операции;
адаптер повторно сверяет его непосредственно перед удалением. Отсутствующий
ресурс уже считается удалённым. После отправки удаления один поиск должен
подтвердить отсутствие, иначе очистка остаётся неопределённой. Одного имени
для разрешения удаления недостаточно.

Загрузочный диск — отдельный ресурс. ВМ создаётся с уже существующим диском
своего развёртывания и `auto-delete=false`. Ядро сначала удаляет ВМ, затем диск,
что позволяет обнаружить частичное выделение и продолжить прерванную очистку.

## Файл начальной настройки без секретов

`user_data_file` и `user_data_sha256` задаются вместе. Файл должен быть обычным,
без символических ссылок в нём и родительских каталогах, без переходов `..`,
с совпадающим SHA256 и размером до 256 KiB. В POSIX он должен принадлежать
текущему пользователю и запрещать доступ группе и остальным. Необычные типы
файлов отклоняются до открытия, поэтому FIFO не может подвесить подготовку.

Допустим JSON-объект с необязательным префиксом `#cloud-config` и переводом
строки. Верхние поля ограничены `ssh_pwauth`, `disable_root`, `users`,
`package_update`, `package_upgrade`, `packages`, `write_files`, `runcmd`.
За содержимое и настройки безопасности отвечает профиль развёртывания.
Вызывающая сторона обязана исключить секреты: адаптер не распознаёт секреты,
спрятанные в произвольных строках скрипта.

Адаптер читает неизменяемый снимок ограниченного размера, проверяет хеш до
обращения к облаку и создаёт закрытую временную копию для
`--metadata-from-file user-data=...`. CLI получает эту копию; содержимое не
попадает в состояние, журналы и очищенные ошибки. Ошибка временной подготовки
означает, что запрос точно не отправлялся. Ошибка очистки после отправки
сохраняет неопределённость результата в облаке.

## Состояние и ограничения

Нормализованный ответ содержит только поля публичного интерфейса ресурса,
включая известный статус провайдера и проверенное имя. Зона статического
адреса читается из `external_ipv4_address.zone_id`.

Наличие ВМ не подтверждает готовность. Cloud-init внутри может ещё работать
или завершиться с ошибкой; сервис и туннель нужно проверять отдельно.
Реальные права аккаунта Yandex, текущее поведение CLI и настройка гостевой
системы остаются непроверенными до отдельно разрешённого испытания в изолированном облаке.

Облако не предоставляет атомарного сравнения меток и удаления. Локальная
блокировка и ID операции уменьшают риск параллельного отката, но посторонние
процессы, имеющие право менять метки, находятся вне этой модели транзакции.

## Официальная документация CLI

Соответствие команд официальной документации Yandex проверено при реализации
2026-10-04:

- Сеть: [создание](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/network/create) и [удаление](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/network/delete)
- Подсеть: [создание](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/subnet/create) и [удаление](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/subnet/delete)
- Группа безопасности: [создание](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/security-group/create) и [удаление](https://yandex.cloud/ru/docs/vpc/cli-ref/security-group/delete)
- Адрес: [создание](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/address/create) и [удаление](https://yandex.cloud/ru/docs/cli/cli-ref/vpc/cli-ref/address/delete)
- Диск: [создание](https://yandex.cloud/ru/docs/cli/cli-ref/compute/cli-ref/disk/create) и [удаление](https://yandex.cloud/ru/docs/cli/cli-ref/compute/cli-ref/disk/delete)
- ВМ: [создание](https://yandex.cloud/ru/docs/cli/cli-ref/compute/cli-ref/instance/create) и [удаление](https://yandex.cloud/ru/docs/cli/cli-ref/compute/cli-ref/instance/delete)

Решение об операциях изменения и отдельном управлении загрузочным диском
описано в [ADR 0006](../adr/0006-yandex-lifecycle.md).
'''
