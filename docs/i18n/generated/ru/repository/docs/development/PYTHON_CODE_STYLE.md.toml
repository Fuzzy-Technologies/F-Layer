body = '''
# Стиль кода Python

Эти правила действуют для всех Python-файлов в инженерных репозиториях Fuzzy Technologies, включая рабочий код, тесты, скрипты и встроенные фрагменты Python в тестовых данных.

## Язык

- Код Python, идентификаторы, docstrings, комментарии, сообщения проверок и встроенные исходные фрагменты пишутся только на английском.
- Локализованные материалы сайта не подпадают под это правило для Python.
- Комментарии поясняют причины, инварианты, ограничения и архитектурные решения, а не пересказывают очевидные действия кода.

## Имена

Для собственных идентификаторов проекта используйте:

- функции и методы: `PascalCase`, включая `Main()`;
- классы, протоколы и перечисления: `PascalCase`;
- переменные, параметры и поля: `snake_case`; для внутренних деталей допустимо начальное подчёркивание;
- константы: `UPPER_SNAKE_CASE`, слова разделяются подчёркиванием;
- файлы тестов: `test_*.py`;
- тестовые функции: обязательный префикс `test_`, затем `PascalCase`.

Сохраняйте имена, заданные Python, фреймворками, SDK, схемами, протоколами и сторонними API. Это относится к специальным методам Python, фикстурам и хукам pytest, обработчикам обратного вызова, параметрам CLI, ключам конфигурации и требованиям совместимости.

## Docstrings

- У каждого модуля, класса, функции и метода рабочего кода и тестов должна быть краткая англоязычная строка документации.
- Docstring располагается первым выражением в своей области видимости.
- Между docstring функции или метода и реализацией оставляйте одну пустую строку.

## Пустые строки

Разделяйте логические этапы внутри функции или метода одной пустой строкой.

Добавляйте пустую строку перед новым этапом управления потоком, перед последующими `return`/`raise`/`yield`, после завершённого вложенного блока, перед `elif`/`else`/`except`/`finally`, между методами класса и перед проверкой запуска модуля как программы.

Не ставьте пустую строку сразу после заголовка `def`, `class`, `try`, `if`, `elif`, `else`, `except`, `finally`, `for`, `while`, `with`, `match` или `case`.

Сохраняйте рядом тесно связанные присваивания и вызовы. Между функциями и классами уровня модуля оставляйте две пустые строки.

## Форматирование и статический анализ

`ruff format` не является стандартным форматтером проекта; нельзя использовать его для автоматической переработки всего репозитория или как проверку CI.

Для проверки кода и статического анализа используйте Ruff:

```bash
python -m ruff check .
```

Изменения, посвящённые только форматированию, не должны переименовывать защищённые интерфейсы, менять поведение или объединять логические блоки.

## Проверки

Обычный набор проверок репозитория:

```bash
python -m compileall -q src tests
python -m ruff check .
python -m mypy
python -m pytest
```

Для инфраструктуры, очистки, отката, авторизации, управления ресурсами и обработки ошибок нужны воспроизводимые тесты без обращения к реальной рабочей инфраструктуре.

## Проверки условий и тесты

- Сообщение проверки должно указывать нарушенный инвариант и вероятную причину.
- Для кода со множеством ветвлений измеряйте покрытие ветвей.
- Не скрывайте нестабильные тесты автоматическими повторами.
- Тесты не должны зависеть от порядка запуска и общего изменяемого состояния, кроме явно изолированных случаев.

## Git

Сообщения коммитов — краткие, на английском, в повелительном наклонении.

## Итоговый принцип

Код должен быть единообразным, читаемым, воспроизводимым и проверяемым: явное поведение важнее скрытой магии, доказательства — предположений, тесты — субъективной уверенности, а стабильность — косметического рефакторинга.
