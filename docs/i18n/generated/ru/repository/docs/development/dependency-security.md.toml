# Безопасность зависимостей документации

Версии инструментов сборки документации зафиксированы в `docs/requirements-api.txt`. Эти зависимости нужны для разработки и сборки; исполняемый пакет `f-layer` не требует сторонних библиотек и по-прежнему собирается проверенной версией Hatchling.

## Устранение уязвимости setuptools

[Задача #54](https://github.com/Fuzzy-Technologies/F-Layer/issues/54) отслеживает [предупреждение Dependabot #1](https://github.com/Fuzzy-Technologies/F-Layer/security/dependabot/1) об уязвимости [GHSA-h35f-9h28-mq5c / CVE-2026-59890](https://github.com/advisories/GHSA-h35f-9h28-mq5c). Исправление для release-1.2 заменяет зафиксированную версию setuptools `80.9.0` на исправленную `83.0.0`, сохраняя остальные версии инструментов документации.

Уязвимость связана с совпадениями после нормализации Unicode при обработке исключений `MANIFEST.in` в setuptools на файловых системах macOS APFS/HFS+. Из-за неё файлы, которые должны быть исключены, могут попасть в архив исходников. Собственные пакеты F-Layer собираются Hatchling и проходят явную сверку с отслеживаемыми исходниками. Предупреждение указывает на уязвимую зависимость инструментов документации; оно не свидетельствует об утечке частных данных из архива F-Layer.

## Проверки и действия при выпуске

Установите зафиксированные зависимости документации во временное окружение и проверьте их совместимость и импорт модулей. Локально выполняются целевые проверки; CI pull request собирает документацию EN/RU/ZH-CN из установленного wheel в строгом режиме и проверяет релизные пакеты с теми же зафиксированными инструментами.

Исправление попадает в `develop` через PR соответствующей задачи. Dependabot проверяет основную ветку, поэтому предупреждение может оставаться открытым, пока релизная `master` содержит прежнюю версию. После переноса изменений release-1.2 в `master` повторно проверьте граф зависимостей основной ветки и статус предупреждения. Не закрывайте его вручную как исправленное, пока исправленная зависимость не появилась в этой ветке.

Опубликованные теги 1.0.0 и 1.1.0 сохраняют историческое состояние. Результаты проверки исправления относятся к новому коммиту и релизу; прежние пакеты не переписываются.
'''
