# Python-пакет и установка

F-Layer распространяется как Python-пакет `f-layer`. Он устанавливает команду `flayer` и одноимённый импортируемый пакет. Пользователи устанавливают wheel; клонирование репозитория нужно только для работы над кодом. Для установки release-2.0 образ контроллера Docker не требуется.

## Установка опубликованного релиза

Используйте Python 3.11 или новее. Для работы с облачным шлюзом запускайте контроллер в Linux или WSL: созданным закрытым файлам нужны права POSIX. CLI провайдера и VPN-клиент — отдельные приложения; их установка описана в руководстве пользователя. Установка Python-пакета не настраивает облачный аккаунт.

Существующие [релизы GitHub](https://github.com/Fuzzy-Technologies/F-Layer/releases) содержат wheel. Например, следующая команда устанавливает опубликованный CLI **1.2.1** через pipx:

```bash
pipx install https://github.com/Fuzzy-Technologies/F-Layer/releases/download/v1.2.1/f_layer-1.2.1-py3-none-any.whl
flayer --help
flayer check
```

Если [pipx](https://pipx.pypa.io/latest/how-to/install-pipx.html) ещё не установлен, сначала установите его. Выполните `pipx ensurepath` и откройте терминал заново, если команда `flayer` не найдена. pipx создаёт отдельное окружение для команды.

Для приложения или окружения без pipx установите тот же wheel через pip внутри виртуального окружения:

```bash
python3 -m venv .venv
. .venv/bin/activate
python -m pip install https://github.com/Fuzzy-Technologies/F-Layer/releases/download/v1.2.1/f_layer-1.2.1-py3-none-any.whl
python -m flayer check
```

Версия 1.2.1 не включает VPN-сценарий release-2.0. Скачивайте wheel нужной версии; не переименовывайте предварительный wheel, выдавая его за релизный.

## Установка дополнения VPN в релизе 2.0

Пакет release-2.0 добавляет набор зависимостей `vpn` для локального создания ключей. Он устанавливает `cryptography==50.0.2`; основному пакету по-прежнему не нужны обязательные сторонние библиотеки во время работы. Та же зависимость включена в набор разработки, чтобы тесты VPN выполнялись в обычном окружении разработчика.

После публикации официального wheel 2.0.0 обычная установка для шлюза выглядит так:

```bash
pipx install 'f-layer[vpn] @ https://github.com/Fuzzy-Technologies/F-Layer/releases/download/v2.0.0/f_layer-2.0.0-py3-none-any.whl'
flayer check
```

Для скачанного релиза или предварительного wheel CI используйте его фактическое имя:

```bash
python -m pip install './f_layer-2.0.0-py3-none-any.whl[vpn]'
```

Последнюю команду запускайте в виртуальном окружении. Разрешение зависимостей загружает библиотеки дополнения из настроенного индекса Python, а сам wheel F-Layer берётся из явно указанного локального файла или URL GitHub. Wheel не содержит SSH-ключей, учётных данных VPN и конфигурации проекта.

После проверки прав на проект и публикации в PyPI тот же пакет можно установить по имени:

```bash
pipx install 'f-layer[vpn]==2.0.0'
```

Эта команда описывает целевой способ распространения. Она не подтверждает, что имя уже зарезервировано или версия 2.0.0 доступна в PyPI. До публикации используйте точный wheel из официального GitHub Release.

## Источник версии

Явное значение `__version__` задаётся в `src/flayer/__init__.py`. Источник версии Hatchling с регулярным выражением читает его без импорта пакета. Метаданные wheel, архива исходников и установленный исполняемый код используют одну версию. Зависимость VPN загружается VPN-кодом; установка и импорт ядра не включают её автоматически.

Стабильные релизы используют `X.Y.Z` и неизменяемый аннотированный тег `vX.Y.Z`, как описано в [процессе выпуска](../RELEASE_WORKFLOW.md). Версию повышают в прошедшей ревью релизной ветке. Слияние разработки не публикует пакет.

## Сборка и проверка установки

Из окружения разработки, установленного командой `python -m pip install -e '.[dev]'`:

```bash
python -m hatchling build --directory _build/distribution
python -m pytest tests/integration/test_distribution.py --no-cov
```

Wheel содержит типизированный пакет `flayer`, метаданные лицензии Apache-2.0 и консольную точку входа. Архив исходников включает код, тесты, инструменты, документацию, changelog и примеры, необходимые для повторной сборки. Локальные окружения, частное состояние и созданные отчёты исключены. Результаты сборки не отслеживаются Git.

Тесты установки собирают оба формата, повторно собирают wheel из архива исходников и сравнивают байты. Они устанавливают wheel в новое виртуальное окружение, запускают команду вне рабочей копии исходников, сравнивают поведение модуля и консоли, выполняют локальную диагностику и проверяют зависимости. При установке ядра также проверяется, что необязательная библиотека cryptography не была установлена.

Релизный CI выполняет эти тесты на **тех самых проверенных файлах**, которые затем загружаются. Сначала он получает wheel зависимостей VPN, затем без сети устанавливает wheel F-Layer с дополнением `vpn` во второе чистое окружение. Проверка VPN создаёт ключи X25519 и RSA в памяти и проверяет согласованность зависимостей. Она никогда не обращается к облачному провайдеру. Повторить эту целевую проверку можно так:

```bash
python -m pip download --only-binary=:all: --dest _build/vpn-wheels './_build/distribution/f_layer-1.2.1-py3-none-any.whl[vpn]'
FLAYER_DISTRIBUTION_DIRECTORY=_build/distribution \
FLAYER_DISTRIBUTION_WHEELHOUSE=_build/vpn-wheels \
python -m pytest tests/integration/test_distribution.py --no-cov
```

Используйте фактическую версию локально собранного wheel. Предварительная сборка ветки сохраняет текущую версию исходников до стабилизации релиза. Полные регрессионные проверки, документация и пакеты проверяются в CI. Если каталог wheel не указан явно, тесты собирают новые пакеты. Если каталог wheel зависимостей отсутствует, тест установки VPN сообщает о пропуске, а не утверждает, что этот сценарий проверен.

## Настройка и публикация в PyPI

Отслеживаемый workflow — `.github/workflows/release-publish.yml`. Он использует PyPI Trusted Publishing и GitHub OIDC без постоянного токена загрузки. Наличие workflow само по себе не даёт прав на проект PyPI.

Перед первой рабочей загрузкой владелец выполняет настройку:

1. Войдите в нужный аккаунт PyPI и проверьте его права на `f-layer`. Если проекта ещё нет, настройте ожидающий создания проекта Trusted Publisher с этим именем. Такой publisher не резервирует имя.
2. Укажите владельца GitHub `Fuzzy-Technologies`, репозиторий `F-Layer` и файл workflow `release-publish.yml`. Текущее задание загрузки не использует окружение GitHub, поэтому оставьте это необязательное поле publisher пустым.
3. Задайте переменной репозитория `FLAYER_RELEASE_OWNER` точный логин GitHub уполномоченного владельца. Устанавливайте `FLAYER_PYPI_ENABLED=true` только после проверки publisher.
4. Завершите и закройте штатный майлстоун релиза без открытых пунктов. Проведите ревью, слейте релиз в `master` и создайте аннотированный тег версии.
5. Запустите **Publish an owner-approved PyPI release** из `master` с этим тегом, штатным номером майлстоуна и включённым подтверждением публикации.
6. Проверьте результат загрузки и убедитесь, что URL проекта и версия в PyPI относятся к этому репозиторию. Установите опубликованную версию в чистое окружение и выполните `flayer check`, прежде чем объявлять установку по имени пакета доступной.

Проверка требует настроенного владельца, явного подтверждения, точного совпадения тега с `master` и завершённого соответствующего майлстоуна. Задание загрузки получает только файлы, прошедшие аудит и проверку изолированной установки. Только этому заданию выдаётся OIDC-разрешение. Обычный PR и push тега ничего не публикуют в PyPI.

Фактические права на аккаунт, настройка publisher, первая загрузка и установка после неё — операционные этапы приёмки релиза. Они остаются непроверенными до изучения реальных результатов.

