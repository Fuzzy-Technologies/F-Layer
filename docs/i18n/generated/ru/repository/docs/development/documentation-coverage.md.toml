body = '''
# Требования к полноте документации

Полнота документации означает, что для каждого отслеживаемого файла определён способ представления, а не то, что каждый файл становится страницей пользовательского API. Генерируемый [реестр репозитория](https://fuzzy-technologies.github.io/F-Layer/en/coverage/) содержит каждый файл, его страницу или ссылку на исходник и объяснение выбранного способа. Машиночитаемая версия — `_build/api-reference/repository-coverage.json`.

Документация репозитория содержит поддерживаемые пользовательские руководства, архитектурные контракты, ADR, описания релизов и инструкции по разработке. Разовые расследования, заметки сессий, отчёты аудита, сводки ревью, сырые логи и квитанции тестовых прогонов хранятся в задачах и PR GitHub, артефактах CI или приватных записях; они не входят в отслеживаемые исходники релиза и опубликованные страницы. Допустимые категории отчётов — воспроизводимые измерения производительности и явные проверки соответствия ADR. Метаданные ревью переводов остаются входом сборки; текстовые снимки ревью не являются документацией.

## Учёт файлов

`docs/site/repository-coverage.toml` задаёт правила `fnmatch` относительно корня репозитория. Каждый отслеживаемый Git файл должен соответствовать ровно одному правилу с непустым обоснованием. Неизвестный тип файла, пересекающиеся правила, отсутствующий отслеживаемый файл и некорректное правило приводят к ошибке проверки. Неотслеживаемые файлы пакета и основного сайта не могут попасть в сборку. Шаблоны намеренно охватывают будущие файлы установленных категорий, не фиксируя число модулей и файлов. Для новой категории требуется явное решение в манифесте, а не незаметное исключение.

| Категория файлов                       | Представление в документации                                                                                            |
| -------------------------------------- | ----------------------------------------------------------------------------------------------------------------------- |
| Публичный Python-код пакета            | Страница API установленного wheel и точные якоря публичных определений.                                                 |
| `flayer.__main__`                      | Явная публичная исполняемая точка входа, несмотря на подчёркивания в имени.                                             |
| Приватный Python-код пакета            | Только исходная реализация; перечисляется с явным обоснованием.                                                         |
| Основной Markdown                      | Отображаемые страницы с навигацией, включая шаблоны ADR, правила, релизные руководства и шаблон PR GitHub.              |
| Локализованный Markdown                | Отображается языковым сборщиком с явным состоянием draft/stale/missing/approved; не считается одобренным автоматически. |
| Тесты и инженерные инструменты         | Исполняемые проверки и команды в виде исходников, а не пользовательские API.                                            |
| Примеры                                | Исходные данные, на которые ссылается руководство; не Python API.                                                       |
| Workflows и формы задач                | Конфигурация автоматизации и организации работы в виде исходников.                                                      |
| Ресурсы сайта и метаданные локализации | Ресурсы сайта или входные данные валидатора; не страницы API.                                                           |
| Упаковка, маркер типов, лицензия       | Требования к исходникам и распространению; не страницы API.                                                             |

Основные написанные маршруты сохраняются. Другой Markdown репозитория получает маршрут `en/repository/<repository-path>/`. Скрытый исходный каталог `.github/` отображается как `repository/github/`, чтобы MkDocs включал шаблон PR. Генерируемые копии преобразуют Markdown-ссылки в ссылки на страницы, а ссылки на прочие файлы — в точные исходники `develop`.
Сборщик никогда не переписывает файлы правил под управлением владельца.

## Установленный пакет и границы API

Wheel устанавливается в новый управляемый каталог, а не в окружение инструментов документации; другие установки F-Layer не влияют на результат. Обнаружение читает синтаксис установленных Python-файлов и никогда не импортирует F-Layer.
Каждый файл пакета, включая приватные модули, `__main__.py`, `py.typed` и будущие ресурсы пакета, должен совпадать с перечнем и байтами исходников. Кэши байткода интерпретатора исключаются. Недостающие или лишние файлы wheel приводят к ошибке до отображения страниц.

Каждый неприватный модуль и явно включённый модуль CLI получают страницу API. Для определённых публичных классов, функций и методов обязательны docstrings и точные якоря на странице. Вызываемые методы протоколов (`__call__`) включаются. Определения внутри условных блоков и других конструкций управления потоком сохраняют область своего модуля или класса и учитываются без выполнения кода. Приватные вспомогательные функции, другие специальные методы и вложенные функции перечисляются как доступные только в исходниках. Конструкторы представлены сигнатурой класса и исходным кодом; их docstrings включаются в ревью перевода, если рендерер объединяет их с документацией класса. Хуки dataclass считаются методами реализации. Импортированные псевдонимы, константы, поля и унаследованные методы представлены в определяющем их модуле или классе; проверка не требует повторных якорей и не выдаёт тесты за публичный API.

Новый публичный модуль обнаруживается автоматически. Новый приватный модуль учитывается и проверяется на соответствие wheel. Для поддержки модуля с начальным подчёркиванием, кроме уже предусмотренного CLI, нужно отдельное решение о границе API.

## Проверки сайта и подтверждающие результаты

Выравнивание таблиц использует ограниченное приближение ширины исходных Markdown-ячеек: широкие и полноширинные символы считаются за два, комбинируемые знаки — за ноль, остальные — за один. Байты содержимого ячеек и экранирование Markdown сохраняются; полного соответствия ширине графем и эмодзи в терминале не предполагается.

Проверка исходников охватывает все отслеживаемые Markdown-ссылки, выравнивание таблиц, классификацию файлов и правила для результатов генерации. Строгая сборка из установленного wheel проверяет все локальные URL и точные фрагменты, обязательные якоря API, ссылки на исходники и обход графа ссылок от английской главной страницы. Каждая учтённая страница Markdown или API и сам реестр должны существовать и быть достижимы. Поэтому страница, на которую нельзя попасть по навигации, приводит к ошибке, даже если файл существует.

```bash
python -m tools.documentation_coverage
python -m tools.documentation_gates
python -m tools.build_api_reference
python tools/validate.py
```

Эти проверки подтверждают структурную полноту и происхождение данных. Они не доказывают, что текст объясняет всё поведение, что docstrings верны по смыслу или что перевод прошёл ревью человеком. Такое одобрение не генерируется.

## Полнота переводов

Страницы репозитория, введения модулей, описания публичного API, отображаемые описания конструкторов и текст реестров получают обнаруживаемые единицы перевода по [ADR 0018](../adr/0018-generated-documentation-translations.md). TOML-каталоги в `docs/i18n/generated/` служат входными данными локализации, а не дополнительными основными Markdown-страницами. Их ревью связано и с исходным текстом, и с байтами перевода. Листинги API, команды, имена файлов и идентификаторы символов не меняются.

Языковой рендерер сохраняет маршруты и исходные якоря заголовков, фиксирует каждую отсутствующую и устаревшую единицу и никогда не считает английскую подстановку переводом. Для версий пакета 2.0 и выше неполный перевод любого отображаемого поясняющего текста блокирует успешную сборку документации. Дополнительный параметр `--require-complete-translations` применяет то же требование к более ранним стабилизационным версиям. Существующие проверки отслеживаемых файлов, якорей API, запрета импортов, ссылок, достижимости и соответствия wheel сохраняются.
'''
