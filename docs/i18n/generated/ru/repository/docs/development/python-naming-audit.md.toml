# Аудит имён Python и миграция

Задача: [#116](https://github.com/Fuzzy-Technologies/F-Layer/issues/116).

2026-11-04 владелец подтвердил camelCase для собственных переменных, параметров
и полей. PascalCase для функций, методов и классов и UPPER_SNAKE_CASE для
констант остаются установленными соглашениями.

## Область аудита и происхождение проблемы

Отправная точка — `develop` на коммите `e8561f5`. Проверяются все 92 отслеживаемых
модуля и стаба Python в `src`, `tools` и на всех уровнях тестов. Начальная
инвентаризация обнаружила 1374 вхождения привязок snake_case в 78 файлах и 503
различных имени-кандидата. В эти исходные числа входят допустимые имена pytest
и внешних интерфейсов; это не количество нарушений.

Противоречащее требованию указание snake_case появилось в коммите начального
каркаса `57c9260` от 2026-10-04 — в протоколе разработки и руководстве по стилю.
Настроенные правила Ruff проверяли синтаксис, импорты и отдельные ошибки,
но не это соглашение об именах. Новый этап `tools.python_naming` закрывает
этот пробел в проверках.

Рефакторинг охватывает привязки, поля, параметры, именованные аргументы,
псевдонимы импортов, регистрацию фикстур и соответствующие встроенные примеры.
Переопределения argparse, configparser, importlib, HTMLParser, Griffe, SSL и
других внешних интерфейсов сохраняют требуемое внешнее написание. Исключения
валидатора привязаны к точному файлу и полному имени определения.

## Миграция вызывающего кода Python

Используйте `CloudPlacement.ycProfile`, `project.cloud.zoneId`,
`settings.commandTimeout` и `expectedIdentity=`. Прежние имена Python-полей и
именованных аргументов со snake_case нужно обновить. Методы, например
`LoadVpnProject()`, сохраняют PascalCase. Тестовые функции сохраняют `test_`,
а параметры встроенных фикстур pytest — свои имена внедрения.

Флаги CLI, ключи TOML проекта, поля Yandex/API, интеграционные сообщения,
сохранённое состояние, манифесты принадлежности и JSON протоколов сохраняют
внешнее написание. Например, в `project.toml` остаётся `yc_profile`, а
`subprocess.run` по-прежнему получает `capture_output`.

На границах сериализации и вычисления отпечатков поля dataclass в camelCase
явно преобразуются в прежние имена snake_case, а ключи обычных словарей
сохраняются. Переименование атрибутов Python не должно незаметно менять
отпечатки существующих проектов и схемы надёжно сохранённого состояния.
Прямой вызов `dataclasses.asdict()` отражает новые имена полей Python;
для сохранения данных и интеграционных сообщений используйте существующие
публичные кодеки.

## Проверка

Отдельный PR проходит полный набор проверок, включая имена, на точной ревизии.
Тесты проверяют отклонение нарушений, исключения фреймворков и обнаружение файлов
во всём репозитории. Регрессии сериализации фиксируют прежние форматы и хеши.
Полные проверки дистрибутивов и документации обязательны; подмножество тестов
в Windows не заменяет результаты Linux.

Изменение не затрагивает развёрнутые ресурсы, учётные данные, сеть и профили VPN.
Экспериментальная работа над VPN остаётся отдельной от этого рефакторинга.
'''
