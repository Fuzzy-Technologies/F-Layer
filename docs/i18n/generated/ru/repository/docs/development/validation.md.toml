# Проверки качества

Один раз установите зафиксированные инструменты разработки, затем используйте одну и ту же команду локально и в workflow Python quality:

```bash
python -m pip install -e ".[dev]"
python tools/validate.py
```

Скрипт находит рабочую копию, в которой расположен, поэтому его можно запускать по абсолютному пути из другого каталога. Каждый инструмент получает `PYTHONPATH=src:.`, разрешённый относительно этой рабочей копии. Editable-установка из другого worktree не сможет незаметно подменить проверяемый пакет.
Посторонние параметры pytest, подключение плагинов через окружение и переопределения исходников mypy сбрасываются; полный скрипт загружает только необходимый плагин покрытия pytest.

## Обязательные проверки

Полный набор выполняется последовательно и останавливается при первой ошибке:

1. Принудительно скомпилировать `src`, `tests` и `tools` с помощью `compileall`.
2. Проверить имена собственных идентификаторов командой `python -m tools.python_naming`, затем выполнить Ruff и строгую проверку типов mypy. Проверяются camelCase для переменных, параметров и полей, PascalCase для функций и типов, UPPER_SNAKE_CASE для констант; внешние интерфейсы и внедряемые фикстуры pytest сохраняют свои имена.
3. Найти и запустить все уровни тестов pytest с измерением покрытия ветвей.
4. Требовать не менее 80% общего покрытия операторов и ветвей, а также отдельно не менее 80% покрытия ветвей `flayer`. Если в пакете нет ветвлений, требований к покрытию ветвей нет; пустые или некорректные измерения считаются ошибкой.
5. Импортировать пакет из этой рабочей копии изолированным интерпретатором.
6. Собрать и установить пакет во временный каталог, запретив загрузку зависимостей и изоляцию сборки, затем импортировать установленный пакет.
7. Выполнить `python -m flayer --help`, если в рабочей копии есть `flayer/__main__.py`. Об отсутствии CLI сообщается явно.

Для проверки установки без сети необходима зафиксированная версия Hatchling из набора зависимостей разработки. Отсутствующий инструмент, ненулевой код завершения или превышение времени этапа означают провал проверки. На каждый дочерний процесс отводится десять минут. Отчёты покрытия и временно установленный пакет удаляются и при успехе, и при ошибке.

Порог покрытия относится к рабочему коду пакета. Инструменты репозитория проверяются `compileall` и mypy и имеют тесты поведения; этот процент не означает покрытие workflows или документации.

## Уровни тестов

Pytest ищет тесты во всём `tests/`, а не только unit-тесты. Помещайте тест в каталог своего уровня; при сборе ему автоматически назначается соответствующий строгий маркер. Путь без определённой категории приводит к ошибке сбора тестов.

| Каталог / маркер | Область проверки                                     |
| ---------------- | ---------------------------------------------------- |
| `unit`           | Изолированное поведение модулей и ветви ошибок       |
| `contract`       | Общие интерфейсы и совместимость сохранённых данных  |
| `functional`     | Полные локальные сценарии                            |
| `integration`    | Совместная работа адаптеров с имитациями компонентов |
| `e2e`            | Полные локальные сценарии без изменений в облаке     |

Во время разработки запускайте нужный уровень тестов, а перед ревью — полный набор:

```bash
PYTHONPATH=src:. python -m pytest -m contract --no-cov
python tools/validate.py
```

Во всех тестах действует защита сокетов: она блокирует соединения Python, исходящие датаграммы и DNS. Передавайте тестовые реализации клиентов провайдеров и транспортов. Эта фикстура предотвращает случайные обращения, но не заменяет изоляцию операционной системы: для дочерних процессов и нативных библиотек по-прежнему нужны воспроизводимые имитации и внимательное ревью.
Тесты не разрешают реальные операции у провайдеров и не создают облачные ресурсы.

CI использует тот же полный скрипт, что и локальная разработка. Последующее изменение отслеживаемого файла делает прежние результаты неактуальными и требует повторной полной проверки.
