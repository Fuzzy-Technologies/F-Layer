# Проверка установленного VPN перед релизом

Релиз 2.0 готов только после того, как оператор установил пакет кандидата, развернул проект в Yandex Cloud и подключил настоящие клиенты по обоим протоколам: AmneziaWG и VLESS Reality. Результаты нужно записать в [Task 73](https://github.com/Fuzzy-Technologies/F-Layer/issues/73). Тесты конфигурации и запущенные службы systemd не заменяют эту проверку.

## Выбор кандидата и области облачных ресурсов

Используйте wheel и отчёт сборки из успешного CI релизных пакетов для точного коммита, прошедшего ревью. Запишите коммит, запуск workflow, имя wheel, SHA-256 и версию Python. До подготовки релиза wheel разработки сохраняет текущую версию исходников; различайте его по хешу и коммиту, не переименовывайте в 2.0.0.

Используйте отдельный каталог Yandex Cloud с явно заданным бюджетом ресурсов и разрешением создавать и удалять тестовые ресурсы. Оператор выбирает аккаунт, именованный профиль `yc`, каталог, зону и совместимый образ Ubuntu 24.04 amd64. Эта инструкция не предоставляет доступ к аккаунту и не разрешает автоматизированному агенту создавать платные ресурсы. Храните облачные идентификаторы и клиентские учётные данные в частных локальных записях; в публичной задаче нужны результаты, версии и ссылки на подтверждения, а не секреты.

Запускайте контроллер в Linux или совместимом POSIX-окружении с Python 3.11 или новее и OpenSSH. Установите выбранный wheel с дополнением `vpn` в новое виртуальное окружение вне рабочей копии исходников. Замените имя примера фактически скачанным файлом:

```bash
python3 -m venv flayer-acceptance-env
. flayer-acceptance-env/bin/activate
python -m pip install './f_layer-1.2.1-py3-none-any.whl[vpn]'
python -m pip check
flayer --help
flayer check --format json
```

Убедитесь, что Python импортирует `flayer` из установленного пакета этого окружения. Не задавайте `PYTHONPATH`, не используйте editable-установку и не запускайте проверку из репозитория.

## Создание и развёртывание одного проекта

Следуйте [Quick Start](../site/content/en/guide/index.md), записывая шаги, которым потребовались недокументированные знания или ручное исправление. Создайте новый частный проект:

```bash
flayer project init acceptance-vpn
```

Отредактируйте `acceptance-vpn/project.toml`: укажите выбранные каталог, профиль `yc`, образ, зону, текущий публичный диапазон IPv4 администратора и доступную цель Reality. Для каждого клиента используйте отдельное именованное устройство. Подсеть туннеля, облачная подсеть и локальные сети клиентов не должны пересекаться. Выполните описанное в документации требование к IPv6 на клиенте, прежде чем считать соединение полным туннелем IPv4.

Локальная подготовка должна проходить без обращения к облаку, а повторный запуск — использовать существующие ключи:

```bash
flayer vpn prepare --project acceptance-vpn --format json
flayer vpn prepare --project acceptance-vpn --format json
```

Затем оператор явно разрешает создание в выбранном каталоге. Замените `example-folder` тем же ID каталога, который указан в проекте:

```bash
flayer vpn deploy --project acceptance-vpn --allow-mutation --scope-confirm example-folder --format json
flayer vpn status --project acceptance-vpn --format json
```

Убедитесь, что ожидаемые сеть, подсеть, группа безопасности, зарезервированный публичный адрес, загрузочный диск и ВМ принадлежат проекту. Ключ SSH-сервера должен быть получен через аутентифицированный облачный канал и закреплён до передачи закрытых файлов. Не обходите несовпадение ключа и не включайте доверие при первом подключении. Используйте пути клиентских файлов, которые сообщило успешное развёртывание.

## Подключение по обоим протоколам

Проверяйте протоколы по отдельности, чтобы работающий первый туннель не скрыл сбой второго. Для каждого устройства запишите ОС, версию клиента, способ импорта и результаты. Для наблюдения исходного адреса соединения используйте HTTPS-сервис под контролем оператора либо выбранный им сервис.

Для [AmneziaWG](../architecture/amneziawg.md):

1. Импортируйте `amneziawg.conf` этого устройства в совместимый клиент AmneziaWG 3.1.
2. Включите туннель и проверьте настоящий обмен handshake между клиентом и сервером.
3. Выполните разрешение имени и загрузите HTTPS-контент через туннель. Убедитесь, что наблюдаемый исходный IPv4 совпадает с зарезервированным публичным адресом проекта.
4. Проверьте заданную политику маршрутизации и настройку IPv6 клиента. Успех IPv4 не доказывает, что IPv6 или другой трафик не может обходить туннель.
5. Отключите туннель перед проверкой VLESS.

Для [VLESS Reality](../architecture/vless-reality.md):

1. Импортируйте URI из `import.txt` этого устройства в совместимый графический клиент либо запустите созданный `client.json` с указанной в документации версией Xray.
2. В графическом клиенте явно выберите режим прокси или VPN/TUN и примените описанные настройки DNS и маршрутов. URI импорта не содержит полную политику маршрутизации. Запишите, какой трафик охватывает выбранный режим.
3. Проверьте настоящее аутентифицированное соединение, разрешение имён и передачу HTTPS через него. Наблюдаемый исходный IPv4 должен совпасть с адресом шлюза.
4. Для созданной конфигурации Xray проверьте приложение через `socks5h://127.0.0.1:10808`. Это проверяет прокси приложения, а не маршрутизацию всей ОС. Любое заявляемое поведение VPN/TUN проверяйте отдельно в выбранном клиенте.
5. Отключитесь и подключитесь снова. Убедитесь, что сохранённый импорт по-прежнему работает.

Любой режим раздельной маршрутизации, который релиз планирует заявлять, проверяйте в отдельном проекте. Проверьте разрешённый и исключённый адреса назначения; запишите, предусматривает ли документация блокировку или прямой маршрут. Не меняйте настройки уже подготовленного проекта, чтобы обойти защиту от замены.

## Повторное развёртывание и обработка ошибок

Повторно выполните ту же команду развёртывания. Идентификаторы облачных ресурсов и клиентские учётные данные должны сохраниться; оба ранее импортированных профиля должны продолжить подключаться. Запишите результат, не копируя закрытую конфигурацию в задачу.

Выполните контролируемое прерывание в пределах разрешённого тестового сценария. Запишите, произошло ли оно во время создания облачных ресурсов или установки гостевой системы, сохраните частный проект и состояние, затем следуйте соответствующей описанной процедуре восстановления. Для прерванной облачной операции используются явные команды:

```bash
flayer vpn recover --project acceptance-vpn --allow-mutation --scope-confirm example-folder --format json
flayer vpn deploy --project acceptance-vpn --allow-mutation --scope-confirm example-folder --format json
```

Ошибка установки гостевой системы после создания облака обычно позволяет повторить `deploy` с сохранённым проектом. Принудительное завершение процесса во время замены гостевой конфигурации может потребовать описанной ручной проверки и исправления; не заявляйте автоматическое восстановление, если именно этот сценарий не был фактически успешно проверен. Любой провал или необъяснённый результат остаётся блокирующей релиз проблемой.

## Удаление ресурсов и фиксация результата

Отключите клиенты, затем удалите именно управляемое развёртывание:

```bash
flayer vpn destroy --project acceptance-vpn --allow-mutation --scope-confirm example-folder --format json
```

Убедитесь в Yandex Cloud, что удалён каждый ресурс, записанный для этого развёртывания, включая зарезервированный адрес и загрузочный диск, а посторонние ресурсы не затронуты. Сохраняйте частное состояние до завершения проверки. Локальные учётные данные удаляйте отдельно по правилам хранения оператора; `destroy` оставляет локальные файлы для анализа.

Результаты Task 73 должны включать идентичность кандидата, версии контроллера и клиентов, результаты соединения, DNS и маршрутизации для обоих протоколов, повторного развёртывания, прерывания и восстановления, подтверждение очистки и ограничения. Для каждой проверки укажите `passed`, `failed` или `not run`. Отсутствие подтверждения не считается успехом.

Закрывайте Task 73 только после принятия реальных результатов оператором. Завершите остальные штатные пункты майлстоуна перед закрытием `release-2.0`; лишь затем готовьте версионный changelog, стабильный релиз `master` и аннотированный тег `v2.0.0`. Если публикация PyPI настроена, также нужно проверить установку из опубликованного индекса пакетов.
