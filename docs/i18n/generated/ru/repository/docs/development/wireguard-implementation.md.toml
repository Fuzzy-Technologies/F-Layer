body = '''# Границы реализации стандартного WireGuard

Кандидат разработки для релиза 2.1 добавляет низкоуровневые модели стандартного
WireGuard, кодеки приватного материала и рендереры конфигурации. Эти API не входят
в опубликованный пакет 2.0.0. Их архитектура следует
[ADR 0023](../adr/0023-selectable-vpn-transports.md).

## Реализованная основа

`flayer.vpn_selection.VpnProtocolSelection` связывает протокол с явным подмножеством
объявленных идентификаторов устройств. Дополнительные IP-туннели используют точное
сопоставление устройств и приватных адресов. AWG сохраняет прежнее поле адреса
устройства; у VLESS туннельных адресов нет. Порядок канонический, без выделения
адресов и переименования устройств. `Project()` создаёт профиль только с устройствами
и слушателем выбранного протокола, общей идентичностью и политикой маршрутов.
Изменения посторонних устройств, адресов и слушателей не влияют на эту проекцию.
`ParseProtocolSelections()` проверяет состав клиентов, а не полный файл проекта.

`flayer.profiles.wireguard` предоставляет проверенные `WireGuardSettings`,
`WireGuardPeer` и `WireGuardMaterial`, явную генерацию материала и ограниченные
строгие JSON-кодеки. Стандартный WireGuard использует отдельные ключи X25519
и предварительно согласованные ключи на устройство. При повторной подготовке
нужно декодировать сохранённый материал: повторный вызов генератора намеренно
создаёт другие учётные данные. Приватные поля исключены из представления объектов,
некорректный вход не повторяется в сообщениях.

Серверный рендерер выводит только собственный закрытый ключ и открытые/
предварительно согласованные ключи выбранных клиентов. Клиентский рендерер
выводит только закрытый ключ этого устройства, открытый ключ сервера, его
предварительно согласованный ключ, явный адрес, endpoint, MTU, маршруты, DNS
и keepalive. Полей обфускации AWG нет в обеих конфигурациях. Проверять состав
туннеля и адреса до генерации материала. Отклонять общие идентичности Curve25519,
эквивалентные кодировки закрытых скаляров и открытые/повторно используемые предварительно согласованные ключи, некорректные
подсети, TCP-слушатели и несовпадающие порты endpoint клиента.

Публичные API подготавливают байты в памяти. Перед сохранением или передачей байтов учётных
данных нужно проверенное приватное хранилище с контролем принадлежности.
Не помещать их в логи и облачные метаданные. Стабильное имя службы выводится
из полной идентичности стека и не меняется при изменении состава клиентов.

## Реализация управляемой серверной службы

`PrepareWireGuard()` создаёт чувствительный серверный комплект с `server.conf`,
`deployment.json` и автономным `install.py`, а также стандартный `wireguard.conf`
для каждого выбранного устройства. Подготовка выполняется без сети и сохраняет
переданный ключевой материал. Дескриптор связывает полную идентичность владельца
стека, закреплённые исходники tools, точные хеши программы и конфигурации,
открытые ключи клиентов, адреса и политику маршрутов. Закрытых клиентских ключей
в нём нет. Нативный экспорт AmneziaVPN остаётся задачей #129.

Серверная программа реализует первичную установку, точную проверку повторного
запуска, проверку/статус без изменений, запуск/остановку systemd, удаление по
квитанции и восстановление прерванной установки. Развёртывание нового проекта
схемы 2 вызывает её через SSH-приёмник с закреплённым ключом сервера. Для
существующей установки схемы 1 нужен отдельный процесс миграции/входящих правил;
не запускать программу вручную на рабочем сервере в обход этого процесса.

Начальная платформа — Ubuntu 24.04 amd64 с ядром GA 6.8. До сборки tools и
публикации управляемой конфигурации допуск первой установки читает фиксированный
[JSON Ubuntu CVE-2026-98432](https://ubuntu.com/security/cves/CVE-2026-98432.json).
Требуется единственная запись `noble` пакета `linux` со статусом `released`,
а версия пакета работающего ядра должна быть не ниже исправленной версии этой
записи. Описание со статусом `pending`, недоступный ответ, другая ветка ядра или
неоднозначные данные блокируют активацию. На момент реализации Ubuntu указывает
для noble ожидающее исправление; целевая версия не доказывает выпуск исправления.
Установщик не обновляет и не перезагружает ядро и не применяет общесерверное
смягчение уязвимости. Такое обслуживание требует отдельного плана.

Квитанция сохраняет доказательство по конкретной CVE, полную `/proc/version_signature`
работающей сборки Ubuntu, версии пакетов образа/модулей, контрольную сумму исходников
доступного модуля и хеш его файла на диске. Загруженный модуль должен сообщать такую
же контрольную сумму исходников; после создания интерфейса это подтверждение
обязательно до его включения. Отсутствие/несовпадение идентичности сборки или исходников
блокирует действие. Это данные работающей сборки/исходников и отдельный дисковый хеш,
а не хеш работающего образа или загруженной памяти. См. [идентичность ядра Ubuntu](https://ubuntu.com/kernel)
и [ABI модулей ядра](https://docs.kernel.org/admin-guide/abi-stable.html).
Обычный статус, повторная проверка и запуск после загрузки
сравнивают текущее ядро с квитанцией без загрузки метаданных и переустановки tools.
Изменённое ядро требует явного обслуживания политики. Это оценка одной указанной
базовой уязвимости, а не всей безопасности ядра. Статус не заявляет проверку
сквозного трафика или воспроизведения медиа.

Tools собираются приватно из закреплённого по контрольной сумме upstream-архива
`wireguard-tools 1.0.20260223`. Ограниченная распаковка не создаёт ссылок и отклоняет
опасные пути; пропускается только точно опознанная неиспользуемая ссылка wg-quick
из закреплённого архива. Исполняемый файл должен сообщать закреплённую версию и иметь формат Linux
amd64. Каталог службы сохраняет лицензию исходников. Установка пакетов, замена
системных бинарников и запасная userspace-реализация не выполняются. На сервере
уже должны быть средства сборки (`make`, компилятор, заголовки libc), `ip`, `ss`,
`nft`, `unshare`, `modinfo`, `dpkg-query`, Python и systemd.
Квитанция фиксирует хеши и версии исполняемых файлов компилятора/make, целевую
архитектуру, версии пакетов заголовков libc/ядра и точные параметры upstream-сборки.
Во время сборки toolchain не должен меняться; обычный статус не пересобирает tools.

Полный хеш владельца определяет приватный каталог; стабильные имена службы,
интерфейса и таблицы nft используют короткий префикс владельца и полные метки
операции. Для приватных каталогов/файлов строго проверяются владелец и права.
Отклоняются символьные/жёсткие ссылки, лишние файлы, изменённые байты конфигурации,
бинарника/юнита, неизвестные клиенты/адреса, занятые UDP-порты и пересечения
с существующими маршрутами сервера. Приватная блокировка сериализует изменения
контроллера. Вызовы systemd привязаны к точной установленной программе и юниту
и проверяют свои квитанции.

Правила forwarding/NAT используют только выбранный интерфейс, явные адреса
клиентов и объявленные назначения. Точная JSON-политика сначала компилируется
во временном сетевом пространстве имён, затем сравнивается с правилами сервера.
Программа не очищает общий ruleset, не меняет глобальную input-политику,
не перезапускает общую сеть и не сбрасывает IPv4 forwarding других туннелей.
IPv6 на сервере должен быть заранее выключен. Переходы входящих правил облака и существующего сервера —
отдельная интеграция; работающая служба не доказывает доступность UDP-слушателя.

Полный приватный журнал и подготовленные файлы публикуются вместе до активации
службы/интерфейса. Файлы и границы каталогов сохраняются через fsync до активации
и до удаления доказательств очистки. При сбое установки удаляются только доказанно свои объекты.
Удаление/восстановление требуют явного разрешения изменения и точного SHA256
предыдущей квитанции. Журнал хранит несекретные хеши файлов вне удаляемого дерева,
чтобы продолжить прерванную частичную очистку. Чужое или изменённое состояние
сохраняется для диагностики. Зафиксированная рабочая служба не откатывается при
сбое завершения журнала. Обычная установка отклоняет замену, изменения клиентов
и ротацию ключей: для них нужны явные переходы вместо неявной генерации.

## Явный выбор протоколов и автономная подготовка проекта

Кандидат разработки принимает приватные проекты схемы 2 через публичный загрузчик
и CLI подготовки без сети. Явное повторяемое указание протокола включает этот
формат; без него сохраняются точный шаблон AWG/VLESS схемы 1 и прежние отпечатки:

```bash
flayer project init ~/flayer-wireguard --protocol wireguard
# Edit the cloud placement and administration address in project.toml first.
flayer vpn prepare --project ~/flayer-wireguard
```

Повторяйте `--protocol` для непустого сочетания `amneziawg`, `vless-reality`
и `wireguard`. OpenVPN недоступен до отдельной реализации. Пустой выбор,
повторяющийся или неизвестный протокол — ошибка, а не переход к прежней паре.
Весь документ проверяется до генерации ключей: отклоняются неактивные/неизвестные
настройки, совпадающие UDP-слушатели, TCP 22, пересечения сетей, неверный MTU,
лишние ключи сопоставления адресов и более двух DNS-серверов.

Каждая выбранная таблица требует явного `device_ids`. WG использует собственное
сопоставление `[wireguard.device_addresses]`; `devices.ipv4_address` верхнего уровня
принадлежит только участникам AWG, у VLESS адреса туннеля нет. Идентификаторы
и назначенные адреса сохраняются, а порядок объявлений приводится к каноническому.
Адреса не выделяются по порядковому номеру, ни один протокол не регистрирует все
устройства неявно.

`SelectedVpnProject` хранит полный публичный отпечаток проекта отдельно от
`TransportFingerprint()`. Отпечаток протокола включает его участников, слушатель/
настройки, идентичность и общую политику маршрутов, исключая устройства,
слушатели/настройки других протоколов и размещение в облаке. Можно объявить ещё
не включённое устройство, не меняя байты сохранённых материалов протоколов.

Подготовка создаёт отдельные принадлежащие проекту комплекты
`server-<stack>-<protocol>-credentials` с приватным `material.json` и доказательством
`intent.sha256`, а также серверный комплект протокола. Точно совпадающий материал
декодируется, а не генерируется заново. До публикации новых комплектов проверяются
все существующие манифесты и точные наборы файлов. Изменение своих участников/
настроек или дрейф блокирует действие без перезаписи других протоколов. Если более
поздняя локальная запись комплекта завершается сбоем, зафиксированные ключи
сохраняются для повтора с неизменным входом. Прежние требования к принадлежности
файлов и приватным правам 0700/0600 остаются в силе.

Подготовка также сохраняет принадлежащий проекту несекретный комплект
`server-<stack>-creation`: `creation.json` содержит точные упорядоченные спецификации
шести ресурсов, исходные метки создания, отпечатки проекта/плана и независимые
дайджесты комплектов протоколов; `cloud-init.json` сохраняет точные исходные байты
bootstrap. Компиляция читает этот снимок вместо пересборки меток ВМ или bootstrap
из текущих настроек. Bootstrap нового WG включает средства сборки, kmod, iproute2
и util-linux; он не обновляет и не перезагружает ядро. Подготовка не создаёт
облачное состояние или клиентские экспорты с фиктивным endpoint. Существующие
снимки проверяются без повторной генерации установщиков, ключей или bootstrap.

Редактирование старого проекта до схемы 2 не является миграцией. Сохранённое
облачное состояние или журнал незавершённой операции, прежние общие ключи, bootstrap/trust-комплекты или экспорты
устройств блокируют подготовку. Сохраняйте исходную конфигурацию схемы 1, ключи,
манифесты и ссылки для очистки, пока явный процесс миграции/входящих правил не
сможет доказать прежнюю базовую конфигурацию.

## Жизненный цикл нового проекта

Для нового проекта схемы 2 `deploy`, `status`, `recover` и `destroy` используют
исходный план шести ресурсов. Изменения требуют явного разрешения и точного scope
до подготовки, аутентификации или загрузки данных вендора. До отправки запроса
создания новой WG ВМ контроллер дополнительно требует доказательство опубликованного
исправления noble/linux; сервер всё равно проверяет исполняемую сборку. Недоступные
данные или статус pending блокируют создание до выделения платных ресурсов.
Исправные повторы/status используют сохранённую серверную проверку; очистка
и восстановление удаления не зависят от загрузки этих данных.

Каждое наблюдение облака проверяет точные scope, тип, имя, зону и исходные метки
создания. Для security group также сверяются привязка к сети и полное мультимножество
действующих IPv4-правил, включая описания и кратность. Документированные числовые
представления JSON нормализуются; IPv6, косвенные цели и неизвестная политика
отклоняются. Ограниченный снимок сохраняет ID правил. Перед каждым удалением
проверяются все оставшиеся исходные ресурсы: дрейф firewall останавливает очистку
до удаления первой ВМ. Очистка не присваивает неучтённый или заменённый ресурс.
Эта часть реализации не обновляет облачные правила и не меняет метки ресурсов.

Единственный фактический IPv4-интерфейс ВМ должен ссылаться на точную принадлежащую
проекту подсеть и только исходную security group, иметь зарезервированный публичный
NAT-адрес и внутренний адрес этой подсети. IPv6, дополнительные интерфейсы и
неизвестные поля привязок отклоняются. Точный принадлежащий проекту загрузочный
диск должен оставаться доступным для записи и исключённым из автоматического
удаления; дополнительные диски, файловые системы и локальные диски отклоняются.
Непосредственно перед удалением ВМ по ID повторяется полное чтение привязок и
сравнение с закреплённым снимком. Изменённая привязка не должна обходить проверку
входящих правил или приводить к удалению постороннего auto-delete диска.
См. [схему привязок ВМ провайдера](https://yandex.cloud/en/docs/compute/api-ref/Instance/get).

SSH-приёмник принимает не более трёх выбранных протоколов. Установка WG идёт первой,
чтобы прерванная WG-транзакция не запустила установщик другого протокола. Только
установка получает разрешение на изменение; следующая проверка доступна лишь
для чтения. Серверные программы читаются из закреплённых исходных комплектов.
Клиентские файлы с фактическим адресом публикуются после совпадения принадлежащего
проекту зарезервированного IP с ВМ и проверки активности всех выбранных служб.
Метка IAM serial-key использует исходный отпечаток проекта, даже если меняется
постороннее устройство или локальное имя профиля аутентификации. Это не меняет
ключи и не пересоздаёт ресурсы. Изменение выбранных участников, слушателей,
маршрутов, размеров ресурсов или размещения требует явного перехода.

Облачное восстановление сохраняет общий долговечный журнал и исходные ID операций.
Если облачного журнала нет, явное серверное восстановление принимает только
наблюдаемую WG-квитанцию либо отдельное доказательство полного отсутствия объектов
для пустых оставшихся метаданных. Оно не удаляет исправную службу и не добавляет
клиентов. Обычный deploy не исправляет прерванную серверную транзакцию. Status
не принимает параметры изменения и отделяет здоровье службы от клиентской
связности. Разрешённый callback запуска после перезагрузки восстанавливает
приватный временный файл координации; status остаётся только чтением. Если
перезагрузка прервала установку/удаление до возможности восстановления файла
службой, status может читать без создания файла и отбрасывает результат, если
во время наблюдения изменяющая операция создаёт любой путь блокировки.
Восстановление по-прежнему берёт исключительную блокировку и повторно проверяет
точное текущее доказательство. Все изменяющие callbacks службы создают файл
координации до побочных действий. Удаление всего проекта использует сохранённый
несекретный облачный снимок даже при потере
приватных клиентских или SSH-ключей. Локальные артефакты сохраняются; прежнее
доверие или клиентские экспорты блокируют новое развёртывание после очистки.

## Серверная транзакция одного клиента

Приватный `_wireguard_peer.py` реализует серверную транзакцию одной явной
регистрации или отзыва. Упаковщик на контроллере выдаёт драйвер только на stdlib
и вспомогательную программу с закреплённой контрольной суммой. Автономная загрузка
принимает только точный обычный helper-файл root с приватными правами, без ссылок
и символических предков; одобренные байты проверяются до исполнения. Helper
временный: исходные установленная программа, tools-бинарник, лицензия, unit,
владелец, nonce и сохранённые данные проверки ядра/сборки остаются прежними.
Закрытые ключи устройств не передаются на сервер.

До активации проверяются точная исходная каноническая квитанция, полное действующее
состояние и изменение одного устройства. Изменение ключа/адреса другого клиента,
серверного ключа, слушателя, подсети, маршрутов или закреплённого runtime — ошибка.
Полный приватный кандидат и несекретный журнал метаданных схемы 2 подготавливаются
в существующем пространстве транзакции. Поддержка атомарного обмена каталогов
на той же файловой системе проверяется до действующих изменений. Действие с
клиентом не загружает tools, не генерирует ключи, не обновляет ядро, не меняет
облачные входящие правила, не пересоздаёт интерфейс и не перезапускает службу.

Используется upstream [`wg syncconf`](https://raw.githubusercontent.com/WireGuard/wireguard-tools/v1.0.20260223/src/man/wg.8),
чтобы менять только различия и сохранять неизменённые сеансы. Регистрация меняет
клиента в ядре до допуска его адреса через nftables; отзыв запрещает источник до
удаления клиента из ядра. Только доказанно своя таблица заменяется одним nft-пакетом
удаления/создания; общий ruleset не очищается. Допускаются лишь записанные префиксы
старого/нового состояния в указанном порядке. Необъяснимые сочетания или посторонний
дрейф интерфейса, ядра либо firewall блокируют следующее изменение. Перемещение
endpoint, время handshake и счётчики трафика не входят в управляемую конфигурацию.

Полный кандидат публикуется через Linux
[`RENAME_EXCHANGE`](https://man7.org/linux/man-pages/man2/renameat2.2.html): загрузка
не увидит отсутствующие или смешанные файлы конфигурации. Полная квитанция
действующего каталога определяет факт commit: до публикации восстановление
возвращает только выбранного клиента и префикс политики, а после неё сохраняет
исправный целевой каталог, в том числе при ошибке fsync после публикации.
Доказательство commit и границы каталогов сохраняются до удаления резервных
файлов или журнала. Частичное удаление резервной копии и пустой финальный журнал
восстанавливаются без отката уже зафиксированного клиента. Восстановление требует
текущую квитанцию, хеш исходной предыдущей квитанции и исходно наблюдавшуюся
голову истории. До удаления резервных файлов явно сохраняются оба родительских
каталога обмена, включая повтор commit после ошибки fsync.

Отдельный несекретный `peer-<owner>.json` хранит последнее точное действие/устройство,
дайджесты старой/новой квитанций и deployment, а также предыдущий хеш истории.
Канонический дайджест записи образует связанную голову истории. Применение и
восстановление требуют исходно наблюдавшуюся голову; идентичный завершённый повтор
должен совпасть с родителем последнего commit. Возврат к тем же байтам конфигурации
после регистрации/отзыва не позволяет повторить устаревший запрос, в том числе
после длинных повторяющихся циклов. Status сообщает текущую и исходную для
транзакции головы. Эти хеши — предусловия операции, а не ключи клиентского
подключения. Неканонические байты метаданных,
неизвестные файлы, неверные прежние доказательства или изменённая история commit
блокируют действие. Status выдаёт лишь ограниченные факты.

Восстановление неприменённой операции также отзывает полномочия исходной головы
истории. До подтверждения отмены или удаления резервных файлов надёжно сохраняется
запись аудита версии 1 с одинаковыми хешами предыдущей/текущей квитанций, фактическим
неизменённым дайджестом deployment и исходным родителем истории. Её хеш блокирует
apply RPC, задержавшийся до получения исключительной серверной блокировки: старый
запрос уже не активируется после ответа `not-applied`. Точный повтор восстановления
сохраняет то же подтверждение отмены; следующая попытка требует заново наблюдать
голову истории. Опубликованное подтверждение — допустимый префикс очистки отката
после сбоя, включая пустой финальный журнал. Оно не доказывает завершённую
регистрацию или отзыв клиента.

Точка входа требует
явного разрешения изменения и общей исключительной блокировки; status только
для чтения не создаёт файл координации и отбрасывает наблюдение, если после
перезагрузки во время чтения появляется блокировка. Временная приватная подготовка
запроса не меняет управляемую установку.

Детерминированные POSIX-тесты моделируют независимое состояние ядра/таблицы и
прерывают каждую границу активации/публикации/очистки, используя настоящие приватные
файлы, обмен каталогов и fsync. Эти модели не аттестуют реальное ядро или nft-политику.
Отдельный изолированный Linux CI проверяет реальные обновления клиентов закреплённым
инструментом, идентичность интерфейса, эквивалентность nft echo/live, атомарность
отклонённого пакета и сохранение чужой таблицы. Локальная сеть и рабочий сервер
не используются.

## SSH-граница управления клиентом

`SshGuestProvisioner.WireGuardPeerOperation()` теперь предоставляет серверную
транзакцию через существующий SSH-канал с независимо закреплённым ключом хоста.
Она принимает сохранённый приватный серверный пакет, регистрацию/отзыв одного
указанного клиента и `status`, `apply` либо `recover`. Изменение требует точного
подтверждения scope, явного разрешения, текущей квитанции и исходной связанной
истории; восстановление дополнительно требует исходную квитанцию. Status
отклоняет параметры изменения. Проверить их до SSH, связать точную серверную роль/
имя и владельца дескриптора с полной идентичностью стека, проверить сохранённые
хеши конфигурации/программы. Обслуживание службы использует ту же усиленную
проверку владельца. Одного суффикса имени пакета недостаточно для доступа
к серверному каталогу другого стека.

Через приватный stdin SSH передаются только драйвер/помощник и серверные
конфигурация/дескриптор; дескриптор сохраняет закреплённую исходную установленную
программу. Root-приёмник независимо проверяет точный пакет из четырёх файлов,
цель и разрешение до приватной временной подготовки, затем вызывает ограниченный
вектор аргументов. Сырой stderr не передаётся. Контроллер отклоняет дубли полей,
лишний вывод, неверные цели/хеши дескриптора, несогласованные факты истории
и произвольные результаты. Подтверждения изменения различают `committed`
и `not-applied` при восстановлении; они не заменяют последующее наблюдение
здоровой службы. Переносимые тесты используют границы runner/staging в памяти,
не выполняя SSH или серверную программу.

Ограниченный `history-status` только для чтения наблюдает аудит владельца даже
при отсутствии установленного каталога/службы. Проверяет управляемых предков
и владельца аудита, не создавая каталог или файл координации. Обычный deploy
требует это доказательство истории до любого установщика: удаление службы
не скрывает историю отзыва и не позволяет старым файлам контроллера вернуть ключи.
Если установленный каталог отсутствует, а аудит сохранён, серверная защита установки
откажет даже при передаче текущего дайджеста этого аудита. Воссоздание такого каталога
требует явного контракта восстановления протокола, а не обычной установки.

Установка также передаёт точную ожидаемую историю через приватный stdin.
Упакованный драйвер повторно проверяет её под той же исключительной серверной
блокировкой, что защищает установку, закрывая промежуток между RPC-наблюдением
и изменением. До загрузки разрешённого установщика как модуля и вызова его прежних
функций установки/проверки проверить байты сохранённого `original.py` по исходному
закреплению дескриптора. Это избегает вложенной CLI-блокировки и сохраняет исходные
установленную программу, runtime и startup-callback. Проверка только для чтения
сверяет ту же историю до перехода приёмника к другому транспорту; защита WG всегда
запускается первой, даже если входной пакет первым перечислил другой протокол.
Временные входные копии пишутся в эксклюзивные приватные файлы внутри самой
подготовки запроса; существующий управляемый каталог не нужен, переименование
между файловыми системами не предполагается.

Этот низкоуровневый API не сохраняет намерение контроллера и не выпускает новые
ключи устройств. Описанный ниже процесс проекта предоставляет долговечный журнал
и сохраняет полные старые/новые пакеты и исходные доказательства.

## Приватное хранилище ревизий контроллера

Приватный `_vpn_revisions.py` сохраняет состояние контроллера клиентов проекта
и разрешает действующие ревизии для жизненного цикла.
Каждая попытка сначала пишет журнал метаданных с привязкой к владельцу, затем
неизменяемый приватный пакет нового материала/конфигурации и сохранённой программы
установки, затем точный дайджест пакета до удалённой активации. После прерывания
публикации дайджеста использовать уже полностью подготовленные файлы; не генерировать
заново частично сохранённые ключи. До каждого переименования выполнить fsync точного
приватного временного inode, включая повтор после прежней ошибки синхронизации файла.
Неполная приватная подготовка блокируется для
проверки до любых удалённых операций.

После проверки активного результата на сервере сохранить отдельную неизменяемую
несекретную запись завершения, затем атомарно переключить приватный указатель
головы и убрать журнал. Каждая запись связана с точным родителем, исходной базой
создания, старыми/новыми закреплёнными значениями транспорта и серверными квитанцией/
историей. Восстановленная неприменённая попытка сохраняет подготовленные файлы
для аудита и продвигает серверную историю отмены, сохраняя прежние действующие
квитанцию, ключи и конфигурацию. Новые записи завершения используют схему версии 2:
отправленная неприменённая попытка обязана доказать точное серверное подтверждение
отмены. Попытка без подготовки, которая не могла отправить apply RPC, продвигает
только локальные доказательства и сохраняет серверную историю. Исторические записи
версии 1 читаются с исходной неизменяемой семантикой. Повтор публикации сверяет точные существующие байты записи/
указателя. Прерванное завершение успешной операции версии 1 может убрать оставшийся
журнал без перезаписи неизменяемой записи, в том числе опубликованной до указателя
головы. До удалённого доступа проверить точную принадлежащую манифесту запись
завершения текущей операции. Если неизменяемая запись отправленной неприменённой
операции версии 1 уже существует, а журнал остался, состояние обновления неоднозначно:
отклонить его до любых операций провайдера/сервера и сохранить для явной проверки,
независимо от публикации головы.
Прежние доказательства без подтверждения отмены не переинтерпретируются как версия 2.
Уже закрытые отмены версии 1 не получают задним числом защиту от задержанных старых
запросов; только следующий проверенный commit или отмена продвигает их серверные полномочия.
Неизвестные, отсутствующие, связанные ссылками или несогласованные
метаданные владельца не принимаются автоматически.

Загрузчик проверяет всю ограниченную цепочку (до 4096 записей), не завися от
наличия приватных ключей клиентов. До публикации проверить типы/формат дайджестов
результата и до подготовки или продвижения новой головы проверить тот же лимит
ёмкости; точный повтор уже завершённой операции доступен и на лимите.
Только чтение активного материала/серверных байтов
требует полный закреплённый манифест запроса. Так очистка всего облачного
стека сохраняет исходное несекретное доказательство владельца даже при потере
клиентских ключей. Исходные ресурсы/bootstrap и пакеты других протоколов остаются
прежними. Постоянная приватная advisory-блокировка охватывает целые согласованные
процессы проекта; чтение при отсутствии блокировки не создаёт файл и отбрасывает
наблюдение при гонке. Выбранные prepare/deploy/status/recovery и операции клиентов
используют эту общую блокировку; удаление всего стека проверяет несекретные ревизии
и сохраняет приватные файлы. Неподдержанные runtime/export для выбранного проекта
по-прежнему отклоняются до изменения. Тесты используют синтетические проекты
и настоящие приватные POSIX-файлы/блокировки, без операций с облаком, SSH или
локальной сетью.

## Управление клиентом проекта

`PrepareWireGuardPeerEnrollment()` и `PrepareWireGuardPeerRevocation()` теперь
готовят детерминированное изменение профиля/материала одного указанного клиента
в памяти. Регистрация требует уже сохранённых вызывающей стороной ключей нового
устройства и явного свободного адреса; эти функции не генерируют ключи. Ключ
сервера, ключи/адреса остальных клиентов и байты их конфигураций остаются прежними.
Некорректные идентификаторы, повторное использование адреса/ключа, превышение
лимита клиентов и отзыв последнего клиента отклоняются. Исходный приватный материал
остаётся доступен для аудита. Удаление последнего клиента требует деактивации
протокола. Эти API подготовки не обращаются к серверу, не отключают клиента,
не сохраняют ревизию и не обновляют состояние проекта. `RunVpnPeer()` теперь
объединяет их с сохранёнными ревизиями контроллера и управляемой SSH-транзакцией.

Для развёрнутого проекта WireGuard схемы 2 измените `project.toml`, задав ровно
одну регистрацию/отзыв указанного клиента. Для регистрации объявите новое устройство
и явный свободный туннельный адрес; сохраните всех прежних клиентов/адреса и другие
протоколы. Отзыв удаляет только членство/адрес этого протокола, сохраняя общие
объявления устройств, нужные остальным протоколам. Удаление последнего клиента
требует деактивации протокола. План только для чтения проверяет эту разницу до
внешнего доступа, наблюдает весь исходный облачный граф, действующие входящие
правила/подключения, существующее IAM-закрепление хоста и активные серверные
квитанцию/историю, затем сообщает `baseline_sha256` и `plan_expires_at`.
План не генерирует ключи.

```console
flayer vpn peer plan --project PROJECT --protocol wireguard --device phone --change enroll --format json
flayer vpn peer enroll --project PROJECT --protocol wireguard --device phone --allow-mutation --scope-confirm FOLDER_ID --expected-baseline-sha256 BASELINE --plan-expires-at EXPIRES_AT
flayer vpn peer status --project PROJECT --protocol wireguard --device phone --change enroll --format json
flayer vpn peer recover --project PROJECT --protocol wireguard --device phone --change enroll --allow-mutation --scope-confirm FOLDER_ID --expected-baseline-sha256 JOURNAL_BASELINE
```

Замените заполнители прописными буквами проектом, точным scope и выданными
доказательствами. Применение должно повторить план в течение 600 секунд. Только
после совпадения разрешения и базы сгенерировать и сохранить один новый ключ/PSK
устройства, записать журнал/запрос, затем непосредственно перед удалённым применением
повторно наблюдать облако/доверие и серверные доказательства. Сохранить исходные
байты/закрепление установленной программы. До продвижения локальной головы проверить
здоровый желаемый результат на сервере и вычисленную связанную историю. Точный
повтор последней завершённой операции проверяет здоровье без генерации ключей
или изменения сервера, даже если исходный план уже истёк.

Неизвестный результат SSH сохраняет журнал. Status клиентов выдаёт отдельную базу
журнала и ненулевой код выхода, пока требуется восстановление. Явное восстановление
повторяет эту базу, цель, scope и разрешение; использует сохранённые исходные
доказательства/файлы без генерации ключей, завершает опубликованный корень или
откатывает только неприменённый префикс. Полностью подготовленный откатившийся
кандидат используется повторно при следующем идентичном свежем плане. Отсутствующую
подготовку до активации можно заархивировать как неприменённую; неполные приватные
байты требуют проверки и не заменяются. Восстановление также заново вычисляет
привязку исходного плана по текущим облачным локаторам, адресу и IAM-закреплению
хоста, сохранённым исходным голове/квитанции/истории и сроку действия. Даже корректный
заменённый граф того же владельца или изменённое закрепление хоста не получают
запись восстановления по старому плану. Само истечение срока не мешает явному
восстановлению. Обычные prepare/deploy/status/recover
отклоняют незавершённый журнал клиента. Destroy всего проекта остаётся отдельно
разрешённой очисткой облачного стека и не требует приватных ключей клиентов
или администратора.

После завершения обычный жизненный цикл использует действующие закреплённые
значения протоколов и исходный план шести ресурсов/bootstrap/SSH-маркер.
Проверяет историю клиентов до установщиков других протоколов, поэтому восстановление
старых файлов контроллера не может автоматически принять повторившуюся серверную
конфигурацию. Другие службы, ресурсы, адреса и существующие клиентские файлы
сохраняются. Выдача клиентских конфигураций остаётся задачей #129; завершение операции
клиента само по себе не экспортирует нативные профили и не подтверждает доступ
к Интернету/медиа.

## Неизменяемые ссылки на источники протоколов

Приватный `_vpn_protocol_sources.py` теперь обозначает точный источник независимо от его активного/отключённого состояния. Связанный с владельцем `ProtocolSource` содержит только каноническое закрепление протокола и фиксированную ссылку на исходные пакеты, запрос клиента либо запрос протокола, без тел конфигураций и ключей. Текущее чтение клиентов использует закрытые модели источника/идентичности/закрепления; неподдерживаемые расширения отклоняются до несекретной сериализации. Чтение жизненного цикла идёт через этот resolver; прежние имена пакетов, манифесты, байты установщика и клиентские файлы сохраняются. Ссылка сама по себе не фиксирует эпоху и не активирует службу.

Подготовка запроса протокола копирует сохранённые роли материалов/сервера в памяти, записывая исходное закрепление, nonce операции и дайджест предшествующего состояния. Она не выпускает ключи, не создаёт новый установщик и не публикует файлы. Будущий контроллер эпох обязан журналировать операцию до публикации или удалённых изменений. До восстановления канонических виртуальных пакетов проверяются полные принадлежащие проекту манифесты запросов, точные наборы файлов, роли и дайджесты. Чужой владелец, перенаправленные пути, неканонические или противоречивые метаданные блокируют чтение. Несекретный обход эпох и облачная очистка не должны вызывать reader приватных байтов; потеря клиентских ключей не разрешает перевыпуск проекции. Публикация/выбор эпох остаются открытой частью реализации.

## Сегменты истории клиентов для эпох протоколов

Приватное хранилище ревизий теперь читает и публикует отдельный сегмент клиентов WireGuard из явно заданного контекста `PeerSegment`. Его genesis — полный дайджест эпохи; неизменяемые записи клиентов по-прежнему привязаны к постоянному дайджесту создания. Указатели и журналы находятся в фиксированной приватной папке `protocol-epochs/<digest>`, а исходные файлы создания и все неизменяемые пакеты запросов/завершений сохраняют прежние расположения. Начальная проекция использует сохранённые источники протоколов, в том числе последний зафиксированный запрос клиента из предыдущего сегмента, без перезаписи установщика, ключей или закрытого указателя.

Каждый сегмент проверяет точное начальное закрепление, серверную квитанцию/историю, цепочку родителей и журнал незавершённой операции, возвращая имена всех используемых артефактов клиентов. Будущий reader графа эпох должен проверить все закрытые сегменты и сравнить объединение их имён артефактов с глобальным хранилищем: отдельный сегмент не является полным графом. Для неактивного WireGuard запрещены записи и незавершённые операции клиентов. Настроенные источники могут сохраняться при пустом активном подмножестве. Обход метаданных не требует приватных клиентских данных; восстановление сохранённой проекции требует её точных байтов.

Компонент не публикует эпоху протоколов и не разрешает удалённые действия. Обычные точки входа жизненного цикла/клиентов отклоняют указатели, журналы, файлы прерванной публикации и каталоги сегментов протоколов до интеграции координатора протоколов. Незаметный возврат к исходному указателю клиентов невозможен. Существующие проекты нулевой эпохи сохраняют байты метаданных и поведение. Изолированные POSIX-тесты проверяют оба сегмента, устаревшие скопированные указатели, владельца/пути и прерывание публикации завершения; локальный VPN, SSH и облачные команды не запускаются.

## Асинхронный SDK облачных входящих правил в заданном scope

Конкретный `VpnYandexProvider` теперь предоставляет `BeginIngressChange()` и `ReadIngressChange()` для точного изменения слушателя из [ADR 0024](../adr/0024-owned-vpn-protocol-transitions.md). Это примитив провайдера, а не CLI протоколов или его надёжно сохраняемый координатор проекта/сервера. Вызывающая сторона должна доказать исходный облачный граф, зафиксированную действующую политику и привязку исходного слушателя к протоколу, сохранить намерение до Begin. Нельзя снова вызывать Begin, пока отправленная операция ожидает завершения или её исход неизвестен.

Begin требует явное разрешение изменения, точный scope и ожидаемый полный дайджест прежней политики. Повторно читает полную группу, затем отправляет одну scoped-команду `update-rules --async --print-metadata` по ID с отключёнными повторами CLI. Передаются только доказанные ID удаления либо одно разрешение с тегом; ID удаления с запятой, похожие на опции или слишком длинные отклоняются до любого I/O. Возвращаются только минимальные ID операции/ресурса и отпечаток полного запроса. Сохранить ссылку до опроса, даже если провайдер завершил действие сразу. Begin не скрывает последующее чтение после отправки; потерянный/некорректный ответ не становится `not-applied` или автоматической повторной отправкой.

Read принимает только сохранённую ссылку, связанную с точным планом. Требуются документированный тип `UpdateSecurityGroupMetadata`, целевая группа и выделенные ID правил. Ожидание и конечная ошибка — ограниченные факты, а не здоровая политика или доказательство отката. Успех требует соответствия полному изменению и типизированного ответа операции, и заново прочитанной полной активной политики, включая неизменные посторонние правила/метаданные ресурса и фактические выделенные ID. Сырые сообщения провайдера отбрасываются. Повтор Read может повторить наблюдение, но не изменение.

JSON операций и прямое чтение политики security group используют общий предел 1 MiB байтов, отклоняют дубли ключей на любой глубине и нестандартные числа JSON. Строгий reader группы также защищает обычные наблюдение/удаление выбранного проекта. [Контракт метаданных операции](https://github.com/yandex-cloud/cloudapi/blob/master/yandex/cloud/vpc/v1/security_group_service.proto) upstream и [CLI чтения операции](https://yandex.cloud/en/docs/cli/cli-ref/operation/cli-ref/get) задают внешнюю границу. Тесты используют настоящий scoped-адаптер с runner в памяти, не вызывая CLI или сеть. Надёжная публикация эпох, серверное резервирование/отзыв полномочий, откат и интеграция CLI протоколов остаются задачей #128.

## Надёжное намерение изменения входящих правил и неопределённость отправки

Приватный кодек планов входящих правил сохраняет полный версионированный `IngressDelta`: исходную спецификацию создания, ресурс в заданном scope, ID правил, описания и метки, исходные CIDR, привязку listener к протоколу и nonce операции. Хеш канонических байтов совпадает с прежним отпечатком плана. Декодирование повторно проверяет полный контракт изменения и требует точных канонических байтов; неизвестные поля, дубли, нестандартный JSON, неподдерживаемые расширения моделей и метаданные свыше 1 MiB отклоняются. План не пересобирается из текущих желаемых настроек.

Журнал входящих правил связывает точный план с исходным дайджестом создания, дайджестом предыдущего состояния и коротким сроком действия. Под общей блокировкой проекта `protocol-ingress-pending.json` публикуется до неизменяемого принадлежащего проекту пакета намерения. До одной отдельно разрешённой отправки через SDK состояние надёжно переводится из `prepared` в `dispatching`, означающее неопределённый результат в облаке. Точная возвращённая ссылка на операцию/ресурс/план сохраняется как `recorded` до опроса. Таймаут, истечение срока и внешне прежняя политика не разрешают сбросить состояние отправки или отправить план повторно. До публикации любого намерения резервируется место для максимально допустимой ссылки на операцию. Известное подтверждение можно записать и после истечения срока.

Распознаётся только точная прерванная публикация следующего состояния из проверенного временного файла. Согласование завершает ту же публикацию и не выдаёт новых полномочий. Конфликт намерения, пропущенные/обратные переходы, отсутствие неизменяемых байтов либо другая уже известная операция останавливают восстановление. Исходные ключи и пакеты конфигураций сохраняются. Сохранённое намерение без журнала либо дополнительное неучтённое намерение не принимаются. Перед повторным использованием полного видимого пакета и выдачей полномочий на отправку его проверенные файлы, манифест, каталог пакета и родительский каталог артефактов повторно синхронизируются через закреплённые дескрипторы. Сбой любого барьера не выдаёт разрешение на отправку; существующая неизвестная блокировка публикации сохраняется. Наблюдение журнала только для чтения этих записей не выполняет. Полная допустимая политика может превышать 64 KiB; только этот фиксированный путь журнала использует явный предел метаданных 1 MiB. Для метаданных клиентов сохраняются прежние предел и контракт пути.

Это локальные примитивы хранения без отправки в облако или на сервер и пока без публичной команды управления протоколами. Сам по себе дайджест предыдущего состояния не подтверждает действующую эпоху. Будущий координатор обязан проверить граф эпох, исходные облачные подключения и политику целиком, удерживать серверное резервирование/отзыв полномочий и выполнить проверки согласия и ожидаемого старого состояния SDK. Локальная файловая блокировка не сериализует скопированные контроллеры. API сброса/удаления журнала здесь нет: проверенное завершение эпохи и ограниченный откат остаются частью интеграции. Существующие точки входа жизненного цикла/клиентов отклоняют такой незавершённый журнал или прерванную публикацию до операций провайдера.

## Планирование входящей политики принадлежащего проекту сервера

Приватный `InputPolicy` связывает исходные сети доступа SSH и listener протоколов с неизменяемым пакетом создания и точными исходными байтами `/etc/nftables.conf`. Порядок протоколов сверяется с исходными закреплениями, сохраняя принадлежность протоколу независимо от совпадения UDP-порта. Облачный план создания не пересобирается, ключи не генерируются. Закрытые публичные модели отклоняют скрытые расширения, пересечения источников/портов, listener на TCP 22/UDP 68 и неоднозначные объявления. UDP 68 зарезервирован для безусловного исключения DHCP-клиента. Все скалярные поля цели проверяются до сравнения/фильтрации, в том числе у listener, удаляемого командой disable.

`InputTransition` меняет ровно один listener. Его программа для действующего сервера заменяет только доказанно существующую таблицу `inet flayer_bootstrap` одной транзакцией `nft -f`. Сохраняются SSH, DHCP, loopback, ограничения ICMP, уже установленные соединения и все остальные объявления listener. Пустой активный набор сохраняет административный доступ. Файл для загрузки использует ограниченный `destroy table` и полную таблицу: первый запуск и повторная загрузка идемпотентны без `flush ruleset`. Документированная [семантика `destroy`](https://manpages.ubuntu.com/manpages/noble/man8/nftables.8.html#tables) Ubuntu 24.04 поддерживает этот контракт; предварительная проверка возможностей остаётся обязанностью серверного координатора. Откат восстанавливает прежние разрешения listener с новым маркером операции, не возвращая прежний токен поколения.

Отпечаток native-состояния принимает только одну принадлежащую проекту входящую таблицу и цепочку input с политикой drop, убирает kernel handles/metainfo, сохраняет все упорядоченные выражения правил. Его обязательно сравнивают с ожидаемой программой, скомпилированной во временном сетевом пространстве, по уже принятому в серверной части WireGuard подходу. Сам хеш не доказывает корректность правил или связность. [Контракт атомарной замены](https://wiki.nftables.org/wiki-nftables/index.php/Atomic_rule_replacement) относится к пакету команд целиком; дополнительная разрешающая базовая цепочка всё равно встретит [существующую запрещающую цепочку](https://wiki.netfilter.org/wiki-nftables/index.php/Configuring_chains).

Чистые тесты сохраняют исходный bootstrap и отклоняют расхождения без создания файлов. Проверки настоящих parser/kernel выполняются только в явно изолированных сетевых пространствах Linux CI: отклонённая транзакция сохраняет старую таблицу, действующая замена и повторная/первая загрузка совпадают с изолированной компиляцией, откат сохраняет новый маркер, а посторонняя таблица/счётчик остаётся побайтно эквивалентной. Компонент не выполняет команды. До публичной команды изменения протоколов должны быть интегрированы серверные блокировки/резервирование, проверки квитанций/истории, надёжная публикация загрузочного файла и восстановление.

## Серверное резервирование протоколов и отзыв прежних полномочий истории клиентов

Приватный backend только на stdlib принимает одно закрытое намерение из хешей, связанное с полным владельцем, постоянным созданием, предыдущими общими полномочиями/состоянием, nonce/сроком плана и квитанцией действующего WG либо доказательством полного отсутствия его пространства. Общая блокировка входящих изменений берётся до существующей блокировки WG. Постоянный приватный журнал подготовки предшествует отзыву прежней истории; скопированный контроллер не может подменить намерение с помощью собственной локальной блокировки проекта. При восстановлении записи принадлежащее проекту пространство и все родительские каталоги публикации повторно синхронизируются через закреплённые дескрипторы до отзыва истории или разрешения отправки, даже если после сбоя каталоги уже видимы. Nonce завершённой операции нельзя повторно использовать с новым родителем/историей.

Для активного WG под его блокировкой используется прежний допустимый формат v1 аудита отмены с равными квитанциями. Квитанция установленного корня, ключи, конфигурация, бинарник, интерфейсы и служба сохраняются; связанная история клиентов меняется. Уже поставленные в очередь драйверы клиентов распознают новую историю и отклоняют прежние ожидаемые полномочия. Незавершённые транзакции клиентов/установки блокируют резервирование. Отсутствующий WG требует фактического отсутствия root/unit/интерфейса/NAT/ссылки включения и сохранённой истории клиентов; рабочая квитанция или установка для отзыва полномочий не выдумываются.

`Reserve` надёжно публикует `preparing`, затем `reserved`, повторно используя собственный точный отзыв истории после прерывания. `Expose` расходует единственное разрешение на внешнюю отправку до последующей записи. Повторные вызовы и просроченные планы не выдают его снова; полный временный файл прерванной публикации exposed уже означает неопределённость. `Cancel` принимает только ещё не выданное наружу намерение, сохраняет уже изменённую историю WG и публикует одно неизменяемое завершение cancelled и новый общий указатель до удаления незавершённых метаданных. Точный повтор использует то же завершение. Полный ограниченный обход родителей отклоняет неучтённые записи, потерянные указатели, неизвестные файлы и неподдерживаемые метаданные; отсутствие изменяемого указателя не принимается за новые начальные полномочия.

Обычные точки входа клиентов/установки и текущего самостоятельного обслуживания WG проверяют общий незавершённый журнал под координацией WG. Наблюдение истории остаётся доступным. Существующие callbacks службы сохраняют отдельный контракт запуска/останова уже принадлежащих проекту ресурсов. Исходные неизменяемые серверные пакеты сохраняются; добавление проверок текущего обслуживания не переписывает прежний приватный пакет и не устанавливает его на сервер неявно.

Это приватный backend пока без RPC/публичной команды протоколов. Сам дайджест предыдущего состояния не подтверждает облачную/входящую политику; компонент не применяет nft, не публикует загрузочный файл, не меняет службу и не определяет результат отправленной облачной операции. Завершение после expose и проверенные префиксы отката требуют полного координатора. Тесты используют настоящие приватные POSIX-файлы и блокировки с моделью серверной сети, проверяя отказ старому отложенному запросу клиента, скопированные намерения, фактическое отсутствие, публикацию/повтор, сроки/ёмкость, неопределённую отправку и сохранение исходных байтов runtime/ключей.

## Транзакция зарезервированных входных правил

Приватный backend входных правил на stdlib использует точную раскрытую резервацию.
Составной публичный план связывает хеш облачного плана и полную дельту входных правил
с хешем резервации; один хеш предыдущего состояния не доказывает фактическое состояние.
Контроллер и гостевой код используют общий закрытый формат, генератор правил и
нормализацию native JSON. Ожидаемая таблица компилируется во временном сетевом
пространстве гостя; до записи сравниваются все выражения действующей таблицы проекта.

До замены загрузочного файла сохраняется точный публичный запрос восстановления,
затем атомарно заменяется только `inet flayer_bootstrap`. Сохраняются SSH, остальные
слушатели и таблицы, ключи и runtime WG. Допускаются только описанные последовательности
сначала загрузочного файла, включая перезагрузку или полностью записанный временный
файл. Уже видимый целевой файл и родительский каталог повторно синхронизируются.
Процесс записи nftables наследует оба дескриптора координации, поэтому завершение
родительского SSH-процесса не освобождает блокировки до окончания записи.

Откат возвращает прежние разрешения с новым маркером операции и сохраняет новую
историю гостя. Посторонние полные и частичные файлы и дрейф native-состояния блокируют
восстановление. Повтор терминального вызова проверяет точный результат; после отката
повторное применение запрещено. Статус не исправляет постоянные файлы. Промежуточные
фазы не выдают хеш загрузочного файла или таблицы за терминальный результат.

Это backend входных правил; публичные CLI протоколов и SSH RPC ещё не подключены.
Он не меняет облачные правила и не управляет порядком запуска и удаления сервисов.
Раскрытая резервация остаётся до записи полным координатором облачных, сервисных и
входных квитанций в эпоху; одного результата входных правил недостаточно для завершения.
Тесты используют модель сети и настоящие nftables/backend стандартной библиотеки
только в изолированном пространстве Linux CI. Компьютер и рабочий сервер не меняются.

## Обход сохранённых источников без приватных данных

Обход метаданных источника проверяет полного владельца манифеста, роли файлов,
размеры, чувствительность и полный внешний хеш пакета, не открывая приватные тела.
Исходные источники, изменения клиентов и снимки протоколов сохраняют канонические
хеши ролей material/server даже после потери приватных файлов. Обязательные публичные
файлы намерения и запроса по-прежнему проверяются по точным хешам и закрытым схемам;
одного принадлежащего проекту манифеста недостаточно для принятия противоречивого запроса.

Читатель закрепляет идентичность каталогов, манифеста и публичного файла и отклоняет
неизвестные элементы, небезопасные ссылки и права, изменение состава и обнаружимый
дрейф снимка. Потеря объявленного приватного файла отличается от постороннего файла.
Объявленный приватный хеш — сохранённая ссылка, а не доказательство наличия или
исправности непрочитанного тела. Использование, экспорт и удаление артефактов сохраняют
полную проверку содержимого; обход метаданных не даёт таких полномочий.

Это предоставляет ссылки без приватных данных для будущего графа эпох и полной
облачной очистки после потери клиентских ключей. Переходы протоколов не активируются,
проверки владельца облака и незавершённых операций не обходятся. Указатель эпохи не
выводится из неучтённых артефактов; обычные точки входа всё ещё отклоняют метаданные
неподключённого графа эпох.

## Чтение завершённого графа протоколов

Приватный читатель завершённого графа проверяет неизменяемые пакеты эпох, точное
закрытие предыдущих сегментов WG, закрепления сохранённых ролей источников и полные
ссылки на облачные, входные и сервисные свидетельства. Он отклоняет потерю родителей
и сегментов, неучтённые артефакты клиентов/протоколов/входящих правил, незавершённые
журналы, устаревшие полномочия и превышение лимитов операций и байтов. Полный хеш
итогового пакета эпохи начинает следующий отдельный сегмент клиентов; прежние сегменты
и исходные спецификации создания не меняются.

Облачные свидетельства различают подтверждённое терминальное изменение, отмену до
отправки и завершённую точную обратную операцию. Восстановленные ID и описания правил
остаются фактическими; сохраняются артефакты исходного и компенсирующего намерений.
Входные квитанции связывают применённые, неизменённые или восстановленные байты правил.
Сервисные ссылки закрыты и связаны с источником; одни хеши не подтверждают живой сервис.
Намерение связывает все хеши свидетельств, после чего точное завершение гостя включается
в итоговый пакет без цикла хешей. Порядок публикации и отмена схемы 1 до внешней отправки
описаны в ADR 0024.

Настроенные источники остаются непустыми, но активное подмножество может стать пустым.
История проверяется по хешам deployment из публичных манифестов, сохраняя совместимый
со старым драйвером отзыв полномочий без чтения приватных тел. Обход метаданных работает
после потери клиентских/приватных файлов; обычное использование требует полное содержимое.
Ёмкость должна проверяться до расходования серверных/облачных полномочий.

Намерение эпохи схемы 2 дополнительно связывает полную запись поколения версии 3,
точный хеш конечного нативного журнала и восстановленный составной план с поколением.
Хеш источника поколения выбирает точный настроенный источник WG; обход графа
сверяет закрепления всех трёх исходных файлов с сохранёнными публичными метаданными
сервера. При восстановлении после отключения последовательно записываются барьеры
исходного и нового установленных корней; ключи и адреса сохраняются под новой
квитанцией. Попытка включения, откаченная до полного отсутствия, тоже записывает
барьер нового поколения. Не начатое намерение без применения не заявляет нативное
изменение или новую квитанцию. Нативный откат требует восстановленные входные
правила; подлинная отмена схемы 1 до барьера остаётся отдельным случаем. Чтение
намерений схемы 1 не меняется, приватные исходные файлы для этих проверок не нужны.
Нативная эпоха также сохраняет прежнюю полную сервисную квитанцию либо доказательство
отсутствия каждого другого протокола; один неизменный выбор источника не позволяет
заменить такое свидетельство.

У читателя ещё нет процесса публикации, серверного finalizer схемы 2 и публичного CLI
протоколов. Обычные точки входа отклоняют метаданные эпох до интеграции координатора,
поколений протоколов, аутентифицированной живой аттестации и восстановления. Читатель
не выполняет операций на сервере, в облаке или локальной сети и не выводит фактическую
исправность runtime из локально составленной записи свидетельств.

## Кандидаты поколений WireGuard с привязкой к nonce

Явный кандидат поколения сохраняет исходный установщик, deployment, серверные и
клиентские ключи, проверенный бинарник и лицензию байт в байт. Корень схемы 2 добавляет
отдельно закреплённый lifecycle-helper; обе команды systemd привязаны к новому nonce.
Перед повторным использованием проверяются все файлы и факты исполняющегося ядра;
скачивание, пересборка и генерация ключей не выполняются. Первая штатная подготовка
по-прежнему создаёт схему 1 с прежним форматом unit и проверкой vendor/build.

Callback повторно читает метаданные под существующей блокировкой WG и до изменения
runtime отклоняет старый или отсутствующий nonce, неверный исполняемый файл, дрейф
и занятую блокировку. Дочерние команды наследуют её дескриптор. Транзакции клиентов
сохраняют все восемь закреплённых файлов схемы 2, включая helper, без разрешения менять
helper или unit. Неизвестные файлы и неоднозначные значения схемы отклоняются.

Имя файла unit схемы 2 включает nonce и префикс владельца. Пути корня и транзакции
клиентов остаются постоянными, как и прежние имена схемы 1. Поэтому запоздалая команда
для старого unit не выбирает загруженный callback нового поколения. Выбор пути по
ограниченным метаданным квитанции сам по себе не подтверждает исправность. Полная
проверка требует точный путь unit и отклоняет имена других поколений, неизвестные имена
владельца и оборванные ссылки включения. Проверка полного отсутствия и первая установка
тоже отклоняют такие записи, не удаляя и не принимая их. Status, операции клиентов и
наблюдение резервации используют проверенный unit.

Подготовка кэша записывает только полного неопубликованного приватного кандидата вне
управляемых путей runtime/unit, не активируя его и не предоставляя полномочий. Callback
схемы 2 отклоняет ожидающую резервацию без точного защищённого native-контекста текущего
поколения, запроса/головы и отозванной истории. Обычные remove/recover отклоняют эти поколения
до публикации журнала старой очистки. Приватный native-backend ниже реализует ограниченные
переходы поколений; обычный допуск эпох/публичных протоколов остаётся закрытым до полного
координатора контроллера. POSIX-тесты проверяют реальные
приватные файлы и блокировки только с имитацией сети.

## Журнал кэша поколения под резервацией

`PrepareFresh` сначала собирает полный приватный staged-кэш схемы 1, затем через
тот же путь подготовки из кэша выводит staged-кандидат схемы 2. Явное согласие,
закрепления трёх сохранённых исходных файлов и одобренного текущего receiver/helper,
раздельные канонические пустые приватные каталоги, фактическое отсутствие пространства
и проверки конфликтов предшествуют прежнему vendor-CVE/ядро/build-гейту. Оба снимка
остаются вне управляемых каталогов runtime, полномочий и unit. Сборка бинарника и
проверка конфигурации общие с прямой установкой; её исходный формат данных сохраняется.

До подтверждения повторно проверяются исходные байты и факты исполняющегося ядра.
Квитанция каждого снимка записывается последней после исключительной записи полных
файлов. Прерванные префиксы остаются неопубликованными и отклоняются при повторе.
Подготовка не создаёт ключи, прежнюю транзакцию установки, корень/unit, резервацию,
барьер истории или действующее сетевое состояние. Приватный снимок не является
аттестацией или полномочием на изменение протокола; координатор обязан связать его
с точным зарезервированным запросом поколения и кэша.

Приватный backend кэша связывает полные квитанции сохранённого/нового WG и закреплённые
роли источника с хешем облачного плана и точной дельтой входа в составном запросе схемы 2.
Нужны точная открытая общая резервация и сохранённый отзыв полномочий WG под блокировками
в порядке общая → WG. Подготовка журналируется до записи приватного кэша; сам кэш или
его квитанция не означают полномочий протокола.

Пути кэша задаются полным владельцем и хешем полной квитанции. Проверяются все приватные
байты runtime/конфигурации и сохранённые факты исполняющегося ядра; исходный установщик
хранится как данные. Активные корень, сервис, ключи/конфигурация и отозванная история
сохраняются. Скачивания, сборки, генерации ключей, изменения интерфейса, входа или облака
нет. Тела источника/кандидата приватны, диагностика ограничена хешами/фазами. Лимит кэша
одного сохранённого корня — 12 MiB.

Синхронизируются точный inode каждого файла и все границы каталогов; квитанция пишется
последней. При точном журнале preparing и полных проверенных исходных байтах повтор
может только дописать совпадающий оборванный суффикс или заполнить известные пропуски
после прерванной публикации каталога. Неизвестные/отличающиеся префиксы отклоняются.
Без журнала восстановление оборванного файла не разрешено. Дрейф готового кэша или
потеря его приватных тел тоже отклоняются; завершённый повтор проверяет/синхронизирует
кэш без исходных временных каталогов. Status ничего не исправляет и не выдаёт готовый
кэш за активное поколение.

Схема записи поколения 2 связывает новый кандидат схемы квитанции 2 для включения и
отключения. При отключении кандидат предназначен для восстановления: точные сохранённые
конфигурация/ключи, runtime и факты ядра остаются под новым nonce операции и новым именем
unit. Неопределённая старая остановка не должна выбрать восстановленный старый unit.
Записи поколения схемы 1 читаются для восстановления кэша, но не получают полномочий
входящих правил или незапланированного кандидата под уже открытым хешем плана.

Backend входа принимает такой версионный составной запрос только после подготовки
точного журнала поколения и проверки обоих полных кэшей восстановления. Блокировки
общая → WG по-прежнему защищают наблюдение исходного фактического runtime/истории.
Одна подготовка кэша не разрешает изменение входа: доверенный backend кэша удерживает
и синхронизирует дескрипторы точных файлов и предков на всём участке boot/live-изменений
и проверяет их до публикации конечного журнала входа. Отсутствующие/неготовые кэши,
скопированные намерение/история журнала, изменённые байты или подменённые inode блокируют
дальнейшую запись. Read-only status входа проверяет готовность восстановления без починки
или повторной синхронизации кэша. Составной запрос входа схемы 1 сохраняет прежнее приватное
поведение.

## Защищённые native-переходы WG

Приватный native-backend реализует включение/отключение поколения и откат, оставляя общую
резервацию открытой. Native-допуск требует запись поколения схемы 3 с явным ABI callback.
Хеш helper должен совпасть с утверждённым текущим приватным receiver до закрытия исходного
корня; записи схем 1/2 читаются, но не получают эти полномочия. Хеш допущенного helper
сохраняется: новый утверждённый receiver того же ABI может восстановить операцию без
подмены неизменяемого кандидата. Закреплённые ядро/runtime/конфигурация/ключи не меняются.
Открытие входа схемы 3 требует точной исправной native-записи даже до появления журнала
runtime; подготовка и закрытие сохраняют допустимые пути до native-изменений.

Исходный корень закрывается под блокировками общая → WG до освобождения WG. Родитель
удерживает общую, callback systemctl получает только WG; дочерние команды наследуют
нужные дескрипторы. Синхронизируется точное файловое определение загруженного unit;
до его удаления или подтверждения активации проверяются отсутствие задания, main/control
процессов и populated-поддерева cgroup v2. Нужен явный вывод пустых свойств: без задания
получается Job=, а не Job=0. Уникальный отставленный unit можно снова остановить после
сбоя между намерением и отправкой, но его имя нельзя использовать для восстановления.
Общий forwarding и посторонние протоколы сохраняются.

Публикация/восстановление удерживает точные кэши и проверяет исходную и новую историю.
Откат отключения использует заранее подготовленный новый unit и второе звено отзыва
истории, сохраняя все ключи и адреса. Установленный корень требует точных клиентов/адресов
даже при прерванном удалении; частичная активация разрешена только staged-корню. Оборванные
байты кандидата могут совпадать лишь с закреплённым префиксом источника. Очистка использует
проверенный ограниченный набор имён и сохраняет неожиданные файлы.

Дескрипторы и inode фактических корня, unit, ссылки и каталогов удерживаются и синхронизируются
на конечных барьерах и при подтверждении. Замена квитанции staged/installed имеет отдельные
области проверки. Подмена с теми же байтами обнаруживается либо явно синхронизируется до
следующего подтверждения. Каждый повтор starting синхронизирует определение PID1.
Неактивная ошибка разбора в кэше может наблюдаться до reload; после него идентичность
проверяется строго, чтобы известная оборванная публикация не блокировала восстановление.
После
перезагрузки полная временная конечная запись журнала может завершить публикацию до
перезапуска лишь точного установленного кандидата с полностью отсутствующим ядерным
пространством и завершённым unit. Read-only status сообщает о необходимости восстановления,
не исправляет журнал и не утверждает активность. Частичный дрейф установленных клиентов/
адресов не считается состоянием восстановления после перезагрузки.

Доверенный observer `Origin` дополнительно обрабатывает остановку исходного unit
после точных Reserve/Expose, но до первого нативного допуска, либо в `ready` или
`unchanged`. Такой путь разрешён лишь записи поколения версии 3. До признания полного
отсутствия управляемого ядерного пространства и неактивного завершённого unit с пустой
cgroup проверяются полные исходные квитанция/источник/unit, прежнее ядро и отозванная
история. Частичное ядерное состояние, чужие файлы/unit, задания/PID или устаревшая
история отклоняются до изменения кэша, входа или runtime. Остановка не означает
исправность и не доказывает перезагрузку; первоначальные резервирование и внешняя
отправка по-прежнему требуют прежнее подтверждение исправности. Вызывающий код кэша
и входных правил подключает доверенный observer как зависимость кода, не параметр
JSON. Восстановление окончательно выводит старый unit из использования; откат
восстанавливает заранее заданную новую идентичность с прежними ключами/runtime и
новым звеном истории. Read-only native status сообщает о необходимости восстановления.
Остановленный откат `unchanged` не открывает вход до восстановления; уже восстановленные
входные правила сохраняются.

Порядок облачных действий, общее завершение, публикация эпох с поколениями, координация
первой сборки и публичный CLI протоколов остаются интеграционной работой. Эти приватные
механизмы не означают проверку рабочего сервера/клиента или трафика.

## Оставшаяся интеграция

Добавление/удаление протокола на существующем сервере, миграция схемы 1, явные
наложения облачных/серверных входящих правил
остаются задачей #128. Обслуживание Xray runtime схемы 2 и отдельная команда экспорта
устройства по-прежнему отклоняются до обращения к провайдеру/изменения выходных файлов.
Загрузка, байты bootstrap, метки ресурсов и алгоритмы отпечатков AWG/VLESS схемы 1
остаются прежними.

Нативный экспорт AmneziaVPN `.vpn` и QR остаётся задачей #129. Закреплённые значения
runtime фиксируют выбранную ревизию upstream tools и проверенный SHA256
архива исходников. Одни эти API
не означают, что новый протокол развёрнут или доступен в текущем CLI экспорта.

Детерминированные тесты покрывают настоящее вычисление открытых ключей Curve25519,
цикл кодирования приватного материала, границы секретов устройств, точные полные/
разделённые клиентские настройки, отклонение некорректного приватного ввода
и независимость от посторонних устройств/слушателей. Тесты POSIX-файлов используют
синтетическую модель ядра/служб для аварий, отката, чужого состояния и очистки.
Linux CI дополнительно собирает настоящий закреплённый инструмент и проверяет
вывод ядерного `wg` и JSON nft во временном сетевом пространстве имён, не меняя
локальную или рабочую серверную сеть. Проверка трафика установленных клиентов
телефона/компьютера остаётся отдельным гейтом. Конфигурация не подтверждает связность или воспроизведение
медиа и не выполняет операций с облаком, сервером или локальной сетью.
'''
