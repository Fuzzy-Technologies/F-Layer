body = '''# Границы реализации стандартного WireGuard

Кандидат разработки для релиза 2.1 добавляет низкоуровневые модели стандартного
WireGuard, кодеки приватного материала и рендереры конфигурации. Эти API не входят
в опубликованный пакет 2.0.0. Их архитектура следует
[ADR 0023](../adr/0023-selectable-vpn-transports.md).

## Реализованная основа

`flayer.vpn_selection.VpnProtocolSelection` связывает протокол с явным подмножеством
объявленных идентификаторов устройств. Дополнительные IP-туннели используют точное
сопоставление устройств и приватных адресов. AWG сохраняет прежнее поле адреса
устройства; у VLESS туннельных адресов нет. Порядок канонический, без выделения
адресов и переименования устройств. `Project()` создаёт профиль только с устройствами
и слушателем выбранного протокола, общей идентичностью и политикой маршрутов.
Изменения посторонних устройств, адресов и слушателей не влияют на эту проекцию.
`ParseProtocolSelections()` проверяет состав клиентов, а не полный файл проекта.

`flayer.profiles.wireguard` предоставляет проверенные `WireGuardSettings`,
`WireGuardPeer` и `WireGuardMaterial`, явную генерацию материала и ограниченные
строгие JSON-кодеки. Стандартный WireGuard использует отдельные ключи X25519
и предварительно согласованные ключи на устройство. При повторной подготовке
нужно декодировать сохранённый материал: повторный вызов генератора намеренно
создаёт другие учётные данные. Приватные поля исключены из представления объектов,
некорректный вход не повторяется в сообщениях.

Серверный рендерер выводит только собственный закрытый ключ и открытые/
предварительно согласованные ключи выбранных клиентов. Клиентский рендерер
выводит только закрытый ключ этого устройства, открытый ключ сервера, его
предварительно согласованный ключ, явный адрес, endpoint, MTU, маршруты, DNS
и keepalive. Полей обфускации AWG нет в обеих конфигурациях. Проверять состав
туннеля и адреса до генерации материала. Отклонять общие идентичности Curve25519,
эквивалентные кодировки закрытых скаляров и открытые/повторно используемые предварительно согласованные ключи, некорректные
подсети, TCP-слушатели и несовпадающие порты endpoint клиента.

Публичные API подготавливают байты в памяти. Перед сохранением или передачей байтов учётных
данных нужно проверенное приватное хранилище с контролем принадлежности.
Не помещать их в логи и облачные метаданные. Стабильное имя службы выводится
из полной идентичности стека и не меняется при изменении состава клиентов.

## Реализация управляемой серверной службы

`PrepareWireGuard()` создаёт чувствительный серверный комплект с `server.conf`,
`deployment.json` и автономным `install.py`, а также стандартный `wireguard.conf`
для каждого выбранного устройства. Подготовка выполняется без сети и сохраняет
переданный ключевой материал. Дескриптор связывает полную идентичность владельца
стека, закреплённые исходники tools, точные хеши программы и конфигурации,
открытые ключи клиентов, адреса и политику маршрутов. Закрытых клиентских ключей
в нём нет. Нативный экспорт AmneziaVPN остаётся задачей #129.

Серверная программа реализует первичную установку, точную проверку повторного
запуска, проверку/статус без изменений, запуск/остановку systemd, удаление по
квитанции и восстановление прерванной установки. Это низкоуровневая реализация:
публичный CLI проекта и существующий SSH-приёмник пока не выбирают и не запускают
её. Не запускать программу вручную на рабочем сервере в обход будущего процесса
изменения проекта и входящих правил.

Начальная платформа — Ubuntu 24.04 amd64 с ядром GA 6.8. До сборки tools и
публикации управляемой конфигурации допуск первой установки читает фиксированный
[JSON Ubuntu CVE-2026-98432](https://ubuntu.com/security/cves/CVE-2026-98432.json).
Требуется единственная запись `noble` пакета `linux` со статусом `released`,
а версия пакета работающего ядра должна быть не ниже исправленной версии этой
записи. Описание со статусом `pending`, недоступный ответ, другая ветка ядра или
неоднозначные данные блокируют активацию. На момент реализации Ubuntu указывает
для noble ожидающее исправление; целевая версия не доказывает выпуск исправления.
Установщик не обновляет и не перезагружает ядро и не применяет общесерверное
смягчение уязвимости. Такое обслуживание требует отдельного плана.

Квитанция сохраняет доказательство по конкретной CVE, полную `/proc/version_signature`
работающей сборки Ubuntu, версии пакетов образа/модулей, контрольную сумму исходников
доступного модуля и хеш его файла на диске. Загруженный модуль должен сообщать такую
же контрольную сумму исходников; после создания интерфейса это подтверждение
обязательно до его включения. Отсутствие/несовпадение идентичности сборки или исходников
блокирует действие. Это данные работающей сборки/исходников и отдельный дисковый хеш,
а не хеш работающего образа или загруженной памяти. См. [идентичность ядра Ubuntu](https://ubuntu.com/kernel)
и [ABI модулей ядра](https://docs.kernel.org/admin-guide/abi-stable.html).
Обычный статус, повторная проверка и запуск после загрузки
сравнивают текущее ядро с квитанцией без загрузки метаданных и переустановки tools.
Изменённое ядро требует явного обслуживания политики. Это оценка одной указанной
базовой уязвимости, а не всей безопасности ядра. Статус не заявляет проверку
сквозного трафика или воспроизведения медиа.

Tools собираются приватно из закреплённого по контрольной сумме upstream-архива
`wireguard-tools 1.0.20260223`. Ограниченная распаковка не создаёт ссылок и отклоняет
опасные пути; пропускается только точно опознанная неиспользуемая ссылка wg-quick
из закреплённого архива. Исполняемый файл должен сообщать закреплённую версию и иметь формат Linux
amd64. Каталог службы сохраняет лицензию исходников. Установка пакетов, замена
системных бинарников и запасная userspace-реализация не выполняются. На сервере
уже должны быть средства сборки (`make`, компилятор, заголовки libc), `ip`, `ss`,
`nft`, `unshare`, `modinfo`, `dpkg-query`, Python и systemd.
Квитанция фиксирует хеши и версии исполняемых файлов компилятора/make, целевую
архитектуру, версии пакетов заголовков libc/ядра и точные параметры upstream-сборки.
Во время сборки toolchain не должен меняться; обычный статус не пересобирает tools.

Полный хеш владельца определяет приватный каталог; стабильные имена службы,
интерфейса и таблицы nft используют короткий префикс владельца и полные метки
операции. Для приватных каталогов/файлов строго проверяются владелец и права.
Отклоняются символьные/жёсткие ссылки, лишние файлы, изменённые байты конфигурации,
бинарника/юнита, неизвестные клиенты/адреса, занятые UDP-порты и пересечения
с существующими маршрутами сервера. Приватная блокировка сериализует изменения
контроллера. Вызовы systemd привязаны к точной установленной программе и юниту
и проверяют свои квитанции.

Правила forwarding/NAT используют только выбранный интерфейс, явные адреса
клиентов и объявленные назначения. Точная JSON-политика сначала компилируется
во временном сетевом пространстве имён, затем сравнивается с правилами сервера.
Программа не очищает общий ruleset, не меняет глобальную input-политику,
не перезапускает общую сеть и не сбрасывает IPv4 forwarding других туннелей.
IPv6 на сервере должен быть заранее выключен. Входящие правила облака и сервера —
отдельная интеграция; работающая служба не доказывает доступность UDP-слушателя.

Полный приватный журнал и подготовленные файлы публикуются вместе до активации
службы/интерфейса. Файлы и границы каталогов сохраняются через fsync до активации
и до удаления доказательств очистки. При сбое установки удаляются только доказанно свои объекты.
Удаление/восстановление требуют явного разрешения изменения и точного SHA256
предыдущей квитанции. Журнал хранит несекретные хеши файлов вне удаляемого дерева,
чтобы продолжить прерванную частичную очистку. Чужое или изменённое состояние
сохраняется для диагностики. Зафиксированная рабочая служба не откатывается при
сбое завершения журнала. Обычная установка отклоняет замену, изменения клиентов
и ротацию ключей: для них нужны явные переходы вместо неявной генерации.

## Оставшаяся интеграция

Схема проекта 2, выбор через публичный CLI, интеграция SSH-приёмника, переходы
облачных/серверных входящих правил и точечная регистрация/отзыв остаются задачей #128.
Подключение серверных квитанций, восстановления и удаления к полному жизненному
циклу проекта также впереди. Эта основа
не меняет загрузку и алгоритмы отпечатков AWG/VLESS схемы 1.

Нативный экспорт AmneziaVPN `.vpn` и QR остаётся задачей #129. Закреплённые значения
runtime фиксируют выбранную ревизию upstream tools и проверенный SHA256
архива исходников. Одни эти API
не означают, что новый протокол развёрнут или доступен в текущем CLI экспорта.

Детерминированные тесты покрывают настоящее вычисление открытых ключей Curve25519,
цикл кодирования приватного материала, границы секретов устройств, точные полные/
разделённые клиентские настройки, отклонение некорректного приватного ввода
и независимость от посторонних устройств/слушателей. Тесты POSIX-файлов используют
синтетическую модель ядра/служб для аварий, отката, чужого состояния и очистки.
Linux CI дополнительно собирает настоящий закреплённый инструмент и проверяет
вывод ядерного `wg` и JSON nft во временном сетевом пространстве имён, не меняя
локальную или рабочую серверную сеть. Проверка трафика установленных клиентов
телефона/компьютера остаётся отдельным гейтом. Конфигурация не подтверждает связность или воспроизведение
медиа и не выполняет операций с облаком, сервером или локальной сетью.
'''
