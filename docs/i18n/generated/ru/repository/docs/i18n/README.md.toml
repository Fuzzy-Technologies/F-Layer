# Правила проверки переводов

Английская версия остаётся основной. Русские (`ru`) и китайские (`zh-CN`) переводы требуют редакторского и технического ревью. Владелец разрешил АИне (AIna-Dev) фиксировать ИИ-проверки с указанием авторства по [ADR 0015](../adr/0015-accountable-ai-translation-review.md). Проверенные страницы открываются без видимого уведомления о ревью. При отсутствии или устаревании перевода показывается актуальный английский исходник и фактический статус. Одобрение текста и успешная публикация проверяются отдельно.

```bash
python -m tools.locale_documentation validate
python -m tools.build_locale_sites
```

Сборщик создаёт строгие английскую и локализованные версии сайта из установленного wheel с одним и тем же запретом импортов и зафиксированными инструментами. Он проверяет атрибуты происхождения, ссылки, якоря и достижимость маршрутов. Временный `build-evidence.json` различает `authoredTranslationReviewComplete`, `translationReviewComplete` и `humanReviewComplete`. Состояния генерируемых единиц также записываются по отдельности. ИИ-ревью никогда не учитывается как человеческое, а непереведённые страницы остаются в состоянии missing.

## Идентичность и состояние единицы

Стабильные ID и основной `sourceHash` сохраняют формат данных `fuzzy-doc-unit-v1`. Каждый существующий перевод записывает свой путь и `basedOnSourceHash`. Одно обновление основных метаданных не может сделать устаревший перевод актуальным.

| Состояние метаданных | Отображаемый текст           | Значение для ревью                            |
| -------------------- | ---------------------------- | --------------------------------------------- |
| `missing`            | Актуальный английский текст. | Перевод и его проверка не заявляются.         |
| `draft`              | Локализованный черновик.     | Обязательное ревью не завершено.              |
| `review`             | Перевод на проверке.         | Обязательное ревью не завершено.              |
| `stale`              | Актуальный английский текст. | Исходник или проверенный перевод изменён.     |
| `approved`           | Проверенный перевод.         | Уполномоченные роли сверили текущий исходник. |

Для одобрения нужны роли, выбранные `reviewClass`, имя проверившего, `reviewedAt` в UTC и актуальный `reviewedSourceHash`. По умолчанию `reviewerType` равен `human`. ИИ-одобрение требует явного разрешения в проекте и `reviewerType = "ai"` в каждой записи ИИ-ревью. Дополнительно нужен `reviewedTranslationHash`: SHA-256 текста перевода в UTF-8 с нормализованными переводами строк. Отсутствующая роль, неразрешённый тип проверяющего, изменённый исходник или проверенный перевод приводят к ошибке валидации. Можно записать фактически выполненное ИИ-ревью; выдумывать человеческую личность нельзя.

## Обновление перевода

1. Изучите английское изменение и обновите его основной хеш.
2. Пометьте затронутые переводы как `stale`, сохранив происхождение предыдущих проверок.
3. Сверьте смысл, терминологию, инструкции о принадлежности и разрешении, команды, код, пути и явные якоря заголовков с текущим исходником.
4. Установите актуальный `basedOnSourceHash` и получите фактические проверки уполномоченных рецензентов.
5. Запишите реальный тип, имя и роль проверяющего, время UTC и совпадающий хеш исходника; ИИ-записи также связываются с хешем проверенного перевода.
6. Одобрите только проверенный текст, выполните затронутые проверки и предоставьте CI сборку сайта.

Пути должны оставаться внутри соответствующего языка; незарегистрированные языковые файлы приводят к ошибке. ID понятий и примечания глоссария остаются английскими, а предпочтительные термины переводятся. Ссылки на отсутствующие переводы открывают английскую подстановку выбранного языка.

## Каталоги генерируемого справочника

[ADR 0018](../adr/0018-generated-documentation-translations.md) распространяет ревью с привязкой к исходнику на руководства репозитория, описания API и пояснения реестров. Перевод документа репозитория хранится в `docs/i18n/generated/<locale>/repository/<source-path>.toml`. Каталоги API и реестров содержат записи `[[units]]` внутри того же языка.

Каждая запись содержит `sourcePath`, `sourceHash`, переведённый `body`, `reviewedTranslationHash`, `reviewer`, `reviewerType`, `reviewedAt` с часовым поясом и `reviewRoles = ["editorial", "technical"]`. ID документов имеют вид `repository:<source-path>`; API сохраняет `symbol:<qualified-name>` и добавляет `module:<qualified-name>` для введений модулей. Существующий версионный хеш включает сигнатуру вызываемого объекта, поэтому её изменение также требует ревью. Файлы каталогов должны отслеживаться Git; повторяющиеся и неизвестные ID приводят к ошибке.

Переводы документов сохраняют все заголовки, их исходные якоря и точное содержимое блоков исполняемого кода. Подписи в Mermaid переводятся без изменения ID узлов, связей и направлений. Статическое расширение API переводит объекты документации, сохраняя оригинальные листинги, сигнатуры и байты установленного wheel. Модуль использует переведённый текст только после проверки всех отображаемых описаний. Пояснения реестров переводятся из фактического перечня файлов и символов; пути исходников, код и машинные идентификаторы сохраняют исходное написание.

## Подтверждение публикации

Артефакты сборки содержат полный обнаруженный перечень и реальные состояния ревью для точного коммита. Само ревью не означает развёртывание: публикация требует успешной выкладки Pages из принятого коммита `master`. Стабильный релиз также требует закрытого майлстоуна без открытых пунктов.

Начиная с релиза 2.0 сборщик документации отклоняет любую отображаемую текстовую страницу, если её переводы на оба языка не прошли полную актуальную проверку. Более ранние стабилизационные ветки могут явно включить то же требование:

```bash
python -m tools.build_locale_sites --require-complete-translations
```
