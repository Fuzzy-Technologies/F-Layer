`docs/i18n/units.toml` содержит хеш каждого перевода, имя проверившего, тип проверяющего, роль и время UTC. Последующее изменение требует нового ревью. Проверка текущей ветки не доказывает, что она уже опубликована в Pages.

## Историческая приёмка публикации v1.2.1

Владелец принял PR #66 и #67. Итоговый исходный коммит `master` — `d61cf946ade8d7d018f69351e24a3a0ca51d1079`. [Строгая многоязычная сборка и фактическая публикация Pages](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37861711338) прошли успешно, включая проверку покрытия отслеживаемых файлов, соответствия установленного wheel, ссылок и якорей, а также девяти одобренных написанных страниц каждого языка. На работающих маршрутах `/F-Layer/en/`, `/F-Layer/ru/` и `/F-Layer/zh-CN/` проверены нейтральные названия языков, фирменный слайд и Quick Start. У одобренных страниц сведения о проверке скрыты в метаданных; для отсутствующих переводов генерируемого справочника сохраняется английский текст.

[Task #27](https://github.com/Fuzzy-Technologies/F-Layer/issues/27#issuecomment-6071386490) и [Feature #8](https://github.com/Fuzzy-Technologies/F-Layer/issues/8#issuecomment-6071392694) фиксируют завершение после приёмки публикации. Все три штатные дочерние задачи Feature выполнены. Штатный [майлстоун release-1.2](https://github.com/Fuzzy-Technologies/F-Layer/milestone/3) закрыт без открытых пунктов до стабильной публикации.

[F-Layer v1.2.1](https://github.com/Fuzzy-Technologies/F-Layer/releases/tag/v1.2.1) опубликован после [проверки аннотированного тега и воспроизводимых пакетов](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37862618156). Его тег указывает именно на этот коммит `master`; скачанные wheel, архив исходников и отчёт сборки совпали с проверенными хешами и размерами. Предварительная v1.2.0 остаётся неизменной. Эти записи подтверждают приёмку данной публикации, а не одобрение будущих переводов.
