# Результаты проверки переводов

## Текущая проверка написанных страниц

АИна (AIna-Dev) сверила все **11 написанных английских страниц** с русскими и китайскими переводами 2026-10-09. Для последующих изменений страниц точное время каждой проверки указано в реестре. Проверка охватывает 22 перевода и 44 записи редакторского и технического ИИ-ревью. Одобрение человеком не заявляется. Полномочия и правила привязки к хешам исходника и перевода закреплены в [ADR 0015](../adr/0015-accountable-ai-translation-review.md).

Проверены смысл, естественная инженерная терминология, совпадение команд и кода, разрешение на изменения в облаке, принадлежность ресурсов и очистка, заголовки, ссылки и фактическая доступность релиза. Русский текст теперь объясняет конкретные настройки и действия; для Linux и Yandex Cloud используется слово «каталог». Ссылка на Yandex CLI в русской версии открывает русскую инструкцию провайдера. Раздел установки предшествует Quick Start, который начинается с практического сценария для Yandex Cloud. Для установки v1.2.1 используется существующий релизный wheel, а для нового сценария VPN — wheel явно выбранной предварительной сборки из CI. Публикации в PyPI или стабильного релиза 2.0 не выдаются за состоявшиеся.

Теперь переведены и главная страница API, и страница о проекте. Затем пути фирменных изображений исправлены на основное расположение ресурсов и проверены повторно; точное время этих последующих проверок записано в реестре. На главной API больше нет устаревшего предупреждения о совместимости, относившегося к периоду до 1.0. Локализованные ссылки ведут в API и инженерные справочники соответствующего языка. Новый Quick Start охватывает установку предварительной сборки, настройки приватного проекта, настройку гостевой системы по аутентифицированному соединению, импорт обоих клиентских профилей, проверку DNS и маршрутов и очистку. Независимые ИИ-рецензенты проверили русскую и китайскую терминологию и детали протоколов. Переводы генерируемого API и инженерных справочников хранятся в отдельных каталогах с привязкой к исходникам; эта проверка написанных страниц не одобряет тексты, отсутствующие в этих каталогах.

