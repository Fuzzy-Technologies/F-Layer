body = '''
## Кратко

F-Layer 1.0.0 — первая версионная основа управления инфраструктурой: управление явно закреплёнными за проектом стеками Yandex Cloud, подготовка защищённого SSH-шлюза и диагностика с ограничением нагрузки. Конфигурация, восстановление и очистка проверены воспроизводимыми тестами без сети; развёртывание в реальном облаке и готовность гостевой системы ещё требуют проверки оператором.

## Что изменилось

### Добавлено

- Строгая конфигурация и надёжное сохранение состояния с явным указанием принадлежности стека.
- Инвентаризация Yandex Cloud и операции создания, просмотра состояния и удаления для шести типов ресурсов, включая идемпотентность, восстановление, откат и очистку с проверкой принадлежности.
- Профиль защищённого SSH-шлюза с явными правилами доступа и проверяемыми создаваемыми файлами; закрытые ключи и данные личной инфраструктуры не распространяются.
- Команды status/check и запускаемые по явному запросу HTTP-проверки health/benchmark с ограничением ресурсов.
- Английская документация API из установленного wheel и безопасная публикация Pages только из `master`; в русской и китайской версиях явно обозначены отсутствующие переводы.
- CI без реального облака, завершение связанных Task, очистка веток и ADR 0014 с правилами выборочной истории релизов и формата changelog Fuzzy Technologies.

## Проверки

Сведения о сборке доступны в [релизе GitHub](https://github.com/Fuzzy-Technologies/F-Layer/releases/tag/v1.0.0).

## Несовместимые изменения

Отсутствуют относительно предыдущего стабильного релиза F-Layer: это первая версионная основа. Требования к принадлежности ресурсов и состоянию действуют с первого релиза.

## Попробовать из исходников

```bash
git clone https://github.com/Fuzzy-Technologies/F-Layer.git
cd F-Layer
git checkout v1.0.0
python -m pip install .
python -m flayer --help
python -m flayer check --format json
```

Нужен Python 3.11 или новее. Для изменений в облаке также требуется явно выбранный аккаунт, пути плана и состояния управляемого проекта и разрешение на изменения; перед работой с реальным стеком изучите включённые архитектурные руководства.

## Примечания

- Облачный статус RUNNING не подтверждает готовность SSH и туннеля гостевой системы. Образ гостевой ОС и поведение внешних сервисов необходимо проверить в окружении оператора.
- Загрузка в PyPI не выполняется. Устанавливайте из точного тега или приложенного wheel.
- [Подробная история изменений](https://github.com/Fuzzy-Technologies/F-Layer/blob/v1.0.0/CHANGELOG.md)
- [Состав релиза](https://github.com/Fuzzy-Technologies/F-Layer/milestone/1?closed=1)
