body = '''
## Кратко

F-Layer 1.1.0 упрощает установку и работу с базовой инфраструктурой: типизированный пакет Python, устанавливаемая команда `flayer` и практические руководства по конфигурации, диагностике и первому развёртыванию управляемого шлюза. Для релизных пакетов добавлены проверки повторяемости сборки и принадлежности файлов. Релиз дополняет прежнее поведение; проверка использует изолированные ресурсы и не подтверждает готовность реального облака.

## Что изменилось

### Добавлено

- Типизированный пакет по PEP 561 и консольная команда `flayer` с единым источником версии для исполняемого кода, wheel и архива исходников.
- Повторные побайтно одинаковые сборки wheel и архива исходников, совпадение wheel при повторной сборке из архива, проверка принадлежности содержимого, метаданных и RECORD, а также отчёт сборки.
- Предварительные проверенные пакеты CI и отдельный защищённый ручной workflow PyPI с подтверждением владельца. Этот релиз не включает и не выполняет загрузку в PyPI.
- Руководства по установке, конфигурации провайдера, результатам CLI и первому развёртыванию шлюза с явным указанием принадлежности ресурсов и разрешением на изменения.

### Изменено

- Добавлено семейство логотипов FL в стиле FuzzyRoutines и более понятная навигация документации.
- Столбцы Markdown-таблиц выровнены для удобного чтения исходников; форматирование проверяется.
- В архивах исходников и генерируемой документации приведены команды установки точного стабильного тега, поведение выпущенной консольной команды и подробная история изменений.

### Безопасность

- В сборку включаются только отслеживаемые исходники проекта; отклоняются подменённое содержимое архивов, распознаваемые секреты, опасные пути и неожиданные файлы в корне.
- Публикация в PyPI требует явного разрешения и отделена от GitHub Releases; сохраняются требования 1.0.0 к принадлежности ресурсов и ограниченной области изменений в облаке.

## Проверки

Сведения о сборке доступны в [релизе GitHub](https://github.com/Fuzzy-Technologies/F-Layer/releases/tag/v1.1.0).

## Несовместимые изменения

Нет. Версия 1.1.0 добавляет упаковку, документацию и релизные проверки к интерфейсам 1.0.0; существующие команды `python -m flayer` по-прежнему поддерживаются.

## Попробовать из исходников

```bash
git clone https://github.com/Fuzzy-Technologies/F-Layer.git
cd F-Layer
git checkout v1.1.0
python -m pip install .
flayer --help
python -m flayer check --format json
```

Нужен Python 3.11 или новее. Создание изолированного виртуального окружения и настройка явно ограниченного доступа к облаку описаны во включённом руководстве пользователя.

## Примечания

- Эти проверки без реального облака не заявляют о подтверждении облачного развёртывания, готовности SSH и туннеля гостевой системы, человеческом одобрении переводов или фактической публикации в PyPI.
- Устанавливайте из точного тега или приложенного wheel; загрузка в индекс пакетов выполняется отдельно.
- [Подробная история изменений](https://github.com/Fuzzy-Technologies/F-Layer/blob/v1.1.0/CHANGELOG.md)
- [Состав релиза](https://github.com/Fuzzy-Technologies/F-Layer/milestone/2?closed=1)
