body = '''
## Кратко

**Предварительная публикация.** Версия 1.2.0 остаётся предварительным релизом; завершённое обновление документации доступно в 1.2.1.

F-Layer v1.2.0 упрощает проверку и публикацию документации: каждый отслеживаемый файл отражён в генерируемом справочнике, а маршруты EN/RU/ZH-CN показывают фактическое состояние переводов. В инструменты документации включено исправление безопасности setuptools. Поведение исполняемого кода и CLI остаётся совместимым с 1.1.0; русский и китайский тексты явно обозначены как черновики.

## Что изменилось

### Добавлено

- Реестры файлов и определений, различающие публичный API установленного wheel, отображаемый Markdown репозитория, языковые версии и инженерные файлы, доступные только как исходники.
- Полная навигация по основной Markdown-документации: правилам проекта, шаблонам ADR, архитектуре, разработке, релизным руководствам и шаблону PR GitHub.
- Покрытие API исполняемого CLI и вызываемых протоколов, соответствие всего пакета wheel исходникам, точные якоря, проверка локальных ссылок и достижимости страниц.
- Схемы реализованной архитектуры и строгие многоязычные сборки с локализованной навигацией, уведомлениями о черновиках и подстановках, а также 18 черновыми страницами RU/ZH-CN, связанными с исходниками.
- Реестр переводов с привязкой к исходнику: ссылки на основные исходники и языковые черновики, роли ревью и хеши исходников.

### Исправлено

- Неработающие генерируемые ссылки из материалов ревью репозитория на исходники языковых черновиков; добавлены регрессионные проверки обоих языков и сохранения якорей.
- Команды установки снимка на английском, русском и китайском выбирают `v1.2.0` и сохраняют поддерживаемые консольные и модульные команды.

### Изменено

- Новые файлы существующих категорий покрытия обнаруживаются автоматически; неизвестная или неоднозначная категория и отсутствующее содержимое wheel приводят к ошибке проверки.
- Статус ревью перевода не зависит от успеха сборки. Черновики и отсутствующие переводы обозначаются явно; автоматизация не создаёт одобрений.

### Безопасность

- В инструментах документации зафиксирован setuptools `83.0.0`, исправляющий GHSA-h35f-9h28-mq5c / CVE-2026-59890, вместо уязвимого `80.9.0`.
- Сохранены остальные версии зависимостей документации, сборщик пакета Hatchling, статическое формирование API и существующие требования к принадлежности ресурсов и разрешению на изменения.

## Проверки

Сведения о сборке доступны в [релизе GitHub](https://github.com/Fuzzy-Technologies/F-Layer/releases/tag/v1.2.0).

## Несовместимые изменения

Нет. Исполняемые API, команды CLI, правила сохранённого состояния управляемых ресурсов и поведение провайдеров совместимы с 1.1.0. Релиз добавляет документацию и инструменты проверки.

## Попробовать из исходников

```bash
git clone https://github.com/Fuzzy-Technologies/F-Layer.git
cd F-Layer
git checkout v1.2.0
python -m pip install .
flayer --help
python -m flayer check --format json
```

Нужен Python 3.11 или новее. Вместо установки из исходников можно использовать приложенный wheel; загрузка в индекс пакетов выполняется отдельно под контролем владельца.

## Примечания

- Все 18 написанных страниц RU/ZH-CN остаются черновиками. API и непереведённые справочные материалы используют английский текст; проверенные руководства доступны в 1.2.1.
- Этот релиз не выполняет развёртывание в реальном облаке или загрузку в PyPI.
- [Подробная история изменений](https://github.com/Fuzzy-Technologies/F-Layer/blob/v1.2.0/CHANGELOG.md)
- [Состав релиза](https://github.com/Fuzzy-Technologies/F-Layer/milestone/3)
