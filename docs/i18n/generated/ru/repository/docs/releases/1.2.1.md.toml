body = '''
## Кратко

F-Layer v1.2.1 делает документацию удобнее: начните с практического Quick Start, прочитайте понятное описание продукта и следуйте проверенным русским и китайским руководствам без пометок о черновом переводе. Теперь публикация релиза требует завершённого и закрытого майлстоуна. Поведение исполняемого кода и CLI остаётся совместимым с 1.1.0 и предварительным снимком 1.2.0.

## Что изменилось

### Добавлено

- Quick Start с установкой, локальными проверками без сети, справкой и ссылками на первое развёртывание на английском, русском и китайском.
- Фирменный слайд F-Layer в README и на главных страницах документации, компактный логотип в шапке и квадратная иконка сайта.
- Документированное ревью АИны для всех 18 написанных страниц RU/ZH-CN, привязанное к точным английским исходникам и текстам переводов. Отсутствующие переводы API остаются на английском.

### Изменено

- Поддерживаемые сценарии Yandex Cloud, защищённого SSH-шлюза и диагностики описаны понятным для инженеров и потенциальных покупателей языком.
- Перед стабильной публикацией требуется завершённый штатный майлстоун; заголовки используют `F-Layer vX.Y.Z`, опубликованные теги сохраняются.
- Результаты ревью хранятся в метаданных вместо уведомления на каждой одобренной странице. ИИ-проверки обозначены явно и никогда не называются одобрением человека.

### Исправлено

- Обрезание слайдов на главной и чрезмерный размер логотипа в шапке.
- Русские формулировки о принадлежности ресурсов, китайская терминология виртуальных машин, ссылки локализованной документации и единые примеры установки v1.2.1.
- Проверка актуальности перевода теперь отменяет ИИ-одобрение при изменении самого перевода, даже если английский исходник не менялся.

## Проверки

Сведения о сборке доступны в [релизе GitHub](https://github.com/Fuzzy-Technologies/F-Layer/releases/tag/v1.2.1).

## Несовместимые изменения

Для исполняемых API и команд CLI — отсутствуют. Метаданные ревью документации теперь поддерживают явно разрешённых ИИ-проверяющих; по умолчанию ревью по-прежнему разрешено только людям.

## Попробовать из исходников

```bash
git clone https://github.com/Fuzzy-Technologies/F-Layer.git
cd F-Layer
git checkout v1.2.1
python -m pip install .
flayer --help
python -m flayer check --format json
```

Нужен Python 3.11 или новее. Публикация в индексе пакетов выполняется отдельно.

## Примечания

- Предварительный тег v1.2.0 и проверенные файлы остаются неизменными для прослеживаемости.
- Этот релиз не выполняет развёртывание в реальном облаке и загрузку в PyPI.
- [Подробная история изменений](https://github.com/Fuzzy-Technologies/F-Layer/blob/v1.2.1/CHANGELOG.md)
- [Майлстоун релиза](https://github.com/Fuzzy-Technologies/F-Layer/milestone/3)
