## Кратко

Разверните собственный VPN в Yandex Cloud из одного приватного проекта: AmneziaWG 3.1 и VLESS Reality на одном сервере, с профилями устройств и нативными QR-кодами AmneziaVPN. Управляйте развёртыванием, состоянием, восстановлением и удалением через установленный CLI F-Layer. Облачный аккаунт, сервер и ключи остаются вашими.

## Что изменилось

### Добавлено

- Приватный проект `project.toml` с настройкой ресурсов сервера, идентификаторов устройств, правил доступа и полной либо раздельной маршрутизации IPv4.
- `flayer project init` и `flayer vpn prepare`, `deploy`, `status`, `recover`, `destroy` с явной принадлежностью ресурсов и согласием на облачные изменения.
- Локальный `flayer vpn export --qr` для обоих протоколов: экспорт существующих файлов устройств и нативных профилей AmneziaVPN без изменения ключей и сервера.
- Версионная загрузка расширений, независимые от потребителя контракты интеграционных данных и профиль развёртывания статического сайта с ограниченной областью действия.
- VPN Quick Start и инструкции для ИИ-оператора на английском, русском и китайском.

### Исправлено

- Проверка релизных тегов и публикация PyPI с актуальными метаданными пакета.
- Развёртывание и восстановление установленным пакетом, проверка идентичности SSH-сервера и отчёт о готовности служб.
- Формат профилей AmneziaVPN и совместимость импорта QR-кодов.

### Изменено

- Подготовка, развёртывание и экспорт профилей устройств используют один CLI.
- Разовые расследования и служебные журналы исключены из опубликованной документации.

## Проверки

Воспроизводимые wheel и архив исходников прошли проверку состава; сведения о сборке приложены в `build-evidence.json`. Автоматические проверки охватывают CLI, контракты развёртывания, обработку ошибок, изолированную установку дистрибутивов и документацию на трёх языках.

Владелец принял ограниченную живую smoke-проверку: на Android интернет, обычный YouTube и Speedtest работали через оба протокола; оба нативных QR-кода сканировались и импортировались в AmneziaVPN. Развёртывание и экспорт проверены на разных идентифицированных кандидатах, а не в ходе полной приёмки одной финальной сборки.

## Несовместимые изменения

Для существующих команд CLI и исполняемых API — отсутствуют. Команды VPN добавлены к существующим.

## Попробуйте из исходников

```bash
git clone --branch v2.0.1 https://github.com/Fuzzy-Technologies/F-Layer.git
cd F-Layer
python -m pip install ".[vpn]"
flayer --help
flayer check --format json
```

Нужен Python 3.11+. Для развёртывания VPN требуются Linux/WSL, OpenSSH и авторизованный Yandex Cloud CLI. Git нужен только для работы с исходниками; wheel релиза можно установить напрямую.

## Примечания

- Поддерживается маршрутизация IPv4. Отключите IPv6 на клиенте, чтобы исключить обход туннеля.
- Shorts не работали в живой проверке через оба протокола. Производительность Telegram не установлена. Утечки DNS, соответствие выходного IP, обход через IPv6, полная приёмка восстановления/перезагрузки и удаление живого развёртывания не проверены.
- Дополнительный харденинг и расширенная живая приёмка отложены до следующих версий.
- Публикация PyPI выполняется отдельно от этого релиза GitHub; используйте приложенный wheel, пока `f-layer` 2.0.1 не появится в PyPI.
