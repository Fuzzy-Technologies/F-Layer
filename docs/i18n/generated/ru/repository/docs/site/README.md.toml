# Платформа документации

F-Layer использует шаблон документации Fuzzy Technologies на MkDocs Material. Английские исходники находятся в `content/en/`, а хеши локализации, состояния ревью и глоссарии — в `../i18n/`. Описания интерфейсов Python API остаются в docstrings пакета.

```bash
python tools/build_api_reference.py
python tools/build_locale_sites.py
python tools/build_api_reference.py --serve
python -m tools.locale_documentation validate --output _build/documentation-gates/locales.json
```

При чистой сборке wheel и точные зависимости документации устанавливаются в изолированное окружение. Сборщик запрещает выполнение импортов, создаёт страницы модулей из установленных исходников, строго проверяет ссылки, якоря и локализацию, затем записывает `_build/api-reference/build-evidence.json`. Для воспроизводимых запусков CI без сети можно указать заранее подготовленное виртуальное окружение через `--environment-python PATH`; версии инструментов документации в нём должны точно совпадать с зафиксированными.
Размещайте это окружение вне `_build/api-reference/`: сборщик пересоздаёт данный каталог. Если при создании окружения в управляемый каталог сборки восстановились устаревшие результаты, сборка завершается ошибкой до публикации и требует внешнее проверенное окружение.

Для генерируемых символов API используется та же схема хеширования исходников из шаблона, а реестр создаётся временно. Состояние локализации определяется фактическими переводами и записями ревью; создание реестра само по себе не создаёт перевод или ревью.
Скопированный валидатор сохраняет исходную схему хеширования, ключи схемы и смысл ревью; внутренние идентификаторы следуют стилю проекта.

Многоязычный сборщик показывает одобренные страницы RU/ZH без уведомлений о черновике, а для отсутствующих и устаревших переводов использует актуальный английский текст. Он сохраняет запрет импортов установленного wheel и строгие проверки ссылок и якорей, добавляет подтверждение доступности каждого маршрута и никогда не создаёт одобрения от имени человека. Хеши исходного текста не позволяют скрыть устаревший перевод обновлением основного реестра. См. [правила локализации](../i18n/README.md).
[Снимок результатов ревью](../i18n/review-snapshot.md) фиксирует текущие проверки
переводов, историческую приёмку публикаций и сведения о проверявших.

PR и `develop` загружают файлы предварительной сборки. Только принятый push в `master` может опубликовать Pages. Маршруты: `/F-Layer/en/`, `/F-Layer/ru/`, `/F-Layer/zh-CN/`.
Зависимости документации отделены от метаданных исполняемого пакета и находятся в `../requirements-api.txt`.

## Подтверждение полноты

[Требования к покрытию](../development/documentation-coverage.md) различают отображаемый Markdown, генерируемый публичный API и файлы, доступные только как исходники по явно указанной причине. `_build/api-reference/repository-coverage.json` перечисляет каждый отслеживаемый файл и определённый символ пакета. Неизвестные или пересекающиеся категории, отсутствующие в wheel исходники, лишние или изменённые файлы пакета, отсутствующие якоря API и существующие, но недостижимые страницы Markdown приводят к провалу сборки.

Страница покрытия содержит ссылку на каждый файл или страницу. В неё входит весь основной Markdown репозитория, включая шаблоны ADR, правила проекта, руководства по релизам и шаблон PR GitHub. [Архитектурный справочник](../architecture/reference.md) связывает реализованные компоненты и схемы с текущими интерфейсами исходного кода.

Wheel устанавливается в новый управляемый каталог независимо от выбранного окружения инструментов документации. Окружающая или ранее установленная версия F-Layer не может повлиять на обнаружение API, а установка пакета не изменяет это окружение. Проверенный английский сайт собирается в новое дерево публикации до создания языковых подстановок; восстановленные соседние маршруты отбрасываются.
'''
