body = '''
# AGENTS.md

## 用途

此文件是 AI 代理、Codex 会话、IDE 助手、自动化程序及其他处理 F-Layer 的软件代理必须首先阅读的入口。

修改代码或文档前，必须阅读并遵守 [DEVELOPMENT_PROTOCOL.md](DEVELOPMENT_PROTOCOL.md)。它是仓库开发的权威协议。

## 仓库边界

- 仅在本仓库内工作，除非所有者明确授权在当前任务中使用其他仓库或外部系统。
- 不得检查或修改父目录、相邻仓库、用户主目录中的数据、挂载的共享资源或无关的本地存储。
- 凭据或工具可用，并不意味着已经获得访问基础设施的许可。
- 只读取任务所需文件；优先使用有针对性的搜索和有限片段，不要无范围地输出大量内容。

## 基础设施安全

F-Layer 用于管理基础设施。在测试和开发中，除非所有者明确授权了具体操作，否则不得修改真实云资源。

默认规则：

- 云服务测试使用模拟实现、测试数据或仓库定义的隔离资源；
- 禁止在真实账户中执行创建、更新或删除操作；
- 凭据和机密不得进入模型上下文，也不得提交；
- 清理、回滚、幂等性以及失败时的行为都是必须明确定义的接口要求。

## 语言

- 源代码、注释、文档字符串、提交信息、ADR、权威文档、模式定义、CLI 命令和仓库元数据均使用英语。
- 本地化文件可以使用对应的目标语言。
- 面向用户的交流可以使用用户的语言。

## 强制开发规则

- 遵守 `DEVELOPMENT_PROTOCOL.md`。
- 影响架构的变更需要 ADR 或明确记录的设计决策。
- 如果确定性工具和测试能够回答问题，应优先使用它们。
- 变更应保持精简、便于评审，并限定为一个目标。
- 不要将行为变更与无关的格式调整或清理混合提交。
- 没有相应测试和验证结果，不得宣称完成。
- 不得在受跟踪文件中加入私有基础设施标识符、本机路径、凭据、令牌或机密。

## Git 工作流

- `master` 表示稳定、已发布的状态。
- `develop` 是集成分支。
- 常规工作使用 `feature/*`、`fix/*`、`release/*` 或 `hotfix/*` 分支。
- 不得将普通实现变更直接推送到 `master` 或 `develop`。
- 自动化代理可以在授权范围内准备分支、提交和 pull request，但没有所有者的明确指示，不得合并自己创建的 PR。
- 不得向受保护分支强制推送，也不得改写已经发布的历史。

## 受保护的规则文件

`AGENTS.md` 和 `DEVELOPMENT_PROTOCOL.md` 由所有者控制。代理可以读取和引用，但未经所有者明确授权，不得修改、替换、删除这些文件，或削弱其中的要求。

## 完成工作

报告完成之前：

1. 检查实际 diff；
2. 运行针对性测试；
3. 在可用时运行标准完整检查；
4. 确认变更中没有机密、私有标识符或无关文件；
5. 按需更新文档；
6. 报告实际验证结果、失败情况以及仍未确定的事项。

如果某项必需检查无法运行，必须明确标注为未运行。不得把未执行的检查记为 PASS。
'''
