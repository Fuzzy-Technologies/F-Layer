body = '''# F-Layer 变更记录

按时间记录 F-Layer 已发布的行为、兼容性、文档和安全边界。发布条目遵循 [ADR 0014](docs/adr/0014-scoped-releases-and-changelog.md)。

# 主版本 2

通过已安装的 CLI 部署自建 VPN 并管理设备配置。

## 次版本 2.0

### 补丁 0 — v2.0.0 — 2026-10-11

#### 摘要

- 从一份私有配置在自己的 Yandex Cloud 服务器上部署 AmneziaWG 3.1 与 VLESS Reality。导出现有设备配置及 AmneziaVPN 原生二维码，不修改密钥或服务器。

#### 新增

- 通过已安装的 CLI 初始化、准备、部署、检查状态、恢复和删除私有 VPN 项目。
- 可配置服务器规格、管理访问、各设备标识，以及完整或分流的 IPv4 路由。
- 两种协议的离线 `vpn export --qr`，验证产物归属、采用私有输出权限，并提供 AmneziaVPN 原生配置。
- 英文、俄文和中文 VPN 快速入门及 AI 操作指南。

#### 修复

- 已安装软件包的部署/恢复，以及 SSH 身份和就绪状态检查。
- AmneziaVPN 原生配置与二维码导入兼容性。

#### 变更

- 将自建 VPN 作为 2.0 的主要工作流，保留现有基础设施、SSH 网关及诊断命令。
- 将一次性调查、运行日志和临时审计排除在发布文档及源码分发之外。

# 主版本 1

首个带版本的基础设施基础。真实云账户中的运行验证仍由操作者负责。

## 次版本 1.2

### 补丁 1 — v1.2.1 — 2026-10-09

#### 摘要

- 提供实用入门说明及更清楚的英文、俄文和中文指南。编写的译文已经 AIna 验证，不再显示草稿提示。运行时和 CLI 约定仍与 1.1.0 兼容。
- 以发布前检查已关闭里程碑的方式完成 release-1.2；保留预发布 v1.2.0 标签及文件。

#### 新增

- 三种语言的 Quick Start，包括离线检查、帮助和部署入口。
- README 与文档中的公司幻灯片、紧凑页眉标志和网站图标。
- 全部 18 个 RU/ZH-CN 编写页面的编辑及技术 AI 评审记录，同时绑定当前英文原文和已评审译文。

#### 调整

- 面向工程师和潜在客户，直接说明受支持的云服务器、安全 SSH 网关和诊断流程。
- 稳定发布前要求原生里程碑完成并关闭。
- 已批准页面的评审来源保存在元数据中，不显示评审提示；缺失或过期翻译继续明确回退到英文。

#### 修复

- 文档幻灯片被裁切及页眉标志过大的问题。
- 俄文资源归属措辞、中文虚拟机术语、本地化链接，以及一致的 v1.2.1 安装说明。
- 拒绝未经授权的 AI 批准；原文或译文变化会使批准失效。

### 补丁 0 — v1.2.0 — 2026-10-08

#### 摘要

- 预发布文件：由于 release-1.2 验收尚未完成，其过早设置的稳定分类于 2026-10-08 撤回。现有 v1.2.0 标签和文件保留；当时的最新稳定版仍为 v1.1.0。
- 可浏览完整仓库文档和显示明确翻译状态的 EN/RU/ZH-CN 路由，并使用修复后的文档构建依赖。1.1.0 运行时与 CLI 继续受支持；RU/ZH-CN 文字仍为草稿。

#### 新增

- 逐文件文档清单，为每个受跟踪文件记录明确类别及理由，包括既定类别中未来新增的文件。
- 可导航的权威 Markdown，覆盖仓库入口、政策、架构、ADR 及模板、开发指南和发布历史。
- 已安装 wheel 的 API 覆盖包含可执行 CLI 模块和可调用协议；私有定义具有可追溯的仅源码记录。
- 已实现架构参考，包括组件组合、生命周期与恢复、文档与分发图示。
- 严格 EN/RU/ZH-CN 构建、本地化导航、18 个编写的草稿页面、明确英文回退，以及绑定原文哈希的评审交接资料。

#### 修复

- 生成的仓库页面现在将 RU/ZH-CN 草稿链接保留为源码引用，而不是链接到不存在的权威页面。回归检查覆盖两种语言和保留的标题片段。
- 三种语言中的快照安装示例均选择 `v1.2.0`，不再让读者使用包含更后续代码的开发副本。

#### 调整

- 要求整个包的源码与已安装 wheel 的文件清单和字节完全一致，包括私有模块及可执行入口。
- 发布前验证渲染 API 锚点、所有本地链接、仓库页面可达性、Markdown 表格对齐和明确文件分类。
- 当前草稿译文绑定实际英文原文哈希。draft、stale、missing、review、approved 状态保持区别；生成 API 翻译仍明确标为缺失。

#### 安全

- 文档 setuptools 固定版本从 `80.9.0` 更新到已修复的 `83.0.0`，对应 GHSA-h35f-9h28-mq5c / CVE-2026-59890。其他文档依赖及 Hatchling 分发后端不变。
- 保留静态 API 发现和运行时导入保护、源码归属、限定范围的云修改及仅从 master 发布 Pages。本发布不意味着人工翻译批准、真实云就绪或 PyPI 上传已经完成。

## 次版本 1.1

### 补丁 0 — v1.1.0 — 2026-10-05

#### 摘要

- 将 F-Layer 安装为带类型信息和 `flayer` 控制台命令的 Python 包，按实用配置及网关指南操作，并查看经过审计、可复现的发行包。1.0.0 的运行时约定继续受支持。

#### 新增

- PEP 561 类型元数据、安装后的控制台入口，以及由运行时和发行元数据共享的单一字面量版本来源。
- 离线发行包安装和源码归档重建检查。
- 可复现 wheel/源码归档审计、元数据与 RECORD 验证、受跟踪源码归属检查，以及可下载的构建记录。
- CI 发行包预览及独立保护的手动 PyPI 发布工作流，要求所有者明确配置并确认。
- 安装、云服务配置、CLI 输出和首次部署归属明确的安全网关的用户指南。

#### 调整

- 使用 FuzzyRoutines 风格的 FL 标志系列和更清晰的指南导航。
- 按内容对齐 Markdown 表格列，并在 CI 中检查格式。
- 记录稳定标签安装和已发布控制台命令；源码归档与生成文档包含发布历史。

#### 安全

- 拒绝不属于项目、被修改、缺失或不安全的归档内容及可识别凭据；将变更记录作为明确属于项目的根文件纳入。
- 保留 1.0.0 的资源归属和修改授权要求。GitHub 发布不会启用 PyPI 上传，也不验证真实云访问。

## 次版本 1.0

### 补丁 0 — v1.0.0 — 2026-10-05

#### 摘要

- 为归属明确的 Yandex Cloud 环境建立首个带版本 F-Layer 基线：配置、检查、创建和删除基础设施，准备安全 SSH 网关，并运行有资源限制的诊断。

#### 新增

- 严格 TOML 配置、明确资源栈归属、持久化状态，以及分别定义的资源期望与观测状态接口。
- Yandex Cloud 资源清单和六类资源生命周期支持：网络、子网、防火墙组、公网地址、启动盘及实例。
- 可恢复的 create/status/destroy 编排，具有范围限定的修改授权、幂等性、中断恢复及反向顺序清理。
- 安全 SSH 网关部署配置、由 root 拥有的客户机配置、明确的管理员与设备访问规则，以及经验证的所属生成文件。
- 本地 status/check 命令和显式启用的 HTTP health/benchmark 探测，限制时间、请求次数及响应大小。
- 从已安装 wheel 生成的英文 API 文档、Fuzzy Technologies 品牌风格、明确标示不可用翻译的 RU/ZH 路由，以及仅从 master 部署 Pages。
- 离线测试隔离、确定性 Python CI、关联 Task 完成和安全的已合并分支清理。

#### 调整

- 将初始版本元数据替换为明确的 1.0.0 源码与软件包身份。源码发行包包含变更记录及网关示例。
- ADR 0014 记录按里程碑限定范围的发布选择与易读变更记录；发布说明记录准确的已接受源代码变更。

#### 安全

- 修改云资源前要求明确归属与修改授权；拒绝其他项目资源及不安全的生成文件替换。
- 仅持久化恢复和清理所需的资源标识符。凭据、私钥、生成文件包和本地状态不受 Git 跟踪。
- 诊断不会隐式发现目标。云端 RUNNING 不证明客户机服务就绪。测试使用隔离模拟实现，不修改真实云资源；真实部署和 SSH 访问不属于发布检查的验证结果。

