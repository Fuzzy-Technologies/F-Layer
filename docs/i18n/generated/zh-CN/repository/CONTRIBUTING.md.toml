body = '''
# 参与 F-Layer 开发

F-Layer 采用 Fuzzy Technologies 的开发流程。

开始贡献前：

1. 阅读 [AGENTS.md](AGENTS.md) 和 [DEVELOPMENT_PROTOCOL.md](DEVELOPMENT_PROTOCOL.md)；
2. 从 `develop` 创建独立的 `feature/*` 或 `fix/*` 分支；
3. 将实现关联到 GitHub 中类型为 Task 的任务；
4. 根据所修改的组件边界补充测试和验证结果；
5. 使用仓库模板向 `develop` 提交 pull request。

不得提交凭据、私有基础设施标识符、本机绝对路径或特定环境的机密信息。

影响架构的变更必须随实现一并提交相应的 ADR。
'''
