body = "# F-Layer 开发协议\n\n## 状态与效力\n\n协议版本：`0.1`  \n项目：**F-Layer by Fuzzy Technologies**\n\n本文档规定仓库长期适用的开发规则。人工贡献者、AI 代理、脚本和 CI 作业均应遵守。\n\n## 1. 基本原则\n\n开发按以下顺序进行：\n\n```text\narchitecture / contract\n→ implementation\n→ tests\n→ evidence\n→ documentation\n→ review\n```\n\n代码看起来正确并不代表变更已经完成。完成工作需要相应的测试及验证结果。\n\n## 2. 项目定位\n\nF-Layer 是模块化基础设施自动化平台，用于部署、管理和集成安全的云环境。\n\n核心必须独立于任何单一云服务商、传输或网络协议、部署配置、使用方应用，以及 Fuzzy Technologies 的私有或本地基础设施。\n\n特定云服务商、部署方式和集成的行为应通过明确的接口实现，而不是直接嵌入核心。\n\n## 3. 仓库语言\n\n源代码、注释、文档字符串、文档、ADR、提交信息、工作流、模式定义、CLI/API 名称、issue 和 pull request 的权威语言均为英语。本地化文件是常规例外。\n\n## 4. GitHub 规划模型\n\n使用 GitHub 原生元数据作为规划信息的权威来源。\n\n```text\nMilestone\n└── Feature\n    ├── Task\n    └── Task\n```\n\n每个规划中的 Feature 和 Task 都必须设置原生 Type、Priority、Effort、Milestone、原生父子任务关系；进入开发后还必须设置 Assignee。\n\n标题描述工作内容，不要在标题中重复规划元数据。\n\n## 5. 分支与发布流程\n\n标准分支：\n\n- `master`：稳定、已发布状态；\n- `develop`：下一版本的集成分支；\n- `feature/<name>`：从 `develop` 创建的功能或任务实现分支；\n- `fix/<name>`：从 `develop` 创建的非发布流程修复分支；\n- `release/<version>`：发布稳定化分支；\n- `hotfix/<name-or-version>`：从 `master` 创建的紧急修复分支。\n\n正常流程：\n\n```text\nfeature/* or fix/* → develop → release/X.Y.Z → master → tag vX.Y.Z\n                                           └──────────→ develop\n```\n\n普通实现变更不得直接推送到 `master` 或 `develop`。普通 PR 合并到 `develop` 时默认采用 squash merge。\n\n详细发布规则见 [docs/RELEASE_WORKFLOW.md](docs/RELEASE_WORKFLOW.md)。\n\n## 6. Pull request\n\n每个实现 PR 必须具备：\n\n- 目标分支为 `develop`，明确的发布、紧急修复或发布到外部平台的流程除外；\n- 负责人；\n- 与主要实现任务一致的原生 Milestone；\n- 可用时设置适当的 PR 标签；\n- 指向每个已完成 Task 的明确关闭引用；\n- 变更说明和验证结果；\n- 适用的安全与兼容性说明。\n\n可用于关闭 Task 的关键字包括 `Closes`、`Fixes`、`Resolves` 和 `Implements`。\n\n默认情况下，合并需要人工评审。没有所有者的明确指示，自动化代理不得合并自己创建的 PR。\n\n## 7. Python 代码风格\n\nPython 风格的权威规则见 [docs/development/PYTHON_CODE_STYLE.md](docs/development/PYTHON_CODE_STYLE.md)。\n\n关键约定：\n\n- 函数和方法使用 `PascalCase`；\n- 类、协议和枚举使用 `PascalCase`；\n- 变量、参数和字段使用 `snake_case`；\n- 常量使用 `UPPER_SNAKE_CASE`；\n- 源代码、注释、文档字符串、测试和断言信息仅使用英语；\n- `ruff format` 不是项目标准格式化工具，不得作为全仓库格式检查使用。\n\n外部接口规定的名称优先于纯格式上的统一要求。\n\n## 8. 架构与 ADR\n\n影响架构的工作必须在实现前或随实现一起给出明确的设计决策。\n\nADR 存放在 [docs/adr/](docs/adr/) 中。记录应说明背景、决策、后果、替代方案，以及适用的兼容性或迁移影响。\n\n不要引入没有实际需求的抽象。只有抽象代表真实稳定的接口，或至少有两个合理的使用方时，才应添加。\n\n## 9. 配置与状态\n\n配置、期望状态、云服务的观测状态和生成文件是不同的概念。\n\n- 凭据不得放入受版本控制的配置；\n- 持久化状态只保存管理资源所需的最少标识符；\n- 生成文件必须有明确的归属和生命周期；\n- 清理与回滚行为必须明确；\n- 部分部署和中断的操作必须以安全方式失败，并保留可诊断的信息。\n\n## 10. 云服务商与部署边界\n\n云服务商专用代码负责云 API 细节、认证适配器、能力发现和资源描述转换。\n\n部署配置组合云服务商的能力，形成用户需要的基础设施结果。\n\n核心负责通用接口和操作编排语义，不得假定特定云服务商、地域、网络协议或本地环境。\n\n## 11. 测试\n\n`pytest` 是标准 Python 测试运行器。\n\n```text\ntests/\n├── unit/\n├── contract/\n├── functional/\n├── integration/\n└── e2e/\n```\n\n项目初始阶段可以从 `tests/unit/` 开始。基础设施、清理、回滚、资源管理和错误分支必须有确定性测试，不得调用真实生产基础设施。\n\n## 12. 标准完整验证\n\n```bash\npython -m compileall -q src tests tools\npython -m ruff check .\npython -m mypy\npython -m pytest\n```\n\n此后修改任何受跟踪文件，都会使之前的完整验证结果失效；报告变更可供评审前必须重新运行。\n\n## 13. 安全与机密\n\n不得提交凭据、令牌、私钥、Cookie、会话数据、私有基础设施标识符或本机机密信息。\n\n修改真实云资源需要所有者对具体任务的明确授权。可能修改或删除资源的云操作必须限定范围、定义清理行为，并测试失败路径。\n\n## 14. 本地与私有状态\n\n不得提交虚拟环境、IDE 元数据、缓存、覆盖率输出、本地数据库或状态、生成报告、日志、凭据、构建产物、本机绝对路径或 NAS 引用。\n\n## 15. 文档\n\n文档分工如下：\n\n- `README.md`：项目简明入口；\n- `docs/architecture/`：架构；\n- `docs/adr/`：决策；\n- `docs/development/`：工程指南；\n- 后续本地化文档：EN/RU/ZH 用户文档。\n\n文档必须区分已经实现的行为和路线图中的方向。\n\n## 16. 合并后自动化\n\nPR 实际合并后，自动化可以解析明确的关闭引用、核实原生 `Task` 类型、添加完成说明、将 Task 标记为已完成，并安全删除同仓库中已合并且未受保护的分支。\n\n不能仅因一个子 Task 已合并就自动关闭 Feature。\n\n## 17. 完成标准\n\n只有工作范围和接口已明确、实现与相关测试已完成、失败行为已考虑、diff 中没有机密或私有本地数据、必要文档已更新且必需检查全部通过，工作才算完成。\n\n必需检查未运行或失败时，必须明确报告。\n\n## 18. 提请所有者决定\n\n执行破坏性或含义不明确的操作、扩展到其他系统、修改尚未获授权的真实云资源、更改安全策略、破坏公开兼容性、作出许可证或商标或产品决策，以及修改 `AGENTS.md` 或本协议前，必须停止并征求所有者意见。\n"
