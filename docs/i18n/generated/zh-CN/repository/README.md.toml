# F-Layer

![Fuzzy Technologies 工程实验室中的 F-Layer 与 AIna](https://raw.githubusercontent.com/Fuzzy-Technologies/F-Layer/master/docs/site/content/en/assets/brand/FTech-card-F-Layer.png)

**通过 Python 或命令行部署云服务器、管理资源并检查可用性。**

F-Layer 根据部署配置创建云资源，并在本地记录所创建的资源。
这些记录用于检查部署、恢复中断的操作，以及删除属于当前部署的资源。
它可以自动化服务环境，也可以为应用程序提供可复用的基础设施管理能力，
无需为每个场景维护独立的部署脚本。

**2.0 预发布版本**可以在 Yandex Cloud 部署同时运行 **AmneziaWG 3.1** 和
**VLESS Reality** 的服务器，并为每台设备导出独立连接设置。安装该版本的 wheel，
初始化私有项目，填写云配置，再从 CLI 执行部署。已发布的 **v1.2.1** 支持安全
SSH 网关和 HTTP 检查，不包含新的 VPN 命令。2.0 稳定版尚未发布。
其他云平台需要相应的适配器。云资源由云服务商计费；F-Layer 按 Apache 2.0
许可证开源。

[文档](https://fuzzy-technologies.github.io/F-Layer/zh-CN/) ·
[快速开始](https://fuzzy-technologies.github.io/F-Layer/zh-CN/guide/) ·
[首次部署](https://fuzzy-technologies.github.io/F-Layer/zh-CN/guide/first-deployment/) ·
[API 参考](https://fuzzy-technologies.github.io/F-Layer/zh-CN/api/) ·
[更新日志](https://github.com/Fuzzy-Technologies/F-Layer/blob/master/CHANGELOG.md) ·
[发布版本](https://github.com/Fuzzy-Technologies/F-Layer/releases)

## 安装

需要 Python 3.11 或更新版本。在虚拟环境中安装发布的 wheel 文件；
不需要 Git 或 Docker：

```bash
python -m venv .venv
```

在 Linux/macOS 中运行 `source .venv/bin/activate` 激活环境；
PowerShell 使用 `.venv\Scripts\Activate.ps1`，Windows 命令提示符使用
`.venv\Scripts\activate.bat`。然后运行：

```bash
python -m pip install https://github.com/Fuzzy-Technologies/F-Layer/releases/download/v1.2.1/f_layer-1.2.1-py3-none-any.whl
python -m flayer --help
python -m flayer check --format json
```

预期结果：本地检查输出 `"status": "ok"`，退出码为 `0`。
它检查 Python 和软件包是否可用，不需要云凭据或网络访问。
这只是安装后的首次检查，并不会部署服务器。

## 快速开始

按照 [2.0 预发布版本快速开始](https://fuzzy-technologies.github.io/F-Layer/zh-CN/guide/)
安装包含 `vpn` 可选依赖的预发布版本，创建私有项目，在 Yandex Cloud 部署，
并导入生成的客户端设置。指南涵盖两种协议、DNS 和路由检查，以及云资源删除。
如果使用上文安装的已发布 v1.2.1 软件包，请阅读
[SSH 网关指南](https://fuzzy-technologies.github.io/F-Layer/zh-CN/guide/first-deployment/)。

## 可以实现什么

- **受管云环境：**使用同一份配置和状态文件创建、检查、恢复、删除所属部署的资源。
- **2.0 预发布版本中的私有 VPN 服务器：**同时部署 AmneziaWG 和 VLESS Reality，
  分别生成各设备的客户端文件，并明确清理所属云资源。
- **访问受控的 SSH 网关：**准备服务器配置，并为各设备生成仅通往明确允许目标的 SSH 本地转发。
- **运行检查：**检查 HTTP 端点，在指定限制内测量响应和传输耗时，并输出可供自动化使用的 JSON 报告。
- **应用程序集成：**在自己的工具中复用 Python 配置、提供方和资源生命周期 API。

[架构文档](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/docs/architecture/README.md)
说明了这些部分的协作方式。稳定版本在 `master` 上打标签，更新日志记录发布范围。
`develop` 还包含已接受、计划进入后续版本的工作。

## 参与开发

请阅读 [AGENTS.md](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/AGENTS.md)
和 [DEVELOPMENT_PROTOCOL.md](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/DEVELOPMENT_PROTOCOL.md)。
运行 `python tools/build_api_reference.py`，从已安装的 wheel 构建 API 文档；
详见[文档环境设置](https://github.com/Fuzzy-Technologies/F-Layer/blob/develop/docs/site/README.md)。

