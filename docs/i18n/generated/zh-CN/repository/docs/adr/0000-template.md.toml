# ADR 0000：决策名称

- 状态：提议
- 日期：YYYY-MM-DD
- 相关任务：#NN

## 背景

说明需要作出决策的问题、约束和影响因素。

## 决策

清楚说明选定的架构或契约。

## 影响

说明优点、缺点，以及对兼容性、运维和迁移的影响。

## 考虑过的替代方案

列出可行的替代方案，并解释未采用的原因。

## 验证

说明如何通过实现验证该决策达到了预期目标。
'''
