body = '''
# ADR 0001：将部署配置与所属资源的状态分离

- 状态：已接受，进入实现
- 日期：2026-10-04
- 相关任务：#2、#18

## 背景

F-Layer 以一套已可运行、但针对特定应用的自动化方案为基础。原方案将云服务商设置、网关设置、默认区域、凭据路径以及特定计算机上的产物路径放在同一份配置中。它的资源状态文件有实际用途，但缺少带版本的模式，也没有在读写时明确检查资源归属。

在服务商连接器和部署生命周期操作能够安全协作之前，可复用的核心必须先有稳定的标识。读取缺失或损坏的配置不能隐式选择另一个环境；保存新快照也不能覆盖其他资源栈的资源清单。

## 决策

使用标准库实现 `flayer.core`，并划分三个职责：

- `contracts` 负责模式版本验证、不可变的 `StackIdentity`，以及跨服务商通用的资源归属标签。
- `config` 严格读取 TOML，生成不可变的 `DesiredConfig`、`DesiredResource` 和 `SecretReference` 模型。
- `state` 严格读取 JSON，生成不可变的 `StackState` 和 `ResourceState` 模型，并负责原子化的本地持久化。

期望配置和持久化状态均声明模式版本 `1`。未知版本、未知字段、错误类型和不完整标识均为错误。不隐式设置服务商、项目、区域、凭据、环境覆盖值或存储路径。允许期望资源数组为空；这种配置不会隐式创建基础设施。

资源栈标识包含 `project`、`stack`、`provider`、`scope_id` 和 `owner_id`。读取、写入或删除状态时，五个字段都必须与调用方明确提供的预期值一致。服务商适配器操作实际资源时，应附加核心定义的归属标签，并独立验证这些标签。本地清单用于定位资源，不是当前云访问授权或资源归属的证明。

凭据配置只包含具名的 `env` 或 `file` 引用。核心不读取其值；认证适配器在自身职责范围内解析引用。状态仅保存模式、资源栈标识、资源的逻辑类型和服务商 ID；不复制配置、凭据、服务商响应、连接地址或生成的产物。

保存状态时，在同一目录中使用独占锁和唯一临时文件，执行缓冲区刷新、`fsync` 以及原子 `os.replace`。在 POSIX 上，完成替换或删除后还要同步目录。拒绝带符号链接的路径、父目录跳转和非普通文件。不得覆盖或删除已有的损坏快照或其他资源栈的快照。替换前出错时保留旧快照；提交点之后发生持久化错误时，明确说明新快照可能已经可见。

## 影响

- 核心模块不导入云 SDK，不运行 CLI，不发起网络请求，也不选择网关实现。
- 服务商设置和部署设置需要各自的类型化契约，并转换为核心标识。初始核心模式有意不接受任意字典。
- 添加字段或迁移模式必须明确作出设计与版本决策。加载器不会猜测如何迁移原应用配置。
- 在 POSIX 上，成功写入的状态文件只允许所有者访问。在 Windows 上，文件保密性依赖调用方控制目录的 ACL。
- 进程崩溃可能留下写入锁。恢复前必须确认没有写入进程仍在运行，检查保留下来的快照，然后才能删除本地锁；实现不会抢占锁。
- 路径必须位于可信、由调用方控制的存储中。这些检查不能抵御能够并发修改目录项的本地攻击者。所有写入者都必须使用同一状态 API。
- 本地原子替换不是分布式事务，也不是云生命周期实现。部分部署可以记录已经取得的资源标识；状态协调与回滚仍属于独立工作。

## 考虑过的替代方案

1. **原样复制应用配置。** 未采用，因为这会将特定服务商、网关组件、默认区域和私有存储假设嵌入可复用核心。
2. **接受任意配置字典和服务商响应字典。** 未采用，因为未被发现的字段拼写错误和不受限制的数据持久化会削弱归属检查和秘密排除保证。
3. **使用固定临时文件名且不设置写入锁。** 未采用，因为并发写入者可能截断或替换彼此尚未提交的快照，使归属检查与最终提交脱节。
4. **引入数据库或跨平台分布式锁依赖。** 暂缓，直到确实出现多主机共享状态的需求。

## 验证

确定性测试覆盖严格的模式与类型检查、未知及重复字段、凭据引用隔离、不可变构造、标识的每个维度、部分和空快照、幂等本地删除、损坏状态保留、符号链接与目录穿越拒绝、已有写入锁、权限，以及原子替换前后的错误。测试不解析凭据，也不修改云资源。失败路径测试还验证创建流失败时的文件描述符归属，以及产物清理失败时的明确报告。

实现提交评审前，须通过仓库规定的编译、Ruff、mypy 和 pytest 检查。
'''
