body = '''
# ADR 0002：建立显式限定云目录的只读服务商接口

- 状态：已接受
- 日期：2026-10-04
- 相关任务：#19

## 背景

A-VPN 将 Yandex SDK 资源发现、认证、部署策略和资源修改整合在一起。在生命周期编排能够安全使用云资源之前，F-Layer 需要一个独立于服务商的只读观测接口。诊断和未来的生命周期规划是两个不同的使用方。第一轮并行实现不能依赖尚未完成的核心配置和部署配置文件契约。

初始化服务商时，不得隐式检查凭据或访问基础设施。资源引用必须保留其服务商和作用域；失败时不得泄露捕获的 CLI 输出。本次实现的验证授权不包括访问或修改真实云资源。

## 决策

创建 `flayer.providers.contracts`，定义不可变标识、资源引用、规范化观测结果、能力声明、探测结果、经过安全处理的错误，以及结构化的 `CloudProvider` 协议。

首个适配器使用已有的 Yandex Cloud CLI，通过仅依赖标准库、可注入的 `CommandRunner` 调用。必须明确指定云目录 ID 和 CLI 配置档案。使用 CLI 已有的认证，不导出或持久化凭据。限制子进程运行时间，关闭 stdin，禁用浏览器认证和 CLI 重试，并且不通过 shell 执行命令。

仅提供本地可用性检查、目录访问探测、按资源类型列举、按引用查找以及完整资源清单的组合。支持虚拟机、磁盘、网络、子网、预留地址和安全组。只保留规范化的 ID、名称、状态、可用区、归属标签和公网 IPv4 地址，不在资源对象中保留服务商原始元数据。

查找前验证资源引用，每次读取后验证返回的目录作用域，因为 CLI 按资源 ID 查找可能跨越其他有权访问的目录。对可能被截断的列表直接报错，而不是将其作为完整清单。返回稳定的错误类别，不携带服务商 stdout/stderr，也不保留子进程或 JSON 异常链。

## 影响

- 服务商接口不依赖核心配置、部署配置文件、凭据和生命周期修改操作。
- 确定性的测试替身可以验证生产命令参数和失败行为，无需访问基础设施。
- 初始接口不需要服务商 SDK 或 protobuf 依赖。
- 适配器依赖外部安装且已完成认证的 `yc` CLI。本次变更尚未验证真实账号兼容性。
- CLI 的 JSON 和错误标记兼容性需要持续维护；未识别的错误使用安全的通用类别。
- 达到返回上限的资源清单会被保守拒绝；顺序发现也不是原子快照。
- 资源名称与标签仍是可公开观测的信息，所有者不得用这些字段保存凭据。
- 创建、修改、清理、回滚、破坏性操作授权、幂等性以及操作轮询，需要在任务 #20 中另行定义明确契约。

## 考虑过的替代方案

- **立即提取 SDK 适配器：** 对生命周期工作可行，但会在核心接口稳定前引入认证与令牌处理、生成的 API 依赖和资源修改问题。
- **复制 A-VPN 管理器：** 会把特定部署的资源归属与配置假设保留在服务商接口中。
- **仅实现测试替身：** 无法验证实际生产连接器的作用域选择或 CLI 转换。
- **将原始 JSON 作为观测状态：** 会向所有使用方暴露不稳定的厂商结构及可能包含秘密的元数据。
- **隐式使用 CLI 配置中的目录：** 会隐藏作用域选择，无法证明调用方确实打算访问该账号范围。

## 验证

单元测试覆盖不可变标识、无效选择参数、能力声明、全部支持的资源命令、可用性和目录访问、完整清单、ID 查找、跨目录拒绝、返回上限、畸形 JSON、资源及连接地址、重复 ID、超时、子进程参数安全和安全错误消息。所有执行边界都使用测试替身或 monkeypatch。评审前运行仓库规定的编译、Ruff、mypy 和 pytest 检查。
'''
