body = '''
# ADR 0003：为安全诊断明确规定观测边界

- 状态：已接受
- 日期：2026-10-04
- 相关任务：#23

## 背景

A-VPN 的基础实现将云资源发现、来宾系统自检、SSH、服务目标和传输测量组合在一起。在配置、服务商和生命周期接口稳定之前，F-Layer 就需要可复用的诊断能力。复制整套组合会引入 VPN 和私有基础设施假设，还可能触发非预期流量，或暴露服务商及命令的原始输出。

## 决策

引入 `flayer.diagnostics`，定义结构化、带版本的 `CheckResult` 和 `DiagnosticReport` 契约。结果区分成功、警告、失败、过期和不支持。缺少证据应标记为不支持，而不是成功。

通过注入的接口收集只读健康探测和通用服务商观测。对输入健康报告的模式与时间戳单独校验，不与健康结果本身混为一谈。诊断模块不自行发现基础设施，也不授予基础设施访问权限。

初始 CLI 提供 `python -m flayer status/check/health/benchmark`。本地运行环境检查可离线执行。远程健康检查和基准测量需要明确的 HTTP(S) 地址，以及有界的时间、次数和数据量参数。默认 HTTP 传输使用隔离启动的工作进程，父进程可在总期限到达时终止卡住的 DNS、连接、TLS 或读取操作。禁用重定向和自动代理发现，保持 TLS 验证开启。

仅公开安全的测量事实。响应内容、连接目标标识、凭据和原始异常字符串不进入报告。对结构化输出进行递归安全处理，并隐藏无效 CLI 参数的原始值。适配器作者必须提供允许公开的字段；仅靠脱敏不能证明任意外部文本都是安全的。

## 影响

- 诊断可以独立于服务商和生命周期任务实现与测试。
- 退出码反映证据不完整或检查失败；当前离线 `status` 的退出码为 4。
- HTTP 吞吐量是有限的端到端测量，不宣称代表隧道或链路容量。
- 启动工作进程会带来额外开销。报告中的 HTTP 时长不包含启动时间，但父进程的硬性总期限包含该时间。进程清理最多还可能增加两秒。
- 自定义注入探测或传输仍需自行落实相应限制。
- 服务商 CLI 集成和特定部署的来宾检查将在后续组合实现。

## 替代方案

复制 A-VPN 的云与 SSH 组合会让诊断依赖尚未稳定的服务商接口和特定部署。仅设置 socket 超时无法对 DNS 或缓慢的流式读取施加硬性总期限。仅在线程层面取消，可能导致调用返回后网络操作仍继续运行。独立进程能够明确由谁负责在规定期限内终止操作。

## 兼容性与迁移

这是对初始软件包的增量契约，不需要替换已部署的生命周期接口。不迁移 A-VPN 的私有配置和生成产物。公开 JSON 使用模式版本 1，以便未来明确引入变更。

## 验证

确定性单元测试使用注入的探测、传输和进程，覆盖结果校验、状态汇总、数据新鲜度、脱敏、CLI 输入保密、HTTP 数据量与重定向限制、期限取消和清理。评审前必须通过标准编译、Ruff、mypy 和 pytest 检查。测试不连接真实基础设施或外部服务。
'''
