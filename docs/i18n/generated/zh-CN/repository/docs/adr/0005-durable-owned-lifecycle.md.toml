# ADR 0005：可持久恢复的资源生命周期与归属校验

- 状态：已接受
- 相关工作：任务 #20、功能 #6
- 日期：2026-10-04

## 背景

服务商命令和本地文件替换无法组成单个原子事务。创建操作中断后，资源可能已存在，但本地尚未记录其标识；删除操作中断后，本地可能仍记录已经不存在的资源。对结果不确定的创建自动重试会产生重复资源；回滚则必须保留本次操作之前已存在的资源。

## 决策

通用核心接收不可变的 `DeploymentPlan` 和注入的 `LifecycleProvider`。计划包含最多 128 个唯一逻辑资源、精确的 `StackIdentity`、不可变服务商选项和无环依赖图。构造计划、拓扑排序和服务商选项验证均离线执行。核心资源类型使用可移植的连字符名称；`security-group` 明确转换为服务商枚举 `security_group`。

创建、状态查询、销毁和恢复通过显式状态路径旁的协作式操作锁串行执行。已有的状态写入锁独立保护每次原子快照替换。操作锁无法协调忽略此契约的外部程序，也不是分布式租约。

核心在每次修改前持久化预写日志。日志仅保存归属信息、计划的 SHA-256 指纹、随机操作 ID、动作、原有及新建资源的标识，以及当前待确认的逻辑资源。快照状态保持模式版本 1，仅包含归属、逻辑 ID、类型和服务商 ID。两个文件均不保存期望参数、凭据、虚拟机元数据或命令输出。原子替换和目录同步复用受归属校验保护的状态存储契约。快照和日志通过大小受限的普通文件描述符读取，在可用时采用非阻塞打开，避免文件在验证后被替换成 FIFO 而导致阻塞；JSON 读取和快照写入均限制为 1 MiB。

创建前先发现并验证已存在、且完整归属匹配的资源。如果已有资源的依赖缺失，则在任何修改前阻止操作。创建遵循依赖顺序；每次确认创建成功后，先写日志，再把最小资源标识写入快照。能够确认发生在命令发送前的失败，只回滚本次操作创建的资源，并按创建逆序处理。已有资源继续记录并保留。

服务商失败且结果不确定时，日志保留待确认动作，并返回非零结果。恢复通过完整归属和稳定规格标签观测待确认的逻辑资源。资源可见后，恢复将其记录，并继续创建或执行明确请求的回滚。创建响应及恢复得到的观测结果必须携带本日志的 `flayer-operation` 随机值，资源才能进入允许回滚的集合。回滚时先通过精确查找重新检查该值，服务商适配器还要在删除前立即重复检查。不得把其他操作的资源视为本次操作创建的资源。若新发现的既有资源依赖将被回滚的资源，则阻止清理。提交结果不确定后，即使暂未找到资源，结果仍然不确定：恢复不会据此认定提交失败，也不会自动重复创建。

销毁仅操作已记录的精确资源标识，并按依赖逆序执行。引擎和适配器都必须在按 ID 删除前验证作用域和完整归属。确认资源不存在视为幂等成功。每次确认删除后，先持久化进度再继续。部分销毁可以恢复执行，但不能靠重新创建已删除基础设施来回滚。

## CLI 契约

`python -m flayer lifecycle` 提供 `create`、`status`、`destroy` 和 `recover`。每条命令都要求明确的计划、状态和已完成认证的 `yc` 配置档案参数。修改命令还要求 `--allow-mutation`，以及与计划中云目录 ID 完全相同的 `--scope-confirm`。对于中断的创建操作，恢复接受 `--rollback`。帮助和参数校验不访问基础设施。API 调用方负责授权其明确请求的服务商操作；CLI 标志并不构成安全策略或云 IAM 边界。

## 恢复与限制

正常异常或协作式中断会释放操作锁，同时保留已持久化的进度。硬崩溃可能留下独占操作锁或状态写入锁。操作员必须确认此前进程已不再运行，才能删除对应本地锁并调用恢复。第二个进程从不自动让锁过期或删除锁。不同状态路径彼此不互斥；每个精确资源栈归属标识应使用唯一的权威状态路径。创建随机值可防止将其他操作的资源纳入回滚，但不提供分布式云锁。

引擎只有在服务商确定未知创建结果之后才能安全继续。当前日志不保存厂商操作 ID，也不会自动放弃不确定的动作。名称本身不能证明归属。资源存在只是基础设施观测，不能证明来宾系统就绪或应用部署成功。尚未实现更新或配置漂移修复。

## 替代方案

- 未采用对每次失败创建都重试，因为超时不能证明资源不存在。
- 未采用失败后删除所有匹配资源，因为这会销毁既有基础设施，并错误地把已发现资源等同于可回滚资源。
- 未采用仅在内存中保存进度，因为已被服务商接受的修改必须在本地失败后仍可恢复。
- 未采用在核心中编写特定服务商编排，因为云命令语法和支持的资源参数属于适配器职责。

## 兼容性与验证证据

现有配置和快照模式契约保持不变。生命周期计划是独立、严格的版本 1 TOML 输入，支持可选资源参数和依赖。确定性的服务商测试替身覆盖执行顺序、归属、幂等性、既有资源保留、部分清理、已被接受但中断的创建及删除、不确定的缺失结果，以及快照失败。这些测试不执行真实云操作。
'''
