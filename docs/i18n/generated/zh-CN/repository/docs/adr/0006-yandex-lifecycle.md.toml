body = '''
# ADR 0006：限定 Yandex 生命周期操作范围并明确启动磁盘归属

## 状态

已接受，用于任务 #20 的生命周期实现。

## 背景

首个服务商适配器有意只提供资源发现。生命周期编排现在需要限定范围的创建、对准确归属资源的删除，以及协调中断修改的方法。CLI 超时不能证明远程操作被拒绝；结果不明确后重试创建，可能产生重复资源，并丢失用于清理的资源标识。

Yandex 虚拟机 CLI 可以隐式创建启动磁盘。但这种复合操作不能提供生命周期日志所需的独立、带标签的磁盘请求。因此，在磁盘分配与虚拟机创建之间发生失败时，可能留下未被跟踪的磁盘。

两个使用不同本地状态路径的进程也可能操作同一个资源栈。仅靠资源栈归属无法判断哪个操作创建了资源，因而不能确定回滚资格。

## 决策

1. 保持 `YandexCloudProvider` 只读。新增明确执行修改的 `YandexLifecycleProvider` 适配器，声明创建和删除能力。两者复用限定作用域的规范化观测结果。
2. 使用不可变的 `ResourceSpec` 请求和明确的 `LifecycleProvider` 契约。在修改前拒绝不支持的类型、选项、依赖绑定和畸形请求。
3. 支持由六种资源组成的有限图：网络、子网、安全组、静态 IPv4 地址、磁盘和虚拟机。依赖必须绑定到经过归属验证的精确资源引用，而不是名称或任意 CLI 选项。
4. 将启动磁盘创建为独立的带标签资源。通过 `--use-boot-disk` 连接，并设置 `auto-delete=false`；由核心日志按依赖逆序清理。不得使用 `--create-boot-disk`。
5. 附加完整资源栈归属、逻辑资源 ID、长度受限的期望规格摘要，以及持久化操作随机值。稳定发现检查规格摘要；回滚还必须在按精确 ID 删除前立即检查操作随机值。
6. 将所有已经发出的修改请求失败视为 `MutationError(outcome_unknown=True)`。仅保留安全的稳定错误码。不得自动重试修改，也不得因为之后某一次资源清单中未找到对象，就认定失败的创建从未被接受。
7. 在观测和创建响应中验证准确目录和归属。仅在新的精确 ID 查找后删除，再通过一次有界查找确认缺失。无法确认的删除仍视为结果不确定。
8. 仅接受调用方明确声明、不含秘密的 cloud-init JSON 文件，以及配对的 SHA256 摘要。访问云之前拒绝不安全文件或摘要不一致。通过 `--metadata-from-file` 传递私有临时副本，执行后删除，不在状态和错误消息中保存文件内容。

## 影响

每个显式资源都有可用于发现的标签和由日志管理的清理顺序。创建响应丢失后，可以恢复到准确的操作归属，而不会把其他操作的资源视为回滚对象。

适配器有意不支持更新、导入、自动接管无标签资源、任意元数据、凭据、服务账号绑定或任意厂商命令转发。资源存在与服务商状态不能证明来宾初始化完成、隧道服务就绪或端到端可达。

归属标签是应用层操作授权边界，不是服务商侧事务锁。CLI 没有能够原子比较标签的条件删除。拥有修改标签权限的独立远程参与者不受协作式本地锁模型约束。当操作归属或远程结果不确定时，恢复采取保守策略。

实现使用确定性的命令测试替身验证。本决策不包含真实账号修改或真实 CLI 兼容性冒烟测试。

## 替代方案

- 未采用隐式创建启动磁盘，因为其中间资源不能独立记录或协调恢复。
- 未采用按名称删除，因为名称不能证明归属或目录身份。
- 未采用超时后自动重试，因为超时不是未提交请求的证据。
- 未将所有归属匹配资源视为当前操作创建的资源，因为并发接管会使回滚具有破坏性。

## 兼容性

现有只读契约和能力仍然可用；修改能力以增量方式加入。新的创建调用要求持久化操作 ID。删除支持用于回滚的可选操作 ID；显式销毁则要求完整资源栈归属。

## 参考资料

