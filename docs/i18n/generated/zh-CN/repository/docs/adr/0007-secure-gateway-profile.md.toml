body = '''
# ADR 0007：显式安全网关配置与产物归属

## 状态

已接受，用于首个安全网关配置实现。

## 背景

现有可运行方案将云资源创建、操作系统加固、传输安装、凭据签发和客户端配置导出组合在一起。在这些能力成为可复用的 F-Layer 功能之前，需要分别明确归属和管理契约。只有加固后的虚拟机，并不等于已经实现网关功能。

首个配置必须能够传输实际业务流量，同时避免依赖某个 VPN 产品、私有基础设施、隐式部署位置，或把生成的私钥放入云元数据。云资源观测不能证明来宾初始化完成或传输服务就绪。

## 决策

实现带版本的 `secure-gateway` 配置，明确使用 `ubuntu-24.04-cloud-init` 来宾契约和 `ssh-local-forward` 传输。它组合六种分别管理归属的资源：网络、子网、安全组、预留地址、启动磁盘和虚拟机。启动磁盘必须显式创建，避免虚拟机创建中断后，复合操作隐式生成的磁盘无标签且不受生命周期管理。

`CompileGateway()` 返回已经验证的不可变配置意图。`RenderPlan()` 先验证准确的已导出服务器产物及完整归属清单，再序列化为生命周期 TOML 输入。配置包不导入服务商修改或生命周期实现；组件组合在集成边界验证。

服务器将管理访问与流量传输分离：

- 管理员使用明确指定的 Ed25519 公钥和受限来源 CIDR。
- 每个声明的设备使用唯一公钥和受限来源 CIDR。
- 单独的账号锁定密码、不具备 sudo 权限，只允许向声明的目标白名单进行本地 TCP 转发。禁止 shell、子系统、TTY、远程转发、代理转发、Unix socket 转发和 SSH 隧道接口。
- 设备授权密钥也限制来源 CIDR 和目标。
- 两种角色均使用准确指定、由 root 所有的授权密钥文件，不再回退到用户主目录中的密钥。引导过程先确认隧道账号不存在，再创建其专用组并锁定密码；查找或创建失败时停止服务激活。
- 设备配置将转发绑定到 `127.0.0.1`，要求明确的私钥引用和通过独立可信渠道确认的 known-hosts 文件，并强制严格检查主机密钥。生成过程既不读取这两个文件，也不自动接受主机密钥。

云初始化包含公钥和明确的加固设置，绝不包含私钥或已解析的凭据。生命周期计划包含显式 `user_data_file` 及预期内容的 SHA-256 摘要。服务商在发出请求前验证并复制文件，上传机制由服务商负责。

生成产物与云状态分开保存。新产物包使用独占创建、私有权限、精确内容哈希，并最后写入清单。清理在删除任何文件前，验证完整身份和每个声明文件。未知文件、变化的内容、畸形清单、符号链接、硬链接、其他归属和名称冲突都会阻止操作。清理不会递归删除目录，也不会接触服务商资源。

清理、回滚和释放锁之前，重新检查已固定的 inode、修改信息和摘要记录。产物读取返回经过验证的不可变快照。这些检查可发现同一用户进行的具体替换，但私有目录和独占锁仍属于写入者协作契约。POSIX 没有基于身份和摘要的原子条件 unlink；主动恶意的同用户进程或特权管理员不属于此存储的隔离保障范围。

## 影响

首个配置提供可用的应用层 TCP 网关，而不是完整 IP VPN。IPv4 数据包转发仍然禁用，IPv6 不属于此来宾契约。可选服务端口放行规则不会安装额外监听服务。

配置准备和离线语法检查不能证明 cloud-init 成功执行、目标可达、SSH 认证成功或来宾就绪。因此，本地设备描述记录 `prepared-unverified`。连接前，操作员必须通过独立可信渠道取得服务器主机密钥。`ExitOnForwardFailure` 只检查转发是否建立，不检查最终目标健康状态。

当前产物存储要求 POSIX 主机，以及调用方拥有的 `0700` 目录和 `0600` 文件。客户端配置可以引用 POSIX 路径，也可以引用使用正斜杠的 Windows 绝对路径。尚未实现识别 Windows ACL 的产物存储。从其他系统导出的私有传输配置仍作为敏感内存输入传给 `BuildDeviceBundle()`，不宣称验证了其传输有效性。

写入中断通常只回滚本次新增文件。清理或释放锁失败可能需要显式本地恢复；已有锁绝不自动删除。最后释放锁失败时，已发布的产物包可能仍然可见。本地清理与销毁基础设施是不同操作，不能与活动部署并发竞争。

## 替代方案

复用 VPN 容器会保留产品耦合，并要求在同一变更中实现秘密签发、撤销、版本固定和特定传输健康检查。没有传输功能的服务器基础不能满足网关目标。不受限制的 SSH 转发或首次使用即信任，会削弱明确的作用域和验证契约。

## 兼容性与迁移

现有期望配置模式和服务商发现接口保持不变。本配置引入自己的显式 TOML 模式。不隐式迁移此前的私有配置、状态、设备凭据或连接地址。

## 参考资料

- [安全网关契约](../architecture/secure-gateway.md)
- [OpenSSH 服务器配置](https://man.openbsd.org/sshd_config.5)
- [OpenSSH 客户端配置](https://man.openbsd.org/ssh_config.5)
- [Cloud-init 模块参考](https://docs.cloud-init.io/en/latest/reference/modules.html)
- [nftables 服务器规则](https://wiki.nftables.org/wiki-nftables/index.php/Simple_ruleset_for_a_server)
'''
