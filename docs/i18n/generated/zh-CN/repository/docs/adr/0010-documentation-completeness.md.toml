# ADR 0010：明确检查仓库文档的完整性

- 状态：已接受
- 日期：2026-10-04
- 任务：[#28](https://github.com/Fuzzy-Technologies/F-Layer/issues/28)
- 基于：[ADR 0004](0004-documentation-platform.md)

## 背景

最初的构建器只发现已安装 Python 包的非私有模块。路径过滤还排除了提供受支持 CLI 入口的 `flayer.__main__`。仅比较已发现的公共模块，无法发现 wheel 遗漏的私有模块，也无法发现这一范围之外的源码与 wheel 差异。只复制部分文档目录，还会使规则文件和项目指南等其他 Markdown 文件无法进入页面导航。

“为所有文件提供文档”需要明确范围。将测试、工程工具和内部辅助函数全部自动列为 API，会误导用户认为这些接口受到支持；无说明地排除它们，又会让完整性声明无法验证。

## 决策

维护明确的覆盖规则清单。每个 Git 跟踪文件必须匹配且仅匹配一条规则，规则应说明所属类别及原因。构建时生成可重新创建的 JSON 文件清单、定义清单以及带导航的 Markdown 页面。已有类别自动接纳新文件；没有匹配、存在歧义或类别不受支持时，构建必须失败。不得硬编码模块数量。

除解释器字节码外，源码包与已安装 wheel 的包文件清单和字节内容必须完全一致。显式纳入可执行 CLI 模块。呈现非私有模块、公共定义、公共方法和可调用协议；将私有、嵌套以及其他特殊方法标记为仅在源码中提供。构造函数通过类签名和源码呈现。

呈现 Git 跟踪的所有规范 Markdown 文件，包括 ADR 模板、规则、发布和开发指南、仓库入口以及 PR 模板。保留已有指南的页面地址，其余文件生成仓库页面地址。将复制后文档之间的 Markdown 链接映射到生成页面；非页面文件仍链接到源码。生成过程不得修改由项目所有者管理的规则。

检查页面是否存在、能否从英文入口到达、API 锚点是否准确，以及链接、表格对齐、覆盖规则和生成文件管理规则。翻译审核权限保持不变，不能从结构完整性推断已获得人工批准。增加已实现架构的参考说明和 ADR 索引。

## 影响

构建可以提供可验证的文件完整性声明，同时区分受支持的 API 文档与仅提供源码的工程材料。已有类别的新文件自动可见；新类别需要通过可审查的规则纳入。wheel 遗漏私有文件和页面缺少导航入口都会导致失败。机器可读报告记录每个文件的处理结果及 wheel 来源。

结构完整不代表文字说明充分或翻译质量合格。导入别名、字段、常量及继承成员通过定义它们的模块或类呈现，不要求重复的锚点。若要支持以下划线开头的模块，必须明确决定其接口边界。

## 备选方案

对每个 Python 文件无差别生成 API 文档会将内部实现误当成用户接口。手工维护文件和模块数量会在并行分支合并后失效。只复制目录或只检查目标文件存在，无法发现没有导航入口的页面。运行时导入仍存在不可接受的代码执行和凭据访问风险。

## 兼容性与迁移

公共 Python 行为和已有指南地址保持不变。CLI API 页面、仓库页面和覆盖清单均为新增内容。构建报告增加完整性字段。英文原文变化后需要更新对应哈希；译文在完成审核前继续标记为缺失或过期。
