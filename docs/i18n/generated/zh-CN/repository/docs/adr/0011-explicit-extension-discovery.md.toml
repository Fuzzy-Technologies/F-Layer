# ADR 0011：静态发现扩展并显式加载

## 状态

已接受，用于[任务 #29](https://github.com/Fuzzy-Technologies/F-Layer/issues/29)。

## 背景

Yandex 只读适配器、独立的生命周期适配器和安全网关配置方案已经是实际的扩展使用方。现有契约明确区分资源观察、经过归属验证的资源变更和配置方案编译。强制所有提供商实现通用变更接口，会破坏这一边界。

已安装的 entry point 指向可执行的导入目标。发现扩展时不得导入模块、执行工厂、查询基础设施或调用已安装的元数据查找钩子。搜索任意目录或网络位置也会隐式扩大访问和信任范围。

## 决策

引入 `flayer.extensions`，使用不可变描述符和显式注册表。内置描述符指向现有实现中可用的适配器。外部发现仅从调用者明确选择的 `.dist-info` 目录读取有大小限制的 `METADATA`、`entry_points.txt` 和 `RECORD`，不枚举已安装分发包或搜索路径。版本化分组为 `flayer.providers.v1` 和 `flayer.profiles.v1`。描述符进入注册表前，验证插件标识、分发包身份、确切的稳定版本、分组和导入目标。发现重复项或不受支持的 F-Layer 分组时拒绝继续。

外部加载是独立的显式操作，必须提供准确的已注册描述符，以及包含导入目标的精确描述符允许列表。元数据文件通过摘要固定，并在导入前重新检查，避免用已改变的发现结果授权加载。`RECORD` 中的精确哈希和大小，将选定目标及所有父包绑定到安装根目录下的普通源码文件。外部目标不能使用保留的 `flayer` 命名空间。加载器执行已验证的内存源码快照；临时导入钩子仅服务选定导入链，避免父包导入执行过期字节码。缓存模块必须具备加载器保存的对象、路径和源码哈希记录。加载时还检查工厂的扩展协议及声明身份是否完全一致。这是对代码执行的显式信任决策，不是沙箱或软件包真实性验证。

提供商工厂返回现有 `CloudProvider` 协议。独立的 `LifecycleProviderExtension` 返回现有 `LifecycleProvider` 协议。配置方案在准确的 `StackIdentity` 上下文中编译显式配置，并返回能够生成服务器文件包和生命周期计划的适配器。有界的提供商上下文只包含资源范围、外部身份验证引用和执行限制，不包含解析后的凭据内容。配置方案仍遵守各自的严格模式。

## 影响

导入扩展包和发现元数据都不会执行插件代码。操作人员可以先检查目录，再授权具体的外部工厂。现有 CLI 和生命周期核心保持不变。创建提供商对象或编译内置配置方案不会修改基础设施。

初期仅支持由三个数字部分组成的稳定版本、只使用源码的普通 Python 包，以及不带 extras 的 entry point。新增 ABI 必须使用新分组并明确决定兼容性。调用者提供选定的元数据目录；自动安装、包解析、凭据管理、动态模块扫描和进程隔离均不属于此契约。固定哈希不能验证签名、发布者真实性或依赖归属。加载前必须信任所选环境和外部包；外部依赖也属于显式接受的代码执行信任范围。清理不能撤销插件的任意副作用，只能删除本次尝试创建的模块和验证记录。

## 备选方案

自动遍历 `importlib.metadata` 查找器可能执行已安装的查找代码，并扩大搜索范围。为了探测能力而导入模块会执行尚未授权的代码。通用插件框架、依赖解析器或替换生命周期核心，会引入缺乏实际需求的契约，而不能改善当前使用场景。

## 兼容性与迁移

现有提供商、生命周期、配置方案、状态、文件包和 CLI 契约保持不变。内置扩展适配器属于新增功能。现有调用者可以继续直接使用 API，无需迁移配置或持久化状态。

