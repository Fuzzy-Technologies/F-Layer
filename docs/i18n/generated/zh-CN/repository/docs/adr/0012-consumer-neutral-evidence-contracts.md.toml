# ADR 0012：不依赖调用方的集成证据契约

- 状态：已接受
- 日期：2026-10-04
- 相关任务：#30

## 背景

1337 和 Fuzzy 生态中的其他客户端需要通过有明确边界的接口请求并使用 F-Layer 的观察结果。模型负责推理；持久化的 F-Layer 核心负责执行、状态、资源归属和验证结果。AI 或 MCP 客户端不能仅凭解析消息、发现能力或指定栈名称，就获得基础设施操作权限。

现有诊断、状态和生命周期模型可以提供证据，但不适合将完整内容交给外部通信接口。资源地址、任意诊断细节和提供商状态文本可能泄露基础设施信息。本仓库尚无经过验证的实际 1337 集成。

## 决策

新增独立的 `flayer.integrations` 包，定义版本 1 的请求与结果封装。每条消息必须绑定准确的 `StackIdentity`、有长度限制的请求关联标识和明确的只读操作。解析时必须独立提供预期身份；解析结果还必须提供原始请求。拒绝不受支持的版本、重复或未知字段、超限输入，以及所有变更操作名称。

将已获得的诊断报告、归属已验证的状态快照和生命周期报告，转换为允许列表内的证据。保留诊断结果、有界数值测量、本地记录的资源数量，以及生命周期动作、结果、恢复要求和各状态的资源数量。省略资源标识、逻辑标识、诊断名称和消息、端点、提供商字符串、原始错误、配置、凭据和任意载荷。

只有身份路由元数据和关联标识可以包含调用者字符串。这些是已授权传输所需的非秘密元数据；格式验证不是身份验证，也不是通用秘密检测器。调用者不得将秘密写入这些字段。示例全部使用演示值。

这些封装不会分派执行操作。宿主应用独立授权读取、选择可信的证据来源，并通过现有 API 获取明确的端点和传输限制。生命周期变更结果可以作为历史证据汇总，但这不提供变更请求、批准或执行通道。

## 影响

- F-Layer 具有统一且不依赖传输方式和调用方的证据契约。
- 必须关联资源归属；来源验证和传输身份验证仍由宿主应用明确负责。
- 解析器和适配器不调用提供商、不写入文件系统，也不分派操作。
- 汇总结果有意省略资源级故障排查细节。
- 状态中的数量表示已记录的资源归属，不表示云端资源存在或健康。
- 快照不承诺时效性、重放保护或授权。
- 增加操作种类必须明确修改契约并接受审查。

## 备选方案

在核心中嵌入 1337 编排会将 F-Layer 耦合到特定调用方，并引入尚未得到实际需求支持的调度行为。直接序列化完整模型会暴露资源地址及任意文本。以通用载荷接收变更请求会模糊授权边界。仅做敏感内容脱敏不足以证明外部字符串安全，因此选择严格的字段允许列表。

## 兼容性与迁移

这是 F-Layer 一侧的新增契约，不代表已经验证实际 1337 或 MCP 兼容性。版本 1 使用严格模式，不兼容扩展需要新版本。现有 CLI、核心、提供商和安全网关契约保持不变。

## 验证

确定性测试数据覆盖有界请求结果往返、精确的归属和请求关联、未知字段和版本、无效及重复 JSON、排除含秘密证据，以及拒绝变更操作名称。参考流程将现有本地证据源与适配器组合。提交审查前必须通过完整标准检查和严格文档构建。
'''
