# ADR 0013：用受限静态站点验证配置方案的可扩展性

- 状态：已接受，用于第二个具体部署方案
- 相关任务：[#31](https://github.com/Fuzzy-Technologies/F-Layer/issues/31)

## 背景

只有一个部署方案，无法证明通用生命周期和提供商契约能够独立于 SSH 应用网关组合使用。第二个方案必须产生不同的实际结果，同时避免将新提供商假设写入核心，也不能变成通用的来宾 shell 执行器。

现有 Yandex 生命周期适配器已经实现六种分别验证归属的资源、显式身份与位置、不可变初始化摘要，以及私有的元数据上传副本。现有文件包存储也支持有界独占发布和经过验证的本地清理。这些契约足以支持一个实际静态网站，无需修改这两个层次。

## 决策

新增版本 1 的 `static-site` 方案，要求明确选择全新的 `ubuntu-24.04-cloud-init` 镜像及 Yandex 部署位置。它将有大小限制的纯文本标题和正文进行转义，放入固定 HTML 标记，生成一页 nginx HTTP 页面。固定的 cloud-init 配置仅包含公钥、可公开的页面文字以及预定义的来宾操作。不提供任意 shell、模板、软件包、文件路径或 Web 服务器配置输入。

模式要求明确指定提供商、云目录、所有者、可用区、镜像、私有子网、管理员用户名、公钥和来源，以及 HTTP 来源。HTTP 80 端口允许显式的 IPv4 `/0` 至 `/32` 来源；管理 SSH 22 端口使用独立的 `/24` 至 `/32` 来源。每组最多包含十六个不重叠的规范网络。固定的 root 所有授权密钥路径、禁用其他密钥和 CA 来源、完整 SSH 配置，以及持久启用 SSH 服务，共同保留新来宾系统的授权边界。

`CompileStaticSite()` 验证不可变配置。`BuildStaticSiteBundle()` 使用现有的归属受控服务器文件包存储。`RenderStaticSitePlan()` 验证整个文件包未发生改变且生成字节完全匹配，然后输出现有的网络、子网、安全组、地址、磁盘和实例资源图。实际生命周期解析器和引擎无需新语义即可执行计划。现有提供商验证并提交由摘要绑定的 cloud-init。

`PrepareStaticSite()` 和模块 CLI 在明确的文件包根目录下，将 cloud-init 和生命周期 TOML 分别发布为私有、归属受控的文件包，两者都不覆盖已有文件。如果计划发布失败，通过现有删除 API 新增的 `expected_bundle` 参数，将清理绑定到最初生成的文件包。删除前，存储在操作锁内验证完整的预期文件字节和清单元数据。这样，同一身份但不同内容的有效替代文件包不会仅因归属相同而被误删。默认清理调用保持原行为。若已发布的计划完全一致，则保留其引用的服务器文件包；检测到替换时不删除，交由显式恢复处理。字节和清单元数据均相同的文件包视为等价预期内容；该参数不提供历史 inode 凭证，也不隔离同一用户的恶意进程。

公开的解析、编译、文件包生成及计划渲染函数允许以后接入扩展适配器。此方案不依赖扩展发现、尚未合并的扩展包或提供商变更模块导入。现有安全网关、核心 CLI 和提供商契约保持不变。

## 影响

第二个方案证明，提供网页服务可以复用资源归属、生命周期、提供商转换和生成文件包契约，而不只是给网关改名。它不创建隧道或设备账号、不进行数据包路由，也不接受凭据。HTTP 和 SSH 来源权限彼此独立。

固定初始化在显式激活服务前检查 SSH、nftables 和 nginx 配置。发行版安装软件包时仍可能单独启动服务。本地准备成功或提供商报告实例存在，不能证明来宾配置成功或服务就绪，因此不生成就绪标记，也不作就绪声明。实际来宾行为需要另行获得授权后验证。

本方案有意不包含 TLS、域名自动化、多页面、上传资源、动态应用、IPv6、Windows 文件包存储或任意服务器配置。公开页面文字不是秘密传输渠道。生成的计划引用绝对本地初始化路径，不得作为可移植配置提交到 Git。生命周期恢复仍需使用时，操作人员必须保留两个文件包。

现有存储对同一用户协作进程的竞争限制及部分文件系统故障行为仍然存在。本地清理不能代替云端销毁。

## 考虑过的替代方案

将网关改名并允许 HTTP 入站，无法证明新的实际结果，因为它不会安装或配置 Web 监听服务。通用 cloud-init 或 shell 透传会开放任意来宾执行，模糊受限方案的契约。新增云提供商会把任务扩大为提供商资源转换和权限工作，而不是验证方案复用。

现在从网关抽出共用渲染器，会耦合原本独立的开发分支，并仅为减少少量重复而修改正常工作的方案。较小的静态站点渲染器面向现有稳定资源子集；以后可以根据两个方案的实际行为，再判断共用序列化器是否有必要。

## 兼容性与迁移

已有配置、网关 API、状态、提供商身份、生命周期命令和资源语义不变。静态站点 TOML 使用独立的明确模式，不自动迁移。两个方案均可独立工作，不要求扩展发现。

## 验证

确定性测试将实际生命周期解析器、引擎和 Yandex 适配器与模拟 CLI 执行器组合，覆盖创建、状态、重复创建、按依赖逆序销毁、重复销毁、初始化摘要拒绝、回滚和已准备文件的清理。还检查严格拒绝、UTF-8 文本限制、HTML 转义、私有路径限制、冲突及发布失败。shell 和初始化检查使用隔离的模拟命令；可用的来宾语法工具只运行离线检查模式。测试不修改云资源或宿主服务。

准备、操作、清理步骤和确切实现限制见[静态站点契约](../architecture/static-site.md)。
'''
