# ADR 0016：与传输协议无关的 VPN 部署及私有文件包

- 状态：提议
- 日期：2026-10-09
- 相关：[任务 #56](https://github.com/Fuzzy-Technologies/F-Layer/issues/56)、[功能 #55](https://github.com/Fuzzy-Technologies/F-Layer/issues/55)

## 背景

ADR 0007 中的 SSH 网关转发选定的 TCP 连接。VPN 部署还需要设备凭据、路由设置、服务器安装、客户端配置及凭据撤销。这些职责必须与通用云资源创建和提供商标识持久化分开。

AmneziaWG 与 VLESS Reality 需要相同的归属和文件包边界，但流量模型不同。IP 隧道可以承载操作系统流量；本地应用代理只承载明确发送给代理的流量。导出客户端文件不表示服务器已经部署、客户端已导入配置或数据包能够通过隧道。

## 决策

新增 `flayer.profiles.vpn`，作为不依赖具体传输协议的公共配置契约。模式包含 `StackIdentity`、已声明设备、IPv4 路由、DNS 地址以及具名 TCP/UDP 监听端口。该模块不导入具体传输实现，也不调用云提供商。现有配置、生命周期、状态、文件包及诊断接口保持兼容。

`ParseVpnProfile()` 只接受这些公共字段。未知字段（包括内联凭据）会被拒绝，错误不回显输入值。`LoadVpnProfile()` 最多读取 64 KiB 的显式 TOML，不解析环境变量、凭据、DNS 名称或提供商账户。直接构造 dataclass 与解析输入使用同样严格的验证。

| 契约                   | 含义                                                 |
| ---------------------- | ---------------------------------------------------- |
| `VpnDevice`            | 稳定设备名称和可选的私有 IPv4 隧道地址。             |
| `VpnRoutes`            | 全量或分流 IPv4 路由、明确 DNS，以及 IPv6 使用前提。 |
| `VpnEndpoint`          | IPv4 地址或小写 DNS 名称，加上明确端口。             |
| `VpnListener`          | 具名传输、TCP/UDP 端口和来源 CIDR 允许列表。         |
| `VpnCapabilities`      | 支持的路由模式，以及 IP 隧道或应用代理的流量范围。   |
| `VpnProfile`           | 绑定准确项目、栈、资源范围和所有者的公共配置。       |
| `PreparedVpnTransport` | 经过精确归属检查的私有服务器及客户端文件包。         |

一个配置最多包含 16 个设备和八个传输监听项。设备名称、已分配隧道地址、传输名称及协议/端口组合必须唯一。准备 IP 隧道配置时，每个设备必须已有明确的 RFC1918 私有 IPv4 地址。具体适配器负责验证隧道子网成员、与服务器地址的冲突、公钥格式、UUID 等协议专属设置。

### 路由与地址族语义

`full` 必须且只能使用 `0.0.0.0/0`；`split` 要求规范且不重叠的 CIDR，合并后不能覆盖整个 IPv4 地址空间。DNS 地址必须是声明路由覆盖的 IPv4 单播目标。契约不包含隐式的直连 DNS 回退。

路由范围与流量范围不是同一概念。`network_mode="ip-tunnel"` 的全量路由描述分配给隧道的 IPv4 流量；`network_mode="application-proxy"` 的全量路由只表示使用该代理的应用可访问的全部 IPv4 目标，不修改系统路由表，也不捕获其他应用流量。适配器、描述符、CLI 输出和指南必须保留这一区别。

初始模式仅支持 IPv4，拒绝 IPv6 目标和任何宣称 IPv6 可达的能力。`ipv6_policy="disabled"` 记录明确的客户端前提：操作人员必须关闭客户端 IPv6，或使用已另行验证、能够防止绕过的客户端策略。这不表示 F-Layer 已修改主机设置、安装 kill switch 或证明不存在流量泄漏。模式有意拒绝 `block` 策略，因为通用契约无法保证操作系统执行拦截。DNS 端点名称仍需由具体适配器解析为 IPv4 并检查可达性。

### 秘密与生命周期组合

私钥和客户端凭据属于具体传输的材料对象及生成的 `Artifact` 载荷，不得进入配置字段、通用 `ResourceState`、CLI 诊断或异常文本。秘密对象在 `repr` 中隐藏内容；调用者不得用通用对象序列化器导出它们，也不得记录其内容。Python 内存不是安全隔离区。

`BuildVpnServerBundle()` 和 `BuildVpnDeviceBundle()` 要求将所有不透明的传输载荷标记为敏感。服务器文件包使用 `{stack}-{transport}`，设备文件包使用 `{device_id}-{transport}`，避免同一栈或设备的两个协议相互冲突。现有归属受控文件包存储提供私有 POSIX 权限、独占创建、完整清单、内容摘要和经过验证的本地清理。

`PreparedVpnTransport` 要求恰好一个敏感服务器文件包，并为每个声明设备提供恰好一个敏感客户端文件包。所有文件包必须完全匹配配置的归属和传输名称。准备文件不会生成服务就绪或身份验证成功的状态。

按照 ADR 0007，云初始化仍不得含有秘密。生命周期计划可以创建网络、预留地址、磁盘、实例和公开初始化文件。独立的来宾部署器在检查主机信任及资源归属后，通过明确认证的通道传输敏感服务器文件包，不能把私有文件写入提供商元数据或 cloud-init。云实例的 running 状态不证明 VPN 服务可用。

诊断必须分别报告提供商资源、来宾安装、服务状态、客户端导出和端到端可达性的观察结果。本契约不会为尚未执行的检查制造成功证据。

### 替换、撤销与清理

`VpnProfile.Fingerprint()` 对公共配置计算哈希。已准备传输的指纹还包含具体能力及精确文件摘要，但不暴露文件内容。`ValidateVpnReplacement()` 要求调用者提供预期的上一版指纹，并保持完整栈身份及传输名称不变。在验证两套完整文件后，可接受显式变更的设备成员或设置。这只是纯前置条件检查，不进行写入、远程撤销，也不授权覆盖已有文件包目录。

修改远程凭据前，来宾部署器必须验证预期的当前部署。移除设备需要更新服务器配置并验证最终服务状态。删除本地客户端文件或在新文件包中省略它，不会撤销服务器上的访问权。在服务器撤销成功前，旧客户端材料仍须视为敏感信息。更新失败或中断时，必须保留足够的非秘密信息供显式恢复，不能报告完成。

本地文件包替换继续遵循现有独占发布和清理规则。存在未知文件、字节变化、其他所有者或不完整清单时，禁止自动删除。明确批准的旧文件只有在完整存储清单验证成功后才能删除，随后按预期归属发布新文件。这些是独立文件系统操作，不是跨文件包或来宾系统的原子事务，崩溃后可能需要操作人员恢复。云端销毁仍是独立控制的生命周期操作，不会因本地清理而自动执行。

## 验证

针对性的确定性测试覆盖全量/分流路由、DNS 经声明路由可达、不受支持的 IPv6、错误类型、重复设备和监听身份、敏感载荷要求、双传输文件包命名空间、完整文件包集合及预期上一版替换检查。还验证现有存储拒绝清理外部或已修改文件，通用基础设施状态拒绝传输凭据，以及错误不回显输入。

这些测试仅创建临时本地测试文件，不证明真实云部署、来宾安装、协议互通、客户端导入、运行中来宾的访问撤销或端到端连接。这些验证属于具体实现和明确授权的部署验收。

## 影响

两个具体传输可以共享公共配置及安全本地存储，无需新增协议专用资源种类，也不向通用状态加入私有材料。新实现必须声明实际流量范围，不得悄悄扩大路由或承诺尚不支持的 IPv6。

首版契约要求明确的客户端 IPv6 防护措施，不提供通用 kill switch。在出现独立的 Windows ACL 实现前，文件包存储仍仅支持 POSIX。具体适配器仍须实现并测试自己的凭据签发、配置验证、安装、服务检查、回滚和撤销行为。

## 备选方案

将私钥嵌入 cloud-init 违反已有元数据边界；将凭据保存到通用提供商状态会扩大读取权限，并让资源清理依赖传输秘密。把应用代理描述成系统级 VPN 会歪曲实际客户端行为。只使用设备名称命名文件包，在启用两个协议时会冲突。

## 兼容性

新增版本 1 的 VPN 模式及模块，不改变现有 SSH 网关、静态站点方案、提供商参数、资源持久化状态或文件包存储格式。已有公共导入保持不变。
'''
