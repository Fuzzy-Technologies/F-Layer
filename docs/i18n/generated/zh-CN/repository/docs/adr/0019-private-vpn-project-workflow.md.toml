# ADR 0019：私有 VPN 项目与经过身份验证的来宾部署

- 状态：提议
- 日期：2026-10-09
- 相关：[任务 #71](https://github.com/Fuzzy-Technologies/F-Layer/issues/71)、[功能 #55](https://github.com/Fuzzy-Technologies/F-Layer/issues/55)

## 背景

安装 F-Layer 后，用户需要完整流程：创建本地项目、设置云部署位置和设备、准备凭据、创建云资源、安装两个传输协议，并导出可用客户端文件。流程必须继续区分公共配置、最小云状态、私有文件及实际健康检查结果。

首次连接新服务器还需要已验证的 SSH 主机密钥。如果自动接受公网地址上任何响应的密钥，私有服务器文件包可能被截获。手工复制密钥可行，但会无谓增加首次部署难度。

## 决策

新增 `flayer project init DIRECTORY` 及以下项目命令：

```bash
flayer vpn prepare --project DIRECTORY
flayer vpn deploy --project DIRECTORY --allow-mutation --scope-confirm FOLDER_ID
flayer vpn status --project DIRECTORY
flayer vpn destroy --project DIRECTORY --allow-mutation --scope-confirm FOLDER_ID
flayer vpn recover --project DIRECTORY --allow-mutation --scope-confirm FOLDER_ID
```

`recover --rollback` 通过现有生命周期引擎显式请求回滚，不猜测结果不确定的云操作究竟发生了什么。

### 本地项目与凭据

控制器支持 POSIX 主机，包括 Linux 和 WSL。初始化要求新目录和 OpenSSH `ssh-keygen`，创建权限为 `0700` 的目录、权限为 `0600` 的 Ed25519 管理密钥、可编辑的 `project.toml` 及本地 Git 排除项。绝不覆盖已有目录；初始化部分失败时保留文件供检查。

公共项目模式包含准确的栈归属、已授权的现有 `yc` 配置、Yandex 云目录、可用区和 Ubuntu 24.04 amd64 镜像、私有云子网、有界管理 CIDR、设备地址、路由及明确的 AmneziaWG/VLESS 设置。未知字段和内联凭据被拒绝。云子网与隧道子网不得重叠。TCP 22 端口仅供管理。

准备阶段只生成一次协议材料。控制器凭据保存在单独、敏感且归属受控的文件包中。AmneziaWG 客户端私钥不传到服务器，服务器文件只含该协议实际需要的凭据。公共项目指纹防止配置变化后意外复用凭据；材料或清单改变时拒绝继续，不隐式轮换密钥。

本地准备验证两个协议渲染器，并保存服务器文件及公开初始化，但不会生成带占位服务器地址的客户端文件。只有在准确的归属受控实例上观察到确切预留 IPv4 地址后，才生成客户端文件。

### 云资源生命周期

VPN 专用初始化及六种类型化资源与现有 `LifecycleEngine` 组合：网络、子网、安全组、预留地址、启动盘和实例。通用云状态仍只保存归属受控的提供商资源定位信息。云元数据仅包含管理公钥及非秘密初始化，私有传输内容不得进入生命周期参数或 cloud-init。

初始化配置仅允许密钥登录的非 root 管理、受限入站过滤，并禁用来宾 IPv6。防火墙不安装 SSH 网关方案中丢弃转发流量的链。AmneziaWG 管理自己接口的转发及 NAT 规则，并在服务启动时开启 IPv4 转发。

对于 deploy、destroy 或 recover，CLI 在准备文件或构造提供商之前，就要求同时提供 `--allow-mutation` 与精确的 `--scope-confirm` 云目录 ID。生命周期日志保留不确定操作及部分清理记录。普通重试不能悄悄重建仍未解决的待处理资源。

### 独立建立主机信任

公开初始化成功后，来宾将 Ed25519 主机公钥及准确的公共项目指纹写入串口控制台。控制器先依据确切 ID 查询已持久化的实例和预留地址，验证完整归属标签与范围，并要求两者公网 IPv4 地址一致。

随后通过选定的 `yc` 配置，调用该准确实例的已认证 Yandex Cloud 串口输出 API。解析有大小限制，丢弃无关输出；匹配结果出现冲突密钥时拒绝继续。若初始化输出尚未出现，进行有界等待后给出明确重试提示。不会完整打印或保存串口内容。

公钥作为归属受控的私有 known-hosts 文件保存。变化的密钥或地址不能覆盖已有固定记录。OpenSSH 使用严格主机密钥检查、指定私钥，不使用 agent、用户 SSH 配置、代理命令或连接复用，并只接受 Ed25519 主机密钥。信任来源是已授权云账户和准确的归属受控实例，而非第一次未经认证的网络连接。

### 来宾安装与观察结果

私有服务器文件包通过 SSH 标准输入传输，不放在命令行参数中。来宾接收器在创建文件前验证完整、有界的消息。每个安装器使用 root 所有、权限 `0700` 的临时目录及权限 `0600` 的普通文件，明确设置工作目录，并仅调用选定协议的安装器。每个安装器负责自己的服务、固定依赖、验证、回滚和来宾清理。

控制器边界抑制安装器输出，防止打印凭据；接收器仅返回固定完成标记。无论成功或失败都会删除临时文件。若一个传输已安装而另一个失败，则保留云资源和控制器材料；重试使用相同凭据及安装器的幂等性检查。

`status` 分别报告云资源存在情况及准确来宾服务的活动状态，不把安装成功或服务运行等同于客户端连接成功。报告明确要求导入客户端配置并验证端到端流量。用户设置兼容客户端的 TUN 或系统路由模式前，VLESS 仍为应用代理。初始 IPv4 契约继续要求 ADR 0016 中的客户端 IPv6 防护措施。

### 替换与销毁

首版 CLI 支持新部署和完全相同的重试，不提供密钥轮换或设备撤销命令。更改已准备项目或凭据需要独立、显式的替换流程；删除本地客户端文件不等于在服务器撤销访问。未来替换命令必须在变更前绑定预期的上一版远程部署记录。

`destroy` 只删除归属验证通过的生命周期状态所记录的云资源。私有本地文件有意保留，CLI 会明确说明。它不递归删除项目目录、不删除外部文件，也不声称已清除导出的本地凭据。后续部署若地址或固定主机密钥变化，必须明确恢复文件包或创建新私有项目。

## 验证

确定性测试将真实编译器、生命周期日志、归属受控存储和两个协议渲染器用于模拟云及模拟来宾。覆盖 create/status/destroy、相同重试、变更前的授权拒绝、确定的云拒绝与回滚、不确定创建与显式恢复、保留凭据的来宾失败、非活动服务、外部归属、地址不匹配、主机密钥变化、私有文件系统规则，以及初始化、状态和错误输出不含秘密。

分发测试在源码目录外安装实际 wheel 和 VPN extra，执行 `flayer project init` 并准备两个服务器文件包。SSH 测试检查准确选项及私有载荷仅出现在标准输入。来宾暂存测试使用模拟安装器进程检查真实临时文件权限。本次变更的测试不修改真实云。

## 影响与限制

安装软件包后，现在可以从可编辑项目设置一路执行到两个服务器服务及私有客户端导出。每个外部操作都有明确边界，可在确定性测试中替换。

部署仍需要已授权的 Yandex Cloud 账户、云配额、正确的管理员来源 CIDR、来宾访问软件包的出站能力，以及支持 TLS 1.3 和 HTTP/2 的可达 Reality 目标。真实云初始化、操作系统包安装、VPN 客户端兼容性、流量转发、DNS 行为和 IPv6 防泄漏措施，需要另行授权的部署验收。离线证据不能被描述为这些实际结果。

原生 Windows ACL 文件处理、所有平台的一键客户端 TUN 配置、远程凭据替换/撤销，以及任意现有服务器迁移，不属于初始项目流程。

## 备选方案

将秘密放进 cloud-init 会违反 ADR 0007。首次使用即信任或单独使用 `ssh-keyscan`，不能认证首次来宾连接。复用受限 SSH 转发配置会阻断 VPN 数据包路由。为每个协议新增通用提供商资源种类，会将云状态与来宾秘密耦合。

