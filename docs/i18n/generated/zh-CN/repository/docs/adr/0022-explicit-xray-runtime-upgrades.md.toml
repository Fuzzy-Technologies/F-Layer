body = '''# ADR 0022：显式、可恢复的 Xray 运行时升级

- 状态：提议
- 日期：2026-11-05
- 相关：[任务 #118](https://github.com/Fuzzy-Technologies/F-Layer/issues/118)、[任务 #103](https://github.com/Fuzzy-Technologies/F-Layer/issues/103)

## 背景

Xray 26.10.31 默认禁用 MPTCP，以减少 CVE-2026-98432 的攻击面。
新安装必须使用固定 SHA-256 的发布资产。现有项目保留不可变的私密文件包、
所有权回执和设备导出文件。修改软件包常量不能授权替换正在使用的可执行文件、
轮换凭据或改写旧文件包的清单。

Linux 内核需要依据发行商信息单独评估和维护。升级 Xray 或服务处于活动状态，
都不能证明内核已修复、客户端流量正常或 YouTube 能够播放。

## 决策

增加只读 `flayer vpn runtime-status`，以及显式 `upgrade`、
`rollback-upgrade` 和 `recover-upgrade` 操作。操作复用精确的云实例/地址
所有权检查和经过认证的 SSH 信任，不创建、修改或删除云资源。变更必须提供
`--allow-mutation`、精确的 `--scope-confirm`、`--expected-version`
和 `--expected-receipt-sha256`。预期摘要绑定完整的原远端回执，包括二进制文件、
私密配置和服务文件的哈希。不符合预期的状态会在修改任何受管服务或文件前被拒绝。

支持的正向升级为 26.9.30 至 26.10.31，分别固定 amd64 和 arm64 压缩包的字节
及 SHA-256。普通部署不隐式迁移运行时。验证原始文件包清单后，仅按规范化换行符
后的精确源码哈希识别已知旧安装程序；原私密文件和清单不变。维护旧文件包时，
通过内存传输当前受信任的安装程序。

### 事务与恢复

停止唯一的受管 VLESS 服务前，先准备新二进制文件，并用不变的配置检查其语法。
替换可执行文件前，原子发布完整的私密事务目录，其中保存两个二进制文件以及
精确的旧、新回执。事务日志绑定所有者和全部保存文件的哈希。配置、systemd 单元、
设备凭据、AWG、云资源、防火墙及本地网络均不属于此事务。

切换二进制文件和回执后，仅启动该 VLESS 服务，检查 Reality 目标、语法、
活动状态和本地监听端口。失败时尝试经过所有权验证的回滚。回滚失败或强制中断
会保留经过验证的日志，供显式 `recover-upgrade` 恢复旧运行时。
普通安装和删除会拒绝未完成的事务，不猜测结果。

已提交的事务保留旧运行时以支持显式回滚。携带原预期回执重复升级仅验证结果，
不会再次重启服务。回滚要求当前新回执；恢复中断操作要求原旧回执。
写入前，两种操作均验证当前和保存的每个受管文件。普通删除还会验证并移除
已提交事务的精确自有文件。额外文件、符号链接、硬链接、不支持的版本、
配置或服务内容变更都会阻止操作。

同步目录项和原子文件替换以保证持久性。进程在发布前被终止可能留下不生效的
暂存目录；系统不会将其认作自有部署，也不会根据猜测删除它。

### 观察与兼容性

运行时状态报告有界且非敏感的版本/哈希、事务状态、当前内核版本以及可获得的
已安装内核包版本。内核补丁状态始终为 `not-assessed`；比较上游版本不能识别
发行商回移的补丁。不会隐式升级软件包、重启或应用防火墙缓解规则。
此类操作需要在 #103 中单独准备范围明确的维护流程。

原生 `.vpn`/QR 内容、VLESS TCP Reality/Vision 策略、DNS/路由和 AWG MTU
保持不变。契约测试遵循 AmneziaVPN 5.1.0.6 的版本化导入模型；
Android/桌面实机导入和播放仍属于 #73 的在线验收。现有 POSIX 控制端/
私密存储契约继续有效。Windows 检查使用隔离测试夹具；命令不会启动 WSL 或本地 VPN。

## 验证

确定性测试覆盖新安装、旧项目重试、显式授权、精确回执检查、幂等性、健康检查失败、
中断写入、回滚/恢复、篡改日志及私密输出抑制。支持的 Linux CI 使用真实固定版本
运行时验证配置，并测试安装包 CLI 的组合行为，不访问生产基础设施。
完整规范门禁、文档和可复现构建门禁均针对 PR 的精确提交运行。

## 影响与替代方案

运行时维护成为独立且经过身份认证的操作，不再是部署的副作用。
需要短暂中断 VLESS，并临时保存两个经过验证的可执行文件。
内核重启会中断两种 VPN 协议，因此单独处理。

重建虚拟机、轮换凭据、追随会变化的 latest、手工修改回执、
接受任意旧安装程序或照搬 Amnezia 的 Docker/防火墙更新脚本都会违反这些边界。
对内部已验证的候选 wheel，无须发布新的 F-Layer 公共版本。
'''
