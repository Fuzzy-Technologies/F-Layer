body = '''# ADR 0023：显式选择 VPN 协议与隔离共存

- 状态：提议
- 日期：2026-11-06
- 任务：[#127](https://github.com/Fuzzy-Technologies/F-Layer/issues/127)、[#121](https://github.com/Fuzzy-Technologies/F-Layer/issues/121)

## 背景与交付状态

现有私有项目同时部署 AmneziaWG 和 VLESS Reality。增加标准 WireGuard 与
OpenVPN，需要显式选择、独立凭据和网络，以及对已准备项目的安全演进。
普通部署目前会拒绝已准备意图发生变化的项目。应保留这一拒绝行为，
直到专用迁移流程能够证明所有权并恢复中断的变更。

本 ADR 定义 2.1 发布的实现契约。下述新模式、命令和协议均为计划内容；
合并决策并不等于已实现或已部署。服务器与导出实现、自动化门禁、文档和
已安装客户端验收，仍由 Feature #120 和 #119 下的独立任务交付。

## 选择与兼容性

保留项目模式 1、其隐式 AWG/VLESS 组合、指纹、文件名、凭据、清单、
主机信任及云状态的字节兼容性。普通准备、部署和导出不得隐式迁移旧项目。

项目模式 2 增加显式且非空的 `protocols` 数组。允许的标识为
`amneziawg`、`vless-reality`、`wireguard` 和 `openvpn`。
拒绝未知或重复标识；计算指纹时按上述固定顺序规范化。
所选协议必须提供设置，未启用协议的设置表应被拒绝。
旧软件包必须在修改前拒绝模式 2；这是明确的前向兼容边界，不代表可以重建虚拟机。

身份、云位置、路由策略和命名设备保持原有含义。
`devices.ipv4_address` 仍只属于 AWG。每个新增 IP 隧道拥有
`device_addresses` 表，将精确声明的设备 ID 映射到显式私有 IPv4 地址。
不得重命名设备或按枚举顺序分配地址。VLESS 不分配隧道地址。
新协议不得复用 AWG 密钥、VLESS UUID 或其他协议的证书。

以下片段展示未来模式 2 的字段；它不是完整项目，也不是当前软件包可接受的配置：

```toml
schema_version = 2
protocols = ["amneziawg", "vless-reality", "wireguard", "openvpn"]

[wireguard]
port = 51821
tunnel_cidr = "10.67.0.0/24"
mtu = 1280

[wireguard.device_addresses]
laptop = "10.67.0.2"
phone = "10.67.0.3"

[openvpn]
port = 1194
protocol = "udp"
tunnel_cidr = "10.68.0.0/24"
mtu = 1280

[openvpn.device_addresses]
laptop = "10.68.0.2"
phone = "10.68.0.3"
```

生成材料或创建云适配器前，校验全部所选设置。传输/端口组合必须唯一，
TCP 22 保留给管理。拒绝云网段与隧道网段重叠、使用服务器/网络/广播地址、
重复对等端地址以及子网容量不足。每个隧道的首个主机地址保留给服务器。
MTU 必须在限定范围内，初始默认值为 1280。DNS 和全量/分流 IPv4 路由
沿用现有严格契约。原生导出最多支持两个 DNS 服务器，必须拒绝静默截断。
来宾端仍显式禁用 IPv6；兼容客户端的防护措施与泄漏检查是必要验收证据，
不能从服务处于运行状态推断。

## 所有权与迁移生命周期

通用 `state.json` 保持模式 1，仍存储相同六类云资源定位信息。
新增的受管传输描述符和操作日志使用独立、私有且带版本的文件。
将其绑定到精确栈身份、原始项目指纹、各传输的期望指纹、
材料/制品清单哈希以及观察到的来宾回执。不得包含密钥、证书或配置正文。
显式迁移期间，模式 1 的制品与固定主机信任保持不变。

未来 `flayer vpn protocol` 流程包含只读 `plan`、显式 `enable`、`disable`
以及 `recover`。修改需要现有 `--allow-mutation`、精确 `--scope-confirm`
及计划中的预期基线摘要。基线绑定当前受管云入口规则、来宾回执和本地材料。
第一次写入前重新观察；拒绝非本方所有权、主机信任变化、漂移、计划过期、
未解决日志或非预期旧摘要。增删协议绝不能成为普通 `deploy` 的隐式副作用。

激活前先暂存并校验私有材料、生成配置与已验证运行时。
每次远程变更前，将预期旧/新哈希写入日志。保留现有 SSH 入口及其他所选协议。
云入口更新必须核验所有权和精确旧规则集，并从提供商回读结果；
API 结果不确定时要求恢复，不能猜测并重试修改。
只原子更新已证明归属的来宾输入链：较早 nftables 基链中的 accept，
不能覆盖后续基链的 drop。绝不使用 `flush ruleset`。

每个新协议独立拥有服务、接口、运行目录、入口条目及按接口限定的转发/NAT 表。
名称由完整栈身份生成：`flayer-wg-<12hex>` / `fwg<12hex>` 和
`flayer-ovpn-<12hex>` / `fov<12hex>`；接口名不超过 Linux 的 15 字节限制。
仅允许声明的对等端源/目的地址、已建立连接的返回流量及本方接口的 masquerade。
拒绝隧道间转发。无关表、服务、主机路由、DNS 和网络适配器不属于操作范围。
其他隧道可能仍依赖全局转发时，不得将其关闭。

相同操作应校验并复用已安装回执，不下载、不安装软件包、不生成凭据，
也不重启服务。激活前失败不得影响现有服务；有限变更后失败，
只从已验证私有备份回滚该项变更。进程崩溃或结果含糊时，
留下持久的 recovery-required 状态。恢复时核对精确的旧或新观察状态；
未知状态按失败关闭处理。停用仅删除已证明归属的服务、接口、文件及入口/NAT 条目；
控制器私有材料保留供审计，擦除需单独显式操作。
不得删除虚拟机、磁盘、保留地址、共享网络或其他协议的资源。

## WireGuard 运行时与对等端材料

使用 Ubuntu 24.04 amd64 的内核 WireGuard 实现。
上游推荐 Linux 使用内核实现；避免第二个 Go 运行时和隐式用户态回退。
安装前验证来宾平台、内核能力及支持的已修补内核策略。
记录实际运行内核与软件包的精确版本；内核安全更新及重启授权属于 #103，
不属于协议激活。缺失或未经批准的内核在任何修改前失败。

从上游 `v1.0.20260223`、提交
`49ce333da02056ae7b22ee2aeb6afe8aaed79b19` 构建私有 `wg` 工具。
实现必须固定并校验源码归档 SHA256，保留上游声明，
并在所有权回执中记录构建/工具链和已安装二进制哈希。
不得安装浮动版本 WireGuard 软件包或修改系统 `wg-quick` 服务。
运行时更新必须显式核对预期回执，并支持暂存验证与回滚。

在本地生成独立的 X25519 服务器密钥、每设备一组 X25519 密钥对及随机预共享密钥。
私有目录权限为 `0700`，普通文件为 `0600`，沿用现有路径、链接和清单防护。
只有服务器私钥与对等端公钥/预共享密钥传到来宾；客户端私钥只保留在控制器
及对应设备的私有导出中。只持久化一次，复用时校验精确设备/地址所有权。
标准 WireGuard 不包含 AWG 混淆字段。

注册时只暂存新对等端，保留所有旧密钥和地址。
吊销需原子地从受管配置与运行接口删除该对等端；仅删除导出不等于吊销。
显式轮换绑定预期旧材料和回执，并指出哪些配置需要重新导入。
服务器密钥轮换影响所有 WireGuard 配置，必须明确说明。

## OpenVPN 运行时与凭据生命周期

在 Ubuntu 24.04 amd64 上使用 OpenSSL 3 构建上游 OpenVPN `2.7.9`，提交
`7b60c2aa34992639691e3a2d651fe27301e2e9d5`。
固定并校验发行源码 SHA256，保留声明，并在回执中记录编译器、
通过身份验证的发行版构建依赖及二进制哈希。
不得替换系统 OpenVPN 二进制或服务。初期禁用 DCO，避免本功能修改内核模块。
运行时维护遵循与 WireGuard 相同的暂存、预期旧状态和可恢复契约。

支持一个显式选择的 UDP 或 TCP 监听，默认 UDP 1194。
TCP 是操作人员选择并配套相同客户端设置的备用方案，不自动增加第二个监听。
使用 `topology subnet`、证书绑定的静态 CCD 地址、`ccd-exclusive`
以及明确区分的服务器/客户端证书角色。不允许重复 common name 或仅密码认证。

通过 VPN 的密码学依赖，在本地生成私有 ECDSA P-256 CA、服务器密钥/证书
及每设备的密钥/证书。复用时校验 CA basic constraints 与签名用途、
叶子密钥用途、服务器/客户端 EKU、随机正序列号、签发者签名和公私钥匹配。
稳定的服务器及设备证书名称由栈/设备身份生成。
CA 私钥和设备私钥绝不传给来宾。来宾仅接收 CA 证书、自己的服务器密钥/证书、
CRL、静态控制通道密钥及最小 CCD 条目。普通状态和诊断不得包含这些材料。

使用 TLS 1.2 或更新版本、双向证书验证、精确的预期服务器名称验证、
AEAD 数据密码 `AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305`
及带本地生成 256 字节静态密钥的 `tls-crypt`。
拒绝压缩、旧密码回退、任意脚本/插件及无限制推送策略。
控制密钥由该 OpenVPN 服务共享，不能替代每设备证书认证；
轮换时必须重新导入所有 OpenVPN 配置。每客户端 `tls-crypt-v2`
可作为后续扩展，当前不作隐式承诺。

CA 有效期为 3650 天；服务器和设备证书为 365 天，且不得超过签发者有效期。
not-before 容许五分钟时钟偏差。prepare、plan 和 status 都检查 UTC 有效期。
材料过期或无效时按失败关闭处理，不能静默重新生成。提前 30 天提示续期。
CRL 的 next-update 间隔为 30 天，提前七天提示续期。
续期必须显式执行；除非另行选择轮换，否则保留身份和密钥，且仅安装已验证替代物。
CA 轮换是影响全部客户端的独立迁移，必须明确影响与回滚，绝不在普通部署期间执行。

吊销记录精确设备序列号，发布 CA 签名的 CRL 并排除其 CCD 条目。
安装 CRL 后仅重启所选 OpenVPN 服务，使现有会话终止且后续握手被拒绝。
应说明此有限操作也会中断其他 OpenVPN 会话；AWG、WireGuard 和 VLESS 必须保持不变。
过期 CRL 不得视为健康。续期和重试期间保留吊销历史，不得复用序列号。

## 客户端制品与验收

保留受管包名称 `device-<deviceId>-<protocol>` 和安全重复导出行为。
标准 WireGuard 包含 `wireguard.conf` 和原生 `amnezia.vpn`；
OpenVPN 包含自包含的 `client.ovpn` 和原生 `amnezia.vpn`。
仅包含所选设备凭据、端点、精确路由/DNS 策略及必要的公开 CA/服务器身份。
绝不导出 CA 签名密钥、服务器私钥、管理凭据或其他设备材料。

现有 `--qr` 仅生成完整 Amnezia 原生扫描帧，沿用 qCompress/QDataStream
封装和帧数上限。标准 WireGuard QR 属于另一种导入器契约，需要未来显式格式选择器；
不得把原生帧称为通用兼容格式。OpenVPN 同样没有通用的纯配置 QR 契约。
默认文件导出不得导入可选 QR 渲染依赖。

两个新原生配置以 Android 和 Windows 的 AmneziaVPN 5.1.0.6 为目标。
匹配固定源码模式：`amnezia-wireguard` / `wireguard` 与
`amnezia-openvpn` / `openvpn`；第三方 `last_config` 必须包含协议的
结构化 JSON 和精确原生 `config`，不能用原始文本代替结构化对象。
两种表示中的设备 ID、对等端字段、CA/名称验证、传输、路由与 DNS 必须一致。

Android/Windows 的标准 WireGuard 客户端使用 `.conf`；
OpenVPN 2.6/2.7 社区客户端及 OpenVPN Connect 必须使用所选 AEAD/TLS 配置验收。
这些只是目标矩阵，不代表兼容性验证已经完成。
#132/#126 验收时记录精确客户端版本与导入行为。
配置语法、编解码往返或活动服务都不能证明 DNS、IPv6 防护、漫游、
重连、互联网访问或媒体播放正常。

实现门禁覆盖模式 1 的基准指纹/制品、协议子集选择、冲突、隔离的内核/工具/
OpenVPN 一致性、原生文件/QR 往返、敏感诊断隐藏、所有权及中断后的回滚/恢复。
已安装 wheel 测试使用模拟或隔离资源。任何真实部署、付费资源创建、
主机重启或桌面 VPN 切换都需要所有者另行授权明确边界。
无关协议工作期间，现有手机/桌面配置始终保持有效。

