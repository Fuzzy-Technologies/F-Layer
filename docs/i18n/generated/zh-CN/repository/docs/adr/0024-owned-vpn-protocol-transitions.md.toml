body = '''# ADR 0024：受管 VPN 协议迁移与不可变纪元

- 状态：Proposed
- 日期：2026-11-07
- 任务：[#128](https://github.com/Fuzzy-Technologies/F-Layer/issues/128)、[#122](https://github.com/Fuzzy-Technologies/F-Layer/issues/122)
- 扩展：[ADR 0023](0023-selectable-vpn-transports.md)

## 背景与实现边界

显式选择协议的项目生命周期保留不可变的六资源创建计划。WireGuard 对等端修订已能变更一个已部署协议，同时保留服务器密钥、其他对等端、运行时及云策略。添加或停用整个协议还涉及主机输入策略和云入口；必须保留原始资源身份，并在对等端及协议变更之间撤销陈旧操作授权。

本决策定义协议迁移集成。私有代码已提供 `IngressDelta` 规划器、限定范围的异步入口操作、
公共来宾预留、受管输入事务、已提交图读取器、代际缓存准备及私有原生 WG 转换。公共协议
CLI、旧项目迁移、完整控制器协调及纪元发布在完成集成和测试前仍不可用。普通部署继续拒绝改变的
协议选择，这些私有后端不会绕过该准入边界。

## 原始创建身份与协议纪元

绝不以按新监听器编译的计划替换原始六个 `ResourceSpec`、创建标签、bootstrap 字节/路径/哈希、VM 附件或串行控制台信任指纹。通用云 `state.json` 不变。创建基线永久保留，有效协议状态使用独立叠加层。

采用不可变协议纪元。每个新纪元绑定精确前一纪元、其 WireGuard 对等端修订段的终结指针/摘要、已配置协议意图、活动协议固定值及保留的受限材料/服务器引用、静态选择指纹、活动来宾回执/历史以及完整云/主机入口回执。保留所有已关闭修订段及原始文件。纪元和日志元数据不包含密钥正文。

纪元零是现有创建基线和原 WireGuard 对等端布局。已提交迁移启动独立对等端修订段，其起点为新纪元的精确摘要。对等端记录仍绑定原始创建摘要；后续纪元先关闭该段，再启动新段。此顺序保证无环，并防止旧对等端计划在协议改变后重新获得授权。缺失父项、修订段、引用或所有权证明均拒绝操作；孤立产物不能用来猜测丢失的头指针。

通过已验证纪元和当前对等端修订段解析活动协议固定值。源引用只有经受管清单和完整摘要验证后，才能指向原始字节、已关闭对等端请求或协议请求。读取历史状态不得重新生成安装器。非秘密遍历和整个云栈清理必须在客户端私有文件丢失时仍可进行；读取活动凭据仍需完整私有清单。

项目模式 2 保留非空的已配置 `protocols` 声明及其设置/材料。纪元另行记录活动子集，该子集可以为空。停用最后一个活动协议仍保留 VM、地址、SSH 和配置文件，并报告没有活动协议。普通 deploy 不得重新激活已停用协议。对等端操作要求目标协议处于活动状态；重新启用必须显式说明将激活哪些保留成员。

## 规划与协调变更

未来公共流程包含只读 `plan`/`status`、显式 `enable`/`disable` 及 `recover`。短期有效计划绑定目标意图、精确纪元/对等端头、当前完整云策略/附件、现有已认证主机固定值、全部相关来宾回执/历史和私有请求摘要。要求显式变更同意、精确 scope 及预期基线；发送前重新观测。过期或漂移不能仅靠编辑 CLI 参数修复。

现有项目锁覆盖全部协作的本地入口。持久协议日志在恢复完成前阻止普通 deploy、runtime、export 和对等端变更。来宾预留日志还拒绝持有项目副本的第二控制器：本地 advisory 锁不能串行化两台机器。只读 status 仅报告已验证的旧/新状态前缀。全云删除保留独立显式 scope，只接受完整且已知的已提交或待处理云策略前缀，绝不接受任意规则。

来宾入口协调锁始终先于协议专用锁，使用固定顺序。在实际保护变更的锁内验证预期授权。允许云写入之前，持久化预留、目标哈希及操作 nonce；云结果未知时保留预留。完成或取消必须持久消耗旧来宾授权，防止协议迁移流程中延迟的 SSH 操作在报告回滚后激活。恢复重试保留精确完成证明，不能每次重试都产生新授权纪元。

## 精确云入口差异

规划前，控制器必须根据创建基线与已提交叠加层证明完整原始云图及有效策略。调用方自行提供的快照不能证明真实规则此前已获授权。

纯 `IngressDelta` 绑定冻结的安全组 spec、完整栈身份、活动资源、网络、精确原规则 ID/元数据、一个监听器和操作 ID。保留原始 `flayer-spec` 标签。新允许规则描述由完整 owner 哈希、协议和操作 ID 构成，只开放一个 TCP 或 UDP 端口及完整声明的 IPv4 源列表。在已验证提供方读回分配 ID 之前，它没有真实提供方规则 ID。该端口任何既有宽范围或窄范围允许规则都会阻止新启用计划。

移除必须提供已验证回执中目标端口的全部允许规则 ID、精确监听器/源语义，以及原创建语义或完整受管操作标签。无操作标签的创建规则还需单独证明的 `creationListener`，包含原协议名称，并与目标一致。控制器构造 delta 前必须从原始清单绑定的协议角色或纪元获得该绑定，不能从端口相同或调用方期望名称推断。通用创建 spec 本身没有协议归属。拒绝宽端口范围、任意描述、重复源允许、无关 ID 和 TCP 22。其他规则、描述、标签在规范化后必须完全一致。带标签的目标规则目前不能移除，因为计划中的 CLI 写入器尚不能保证精确恢复标签；这不表示丢弃其他规则标签，也不将未知目标视为空。

可选规则标签遵循提供方有界不可变 map 契约，参与完整策略比较。缺失标签与空标签规范化后等价；未知字段及不支持的目标仍是错误。[安全组响应](https://yandex.cloud/en/docs/vpc/api-ref/SecurityGroup/get)记录了标签，并区分活动策略与正在更新的策略。

文档中的 [update-rules API](https://yandex.cloud/en/docs/vpc/api-ref/SecurityGroup/updateRules)接受显式删除 ID/新增 spec，返回长时间运行操作。请求没有文档化的预期代际前置条件，因此实现必须将前后检查视为乐观并发控制，不能声称提供方保证 compare-and-swap。只使用已证明的 ID，不能通过替换整个组来擦除其他操作者条目。

未来 [CLI 写入器](https://yandex.cloud/en/docs/cli/cli-ref/vpc/cli-ref/security-group/update-rules)使用显式组 ID、scope、`--async` 和 `--retry 0`。现有作用域适配器已禁用 CLI 重试。轮询前保存返回的操作 ID，校验资源绑定及最终结果后再读回策略。结果或操作 ID 丢失时保持需要恢复：看似旧状态的快照不能证明排队变更不会稍后执行。绝不盲目重新发送或按时间戳猜测操作。外部漂移会停止协调。

回滚时重新添加的目标规则可能获得新提供方 ID 及显式计划的所有权描述。验证已恢复监听器语义，保留所有无关 ID/元数据字段，再将完整实际读回写入不改变活动集合的纪元云回执。历史 `BeforeSha256` 和旧快照仍证明原始状态，不能用来证明已恢复规则的新 ID。

## 来宾输入策略与协议安装代际

改变监听器时不得重放初始 bootstrap 或使用 `flush ruleset`。先验证原启动文件及精确已提交叠加层，再原子替换唯一已证明归属的输入表，并持久保存对应启动文件变更。保留 SSH 和全部无关协议。额外接受 base chain 无法覆盖既有丢弃 chain，因此仅添加第二条允许链并不能实现协议激活。

启用顺序：一次性保留私有凭据；在云及主机入口关闭时暂存并验证运行时/配置；激活受管服务；允许主机输入；允许云输入；验证全部结果回执；提交纪元。停用顺序：拒绝云输入；拒绝主机输入；仅停止/移除受管服务、接口及其转发/NAT 表；验证其他协议；提交纪元。

移除前保留已验证的私有运行时、unit 和配置备份。回滚复用原固定二进制和密钥，不下载、重建或重新生成。其他隧道仍使用全局转发时不得重置它。结果未知的网络操作必须保留日志，不能宣称回滚完成。

停用并重新启用 WireGuard 创建带新受管 nonce 的新安装代际，但保留服务器/客户端密钥及声明地址。只有该显式预期回执/历史事务可以归档或重置旧审计；根目录缺失但审计仍在时，普通安装继续拒绝。根目录缺失期间保留授权撤销证明，在现有 WireGuard 锁内发布替代代际及新历史，不能暴露“根目录缺失且历史为初始值”的状态，从而授权旧安装器。

私有代际缓存后端绑定模式 2 复合请求，其中包含云计划摘要、精确 WG 入站差异、保留来源/文件
固定值及完整缓存/候选回执。在已暴露公共预留和 WG 历史撤销保护下，复制任何回滚/运行时
字节前先持久化准备日志。缓存路径仅由完整所有者及回执摘要推导。验证每个私有文件及祖先，
同步文件 inode 和目录边界，最后发布缓存回执。已记录 preparing 操作只能追加已证明匹配
来源前缀的剩余部分，或补全目录崩溃后的已知缺失项。缺失日志不能授权截断文件恢复。
已准备缓存不可变；重试验证/重新同步缓存，不依赖已丢弃临时来源。只读状态不修复发布，
也不宣称服务已激活。

代际记录模式 2 还要求在停用 WG 时预先规划新的回执模式 2 候选：该身份专用于恢复，而非
第二个活动服务。配置、密钥、二进制、许可证及执行内核证据完全保留，同时绑定新操作
nonce、辅助程序、unit 和网络证明。旧停止命令结果不确定后，绝不能恢复仍可能被延迟命令
选中的旧 unit 身份。代际记录模式 1 仍可用于仅缓存恢复，但没有新的显式计划/预留时，其
已暴露计划摘要不能获得候选或主机入站修改权限。

主机入站后端仅在公共锁、WG 锁保护下，凭精确已准备代际日志及两个完整恢复缓存接受版本化
复合请求。再次检查原始实际 WG 状态/历史，在发布 boot、替换原生入站及发布终态入站日志
全程保留已验证缓存文件/目录描述符。缓存丢失、inode 改变、复制的意图/历史或准备未完成，
均在继续修改入站前拒绝；只读状态不修复。仅入站模式 1 复合请求保留现有私有事务契约。

原生代际记录模式 3 增加显式回调 ABI。首个原生日志之前，辅助程序固定值必须等于明确批准
的当前私有接收程序源字节。模式 1/2 缓存计划不能在原摘要下获得此能力。原生日志保存已
准入辅助程序身份；支持相同 ABI 的后续已批准接收程序可以恢复密封操作，不替换其不可变
辅助程序或候选。未知 ABI 拒绝。
模式 3 开放入站即使在尚无运行时日志时，也要求健康原生记录；准备和关闭保留其原生变更
前路径。

释放 WG 锁交给停止任务前，先在 WG 锁内解除原根的授权，避免只识别 WG 锁的旧对等端驱动
在交接期间获得健康旧根的新权限。保留精确私有缓存，发布替代根前先消耗新 installed 候选
的历史。停用回滚同时消耗原预留和新代际的历史撤销链，绝不恢复旧历史或已退役 unit 名称。
删除 installed 根必须严格校验对等端/地址；只有 staged 候选允许已知部分激活。清理仅选择
已验证文件成员，保留随后出现的意外项。

提交任务前协调精确文件支持的已加载 unit 定义。重载前允许静止的缓存解析错误，但重载后
身份必须严格。退役 unit 或确认激活前，必须观测空 Job、
主/控制 PID 为零及空 cgroup v2 子树；客户端继承描述符不能证明 PID1 任务已排空。重复停止
永久退役的精确 unit 可恢复“已记录意图但尚未提交”的崩溃边界。待处理/未知任务保留恢复
状态。发布与终态确认全程固定并同步实际根载荷、unit、启用链接及目录身份；staged/installed
回执的有意替换使用独立校验范围。新 inode 字节相同但未同步，仍不足以确认。

重启使密封回调无法启动后，完整已知后继日志临时文件可能需要显式协调发布。只有精确
installed 候选文件/历史、完整受管内核空间缺失及已排空 unit，才允许已记录重启阶段。
installed 对等端/地址部分漂移仍拒绝。只读状态报告需要恢复，不修复文件或声称活动健康。

首个原生日志之前，或处于 `ready`/`unchanged` 时，已精确暴露的代际记录 3 可以将原
installed 身份观测为静止。要求精确完整的原回执、文件、unit 和来源固定值、未变执行
内核、已消耗原历史、完整受管内核缺失，以及无任务/PID、无 populated cgroup 的已排空
unit。这既不声明健康，也不推断发生重启。部分或外来状态仍拒绝。缓存和原生前入站恢复
要求显式可信运行时观察器；初始 Reserve/Expose 准入不变。移交锁前永久退役旧 unit；
回滚只恢复预先规划的新候选，保留密钥/运行时及两个历史屏障。此前健康的 `unchanged`
回滚在停止后也可能需要相同恢复。静止时不能新授权开放入站；若入站此前已恢复，则在
新服务恢复期间保留其精确策略。只读状态报告需要恢复。

这些规则依据 [systemd 255 Job 输出](https://github.com/systemd/systemd/blob/v255/src/systemctl/systemctl-show.c)、
[systemd unit/进程属性](https://www.freedesktop.org/software/systemd/man/255/org.freedesktop.systemd1.html)
及 [cgroup v2 递归 populated 状态](https://docs.kernel.org/admin-guide/cgroup-v2.html#un-populated-notification)。
systemctl show --all 将无任务表示为空 Job 值，而不是数字零。

缓存准备本身不变更活动根、unit、入站策略或云资源。原生转换仍为私有，并保持公共预留
暴露。云操作顺序、调用公共完成、带代际的纪元发布及公共 CLI 准入仍需控制器集成。仅缓存或
入站准备均不能授权服务命令或结束已暴露预留。

其他协议变更保留活动 WireGuard 的密钥、配置和根回执，但首次协议写入前必须在同一现有 WireGuard 锁内消耗其对等端历史授权。采用现有有效的前后回执相等的取消审计格式发布新链式历史头；已排队的旧对等端驱动字节会发现预期历史不同并拒绝变更。只有新代码理解的预留机制不足以做到这一点。此证明之前必须拒绝待处理对等端事务。将新历史写入下一纪元；若协议变更随后回滚，也要发布保持旧活动固定值/访问语义、更新完整云回执并记录已消耗历史的无活动变更纪元完成记录。回滚绝不恢复旧历史。此操作要求活动 WireGuard 的精确健康回执。若 WireGuard 不活动或不存在，则验证独立的完整命名空间缺失及保留历史证明，绝不能仅为撤销授权而伪造运行中回执。

显式新 WG 根使用回执模式 2：保留原始 `install.py`、deployment、密钥、二进制及许可证，
增加单独固定的 `lifecycle.py`。两个 unit 回调均绑定精确代际 nonce，在现有 WG 锁内重新
读取完整根元数据，任何原生写入前拒绝陈旧 nonce。原生命令子进程继承该描述符，父进程
丢失后仍保留保护。叶回调不会在取得 WG 锁后再获取公共入口锁。

模式 2 的 systemd unit 名称也包含代际 nonce，旧模式 1 保留原固定名称。指定旧 unit 的延迟
高层启动/停止命令不能解析为当前加载的新 unit 并取得其新回调参数。根及对等端事务路径不变。
根据有界受管回执元数据选择活动 unit 后，仍须验证全部文件、规范代际路径及运行时才能授予
权限。健康及完整缺失检查拒绝保留的其他代际或未知所有者 unit，以及断裂启用链接，绝不
隐式接管或删除这些项。

控制器持有 WG 锁时执行同步 systemd 回调会死锁，因此回调拒绝锁竞争。
原生父进程保留公共入站协调，仅在 systemctl 客户端执行期间释放 WG；叶回调获取 WG 而
不获取公共锁。待处理预留只允许绑定精确代际、当前头/请求及已消耗历史的完整密封原生
上下文。普通移除/恢复仍拒绝模式 2 代际。目前缓存准备器仅写入未发布私有候选，不撤销
历史、不发布根、不授权转换，也不证明活动健康。缓存重用验证完整回执和文件摘要，以及
相同执行内核事实，不下载、构建或重生成凭据。首次运行时准备仍需原有厂商/构建门禁。

私有首次准备器在独立空临时目录中执行相同的执行内核、厂商 CVE、固定工具构建及配置
验证。要求显式同意、精确三个来源文件固定值，以及已批准当前 receiver 回调固定值。
保留 staged 模式 1 基线，再派生 staged 模式 2 候选，凭据、运行时及内核事实完全相同；
两个快照都不声明已安装。拒绝已占用、别名、嵌套或受管状态目标路径；确认前复查来源及
内核事实。回执最后写入。中断临时文件不授予权限，重试不得接管或替换。不得发布旧式
WG 事务、根、unit、预留、历史屏障或网络变更。原直接安装保留厂商门禁及线格式。

## 显式旧项目迁移

迁移是独立规划操作，绝不是 prepare/deploy 的副作用。捕获创建基线前读取已验证的模式 1 配置、清单、原 bootstrap 及观测。保留全部六个实际 spec、项目内原 bootstrap 路径、原 serial 标记、主机固定值、文件名、客户端导出及旧指纹。由现有组合凭据派生每协议材料引用，不签发新密钥，也不改变服务器字节。

原子替换 `project.toml` 之前，日志记录精确旧/新公共 TOML 快照和哈希、不可变元数据及发布边界。恢复可解析任一已记录模式，不重建丢失意图。旧入口和新入口必须在创建密钥或适配器前识别待处理/已迁移状态。旧包在变更前拒绝模式 2。迁移本身只改变已验证控制器元数据，云/来宾证明均为只读；不重标资源、不改入口、不重装服务、不创建付费资源。

## 意图与完成绑定

授权纪元意图与已完成不可变包分开。规范意图绑定永久创建、前序纪元及对等端段闭合、
配置和活动来源、预留，以及完整云、入站和服务证据摘要。模式 2 来宾完成记录消耗 nonce
与前序公共头，并绑定意图摘要。最终包包含意图和精确完成，其完整包摘要成为下一对等端
段的起点，从而避免完成记录与最终纪元摘要之间的循环依赖。请求来宾完成前须准备并记录
完整预期候选，只有验证精确来宾完成后才发布本地纪元头。现有模式 1 暴露前取消只能闭合
无活动变化、入站不变且未提交云操作的纪元，并保留预留摘要。

模式 2 纪元意图将完整代际记录 3 和原生终态日志摘要与既有证据绑定。验证时重建精确的
模式 2 复合计划及原生终态记录，绑定已配置 WG 来源记录摘要，并用保留的公共清单核对
全部三个来源文件固定值。启用、移除、恢复和回滚代际必须对应精确 installed 回执或缺失
以及已消耗历史。停用恢复先消耗原根屏障，再消耗新 installed 根屏障；直接从前序对等端
历史计算一次新屏障并不足够。未启动且未应用的操作不声明新代际或原生变更，保留原有
已消耗屏障，真正尚未屏障且未暴露的取消除外。原生回滚要求已恢复入站事务。保持模式 1
意图兼容性。若前序纪元已有其他协议的完整服务回执或缺失证明，原生纪元必须精确保留。
这些元数据检查不会把自行提供的摘要变成实时证明，也不单独授权发布或完成。

保留完整已知终态云操作和读回，以及每个原始或补偿入站意图制品。补偿绑定独立有效窗口，
记录实际恢复的提供方 ID 和标签。发送前预留完整恢复及纪元容量。与旧规则相同的快照不能
把未知提交变成未发送取消。本地图验证声明的证据及祖先关系；经过认证的实时证明、来宾
完成的调用、发布恢复及公共入口准入仍是协调器的独立责任。

### 私有原生完成

私有公共完成器接受封闭候选，绑定模式 2 纪元意图、完整复合请求、原生/入站终态日志及
与来源绑定的服务证明。I/O 前重建所有原生终态记录。在公共 → WG 锁内，首次发布重新
验证固定代际文件、实际原生状态/历史、已安装文件身份及终态入站策略。可信观察器依赖
必须测量每项其他服务；调用方给出的摘要不足以满足要求。云和本地图证明仍由协调器负责，
目前没有 RPC 或公共 CLI 调用此后端。

精确不可变模式 2 完成记录是提交点。先发布公共头，再仅移除已验证的规范入站/代际/原生
旁车日志，最后移除预留。重新出现的旁车或无法解释的临时项会保留预留。完整精确记录
允许在重启后恢复元数据发布/清理，不声称当前服务健康。精确但不完整的字节前缀必须重新
验证实时终态证明才能追加；不同字节不能接管或替换。恢复绝不倒退已消耗的对等端历史。

普通 WG 变更入口继续前必须同步已完成公共命名空间，封闭最终 unlink 后目录屏障失败
的窗口。只读准入不执行同步或修复。此后端覆盖原生终态操作；模式 1 未暴露取消仍是
单独的无操作路径。

## 私有控制器发布

在现有项目锁内，请求来宾完成前保存包含四个预期公共纪元文件的有界日志。预测完成并非
确认，也不发布头。验证完整旧图、已闭合对等端段、来源/入口清单及容量，仅允许该候选
限定的额外制品。普通图读取器仍拒绝待处理日志。丢失的发布权限不能从孤立包或对等端
目录重建。

协调器提供精确且单独认证的来宾响应后，持久化 `observed`，创建精确空的下一对等端
命名空间，发布新头，再移除终态入口元数据，最后移除发布日志。保留完整已知终态提供方
引用；未知发送不得清理。不可变公共文件按精确前缀恢复，清单最后写入；变更字节、inode
替换、文件次序缺口及目录成员 ABA 均拒绝。完整不可变快照持续固定至后续头及清理屏障。
晚期快照漂移保留或恢复同一 observed 保护日志，不授予新的来宾/云权限。重复完成使用
同一纪元及来宾响应。只读状态不执行修复。

项目锁的变更准入在后续对等端/来宾写入前同步已发布项目命名空间，封闭最终日志 unlink
后目录屏障失败的窗口。只读协调不执行同步。这些是本地发布原语；认证 RPC、实时证明、
云顺序及公共 CLI 准入仍待集成，任何本地记录本身均不能证明这些事实。

## 后果与验证

此设计增加有界元数据及恢复路径，但使原始所有权独立于目标监听器，并保留设备连续性。拒绝模糊状态优于默默采用规则或重新激活已吊销对等端。项目和来宾锁对外部云管理员仍只是 advisory；不承诺分布式原子性，也不修复任意漂移。

确定性测试必须覆盖完整规则身份/标签、保留 SSH 和无关服务、端口/源冲突、陈旧计划、延迟命令、每个发布边界、已知/未知提供方结果、无密钥轮换回滚、全云清理时私钥丢失，以及从任一 TOML 快照迁移。使用 mocks 和隔离 Linux 一致性验证，绝不使用所有者桌面 VPN。已安装客户端/真实云的人工验收仍需单独授权。

拒绝的替代方案：重新编译或重标原云计划；整体替换安全组；重放 bootstrap；从看似旧状态的 API 快照推断成功；仅保存最新对等端头而不关闭父修订段；迁移时重新生成凭据；认为第二条 nftables accept chain 已足够。
