# 架构决策记录

F-Layer 使用架构决策记录（ADR）保存对架构、公共契约、兼容性、安全边界、持久化、提供商接口或扩展设计产生实质影响的决策。

## 命名

```text
0000-template.md
0001-short-decision-name.md
0002-another-decision.md
```

ADR 编号一经分配便保持不变。

## 生命周期

1. 在实现之前或同时记录背景和决策。
2. 链接实现该决策的功能、任务及相关 PR。
3. 描述影响和被否决的替代方案。
4. 不得悄悄重写已接受的 ADR，使其代表另一项决策；必要时用新 ADR 取代。

新记录从 [0000-template.md](0000-template.md) 开始。

