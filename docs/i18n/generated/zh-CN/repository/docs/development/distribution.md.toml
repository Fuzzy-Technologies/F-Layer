# Python 发行包与安装

F-Layer 以 `f-layer` Python 包分发，安装后提供 `flayer` 命令及同名可导入包。用户安装 wheel；只有参与代码开发时才需要克隆仓库。release-2.0 的安装流程不要求 Docker 控制器镜像。

## 安装发行包

使用 Python 3.11 或更新版本。云部署控制端应运行在 Linux 或 WSL 中，因为
私有项目文件需要 POSIX 权限。云服务商 CLI 和 VPN 客户端是单独的应用，
其安装方法见用户指南。

从[发布文件](https://github.com/Fuzzy-Technologies/F-Layer/releases)下载
`f_layer-2.0.0-py3-none-any.whl` 和 `build-evidence.json`。
核对 wheel 哈希，然后在下载目录中安装核心 CLI：

```bash
pipx install ./f_layer-2.0.0-py3-none-any.whl
flayer --help
flayer check
```

如有需要，先安装 [pipx](https://pipx.pypa.io/latest/how-to/install-pipx.html)。
运行 `pipx ensurepath`；若找不到 `flayer`，重新打开终端。
pipx 会创建隔离环境。如需使用 pip：

```bash
python3 -m venv .venv
. .venv/bin/activate
python -m pip install ./f_layer-2.0.0-py3-none-any.whl
python -m flayer check
```

## 安装 VPN 扩展依赖

`vpn` 可选依赖组提供 `cryptography==50.0.2`，用于在本地生成密钥。
核心包没有必需的第三方运行时依赖。开发依赖组包含同一库，以支持 VPN 测试。
部署 VPN 时，通过 pipx 安装：

```bash
pipx install './f_layer-2.0.0-py3-none-any.whl[vpn]'
flayer check
```

或者在虚拟环境中使用 pip：

```bash
python -m pip install './f_layer-2.0.0-py3-none-any.whl[vpn]'
```

依赖解析器从配置的 Python 索引获取扩展所需的库。F-Layer wheel 来自明确
指定的本地文件。Wheel 不包含 SSH 密钥、VPN 凭据或项目配置。
PyPI 发布及上传后的安装验证步骤见下文。

## 版本来源

`src/flayer/__init__.py` 定义字面量 `__version__`。Hatchling 的正则版本源无需导入软件包即可读取该值。Wheel、源码归档元数据和已安装运行时共享同一版本。VPN 代码按需加载其依赖；安装或导入核心不会隐式启用该扩展。

稳定发布采用 `X.Y.Z` 及不可变注释标签 `vX.Y.Z`，详见[发布流程](../RELEASE_WORKFLOW.md)。版本提升属于经过评审的发布分支。开发分支合并不会发布软件包。

## 构建与安装验证

在通过 `python -m pip install -e '.[dev]'` 安装的开发环境中运行：

```bash
python -m hatchling build --directory _build/distribution
python -m pytest tests/integration/test_distribution.py --no-cov
```

Wheel 包含带类型信息的 `flayer`、Apache-2.0 许可证元数据及控制台入口。源码归档包含重建所需代码、测试、工具、文档、变更记录和示例，排除本地环境、私有状态及生成报告。构建输出不受 Git 跟踪。

安装测试构建两种格式，从源码归档重建 wheel 并比较字节。测试将 wheel 安装到新的虚拟环境，在源码工作副本外运行命令，比较模块和控制台行为，执行本地运行时诊断并检查依赖。核心安装还确认没有引入可选的 cryptography 包。

发布 CI 在上传前，对**准确的已审计文件**执行这些测试。它先获取 VPN 依赖的 wheel，然后在第二个干净环境中离线安装带 `vpn` 扩展的 F-Layer wheel。VPN 基本检查在内存中生成 X25519 和 RSA 密钥，并核对依赖一致性，不调用云服务商。可按以下方式重现该针对性检查：

```bash
python -m pip download --only-binary=:all: --dest _build/vpn-wheels './_build/distribution/f_layer-2.0.0-py3-none-any.whl[vpn]'
FLAYER_DISTRIBUTION_DIRECTORY=_build/distribution \
FLAYER_DISTRIBUTION_WHEELHOUSE=_build/vpn-wheels \
python -m pytest tests/integration/test_distribution.py --no-cov
```

使用本地构建 wheel 的实际版本。完整回归、文档和发行包检查在 CI 中运行。未明确提供 wheel 目录时，测试重新构建发行包。缺少依赖 wheel 目录时，VPN 扩展安装测试会报告跳过，而不是声称已经验证该流程。

## 配置并执行 PyPI 发布

受跟踪工作流为 `.github/workflows/release-publish.yml`，使用 PyPI Trusted Publishing 和 GitHub OIDC，不需要长期上传令牌。仅创建工作流并不会获得 PyPI 项目所有权。

首次生产上传前，所有者需要完成以下设置：

1. 登录预期的 PyPI 账户，核实对 `f-layer` 的所有权。如果项目尚不存在，为该名称配置待创建项目的 Trusted Publisher。此类 publisher 不会保留名称。
2. 将 publisher 的 GitHub 所有者设为 `Fuzzy-Technologies`，仓库设为 `F-Layer`，工作流文件名设为 `release-publish.yml`。当前上传作业不使用 GitHub 环境，因此可选环境字段留空。
3. 将仓库变量 `FLAYER_RELEASE_OWNER` 设为准确的获授权 GitHub 登录名，仅在验证 publisher 后设置 `FLAYER_PYPI_ENABLED=true`。
4. 完成并关闭原生发布里程碑，确保没有未完成项。评审并将发布合入 `master`，然后创建版本注释标签。
5. 从 `master` 运行 **Publish an owner-approved PyPI release**，提供该标签、原生里程碑编号并启用发布确认。
6. 检查上传结果，核实 PyPI 项目 URL 和版本指向本仓库。在新环境中安装已发布版本并运行 `flayer check`，之后才能说明按包名安装已经可用。

验证要求配置的所有者、明确确认、精确标签/master 一致性，以及已完成的对应里程碑。上传作业只接收通过审计和隔离安装验证的文件，只有该作业获得 OIDC 权限。普通 PR 和标签推送都不会发布到 PyPI。

实际账户所有权、publisher 配置、首次上传及上传后安装都是发布验收的操作步骤。在实际结果得到检查前，它们仍属于未验证事项。

