body = '''
# 文档完整性要求

文档完整性表示每个受跟踪文件都有明确的呈现方式，而不是每个文件都必须成为面向使用者的 API 页面。生成的[仓库清单](https://fuzzy-technologies.github.io/F-Layer/en/coverage/)记录每个文件、对应页面或源码链接，以及选择该方式的理由。机器可读版本位于 `_build/api-reference/repository-coverage.json`。

## 文件归类

`docs/site/repository-coverage.toml` 定义相对于仓库的 `fnmatch` 规则。每个 Git 跟踪文件必须且只能匹配一条规则，并有非空理由。未知文件类型、重叠规则、受跟踪文件缺失或规则格式错误都会使检查失败。未跟踪的软件包或权威站点文件不得进入构建产物。规则有意覆盖既定类别中未来新增的文件，不固定模块或文件数量。新类别需要明确修改清单，不能静默排除。

| 文件类别                 | 文档呈现方式                                                                |
| ------------------------ | --------------------------------------------------------------------------- |
| 公开的软件包 Python 代码 | 已安装 wheel 的 API 页面与精确公开定义锚点。                                |
| `flayer.__main__`        | 明确公开的可执行入口，即使名称带下划线。                                    |
| 私有的软件包 Python 代码 | 仅作为实现源码提供，并列出明确理由。                                        |
| 权威 Markdown            | 渲染且可通过导航到达，包括 ADR 模板、政策、发布指南与 GitHub PR 模板。      |
| 本地化 Markdown          | 由语言封装构建器渲染，明确标示 draft/stale/missing/approved，不会默认批准。 |
| 测试和工程工具           | 仅以源码提供可执行验证和命令，不是使用者 API。                              |
| 示例                     | 用户指南链接的输入源文件，不是 Python API。                                 |
| 工作流和 issue 表单      | 仅作为源码提供自动化与治理配置。                                            |
| 资源与本地化元数据       | 站点资源或验证器输入，不是 API 页面。                                       |
| 打包、类型标记、许可证   | 源码及发行约定，不是 API 页面。                                             |

权威编写页面的路由保持不变。仓库其他 Markdown 使用 `en/repository/<repository-path>/` 路由。隐藏的 `.github/` 源目录渲染为 `repository/github/`，使 MkDocs 能纳入 PR 模板。生成副本将 Markdown 链接解析到渲染页面，将非页面引用解析到准确的 `develop` 源文件。
构建器不会改写由所有者控制的规则文件。

## 已安装软件包与 API 边界

Wheel 安装到新的受控目录，而不是文档工具环境；环境中的其他 F-Layer 安装不影响结果。发现过程解析已安装文件的 Python 语法，绝不导入 F-Layer。
每个包文件，包括私有 Python 模块、`__main__.py`、`py.typed` 和未来的包资源，都必须与源码文件清单及字节一致。解释器字节码缓存除外。Wheel 文件缺失或多余会在渲染前导致失败。

每个非私有模块及明确纳入的 CLI 模块都有 API 页面。已定义的公开类、函数和方法必须有文档字符串及准确渲染锚点。可调用协议方法（`__call__`）也包含在内。条件或控制流程块内的定义保留其模块或类作用域，无需执行即可登记。私有辅助函数、其他特殊方法和嵌套函数在定义清单中标记为仅源码。构造函数由类签名和源码表示；当渲染器将构造函数文档字符串合入类文档时，这些文字也纳入翻译评审。Dataclass 钩子属于实现方法。导入别名、常量、字段和继承方法由定义它们的模块或类表示；检查不要求重复锚点，也不会把测试当作公开 API。

未来新增的公开模块会自动发现。新增私有模块会被登记并核对 wheel 一致性。除现有 CLI 外，要支持以下划线开头的模块，必须明确决定 API 边界。

## 站点检查与验证记录

表格补齐使用有限的 Unicode 显示宽度近似来测量原始 Markdown 单元格：宽字符和全角字符计为二，组合标记计为零，其他字符计为一。单元格字节和 Markdown 转义保持不变；不声称与所有字素或表情符号的终端宽度完全一致。

源码检查覆盖全部受跟踪 Markdown 链接、表格对齐、仓库分类和生成输出政策。严格的已安装 wheel 构建会检查所有渲染本地 URL 与精确片段、必需 API 锚点及源码链接，并从英文入口页面遍历链接图。每个已分类 Markdown/API 页面以及清单本身必须存在且可到达。因此，即使页面文件存在，只要成为无法导航到的孤立页面，检查仍会失败。

```bash
python -m tools.documentation_coverage
python -m tools.documentation_gates
python -m tools.build_api_reference
python tools/validate.py
```

这些检查验证结构完整性及来源，不能证明文字解释了所有行为、文档字符串语义正确，或译文经过人工评审。不会自动生成此类批准。

## 翻译完整性

依据 [ADR 0018](../adr/0018-generated-documentation-translations.md)，仓库页面、模块介绍、公开 API 描述、已渲染构造函数描述和清单文字均具有自动发现的翻译单元。`docs/i18n/generated/` 中的 TOML 目录文件是本地化输入，不是额外的权威 Markdown 页面。评审同时绑定原文和译文字节。API 源码列表、命令、文件名和符号标识保持不变。

语言渲染器保留路由和原始标题锚点，记录每个实际缺失或过期单元，绝不把英文回退视为翻译。从软件包 2.0 起，任何已渲染说明文字翻译不完整都会阻止文档构建成功。可选的 `--require-complete-translations` 参数将相同要求用于较早的稳定化版本。现有受跟踪文件、API 锚点、导入保护、链接、可达性和 wheel 一致性检查仍然有效。
'''
