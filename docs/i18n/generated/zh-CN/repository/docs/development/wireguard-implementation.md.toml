body = '''# 标准 WireGuard 实现边界

面向 2.1 发布的开发候选版本增加了标准 WireGuard 的底层意图模型、
私有材料编解码器及配置渲染器。这些 API 不属于已发布的 2.0.0 软件包。
架构遵循 [ADR 0023](../adr/0023-selectable-vpn-transports.md)。

## 已实现的基础

`flayer.vpn_selection.VpnProtocolSelection` 将协议绑定到已声明设备 ID 的显式子集。
新增 IP 隧道使用精确的设备/私有地址映射；AWG 保留原有设备地址字段，
VLESS 不使用隧道地址。顺序规范化，但不分配地址或重命名设备。
`Project()` 生成仅含所选协议设备与监听、共享身份和路由策略的配置模型。
无关设备、地址或监听的变化不会影响该投影。
`ParseProtocolSelections()` 只校验成员关系，不校验完整项目文件。

`flayer.profiles.wireguard` 提供经过校验的 `WireGuardSettings`、
`WireGuardPeer` 和 `WireGuardMaterial`、显式材料生成以及有界且严格的 JSON 编解码器。
标准 WireGuard 使用独立 X25519 密钥及每设备预共享密钥。
重复准备必须解码已保留材料；再次调用生成器会有意创建不同凭据。
私有字段不进入对象表示，无效输入不会在错误消息中回显。

服务器渲染器只输出自己的私钥及所选对等端的公钥/预共享密钥。
客户端渲染器只输出该设备私钥、服务器公钥、该设备预共享密钥、
显式地址、端点、MTU、路由、DNS 和 keepalive。
两种配置都不包含 AWG 混淆参数。生成材料前校验隧道成员及地址。
拒绝共享 Curve25519 身份、私有标量的等价编码、公开或复用的预共享密钥、无效子网、
TCP 监听以及不匹配的客户端端点端口。

公共 API 在内存中准备字节。凭据字节在持久化或传输前，必须进入经过所有权
验证的私有存储；不得写入日志或云元数据。
稳定服务名称由完整栈身份生成，不随对等端成员变化。

## 受管来宾服务实现

`PrepareWireGuard()` 生成包含 `server.conf`、`deployment.json` 和独立
`install.py` 的敏感服务器制品包，并为每个所选设备生成标准 `wireguard.conf`。
准备过程离线执行并保留传入的密钥材料。描述符绑定完整栈所有者、固定 tools 源码、
程序和配置的精确哈希、对等端公钥、地址与路由策略，不含客户端私钥。
AmneziaVPN 原生导出仍属于任务 #129。

来宾程序实现首次安装、精确重复校验、只读检查/状态、systemd 启停、
回执绑定的删除以及中断安装恢复。新建模式 2 项目通过固定主机密钥的 SSH
接收器调用该程序。现有模式 1 安装需要独立迁移/入口规则流程；
不得在生产来宾上手动运行来绕过此流程。

初始平台为采用 GA 6.8 内核的 Ubuntu 24.04 amd64。构建 tools 或发布受管配置前，
首次安装准入读取固定的
[Ubuntu CVE-2026-98432 JSON](https://ubuntu.com/security/cves/CVE-2026-98432.json)。
要求 `linux` 包恰有一个 `noble` 条目且状态为 `released`，运行内核的镜像包版本
不得低于该条目的修复版本。`pending` 描述、响应不可用、其他内核系列或证据含糊
均阻止激活。实现时 Ubuntu 的 noble 修复仍为 pending；目标版本不能证明修复已发布。
安装器不会升级/重启内核，也不会应用整机缓解措施；此类维护需要独立计划。

已安装回执缓存该特定 CVE 的证据、完整的运行 Ubuntu `/proc/version_signature`、
已安装镜像/模块包修订、可用模块的源码校验和及磁盘制品哈希。
已加载模块必须提供相同源码校验和；创建接口后，在 link-up 前必须取得该加载身份。
构建/源码身份缺失或不匹配均拒绝操作。这些是运行构建/源码事实和独立磁盘哈希，
并非运行镜像或已加载内存的哈希。参见 [Ubuntu 内核身份](https://ubuntu.com/kernel)
及[内核模块 ABI](https://docs.kernel.org/admin-guide/abi-stable.html)。常规状态、重复检查和启动检查
只将当前内核事实与回执比较，不重新下载元数据或安装 tools。内核变化需要显式政策维护。
此检查仅评估一个指定 CVE 基线，不代表全部内核安全；任何状态都不声称完成端到端流量或媒体验收。

Tools 从校验和固定的上游 `wireguard-tools 1.0.20260223` 归档私下构建。
有界解包不创建链接并拒绝不安全路径，仅跳过固定归档内精确识别且未使用的 wg-quick 链接。
生成的可执行文件须报告固定版本并为 Linux amd64 格式。
私有服务目录保留源码许可证。不安装软件包、不替换系统二进制，也不使用 userspace 回退。
来宾必须已具备构建依赖（`make`、编译器、libc 头文件）、`ip`、`ss`、`nft`、
`unshare`、`modinfo`、`dpkg-query`、Python 和 systemd。
回执记录编译器/make 可执行文件的哈希与版本、目标、libc/内核头文件包版本，
以及精确固定的上游构建参数。构建期间工具链不得变化，常规状态不会重新构建 tools。

完整所有者摘要确定私有目录；稳定服务、接口及 nft 表使用短所有者前缀和完整操作标记。
私有目录/文件要求精确所有权及权限。检查拒绝符号/硬链接、额外文件、
配置/二进制/单元字节变化、未知对等端/地址、占用的 UDP 端口及与现有来宾路由重叠。
私有操作锁串行化控制器变更；systemd 回调绑定精确已安装程序与单元并校验回执。

转发/NAT 规则仅使用所选接口、显式对等端源地址和声明的目的路由。
精确 JSON 策略先在临时网络命名空间编译，再与来宾实际规则比较。
程序不清空主机 ruleset、不修改全局 input 策略、不重启共享网络，
也不重置其他隧道使用的 IPv4 转发。来宾 IPv6 必须事先禁用。
现有来宾的云及入站规则迁移属于独立集成工作；服务运行本身不能证明 UDP 监听可达。

在任何服务/接口激活前，完整私有日志与暂存文件一起发布。
激活前和删除清理证据前，文件及目录边界均通过 fsync 持久化。
安装失败只移除已证明属于本次安装的对象。
删除/恢复要求显式变更同意及精确旧回执 SHA256。日志在待删除目录树外保留非秘密文件哈希，
使中断的部分清理可继续。外来或漂移状态保留以供诊断。
已提交的健康服务不会因日志收尾失败被回滚。常规安装拒绝替换、对等端变更及密钥轮换，
这些操作必须通过显式迁移，不能隐式重新生成。

## 显式项目选择与离线准备

开发候选版本通过公共加载器和离线准备 CLI 接受模式 2 私有项目。
显式重复选项才启用此格式；省略选项时保留模式 1 的精确 AWG/VLESS 模板与指纹：

```bash
flayer project init ~/flayer-wireguard --protocol wireguard
# Edit the cloud placement and administration address in project.toml first.
flayer vpn prepare --project ~/flayer-wireguard
```

重复 `--protocol` 可选择 `amneziawg`、`vless-reality` 和 `wireguard` 的任意非空组合。
OpenVPN 在其独立实现前不可用。空选择、重复或未知协议均报错，不会隐式退回旧协议对。
生成密钥前校验完整文档：拒绝未启用/未知设置、重复 UDP 监听、TCP 22、
网络重叠、无效 MTU、额外设备地址键以及超过两个 DNS 服务器。

每个所选协议表必须有显式 `device_ids`。WG 使用独立的
`[wireguard.device_addresses]` 映射；顶层 `devices.ipv4_address` 仅属于 AWG 成员，
VLESS 没有隧道地址。保留设备 ID 与分配地址，只规范化声明顺序。
不按枚举顺序分配地址，任何协议都不会隐式注册全部设备。

`SelectedVpnProject` 将完整公共项目指纹与 `TransportFingerprint()` 分开保存。
各传输指纹包括自己的所选成员、监听/设置、身份和共享路由策略，
排除其他协议的设备、监听/设置及云部署位置。
声明尚未选入协议的设备不会改变任何已保留传输字节。

准备过程创建独立受管 `server-<stack>-<protocol>-credentials` 制品包，
包含私有 `material.json` 及 `intent.sha256` 证明，并创建该协议的服务器制品包。
完全匹配的材料被解码而非重新生成。发布任何新制品包前，先校验所有已有包的完整清单和精确文件集。
自己的成员/设置变化或漂移将拒绝操作，不重写其他协议。
若后续本地制品包写入失败，已提交凭据仍可用于输入不变的重试。
现有文件所有权和 0700/0600 私有存储权限要求保持不变。

准备过程还保存受管且非秘密的 `server-<stack>-creation` 制品包：
`creation.json` 保存精确有序的六资源规范、原始创建标签、项目/计划指纹及
各协议包的独立摘要；`cloud-init.json` 保留原始 bootstrap 的精确字节。
编译读取此快照，而非按当前设置重建实例标签或 bootstrap。新建 WG 的
bootstrap 包含构建工具、kmod、iproute2 和 util-linux，不升级或重启内核。
准备过程不创建云状态或占位客户端导出。已有快照只进行校验，
不会重新生成安装程序、凭据或 bootstrap。

将旧项目编辑为模式 2 不构成迁移。保留的通用云状态或待完成操作日志、旧组合凭据、bootstrap/trust
制品包或设备导出会阻止此次准备。保留原模式 1 配置、密钥、清单及清理引用，
直至显式迁移/入口规则流程能够证明原有创建基线。

## 新建项目生命周期

新建模式 2 的 `deploy`、`status`、`recover` 和 `destroy` 使用原始六资源计划。
在准备、认证或下载供应商数据之前，变更必须获得显式同意并精确确认 scope。
提交新的 WG 虚拟机创建请求前，控制器还要求已发布 noble/linux 修复的证据；
来宾仍需校验实际运行构建。证据不可用或状态 pending 时，在分配计费资源前
拒绝创建。健康重试/status 使用来宾缓存基线；清理及删除恢复不依赖该下载。

每次云观测均校验精确 scope、类型、名称、可用区和原始创建标签。
Security group 还校验网络绑定及完整有效 IPv4 规则多重集，包含描述及重复次数。
规范化文档规定的 JSON 数字编码；拒绝 IPv6、间接目标及未知策略。
有界快照保留规则 ID。每次删除前检查所有尚存原始资源，因此 firewall 漂移
会在首台虚拟机被删除前停止清理。清理不接管未记录或已被替换的资源。
此实现部分不更新云规则，也不重写任何现有资源标签。

虚拟机实际唯一 IPv4 接口必须引用精确受管子网及唯一原始 security group，
使用保留公网 NAT 地址，且内网地址属于该子网。拒绝 IPv6、额外接口及未知绑定字段。
精确受管启动盘必须保持可写且不自动删除；拒绝额外磁盘、文件系统及本地盘。
最终按 ID 删除实例前再次完整读取绑定，并与固定快照比较，避免被更改的绑定
绕过入口检查，或删除无关的自动删除磁盘。参见提供商的
[实例绑定模式](https://yandex.cloud/en/docs/compute/api-ref/Instance/get)。

SSH 接收器最多接受三个所选传输。首先安装 WG，避免中断的 WG 事务触发
其他传输安装器；仅安装携带变更同意，随后检查为只读。
服务器程序从固定的原始制品包读取。只有受管保留 IP 与实例一致，且所有
所选服务均已校验为 active 后，才发布含实际地址的客户端文件。
IAM serial-key 标记使用原始项目指纹，即使无关设备或本地认证配置别名发生
变化也不改变；不会轮换密钥或重建资源。所选成员、监听、路由、资源规格
或部署位置的变化需要显式迁移。

云恢复保留通用持久日志及原始操作 ID。没有云日志时，显式来宾恢复只接受
观测到的 WG 回执，或用于清理空遗留元数据的独立完整缺席证明。
它不会移除健康服务或注册对等端。普通 deploy 不会修复中断的来宾事务。
Status 不接受变更选项，服务健康与客户端连通性分别报告。已授权的启动
回调会在重启后重建私有临时协调文件；status 保持只读。如果重启中断安装/删除，
且服务尚不能恢复该文件，status 可在不创建文件的情况下读取；若观测期间变更
操作创建任何锁路径，结果被丢弃。恢复仍获取排他锁并复核当前精确证明。
所有会变更状态的服务回调均在副作用前建立协调文件。全项目删除使用
原始非秘密云快照，即使私有客户端或 SSH 密钥丢失仍可清理。
本地制品被保留；清理后，旧信任或客户端导出会阻止再次部署。

## 受管单对等端运行时事务

私有 `_wireguard_peer.py` 实现一次显式注册或吊销的来宾事务。控制器打包器
输出仅依赖 stdlib 的驱动及校验和固定的维护 helper。独立加载仅接受精确的
私有 root 所有常规 helper 文件，不允许链接或符号链接祖先；执行前校验已批准
字节。Helper 仅临时存在：原已安装程序、tools 二进制、许可证、unit、所有者、
nonce 及缓存的内核/构建核验证据均保持不变。设备私钥不发送至来宾。

激活前校验精确原始规范回执、完整活动运行状态及单设备差异。改变其他对等端
密钥/地址、服务器密钥、监听、子网、路由策略或运行时固定值均报错。
在既有事务命名空间内准备完整私有候选目录及模式 2 非秘密元数据日志。
在修改活动状态前，先探测同一文件系统是否支持原子目录交换。对等端操作
不下载 tools、不生成凭据、不升级内核、不修改云入口、不重建接口，也不重启服务。

使用上游 [`wg syncconf`](https://raw.githubusercontent.com/WireGuard/wireguard-tools/v1.0.20260223/src/man/wg.8)
仅更新差异并保留未改变的会话。注册先修改内核对等端，再通过 nftables 放行其地址；
吊销先拒绝该来源，再从内核移除对等端。仅用一个删除/创建 nft 批次替换已证明
受管表，绝不清空主机 ruleset。只接受按此顺序记录的旧/新状态前缀。
无法解释的组合，或无关接口、内核、firewall 漂移，在下一次变更前停止。
Endpoint 漫游、握手时间及流量计数器不属于受管配置。

通过 Linux [`RENAME_EXCHANGE`](https://man7.org/linux/man-pages/man2/renameat2.2.html)
发布完整候选目录，确保启动时不会看到缺失或混合的配置文件。完整活动根目录
回执决定是否已提交：发布前恢复只还原指定对等端/策略前缀；发布后保留健康的
目标根目录，即使发布后的 fsync 失败也不会回滚已提交对等端。移除备份或日志前，
先持久化提交证明及目录边界。支持部分备份删除及最终空日志的恢复。
恢复必须同时提供当前回执、原始先前回执哈希及原始观测历史头。
移除任何备份前显式持久化交换的两个父目录，包括 fsync 失败后的提交重试。

独立非秘密 `peer-<owner>.json` 记录最近一次精确操作/设备、旧/新回执及 deployment
摘要，并记录前一历史哈希。记录的规范摘要形成链式历史头。应用及恢复必须提供
原始观测头；相同已完成重试必须匹配最新提交的父头。因此注册/吊销后即使配置
字节恢复原样，也无法重放陈旧请求，较长重复循环同样受保护。Status 报告当前及
事务原始历史头。这些哈希是操作前置条件，不是客户端连接密钥。
非规范元数据字节、未知文件、错误
原始证明或改变的提交历史均拒绝操作。Status 仅返回有界事实。

未应用操作的恢复也会消耗原始历史头的授权。确认取消或删除恢复备份前，先持久
发布版本 1 审计记录，其中前后回执哈希相同，部署摘要为实际未改变的部署，父历史
为原始历史头。该记录的哈希阻止在获得来宾排他锁之前延迟的 apply RPC：恢复已
返回 `not-applied` 后，旧请求无法再激活。精确恢复重试保留同一取消证明；后续尝试
必须重新观测历史头。已发布证明是崩溃后的合法回滚清理前缀，包括最终日志目录
已空的情况。该证明不能表示注册或吊销已提交。

入口要求显式
变更同意及共享的排他操作锁；只读 status 不创建协调文件，并在重启后观测期间
出现锁时丢弃结果。临时私有请求准备不改变受管安装。

确定性 POSIX 测试模拟独立内核/表状态，在真实私有文件、目录交换及 fsync 调用
基础上中断每个激活/发布/清理边界。这些模型不证明真实内核或 nft 策略。
独立隔离 Linux CI 校验真实固定工具的对等端更新、接口身份、nft echo/live 等价、
拒绝批次的原子性及无关表保留。不使用桌面网络或生产来宾。

## 对等端 SSH 边界

`SshGuestProvisioner.WireGuardPeerOperation()` 现在通过现有、独立固定主机密钥的
SSH 通道提供来宾事务。接收保留的私有服务器包、一个指定设备的注册/吊销，
以及 `status`、`apply` 或 `recover`。变更必须提供精确 scope 确认、显式同意、
当前回执和原始链式历史；恢复还必须提供原始回执。Status 拒绝变更选项。
这些检查在 SSH 前完成，同时将精确服务器角色/名称及描述符 owner 绑定到完整
栈身份，并校验保留配置/程序哈希。服务维护复用相同的强化 owner 校验。
仅名称后缀无法授权访问另一栈的来宾根目录。

只有驱动/辅助程序及服务器配置/描述符通过 SSH 私有 stdin 传输；描述符保留
原始已安装程序的固定值。Root 接收器在私有临时准备前独立校验精确四文件信封、
目标及同意，再调用有界参数向量。不转发原始 stderr。控制器拒绝重复字段、
额外输出、错误目标/描述符哈希、不一致历史事实或任意结果。
变更确认区分 `committed` 与恢复的 `not-applied`，不能替代随后的健康服务观测。
可移植测试使用内存中的 runner/staging 边界，不执行 SSH 或来宾程序。

有界只读 `history-status` 即使在已安装根目录/服务不存在时仍观测绑定 owner 的
审计。校验受管祖先及审计所有权，不创建目录或协调文件。普通 deploy 必须先于
任何安装器验证该历史：删除服务不能隐藏吊销历史，也不能让旧控制器文件重新
激活密钥。
若安装根目录不存在但仍保留审计，即使调用方提供该审计当前摘要，来宾安装保护
也会拒绝重建。重建此类根目录需要显式协议恢复契约，不能使用普通安装。

安装还通过私有 stdin 传入精确预期历史。打包驱动在与安装相同的来宾排他锁内
再次校验，关闭观测 RPC 与变更之间的时间间隙。按原始描述符固定值校验保留的
`original.py` 字节后，才将已批准安装器加载为模块并调用其未变更的安装/检查函数。
这避免嵌套 CLI 锁，并保留原始已安装程序、运行时及启动回调。接收器进入其他
传输前，只读检查再次校验相同历史；即使输入批次先列出其他协议，也始终先运行
WG 安装保护。
临时输入副本在请求暂存目录内以排他私有文件写入，不依赖已存在的受管根目录，
也不假定能够跨文件系统重命名。

该低层 API 不持久化控制器意图，也不签发新设备密钥。下述项目流程提供持久日志，
并保留完整旧/新包及原始证明。

## 私有控制器修订存储

私有 `_vpn_revisions.py` 为项目对等端控制器提供持久化及有效生命周期解析。
每次尝试先写绑定 owner 的元数据日志，再写包含新材料/配置及
保留安装程序的不可变私有包，最后在远程激活前写入包的精确摘要。摘要发布中断后
复用完整准备文件，绝不重新生成部分保留的凭据。每次重命名前都对精确私有临时
inode 执行 fsync，包括先前文件同步失败后的复用。不完整私有暂存会在任何远程操作前
停止并要求检查。

验证活动来宾结果后，先持久化独立、不可变、非秘密的完成记录，再原子更新私有
头指针并移除日志。每条记录绑定精确父记录、创建基线、旧/新传输固定值及来宾
回执/历史。恢复的未应用尝试保留准备字节供审计，推进来宾取消历史，同时保持
活动回执、密钥及配置不变。新的完成记录采用模式版本 2：已提交请求的未应用尝试
必须证明精确来宾取消记录。未暂存且不可能发送 apply RPC 的尝试仅推进本地证据，
保留来宾历史。历史版本 1 记录仍按原始不可变语义读取。发布重试校验已有记录/指针的精确字节。
中断的版本 1 已提交完成记录可移除残留日志，而不改写该不可变记录，包括先于头指针
发布的记录。远程访问前检查精确且由清单证明所有权的当前操作完成记录。若已发送
请求的版本 1 未应用不可变完成记录已存在但仍有日志，则升级状态不明确：无论头指针
是否发布，都在任何提供方或来宾操作前拒绝，并保留以供显式检查。旧的无取消证明
证据绝不默默解释为版本 2。
已退役的版本 1 取消记录不会追溯获得对延迟旧请求的保护；只有后续经过验证的提交
或取消才能推进其来宾授权历史。
未知、缺失、带链接或
不匹配的 owner 元数据绝不自动接管。

加载器检查完整有界链（最多 4096 条记录），不依赖私有客户端密钥是否存在。
任何发布前先校验完成摘要的类型/格式，暂存或推进新头前预检相同容量边界；
达到容量时仍允许精确重试已完成操作。
只有读取活动材料/服务器字节时才要求完整固定的请求清单。这使全云清理即使
客户端密钥丢失，也能保留原始非秘密所有权证明。原始创建资源/bootstrap 与其他
协议包保持不变。持久私有 advisory 锁覆盖完整的协作项目流程；缺失锁时的只读
回退不创建文件，并在竞态时丢弃观测。所选项目 prepare/deploy/status/recovery 及
对等端操作共用此锁；全栈 destroy 校验非秘密修订并保留私有文件。
尚未支持的所选项目 runtime/export 仍在变更前拒绝。
测试使用合成项目和真实 POSIX 私有文件/锁，不执行云、SSH 或桌面
网络操作。

## 项目对等端流程

`PrepareWireGuardPeerEnrollment()` 和 `PrepareWireGuardPeerRevocation()` 现在可在
内存中准备针对一个指定对等端的确定性配置/材料变更。注册必须传入调用方已保留的
新设备凭据及显式空闲地址；这些函数不生成密钥。服务器密钥、其他对等端的凭据/
地址及其客户端配置字节保持不变。拒绝无效身份、地址/密钥复用、超出设备容量的
注册以及吊销最后一个对等端。原私有材料保留供审计。移除最后一个对等端需要
显式停用协议。这些准备 API 不连接来宾、不使对等端断开、不持久化修订，也不
更新项目状态。`RunVpnPeer()` 现将这些 API 与保留的控制器修订及受管 SSH 事务组合。

对已部署的模式 2 WireGuard 项目，编辑 `project.toml`，仅声明一个指定对等端的
注册/吊销。注册时声明新设备及显式空闲隧道地址；保留所有旧对等端/地址及其他
协议。吊销只移除该协议的成员/地址，保留其他协议仍需的共享设备声明。
移除最后一个对等端必须停用协议。只读 plan 在外部访问前校验该差异，观测完整
原始云图、有效入口/连接、现有 IAM 主机固定值及活动来宾回执/历史，然后输出
`baseline_sha256` 与 `plan_expires_at`。计划期间不生成密钥。

```console
flayer vpn peer plan --project PROJECT --protocol wireguard --device phone --change enroll --format json
flayer vpn peer enroll --project PROJECT --protocol wireguard --device phone --allow-mutation --scope-confirm FOLDER_ID --expected-baseline-sha256 BASELINE --plan-expires-at EXPIRES_AT
flayer vpn peer status --project PROJECT --protocol wireguard --device phone --change enroll --format json
flayer vpn peer recover --project PROJECT --protocol wireguard --device phone --change enroll --allow-mutation --scope-confirm FOLDER_ID --expected-baseline-sha256 JOURNAL_BASELINE
```

将大写占位符替换为项目、精确 scope 和报告证明。应用必须在 600 秒内回传计划。
同意及基线匹配后仅生成并保留一个新设备密钥/PSK，持久化日志/请求，然后在远程
应用前再次观测云/信任和来宾证明。保留原始已安装程序字节/固定值。推进本地头
之前，验证健康目标来宾结果及计算出的链式历史。精确重试最近已完成操作只验证
健康，不生成密钥、不变更来宾，即使原计划已过期。

SSH 结果未知时保留日志。需要恢复期间，对等端 status 报告独立日志基线并返回
非零退出码。显式恢复回传该基线、目标、scope 及同意，使用保留的原始证明/文件，
不生成密钥；完成已发布根目录，或仅回滚未提交前缀。完整回滚候选在下次相同的新
计划中复用。激活前缺失的暂存可归档为未应用；不完整私有字节需检查，绝不替换。
恢复还使用当前云定位符、端点和 IAM 主机固定值，以及保留的原始头/回执/历史和
有效期，重新计算原计划绑定。即使替换图仍属于同一 owner 且内部有效，或主机
固定值已改变，也不能按旧计划接收恢复写入。过期本身不阻止显式恢复。
普通 prepare/deploy/status/recover 拒绝未完成对等端日志。全项目 destroy 仍是
单独同意的整云栈清理，不依赖客户端或管理私钥。

提交后，普通生命周期使用有效协议固定值及原始六资源计划/bootstrap/SSH 标记。
先于无关安装器检查对等端历史，因此恢复旧控制器文件不能自动接管重复的来宾
配置。其他服务、资源、地址及已有客户端文件保持不变。客户端交付仍属任务 #129；
对等端完成本身不导出原生配置，也不证明互联网/媒体验收。

## 不可变协议源引用

私有 `_vpn_protocol_sources.py` 现在独立于活动/停用状态标识精确源。绑定 owner 的 `ProtocolSource` 仅包含规范协议固定值和原始包、对等端请求或协议请求的固定引用，不包含配置或密钥正文。当前对等端读取使用封闭的源/身份/固定值模型，在非秘密序列化前拒绝不支持的扩展。生命周期通过该解析器读取；原包名称、清单、安装器字节及客户端文件不变。源引用本身既不提交纪元，也不激活服务。

协议请求准备在内存中复制保留的材料/服务器角色，记录原固定值、操作 nonce 及前序状态摘要，不生成凭据、不渲染新安装器、不发布文件。未来纪元控制器必须先写日志，再发布或远程变更。重建规范虚拟包前验证完整受管请求清单、精确文件集、角色名称和摘要。拒绝外部 owner、重定向路径、非规范或矛盾请求元数据。非秘密纪元遍历和云清理不得调用私有字节读取器；客户端密钥缺失不能成为重新生成投影的授权。纪元发布/选择仍待实现。

## 协议纪元的对等端历史段

私有修订存储现在可基于显式 `PeerSegment` 上下文读取和发布独立的 WireGuard 对等端历史段。其 genesis 是完整纪元摘要；不可变对等端记录仍绑定永久创建摘要。元数据头和日志位于固定私有目录 `protocol-epochs/<digest>`；原始创建文件及全部不可变请求/完成包保持原位置。起始投影通过保留的协议源解析，包括前一段最后提交的对等端请求，不改写安装器、凭据或已关闭的头。

每一段验证精确起始固定值、来宾回执/历史、父链及待处理日志，并返回所有引用的对等端工件名称。未来纪元图读取器必须验证全部已关闭段，将工件名称并集与全局存储比较；单独一段不等于完整图。停用的 WireGuard 不允许对等端记录或待处理操作。已配置源可在活动子集为空时保留。元数据遍历不依赖私有客户端载荷；解析保留投影仍要求其精确字节。

该组件不发布协议纪元，也不授权远程操作。协议协调器集成之前，普通生命周期/对等端入口拒绝协议头、日志、中断发布文件及段目录，不能静默回退到原始对等端头。现有零纪元项目保持元数据字节和行为。隔离 POSIX 测试覆盖两个段、复制的陈旧头、所有权/路径检查及完成发布中断，不执行桌面 VPN、SSH 或云命令。

## 限定作用域的异步云入口 SDK

具体 `VpnYandexProvider` 现在提供 `BeginIngressChange()` 与 `ReadIngressChange()`，用于 [ADR 0024](../adr/0024-owned-vpn-protocol-transitions.md) 定义的精确监听器差异。这是提供方原语，不是协议 CLI，也不包含持久项目/来宾协调器。调用方须证明原云图、已提交有效策略及原监听器协议归属，并在 Begin 前持久化意图。提交结果仍待处理或未知时，绝不能再次调用 Begin。

Begin 要求显式变更同意、精确 scope 及完整旧策略的预期摘要。重新读取完整组后，只发送一次按 ID 限定的 `update-rules --async --print-metadata`，并禁用 CLI 重试。仅传入已证明的删除 ID 或一条带标签的新增规则；在任何 I/O 前拒绝含逗号、类似选项或过长的删除 ID。仅返回最小操作 ID、资源 ID 与完整请求指纹。即使提供方立即完成，也必须先保存该引用再轮询。Begin 不隐藏提交后的额外读取；丢失或无效响应绝不变成 `not-applied` 或自动重发。

Read 只接受绑定精确计划的已保存引用，要求文档化的 `UpdateSecurityGroupMetadata` 类型、目标组及分配规则 ID。待处理或最终失败只是有界事实，不能证明健康策略或回滚。成功完成必须同时验证有类型的操作响应与重新观测的完整活动策略符合全部差异，包括无关规则/资源元数据不变以及实际分配 ID。丢弃原始提供方消息。后续 Read 可以重试观测，但绝不重复变更。

操作 JSON 与直接安全组策略读取共享 1 MiB 字节上限，拒绝所有深度的重复键和非标准 JSON 数字。严格组读取器也保护已选项目的普通观测/删除。上游[操作元数据契约](https://github.com/yandex-cloud/cloudapi/blob/master/yandex/cloud/vpc/v1/security_group_service.proto)及 [CLI 操作读取器](https://yandex.cloud/en/docs/cli/cli-ref/operation/cli-ref/get)定义外部边界。测试使用真实作用域适配器和内存 runner，不执行 CLI 或网络。持久纪元发布、来宾预留/授权撤销、回滚及协议 CLI 集成仍属任务 #128。

## 持久入口意图与发送不确定性

私有入口计划编解码器保留完整版本化 `IngressDelta`，包括原始创建规格、作用域资源、规则 ID、描述和标签、源 CIDR、监听器协议归属及操作 nonce。规范字节哈希与现有计划指纹相同。解码重新执行完整差异契约并要求精确规范字节；拒绝未知字段、重复键、非标准 JSON、不支持的模型扩展及超过 1 MiB 的元数据，不从当前期望配置重新编译计划。

项目入口日志将精确计划绑定到原始创建摘要、前序状态摘要及短期有效期。在公共项目锁内，先发布 `protocol-ingress-pending.json`，再发布不可变受管意图包。一次独立授权的 SDK 提交之前，持久地将 `prepared` 推进至 `dispatching`，表示云端结果不确定。轮询前将返回的精确操作/资源/计划引用保存为 `recorded`。超时、过期或看似旧的策略都不允许重置发送状态或重发计划。发布任何意图前须为最大操作引用预留空间；已知的延迟确认仍可在过期后记录。

仅识别来自已验证临时文件的精确前向中断发布。协调仅完成同一次发布，不授予新的权限。意图冲突、跳跃/回退阶段、不可变字节缺失或不同的已知操作都会停止恢复。全部原始凭据和配置包保持不变。拒绝采用日志缺失的保留意图或额外未记录意图。复用完整可见包及授予发送权限之前，均通过固定句柄重新同步已验证载荷、清单、包目录和工件父目录。任何屏障失败都不授予发送权限；已有未知发布锁予以保留。只读日志观测不执行这些写入。完整有效策略可能超过 64 KiB；只有此固定日志路径使用显式 1 MiB 元数据上限，对等端元数据保持原有上限和路径契约。

这些是本地存储原语，不发送云或来宾操作，尚无公共协议命令。前序状态摘要本身不能证明活动纪元。未来协调器必须验证纪元图及完整原始云连接/策略，持有来宾预留/授权撤销，并满足 SDK 同意和预期旧值检查。本地文件锁不能串行化复制的控制器。此处没有日志重置/删除 API；验证后的纪元完成和限定回滚仍待集成。现有生命周期/对等端入口在提供方操作前拒绝该待处理日志或中断发布。

## 受管来宾输入策略规划

私有 `InputPolicy` 将原始 SSH 源网络和协议监听器绑定到冻结创建包及精确原始 `/etc/nftables.conf` 字节，按原始固定值验证协议顺序，独立于相同 UDP 端口保留协议归属。它不重新编译云创建计划，也不生成凭据。封闭公共模型拒绝隐藏扩展、源/端口冲突、TCP 22/UDP 68 监听器及歧义声明。UDP 68 保留给无条件 DHCP 客户端例外。比较/过滤前验证目标的全部标量，包括 disable 移除的监听器。

`InputTransition` 仅变更一个监听器。实时程序通过单个 `nft -f` 批次仅替换已证明存在的 `inet flayer_bootstrap` 表，保留 SSH、DHCP、loopback、ICMP 限速、已建立流量及其他全部监听器声明。活动集为空仍保留管理访问。启动覆盖使用限定的 `destroy table` 加完整表，使首次启动及重载幂等且不使用 `flush ruleset`。Ubuntu 24.04 文档中的 [`destroy` 语义](https://manpages.ubuntu.com/manpages/noble/man8/nftables.8.html#tables)支持此契约；能力预检仍由来宾协调器负责。回滚使用本次操作的新标记恢复原监听器访问语义，不恢复旧代令牌。

原生指纹仅接受一个受管输入表及 drop 策略输入链，移除内核 handle/metainfo，保留全部有序规则表达式。必须遵循现有 WireGuard 来宾方式，将其与临时网络命名空间编译的预期程序比较。哈希本身不证明规则正确或连通。[原子替换契约](https://wiki.nftables.org/wiki-nftables/index.php/Atomic_rule_replacement)适用于完整批次；新增接受型基础链仍会遇到[现有丢弃链](https://wiki.netfilter.org/wiki-nftables/index.php/Configuring_chains)。

纯测试不创建文件，保留原始 bootstrap 并拒绝漂移。真实解析器/内核符合性仅在明确隔离的 Linux CI 网络命名空间执行：被拒批次保留旧表，实时替换及重复/首次启动与隔离编译一致，回滚保持新标记，无关表/计数器保持字节等价。本组件不执行命令。公开协议变更命令前，仍须集成来宾锁/预留、回执/历史校验、启动文件持久发布及恢复。

## 来宾协议预留与对等端历史权限撤销

仅依赖 stdlib 的私有预留后端接受一个封闭的纯哈希意图，绑定完整 owner、永久创建、前序公共权限/状态、计划 nonce/有效期，以及活动 WG 回执或完整命名空间缺失证明。先获取公共入口协调锁，再获取现有 WG 锁。持久私有准备日志先于历史撤销；复制的控制器不能通过自己的本地项目锁替换意图。恢复写入在撤销历史或授予发送权限前，通过固定目录句柄重新同步受管命名空间及全部发布祖先，即使目录在崩溃后已经可见。完成操作的 nonce 不能随新父项/历史重复使用。

活动 WG 在其锁内使用现有有效 v1 等回执取消审计。运行根回执、凭据、配置、二进制、接口和服务保持不变，链式对等端历史前进。已排队的旧对等端驱动识别历史变化并拒绝旧预期权限。待处理对等端/安装事务阻止预留。WG 缺失要求实际根/unit/接口/NAT/启用链接缺失及保留历史，不会为撤销权限虚构运行回执或安装。

`Reserve` 持久发布 `preparing`，随后发布 `reserved`，中断后复用自身精确历史撤销。`Expose` 在后续写入前消耗一次外部发送授权。重复调用与过期计划不能重新授予权限；完整的中断 exposed 临时记录已表示不确定。`Cancel` 仅接受尚未暴露的意图，保留已消耗 WG 历史，在清除待处理元数据前发布一个不可变 cancelled 完成记录及新公共头。精确重试复用该完成记录。完整有界父链遍历拒绝孤立记录、丢失头、未知文件和不支持的元数据，不将缺失可变指针推断为新的初始权限。

普通对等端/安装及当前独立 WG 维护入口在 WG 协调下检查公共待处理日志，历史观测仍可使用。现有服务回调保留独立的既有受管启动/停止契约。冻结原始服务器包仍保留；增加当前维护检查不会改写已有私有包，也不会隐式安装到服务器。

此为私有后端，尚无 RPC/公共协议命令。前序状态摘要本身不证明云/输入策略；组件不应用 nft、不发布启动文件、不改变服务，也不判定已提交云操作结果。暴露后的完成及已知回滚前缀仍需完整协调器。测试使用真实私有 POSIX 文件/锁及来宾网络模型，覆盖旧排队对等端拒绝、复制意图、实际缺失、发布/重试、有效期/容量、未知暴露及原始运行时/密钥字节保留。

## 预留入站规则事务

基于标准库的私有入站规则后端现在使用精确的已暴露预留。公共组合计划将云计划摘要和
完整的主机入站变更绑定到预留摘要；仅有先前状态摘要不能证明实际状态。控制器和客体
共用严格的策略格式、生成器及原生 JSON 归一化逻辑。预期表在临时客体网络命名空间中
编译，写入前比较实际所属表的全部表达式。

先持久保存精确的公共恢复请求，再替换启动文件，最后原子替换 `inet flayer_bootstrap`。
SSH、其他监听器和表以及 WG 的运行时和密钥字节均保持不变。只接受已定义的启动文件
优先前缀，包括重启和完整的中断临时发布。已可见的目标启动文件及其父目录也必须再次
同步。原生写入进程继承两个协调描述符，因此 SSH 父进程退出不会在写入完成前释放锁。

回滚使用本次操作的新标记恢复先前监听语义，保留已经消耗的客体历史。外来完整或部分
文件以及原生状态漂移均拒绝恢复。重复的终态调用验证精确结果；回滚后不能重新应用。
只读状态不修复持久文件，中间阶段不会将启动或原生摘要声称为终态结果。

这仅是入站规则后端，尚无公共协议 CLI 或 SSH RPC，也不修改云规则或安排服务启停。
已暴露预留会一直保留，直到完整协调器将云、服务和入站凭据写入新纪元；仅有入站结果
不能结束预留。测试通过网络模型以及隔离 Linux CI 命名空间内的真实 nftables 和标准库
后端完成，不修改桌面网络或已部署服务器。

## 不读取私有载荷的保留来源遍历

来源元数据遍历验证清单的完整所有者、文件角色、大小、敏感标记和外部固定的完整包摘要，
不打开任何私有载荷。原始、对等端和协议来源即使丢失私有文件，仍保留相同的规范
material/server 角色摘要。必需的公共意图和请求文件仍须通过精确内容摘要和严格解码；
仅有所属清单不能覆盖矛盾的请求元数据。

读取器固定目录、清单和公共文件身份，拒绝未知成员、不安全链接或权限、成员变化及可检测
的快照漂移。丢失已声明私有文件不同于外来文件。声明的私有摘要仅为保留引用，不能证明
未读取载荷存在或完整。私有使用、导出及制品删除仍执行原有完整内容检查；元数据遍历不
授予这些权限。

此能力为后续纪元图和客户端密钥丢失后的完整云清理提供非秘密引用，不激活协议转换，也不
绕过完整云所有权及待处理操作检查。不会从孤立制品推断纪元头；普通入口仍拒绝尚未集成的
纪元元数据。

## 已提交协议图读取器

私有已提交图读取器验证不可变纪元包、每个前序 WG 对等端段的精确闭合、保留来源角色固定值
以及完整云、入站和服务证据引用。缺失父项或段、孤立对等端/协议/入站制品、待处理日志、
陈旧权限及操作数或字节超限均拒绝。最终纪元包摘要开始新的独立对等端段，旧段和创建规格
保持不变。

云证据区分已知终态变更、未发送取消和已完成精确逆操作。恢复后的提供方 ID 和描述保留
实际读回值，同时保留原始和补偿意图制品。入站回执绑定已应用、不变或已恢复策略字节。
服务引用严格封闭并绑定来源，但摘要本身不能证明实时服务。授权意图先绑定全部证据摘要，
随后精确来宾完成进入最终包，避免摘要循环。发布顺序及模式 1 暴露前取消边界见 ADR 0024。

配置来源始终非空，活动子集可以为空。历史通过保留公共清单中的 deployment 摘要验证，
无需打开私有载荷即可保留旧驱动理解的历史撤销。客户端/私有来源文件丢失后仍可遍历元数据；
普通使用仍要求完整私有内容。消耗来宾或云权限前须执行容量检查。

模式 2 纪元意图还绑定完整代际记录 3、精确原生终态日志摘要，以及重建的含代际复合计划。
代际来源摘要选择精确已配置 WG 来源；图遍历用保留的公共服务器元数据核对全部三个来源
文件固定值。停用恢复按顺序记录原根屏障和新 installed 根屏障，在替换回执下保留密钥及
地址。启用尝试即使回滚至缺失，也记录新代际屏障。未启动且未应用的意图不声明原生变更
或替换回执。原生回滚要求已恢复入站；真正未消耗屏障的模式 1 取消仍单独处理。模式 1
意图加载不变，以上检查无需私有来源正文。原生纪元还精确保留每个其他协议此前的完整
服务回执或缺失证明；来源选择不变本身不能授权替换该证明。

读取器尚无发布工作流或公共协议 CLI。下文介绍独立的私有来宾模式 2 完成器。普通入口仍拒绝纪元元数据，直到
协调器、传输代际、认证实时证明和恢复完成集成。读取器不执行来宾、云或桌面操作，也不会
从本地编写的证据记录推断实际运行健康。

## 绑定 nonce 的 WireGuard 代际候选

显式代际候选逐字节保留原始安装程序、deployment、服务端和对等端凭据、已验证二进制及
许可证。模式 2 根目录增加一个单独固定的生命周期辅助程序，并将两个 systemd 回调绑定
到新的 nonce。重用前验证完整文件及当前执行内核事实，不下载、重建或生成密钥。默认首次
准备仍生成模式 1，并保留原有 unit 格式及厂商/构建门禁。

回调在现有 WG 锁下重新读取根元数据，在运行时变更前拒绝陈旧或缺失 nonce、错误执行文件、
漂移和锁竞争。原生命令子进程继承该锁描述符。对等端事务保留模式 2 的全部八个文件固定值，
包括辅助程序，不授权替换辅助程序或 unit。未知文件和模式别名仍拒绝。

模式 2 的 unit 文件名包含 nonce 及所有者前缀。根和对等端事务路径不变，旧模式 1 文件名也
保持不变，防止旧 unit 的延迟命令选中已加载的新代际回调。仅通过有界回执元数据选择路径
不代表健康；完整检查要求精确 unit 路径，并拒绝其他代际或未知所有者名称及断裂启用链接。
完整缺失证明与首次安装同样拒绝这些保留项，不删除也不接管。状态、对等端操作及预留观测
均使用已验证 unit。

缓存准备器只在受管运行时/unit 路径外写入完整、未发布的私有候选，既不激活，也不授予权限。
模式 2 回调拒绝待处理预留，除非精确密封原生上下文绑定当前代际、请求/头及已消耗历史。
普通 remove/recover 在发布旧式清理意图前拒绝这些代际。下文私有原生后端实现限定范围的
代际转换；完整控制器协调集成前，普通纪元/公共协议准入仍受阻。POSIX 测试使用真实私有
文件及锁，网络仅为模拟。

## 预留保护下的代际缓存日志

`PrepareFresh` 先构建完整私有 staged 模式 1 基线，再通过相同缓存代际路径派生 staged
模式 2 候选。显式同意、三个保留来源文件及已批准当前 receiver/helper 固定值、规范且
独立的空私有目录，以及实际命名空间缺失和冲突检查，均在原厂商 CVE/执行内核/构建
门禁之前完成。两个快照位于受管运行时、权限和 unit 目录之外。二进制及配置构建与
直接安装共用，直接安装保留原线格式。

确认前复查来源字节及执行内核事实。每个快照都先独占写入并同步完整文件，最后写入
回执；中断前缀保持未发布，重试拒绝接管。准备不创建密钥、旧式安装事务、根/unit、
预留、历史屏障或实时网络状态。私有快照既非证明，也非协议变更权限；协调器仍须将其
绑定到精确预留的代际/缓存请求。

私有缓存后端在模式 2 复合请求中，将完整的缓存/候选 WG 回执与来源角色固定值绑定到云计划
摘要和精确入站差异。它要求精确已暴露公共预留及保留的 WG 历史撤销，并按公共锁、WG 锁
顺序协调。任何私有缓存写入前先记录准备日志，不能从缓存或其回执推断协议权限。

缓存路径使用完整所有者及完整回执摘要。验证全部私有运行时/配置字节及缓存的执行内核事实，
原始安装程序只作为数据保留。活动根、服务、密钥/配置及已消耗对等端历史不变，不下载、构建、
生成密钥或变更接口、入站及云资源。来源/候选载荷仍私有，诊断仅有有界摘要及阶段。每个保留
根的缓存上限为 12 MiB。

同步每个精确文件 inode 及全部目录边界，最后发布缓存回执。在精确 preparing 日志及完整已验证
来源字节仍在时，重试只能补写匹配截断前缀的剩余部分，或补全目录发布中断后的已知缺失项。
未知或不同前缀拒绝；日志缺失不能授权截断文件恢复。已准备缓存漂移或私有载荷丢失同样拒绝。
完成后的重试无需原临时来源，只验证并重新同步保留缓存。只读状态不修复发布，也不把已准备
缓存报告为活动代际。

代际记录模式 2 对启用和停用均绑定新的回执模式 2 候选。停用时该候选专供恢复：完整保留
缓存配置/密钥、运行时及内核事实，同时绑定新操作 nonce 和新 unit 身份。结果不确定的旧
停止命令不得选中恢复后的旧 unit 名称。模式 1 代际记录仍可读取以恢复缓存，但不能在已经
暴露的计划摘要下增加入站修改权限或未经计划的候选。

入站后端仅在精确代际日志已准备、两个完整恢复缓存均通过验证后才接受此版本化复合请求。
公共锁、WG 锁继续保护原始实际运行时/历史观测。仅准备缓存不能授权入站修改：可信缓存
后端在 boot/live 变更全程固定并同步精确文件及祖先目录描述符，发布终态入站日志前再次
检查。缓存缺失或未完成、复制的日志意图/历史、字节改变或 inode 被替换，均拒绝继续写入。
只读入站状态校验恢复就绪性，不修复或重新同步缓存。模式 1 入站复合请求保留原有私有行为。

## 密封原生 WG 转换

私有原生后端实现代际启用、停用及回滚，同时保持公共预留暴露。原生准入要求代际记录
模式 3 和显式回调 ABI。原根解除授权之前，候选辅助程序必须匹配已批准的当前私有接收
程序源；模式 1/2 记录仍可读，但不能获得此能力。保存已准入辅助程序固定值，使支持同一
ABI 的后续已批准接收程序能够恢复密封操作，不替换不可变候选。内核、运行时、配置及密钥
固定值均保持不变。
模式 3 开放入站即使在尚无运行时日志时，也必须具备匹配的健康原生记录；准备和关闭操作
保留其原生变更前的合法路径。

任何 WG 解锁前，先在公共锁、WG 锁内解除原根授权。父进程保留公共锁，systemctl 叶回调
只获取 WG；原生命令子进程继承适用描述符。协调精确文件支持的已加载 unit，再确认无排队
任务、主/控制进程及 populated cgroup v2 子树，才能退役 unit 或确认激活。必须显式输出
空属性：无任务为 Job=，而非 Job=0。意图写入与提交之间崩溃后，可以再次停止唯一已退役
unit，但绝不将其名称用于恢复。共享转发及无关协议保持不变。

发布/恢复保留精确缓存，验证原始及新代际历史。停用回滚使用预先规划的新 unit 和第二条
已消耗历史链接，保留全部密钥及地址。installed 根在中断移除期间仍需严格对等端/地址
状态；只有 staged 根允许已知部分激活。候选截断字节只能匹配固定来源前缀。清理使用已
验证有界成员集，并保留意外文件。

在最终屏障及确认全程固定并同步实际根载荷、unit、链接及目录 inode。staged/installed
回执替换使用独立固定范围。相同字节替换会被检测，或在后续确认前显式重新同步。每次
