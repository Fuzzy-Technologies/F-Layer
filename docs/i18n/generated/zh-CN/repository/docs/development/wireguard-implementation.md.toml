body = '''# 标准 WireGuard 实现边界

面向 2.1 发布的开发候选版本增加了标准 WireGuard 的底层意图模型、
私有材料编解码器及配置渲染器。这些 API 不属于已发布的 2.0.0 软件包。
架构遵循 [ADR 0023](../adr/0023-selectable-vpn-transports.md)。

## 已实现的基础

`flayer.vpn_selection.VpnProtocolSelection` 将协议绑定到已声明设备 ID 的显式子集。
新增 IP 隧道使用精确的设备/私有地址映射；AWG 保留原有设备地址字段，
VLESS 不使用隧道地址。顺序规范化，但不分配地址或重命名设备。
`Project()` 生成仅含所选协议设备与监听、共享身份和路由策略的配置模型。
无关设备、地址或监听的变化不会影响该投影。
`ParseProtocolSelections()` 只校验成员关系，不校验完整项目文件。

`flayer.profiles.wireguard` 提供经过校验的 `WireGuardSettings`、
`WireGuardPeer` 和 `WireGuardMaterial`、显式材料生成以及有界且严格的 JSON 编解码器。
标准 WireGuard 使用独立 X25519 密钥及每设备预共享密钥。
重复准备必须解码已保留材料；再次调用生成器会有意创建不同凭据。
私有字段不进入对象表示，无效输入不会在错误消息中回显。

服务器渲染器只输出自己的私钥及所选对等端的公钥/预共享密钥。
客户端渲染器只输出该设备私钥、服务器公钥、该设备预共享密钥、
显式地址、端点、MTU、路由、DNS 和 keepalive。
两种配置都不包含 AWG 混淆参数。生成材料前校验隧道成员及地址。
拒绝共享 Curve25519 身份、私有标量的等价编码、公开或复用的预共享密钥、无效子网、
TCP 监听以及不匹配的客户端端点端口。

公共 API 在内存中准备字节。凭据字节在持久化或传输前，必须进入经过所有权
验证的私有存储；不得写入日志或云元数据。
稳定服务名称由完整栈身份生成，不随对等端成员变化。

## 受管来宾服务实现

`PrepareWireGuard()` 生成包含 `server.conf`、`deployment.json` 和独立
`install.py` 的敏感服务器制品包，并为每个所选设备生成标准 `wireguard.conf`。
准备过程离线执行并保留传入的密钥材料。描述符绑定完整栈所有者、固定 tools 源码、
程序和配置的精确哈希、对等端公钥、地址与路由策略，不含客户端私钥。
AmneziaVPN 原生导出仍属于任务 #129。

来宾程序实现首次安装、精确重复校验、只读检查/状态、systemd 启停、
回执绑定的删除以及中断安装恢复。这是底层实现；公共项目 CLI 和现有 SSH
接收器尚未选择或调用它。不得在现有生产来宾上手动运行以绕过待实现的项目/入口规则流程。

初始平台为采用 GA 6.8 内核的 Ubuntu 24.04 amd64。构建 tools 或发布受管配置前，
首次安装准入读取固定的
[Ubuntu CVE-2026-98432 JSON](https://ubuntu.com/security/cves/CVE-2026-98432.json)。
要求 `linux` 包恰有一个 `noble` 条目且状态为 `released`，运行内核的镜像包版本
不得低于该条目的修复版本。`pending` 描述、响应不可用、其他内核系列或证据含糊
均阻止激活。实现时 Ubuntu 的 noble 修复仍为 pending；目标版本不能证明修复已发布。
安装器不会升级/重启内核，也不会应用整机缓解措施；此类维护需要独立计划。

已安装回执缓存该特定 CVE 的证据及精确镜像/模块哈希。常规状态、重复检查和启动检查
只将当前内核事实与回执比较，不重新下载元数据或安装 tools。内核变化需要显式政策维护。
此检查仅评估一个指定 CVE 基线，不代表全部内核安全；任何状态都不声称完成端到端流量或媒体验收。

Tools 从校验和固定的上游 `wireguard-tools 1.0.20260223` 归档私下构建。
有界解包拒绝链接及不安全路径，生成的可执行文件须报告固定版本并为 Linux amd64 格式。
私有服务目录保留源码许可证。不安装软件包、不替换系统二进制，也不使用 userspace 回退。
来宾必须已具备构建依赖（`make`、编译器、libc 头文件）、`ip`、`ss`、`nft`、
`unshare`、`modinfo`、`dpkg-query`、Python 和 systemd。

完整所有者摘要确定私有目录；稳定服务、接口及 nft 表使用短所有者前缀和完整操作标记。
私有目录/文件要求精确所有权及权限。检查拒绝符号/硬链接、额外文件、
配置/二进制/单元字节变化、未知对等端/地址、占用的 UDP 端口及与现有来宾路由重叠。
私有操作锁串行化控制器变更；systemd 回调绑定精确已安装程序与单元并校验回执。

转发/NAT 规则仅使用所选接口、显式对等端源地址和声明的目的路由。
精确 JSON 策略先在临时网络命名空间编译，再与来宾实际规则比较。
程序不清空主机 ruleset、不修改全局 input 策略、不重启共享网络，
也不重置其他隧道使用的 IPv4 转发。来宾 IPv6 必须事先禁用。
云及来宾入站规则属于独立集成工作；服务运行本身不能证明 UDP 监听可达。

在任何服务/接口激活前，完整私有日志与暂存文件一起发布。安装失败只移除已证明属于本次安装的对象。
删除/恢复要求显式变更同意及精确旧回执 SHA256。日志在待删除目录树外保留非秘密文件哈希，
使中断的部分清理可继续。外来或漂移状态保留以供诊断。
已提交的健康服务不会因日志收尾失败被回滚。常规安装拒绝替换、对等端变更及密钥轮换，
这些操作必须通过显式迁移，不能隐式重新生成。

## 尚待集成

项目模式 2、公共项目 CLI 的选择、SSH 接收器集成、云/来宾入口规则迁移及定向注册/吊销
仍属于任务 #128。将来宾回执/恢复/删除接入完整项目生命周期同样待完成。
此基础不改变现有模式 1 的 AWG/VLESS 加载或指纹算法。

AmneziaVPN 原生 `.vpn` 与 QR 导出仍属于任务 #129。
运行时固定值记录所选上游工具修订及已校验源码归档的 SHA256。
仅这些 API 不代表新协议已部署，
也不代表现有导出 CLI 已支持该协议。

确定性测试覆盖真实 Curve25519 公钥派生、私有材料编解码往返、
各设备的秘密边界、精确全量/分流客户端设置、拒绝无效私有输入，
以及与无关设备/监听的独立性。POSIX 文件系统测试用合成内核/服务模型覆盖崩溃、
回滚、外来状态及清理。Linux CI 还构建真实固定工具，并在临时网络命名空间校验
内核 `wg` 输出和 nft JSON，不改变桌面或生产网络。
已安装手机/桌面客户端的流量验收仍是独立门禁。渲染出的配置不能证明连通性或媒体播放结果，
也不会执行云、来宾或本地网络操作。
'''
