来源及 unit 文件、当前内核和已消耗历史，才能认定完整受管内核缺失、非活动且已排空的
unit 及空 cgroup。部分内核状态、外来文件/unit、任务/PID 和陈旧历史在缓存、入站或
运行时变更前即被拒绝。静止不代表健康，也不能证明发生重启；初始预留/暴露仍要求原有
健康证明。缓存/入站调用方通过代码依赖选择可信观察器，不能通过 JSON 选项选择。
