body = '''# 标准 WireGuard 实现边界

面向 2.1 发布的开发候选版本增加了标准 WireGuard 的底层意图模型、
私有材料编解码器及配置渲染器。这些 API 不属于已发布的 2.0.0 软件包。
架构遵循 [ADR 0023](../adr/0023-selectable-vpn-transports.md)。

## 已实现的基础

`flayer.vpn_selection.VpnProtocolSelection` 将协议绑定到已声明设备 ID 的显式子集。
新增 IP 隧道使用精确的设备/私有地址映射；AWG 保留原有设备地址字段，
VLESS 不使用隧道地址。顺序规范化，但不分配地址或重命名设备。
`Project()` 生成仅含所选协议设备与监听、共享身份和路由策略的配置模型。
无关设备、地址或监听的变化不会影响该投影。
`ParseProtocolSelections()` 只校验成员关系，不校验完整项目文件。

`flayer.profiles.wireguard` 提供经过校验的 `WireGuardSettings`、
`WireGuardPeer` 和 `WireGuardMaterial`、显式材料生成以及有界且严格的 JSON 编解码器。
标准 WireGuard 使用独立 X25519 密钥及每设备预共享密钥。
重复准备必须解码已保留材料；再次调用生成器会有意创建不同凭据。
私有字段不进入对象表示，无效输入不会在错误消息中回显。

服务器渲染器只输出自己的私钥及所选对等端的公钥/预共享密钥。
客户端渲染器只输出该设备私钥、服务器公钥、该设备预共享密钥、
显式地址、端点、MTU、路由、DNS 和 keepalive。
两种配置都不包含 AWG 混淆参数。生成材料前校验隧道成员及地址。
拒绝共享 Curve25519 身份、私有标量的等价编码、公开或复用的预共享密钥、无效子网、
TCP 监听以及不匹配的客户端端点端口。

公共 API 在内存中准备字节。凭据字节在持久化或传输前，必须进入经过所有权
验证的私有存储；不得写入日志或云元数据。
稳定服务名称由完整栈身份生成，不随对等端成员变化。

## 受管来宾服务实现

`PrepareWireGuard()` 生成包含 `server.conf`、`deployment.json` 和独立
`install.py` 的敏感服务器制品包，并为每个所选设备生成标准 `wireguard.conf`。
准备过程离线执行并保留传入的密钥材料。描述符绑定完整栈所有者、固定 tools 源码、
程序和配置的精确哈希、对等端公钥、地址与路由策略，不含客户端私钥。
AmneziaVPN 原生导出仍属于任务 #129。

来宾程序实现首次安装、精确重复校验、只读检查/状态、systemd 启停、
回执绑定的删除以及中断安装恢复。新建模式 2 项目通过固定主机密钥的 SSH
接收器调用该程序。现有模式 1 安装需要独立迁移/入口规则流程；
不得在生产来宾上手动运行来绕过此流程。

初始平台为采用 GA 6.8 内核的 Ubuntu 24.04 amd64。构建 tools 或发布受管配置前，
首次安装准入读取固定的
[Ubuntu CVE-2026-98432 JSON](https://ubuntu.com/security/cves/CVE-2026-98432.json)。
要求 `linux` 包恰有一个 `noble` 条目且状态为 `released`，运行内核的镜像包版本
不得低于该条目的修复版本。`pending` 描述、响应不可用、其他内核系列或证据含糊
均阻止激活。实现时 Ubuntu 的 noble 修复仍为 pending；目标版本不能证明修复已发布。
安装器不会升级/重启内核，也不会应用整机缓解措施；此类维护需要独立计划。

已安装回执缓存该特定 CVE 的证据、完整的运行 Ubuntu `/proc/version_signature`、
已安装镜像/模块包修订、可用模块的源码校验和及磁盘制品哈希。
已加载模块必须提供相同源码校验和；创建接口后，在 link-up 前必须取得该加载身份。
构建/源码身份缺失或不匹配均拒绝操作。这些是运行构建/源码事实和独立磁盘哈希，
并非运行镜像或已加载内存的哈希。参见 [Ubuntu 内核身份](https://ubuntu.com/kernel)
及[内核模块 ABI](https://docs.kernel.org/admin-guide/abi-stable.html)。常规状态、重复检查和启动检查
只将当前内核事实与回执比较，不重新下载元数据或安装 tools。内核变化需要显式政策维护。
此检查仅评估一个指定 CVE 基线，不代表全部内核安全；任何状态都不声称完成端到端流量或媒体验收。

Tools 从校验和固定的上游 `wireguard-tools 1.0.20260223` 归档私下构建。
有界解包不创建链接并拒绝不安全路径，仅跳过固定归档内精确识别且未使用的 wg-quick 链接。
生成的可执行文件须报告固定版本并为 Linux amd64 格式。
私有服务目录保留源码许可证。不安装软件包、不替换系统二进制，也不使用 userspace 回退。
来宾必须已具备构建依赖（`make`、编译器、libc 头文件）、`ip`、`ss`、`nft`、
`unshare`、`modinfo`、`dpkg-query`、Python 和 systemd。
回执记录编译器/make 可执行文件的哈希与版本、目标、libc/内核头文件包版本，
以及精确固定的上游构建参数。构建期间工具链不得变化，常规状态不会重新构建 tools。

完整所有者摘要确定私有目录；稳定服务、接口及 nft 表使用短所有者前缀和完整操作标记。
私有目录/文件要求精确所有权及权限。检查拒绝符号/硬链接、额外文件、
配置/二进制/单元字节变化、未知对等端/地址、占用的 UDP 端口及与现有来宾路由重叠。
私有操作锁串行化控制器变更；systemd 回调绑定精确已安装程序与单元并校验回执。

转发/NAT 规则仅使用所选接口、显式对等端源地址和声明的目的路由。
精确 JSON 策略先在临时网络命名空间编译，再与来宾实际规则比较。
程序不清空主机 ruleset、不修改全局 input 策略、不重启共享网络，
也不重置其他隧道使用的 IPv4 转发。来宾 IPv6 必须事先禁用。
现有来宾的云及入站规则迁移属于独立集成工作；服务运行本身不能证明 UDP 监听可达。

在任何服务/接口激活前，完整私有日志与暂存文件一起发布。
激活前和删除清理证据前，文件及目录边界均通过 fsync 持久化。
安装失败只移除已证明属于本次安装的对象。
删除/恢复要求显式变更同意及精确旧回执 SHA256。日志在待删除目录树外保留非秘密文件哈希，
使中断的部分清理可继续。外来或漂移状态保留以供诊断。
已提交的健康服务不会因日志收尾失败被回滚。常规安装拒绝替换、对等端变更及密钥轮换，
这些操作必须通过显式迁移，不能隐式重新生成。

## 显式项目选择与离线准备

开发候选版本通过公共加载器和离线准备 CLI 接受模式 2 私有项目。
显式重复选项才启用此格式；省略选项时保留模式 1 的精确 AWG/VLESS 模板与指纹：

```bash
flayer project init ~/flayer-wireguard --protocol wireguard
# Edit the cloud placement and administration address in project.toml first.
flayer vpn prepare --project ~/flayer-wireguard
```

重复 `--protocol` 可选择 `amneziawg`、`vless-reality` 和 `wireguard` 的任意非空组合。
OpenVPN 在其独立实现前不可用。空选择、重复或未知协议均报错，不会隐式退回旧协议对。
生成密钥前校验完整文档：拒绝未启用/未知设置、重复 UDP 监听、TCP 22、
网络重叠、无效 MTU、额外设备地址键以及超过两个 DNS 服务器。

每个所选协议表必须有显式 `device_ids`。WG 使用独立的
`[wireguard.device_addresses]` 映射；顶层 `devices.ipv4_address` 仅属于 AWG 成员，
VLESS 没有隧道地址。保留设备 ID 与分配地址，只规范化声明顺序。
不按枚举顺序分配地址，任何协议都不会隐式注册全部设备。

`SelectedVpnProject` 将完整公共项目指纹与 `TransportFingerprint()` 分开保存。
各传输指纹包括自己的所选成员、监听/设置、身份和共享路由策略，
排除其他协议的设备、监听/设置及云部署位置。
声明尚未选入协议的设备不会改变任何已保留传输字节。

准备过程创建独立受管 `server-<stack>-<protocol>-credentials` 制品包，
包含私有 `material.json` 及 `intent.sha256` 证明，并创建该协议的服务器制品包。
完全匹配的材料被解码而非重新生成。发布任何新制品包前，先校验所有已有包的完整清单和精确文件集。
自己的成员/设置变化或漂移将拒绝操作，不重写其他协议。
若后续本地制品包写入失败，已提交凭据仍可用于输入不变的重试。
现有文件所有权和 0700/0600 私有存储权限要求保持不变。

准备过程还保存受管且非秘密的 `server-<stack>-creation` 制品包：
`creation.json` 保存精确有序的六资源规范、原始创建标签、项目/计划指纹及
各协议包的独立摘要；`cloud-init.json` 保留原始 bootstrap 的精确字节。
编译读取此快照，而非按当前设置重建实例标签或 bootstrap。新建 WG 的
bootstrap 包含构建工具、kmod、iproute2 和 util-linux，不升级或重启内核。
准备过程不创建云状态或占位客户端导出。已有快照只进行校验，
不会重新生成安装程序、凭据或 bootstrap。

将旧项目编辑为模式 2 不构成迁移。保留的通用云状态或待完成操作日志、旧组合凭据、bootstrap/trust
制品包或设备导出会阻止此次准备。保留原模式 1 配置、密钥、清单及清理引用，
直至显式迁移/入口规则流程能够证明原有创建基线。

## 新建项目生命周期

新建模式 2 的 `deploy`、`status`、`recover` 和 `destroy` 使用原始六资源计划。
在准备、认证或下载供应商数据之前，变更必须获得显式同意并精确确认 scope。
提交新的 WG 虚拟机创建请求前，控制器还要求已发布 noble/linux 修复的证据；
来宾仍需校验实际运行构建。证据不可用或状态 pending 时，在分配计费资源前
拒绝创建。健康重试/status 使用来宾缓存基线；清理及删除恢复不依赖该下载。

每次云观测均校验精确 scope、类型、名称、可用区和原始创建标签。
Security group 还校验网络绑定及完整有效 IPv4 规则多重集，包含描述及重复次数。
规范化文档规定的 JSON 数字编码；拒绝 IPv6、间接目标及未知策略。
有界快照保留规则 ID。每次删除前检查所有尚存原始资源，因此 firewall 漂移
会在首台虚拟机被删除前停止清理。清理不接管未记录或已被替换的资源。
此实现部分不更新云规则，也不重写任何现有资源标签。

虚拟机实际唯一 IPv4 接口必须引用精确受管子网及唯一原始 security group，
使用保留公网 NAT 地址，且内网地址属于该子网。拒绝 IPv6、额外接口及未知绑定字段。
精确受管启动盘必须保持可写且不自动删除；拒绝额外磁盘、文件系统及本地盘。
最终按 ID 删除实例前再次完整读取绑定，并与固定快照比较，避免被更改的绑定
绕过入口检查，或删除无关的自动删除磁盘。参见提供商的
[实例绑定模式](https://yandex.cloud/en/docs/compute/api-ref/Instance/get)。

SSH 接收器最多接受三个所选传输。首先安装 WG，避免中断的 WG 事务触发
其他传输安装器；仅安装携带变更同意，随后检查为只读。
服务器程序从固定的原始制品包读取。只有受管保留 IP 与实例一致，且所有
所选服务均已校验为 active 后，才发布含实际地址的客户端文件。
IAM serial-key 标记使用原始项目指纹，即使无关设备或本地认证配置别名发生
变化也不改变；不会轮换密钥或重建资源。所选成员、监听、路由、资源规格
或部署位置的变化需要显式迁移。

云恢复保留通用持久日志及原始操作 ID。没有云日志时，显式来宾恢复只接受
观测到的 WG 回执，或用于清理空遗留元数据的独立完整缺席证明。
它不会移除健康服务或注册对等端。普通 deploy 不会修复中断的来宾事务。
Status 不接受变更选项，服务健康与客户端连通性分别报告。已授权的启动
回调会在重启后重建私有临时协调文件；status 保持只读。如果重启中断安装/删除，
且服务尚不能恢复该文件，status 可在不创建文件的情况下读取；若观测期间变更
操作创建任何锁路径，结果被丢弃。恢复仍获取排他锁并复核当前精确证明。
所有会变更状态的服务回调均在副作用前建立协调文件。全项目删除使用
原始非秘密云快照，即使私有客户端或 SSH 密钥丢失仍可清理。
本地制品被保留；清理后，旧信任或客户端导出会阻止再次部署。

## 受管单对等端运行时事务

私有 `_wireguard_peer.py` 实现一次显式注册或吊销的来宾事务。控制器打包器
输出仅依赖 stdlib 的驱动及校验和固定的维护 helper。独立加载仅接受精确的
私有 root 所有常规 helper 文件，不允许链接或符号链接祖先；执行前校验已批准
字节。Helper 仅临时存在：原已安装程序、tools 二进制、许可证、unit、所有者、
nonce 及缓存的内核/构建核验证据均保持不变。设备私钥不发送至来宾。

激活前校验精确原始规范回执、完整活动运行状态及单设备差异。改变其他对等端
密钥/地址、服务器密钥、监听、子网、路由策略或运行时固定值均报错。
在既有事务命名空间内准备完整私有候选目录及模式 2 非秘密元数据日志。
在修改活动状态前，先探测同一文件系统是否支持原子目录交换。对等端操作
不下载 tools、不生成凭据、不升级内核、不修改云入口、不重建接口，也不重启服务。

使用上游 [`wg syncconf`](https://raw.githubusercontent.com/WireGuard/wireguard-tools/v1.0.20260223/src/man/wg.8)
仅更新差异并保留未改变的会话。注册先修改内核对等端，再通过 nftables 放行其地址；
吊销先拒绝该来源，再从内核移除对等端。仅用一个删除/创建 nft 批次替换已证明
受管表，绝不清空主机 ruleset。只接受按此顺序记录的旧/新状态前缀。
无法解释的组合，或无关接口、内核、firewall 漂移，在下一次变更前停止。
Endpoint 漫游、握手时间及流量计数器不属于受管配置。

通过 Linux [`RENAME_EXCHANGE`](https://man7.org/linux/man-pages/man2/renameat2.2.html)
发布完整候选目录，确保启动时不会看到缺失或混合的配置文件。完整活动根目录
回执决定是否已提交：发布前恢复只还原指定对等端/策略前缀；发布后保留健康的
目标根目录，即使发布后的 fsync 失败也不会回滚已提交对等端。移除备份或日志前，
先持久化提交证明及目录边界。支持部分备份删除及最终空日志的恢复。
恢复必须同时提供当前回执、原始先前回执哈希及原始观测历史头。
移除任何备份前显式持久化交换的两个父目录，包括 fsync 失败后的提交重试。

独立非秘密 `peer-<owner>.json` 记录最近一次精确操作/设备、旧/新回执及 deployment
摘要，并记录前一历史哈希。记录的规范摘要形成链式历史头。应用及恢复必须提供
原始观测头；相同已完成重试必须匹配最新提交的父头。因此注册/吊销后即使配置
字节恢复原样，也无法重放陈旧请求，较长重复循环同样受保护。Status 报告当前及
事务原始历史头。这些哈希是操作前置条件，不是客户端连接密钥。
非规范元数据字节、未知文件、错误
原始证明或改变的提交历史均拒绝操作。Status 仅返回有界事实。入口要求显式
变更同意及共享的排他操作锁；只读 status 不创建协调文件，并在重启后观测期间
出现锁时丢弃结果。临时私有请求准备不改变受管安装。

确定性 POSIX 测试模拟独立内核/表状态，在真实私有文件、目录交换及 fsync 调用
基础上中断每个激活/发布/清理边界。这些模型不证明真实内核或 nft 策略。
独立隔离 Linux CI 校验真实固定工具的对等端更新、接口身份、nft echo/live 等价、
拒绝批次的原子性及无关表保留。不使用桌面网络或生产来宾。

## 对等端 SSH 边界

`SshGuestProvisioner.WireGuardPeerOperation()` 现在通过现有、独立固定主机密钥的
SSH 通道提供来宾事务。接收保留的私有服务器包、一个指定设备的注册/吊销，
以及 `status`、`apply` 或 `recover`。变更必须提供精确 scope 确认、显式同意、
当前回执和原始链式历史；恢复还必须提供原始回执。Status 拒绝变更选项。
这些检查在 SSH 前完成，同时将精确服务器角色/名称及描述符 owner 绑定到完整
栈身份，并校验保留配置/程序哈希。服务维护复用相同的强化 owner 校验。
仅名称后缀无法授权访问另一栈的来宾根目录。

只有驱动/辅助程序及服务器配置/描述符通过 SSH 私有 stdin 传输；描述符保留
原始已安装程序的固定值。Root 接收器在私有临时准备前独立校验精确四文件信封、
目标及同意，再调用有界参数向量。不转发原始 stderr。控制器拒绝重复字段、
额外输出、错误目标/描述符哈希、不一致历史事实或任意结果。
变更确认区分 `committed` 与恢复的 `not-applied`，不能替代随后的健康服务观测。
可移植测试使用内存中的 runner/staging 边界，不执行 SSH 或来宾程序。

该低层 API 不持久化控制器意图，也不签发新设备密钥。在后续控制器修订流程提供
持久日志之前，调用方必须保留完整旧/新包及原始证明。

## 私有控制器修订存储

私有 `_vpn_revisions.py` 为后续对等端控制器提供持久化原语，项目生命周期及
CLI 命令尚未调用。每次尝试先写绑定 owner 的元数据日志，再写包含新材料/配置及
保留安装程序的不可变私有包，最后在远程激活前写入包的精确摘要。摘要发布中断后
复用完整准备文件，绝不重新生成部分保留的凭据。不完整私有暂存会在任何远程操作前
停止并要求检查。

验证活动来宾结果后，先持久化独立、不可变、非秘密的完成记录，再原子更新私有
头指针并移除日志。每条记录绑定精确父记录、创建基线、旧/新传输固定值及来宾
回执/历史。恢复的未应用尝试保留准备字节供审计，仅推进本地证据；活动密钥及
来宾历史保持不变。发布重试校验已有记录/指针的精确字节。未知、缺失、带链接或
不匹配的 owner 元数据绝不自动接管。

加载器检查完整有界链（最多 4096 条记录），不依赖私有客户端密钥是否存在。
只有读取活动材料/服务器字节时才要求完整固定的请求清单。这使后续全云清理即使
客户端密钥丢失，也能保留原始非秘密所有权证明。原始创建资源/bootstrap 与其他
协议包保持不变。持久私有 advisory 锁覆盖完整的协作项目流程；缺失锁时的只读
回退不创建文件，并在竞态时丢弃观测。开放新对等端 CLI 前，仍须集成所有所选
项目入口。测试使用合成项目和真实 POSIX 私有文件/锁，不执行云、SSH 或桌面
网络操作。

## 尚待集成

`PrepareWireGuardPeerEnrollment()` 和 `PrepareWireGuardPeerRevocation()` 现在可在
内存中准备针对一个指定对等端的确定性配置/材料变更。注册必须传入调用方已保留的
新设备凭据及显式空闲地址；这些函数不生成密钥。服务器密钥、其他对等端的凭据/
地址及其客户端配置字节保持不变。拒绝无效身份、地址/密钥复用、超出设备容量的
注册以及吊销最后一个对等端。原私有材料保留供审计。移除最后一个对等端需要
显式停用协议。这些准备 API 不连接来宾、不使对等端断开、不持久化修订，也不
更新项目状态。公共项目吊销仍需要控制器修订/恢复流程；对等端 CLI
尚未提供此能力。

现有来宾上的协议增删、模式 1 迁移、显式云/来宾入口覆盖层及定向对等端
注册/吊销仍属于任务 #128。模式 2 的 Xray 运行时维护与独立设备导出命令
仍在访问提供商/修改输出前拒绝。现有模式 1 AWG/VLESS 的加载、bootstrap
