# 多语言评审记录

## 当前编写页面的评审

AIna-Dev 于 2026-10-09 将全部 **12 个英文编写页面** 与俄文和简体中文译文逐一核对。后续页面修改各自的准确评审时间记录在注册表中。共覆盖 24 份译文及 48 条编辑和技术 AI 评审记录，不声称存在人工批准。评审授权及原文和译文哈希规则见 [ADR 0015](../adr/0015-accountable-ai-translation-review.md)。

评审核对语义、自然的工程术语、命令与代码一致性、云资源修改授权、资源归属与清理、标题、链接及实际发布可用性。俄文内容现已解释具体设置和操作；Linux 与 Yandex Cloud 的目录统一使用 «каталог»。俄文 Yandex CLI 链接打开供应商的俄文说明。安装章节位于 Quick Start 之前，Quick Start 以具体的 Yandex Cloud 操作流程开始。v1.2.1 使用现有发行版的 wheel 安装；新的 VPN 流程则使用明确选定的 CI 候选构建 wheel。不宣称已经在 PyPI 发布，也不宣称稳定版 2.0 已经发布。

API 首页与项目介绍页面也已翻译。随后，品牌图片路径已修正为权威资源位置并重新评审；这些后续评审的准确时间记录在注册表中。API 首页不再重复 1.0 之前的过时兼容性说明。本地化链接保留在对应语言的 API 和工程参考页面中。新版 Quick Start 涵盖候选构建安装、私有项目设置、通过经过身份验证的连接配置虚拟机系统、两种客户端配置的导入、DNS 与路由检查以及清理。独立的 AI 评审者检查了俄文和中文术语以及协议细节。生成 API 和工程参考的译文使用单独的、与原文绑定的翻译目录；本次编写页面评审不会批准这些目录中不存在的内容。

AI 操作指南、README 提示词和 Quick Start 入口由 AIna-Dev 完成编辑与技术自审。审核涵盖版本与服务商能力的如实说明、有界付费操作批准、已有授权的保留、前置条件处理、私有状态、实际客户端验证和清理。这不是独立代理的真实部署；相关证据仍属于发布验收流程。

