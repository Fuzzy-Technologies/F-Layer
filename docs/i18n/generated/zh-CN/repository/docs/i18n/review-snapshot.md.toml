`docs/i18n/units.toml` 记录每份译文的哈希、评审者姓名、类型、角色及 UTC 时间。后续编辑需要重新评审。当前分支的评审不证明该分支已经部署到 Pages。

## v1.2.1 发布的历史验收

所有者已接受 PR #66 和 #67，最终 master 源提交为 `d61cf946ade8d7d018f69351e24a3a0ca51d1079`。[严格多语言构建与实际 Pages 部署](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37861711338) 均通过，包括受跟踪文件覆盖、已安装 wheel 一致性、渲染链接与锚点，以及每种语言的九个已批准编写页面。已在线核实 `/F-Layer/en/`、`/F-Layer/ru/`、`/F-Layer/zh-CN/` 路由，包括无草稿字样的语言名称、公司幻灯片和 Quick Start。已批准页面将评审来源保留为隐藏元数据；缺少翻译的生成参考仍回退到英文。

[Task #27](https://github.com/Fuzzy-Technologies/F-Layer/issues/27#issuecomment-6071386490) 和 [Feature #8](https://github.com/Fuzzy-Technologies/F-Layer/issues/8#issuecomment-6071392694) 在发布验收后记录完成状态。该 Feature 的三个原生子任务全部完成。原生 [release-1.2 里程碑](https://github.com/Fuzzy-Technologies/F-Layer/milestone/3) 在稳定发布前已关闭，未完成项为零。

[F-Layer v1.2.1](https://github.com/Fuzzy-Technologies/F-Layer/releases/tag/v1.2.1) 在[注释标签及可复现发行包审计](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37862618156)后发布。标签准确指向该 master 源提交；下载的 wheel、源码归档和构建记录均与已审计的哈希及大小一致。预发布 v1.2.0 保持不可变。这些记录证明本次发布通过验收，不代表未来翻译已经获批。
'''
