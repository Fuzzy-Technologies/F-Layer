body = '''
## 摘要

**预发布：release-1.2 尚未完成。** 此快照在里程碑验收完成前被发布为稳定版，其稳定分类已于 2026-10-08 撤回。Task #27 和 Feature #8 仍需要真实的人工翻译评审；稳定发布要求里程碑完成并关闭。现有标签和已审计文件保留，以便追溯。

F-Layer v1.2.0 使文档更便于检查和发布：每个受跟踪文件都在生成参考中有明确记录，EN/RU/ZH-CN 路由显示真实翻译状态。文档工具链包含 setuptools 安全修复。运行时和 CLI 行为与 1.1.0 保持兼容；俄文和简体中文内容仍明确标为草稿。

## 变更内容

### 新增

- 文件和定义清单，区分已安装 wheel 的公开 API、渲染的仓库 Markdown、语言覆盖文件，以及仅作为源码提供的工程文件。
- 完整的权威 Markdown 导航，包括政策、ADR 模板、架构、开发、发布指南和 GitHub PR 模板。
- 可执行 CLI 与可调用协议的 API 覆盖、整个包的 wheel/源码一致性、精确锚点、本地链接检查和渲染页面可达性检查。
- 已实现架构图与严格的多语言构建，包含本地化导航、草稿与回退提示，以及 18 个与原文绑定的 RU/ZH-CN 草稿页面。
- 评审交接资料，关联权威原文、两种语言草稿、必需的人工评审角色、当前源哈希和发布验证要求。

### 修复

- 修复从仓库评审资料到语言草稿源文件的生成链接，并为两种语言及保留的片段锚点提供回归检查。
- 英文、俄文和简体中文快照安装说明均选择 `v1.2.0`，保留受支持的控制台及模块命令。

### 调整

- 自动发现现有覆盖类别中的新增文件；未知或含糊类别、wheel 内容缺失会使验证失败。
- 翻译评审状态与构建成功分开记录。草稿和缺失翻译明确标注；自动化不会生成批准。

### 安全

- 文档工具链固定 setuptools `83.0.0`，修复 GHSA-h35f-9h28-mq5c / CVE-2026-59890，替换存在漏洞的 `80.9.0`。
- 保留其他文档依赖版本、Hatchling 打包后端、静态 API 渲染和现有资源归属及修改授权边界。

## 验证

- 精确的发布候选版本必须通过完整 Python 质量、严格多语言文档和可复现发行包 CI。本地检查针对文档变更、链接重写、本地化约定及软件包元数据。
- 带标签发布验证注释标签、精确 master/源码版本、重复构建逐字节一致性、源码归档重建一致性、成员归属、元数据和 wheel RECORD 哈希。
- 发布附带已审计的 wheel、源码归档和构建记录，记录准确源提交、文件大小和 SHA256。

## 不兼容变更

无。运行时 API、CLI 命令、所属资源状态约定和云服务行为均与 1.1.0 兼容。本发布增加文档和验证工具。

## 从源码试用

```bash
git clone https://github.com/Fuzzy-Technologies/F-Layer.git
cd F-Layer
git checkout v1.2.0
python -m pip install .
flayer --help
python -m flayer check --format json
```

需要 Python 3.11 或更新版本。也可以使用附带的 wheel 代替源码安装；上传包索引是由所有者单独控制的操作。

## 说明

- 在带标签的 1.1.0 基础上选择 release-1.2 已接受的 PR #46、#48、#59、#60，并进行范围有限的发布稳定化。插件发现、生态集成接口和静态站点部署配置仍为后续工作。
- 全部 18 个编写的 RU/ZH-CN 页面仍为草稿。生成 API 和尚未翻译的仓库资料明确回退到英文。人工编辑及技术评审尚未完成，因此 Task #27、Feature #8 和里程碑必须完成后才能发布稳定版。
- 本发布不执行真实云部署或 PyPI 上传。
- [详细变更记录](https://github.com/Fuzzy-Technologies/F-Layer/blob/v1.2.0/CHANGELOG.md)
- [发布来源](https://github.com/Fuzzy-Technologies/F-Layer/milestone/3)
