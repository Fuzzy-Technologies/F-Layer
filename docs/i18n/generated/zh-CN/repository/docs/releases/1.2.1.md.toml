body = '''
## 摘要

F-Layer v1.2.1 改善了文档使用体验：可以从实用的 Quick Start 开始，阅读更清晰的产品说明，并按照经过验证、没有翻译草稿提示的俄文和中文指南操作。发布现在要求里程碑完成并关闭。运行时和 CLI 行为仍与 1.1.0 及预发布的 1.2.0 快照兼容。

## 变更内容

### 新增

- 英文、俄文和简体中文 Quick Start，包含安装、离线检查、帮助及首次部署链接。
- README 和文档首页中的 F-Layer 公司幻灯片、紧凑的页眉标志及方形网站图标。
- 对全部 18 个 RU/ZH-CN 编写页面进行可追溯的 AIna 评审，与精确英文原文及译文绑定。缺失的 API 翻译仍显示英文。

### 调整

- 用工程师和潜在客户易懂的语言描述受支持的 Yandex Cloud、安全 SSH 网关及诊断流程。
- 稳定发布前要求完成原生发布里程碑；标题使用 `F-Layer vX.Y.Z`，已发布标签保持不变。
- 翻译评审记录保存在元数据中，不再在每个已批准页面显示提示。AI 评审明确标识，绝不称为人工批准。

### 修复

- 首页幻灯片被裁切及页眉标志过大的问题。
- 俄文资源归属措辞、中文虚拟机术语、本地化文档链接，以及统一的 v1.2.1 安装示例。
- 翻译变更检查现在会在译文修改时撤销 AI 批准，即使英文原文没有变化。

## 验证

- [Python 质量](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37861711357)在精确发布的 master 提交上通过。
- [文档质量检查](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37861711338)在精确发布的 master 提交上通过。
- [发行包验证](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37861711292)在精确发布的 master 提交上通过。
- [多语言 Pages 部署](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37861711338)从这些精确源文件成功完成。全部 18 个俄文和中文编写译文通过了可追溯的 AI 评审；缺失的参考翻译继续回退到英文。
- [release-1.2](https://github.com/Fuzzy-Technologies/F-Layer/milestone/3) 已完成并关闭，未完成项为零；Task #27 和 Feature #8 的验收记录在稳定发布前完成。
- [带标签发行包审计](https://github.com/Fuzzy-Technologies/F-Layer/actions/runs/37862618156)通过了注释标签与版本归属、重复构建字节一致性、源码归档重建一致性、归档归属和 wheel RECORD 检查。
- 发布前已下载附带的 wheel、源码归档及 build-evidence.json，并核对其已审计 SHA256 和大小。
- 测试使用隔离资源；没有执行真实云修改或 PyPI 上传。

源提交：d61cf946ade8d7d018f69351e24a3a0ca51d1079。

## 不兼容变更

运行时 API 和 CLI 命令没有不兼容变更。文档评审元数据现在支持明确获授权的 AI 评审者；默认仍只允许人工评审。

## 从源码试用

```bash
git clone https://github.com/Fuzzy-Technologies/F-Layer.git
cd F-Layer
git checkout v1.2.1
python -m pip install .
flayer --help
python -m flayer check --format json
```

需要 Python 3.11 或更新版本。发布到包索引是独立操作。

## 说明

- 此补丁在已发布基线上完成 release-1.2 的文档和安全范围；后续运行时代码仍保留在 develop。
- 预发布 v1.2.0 标签和已审计文件保持不变，以便追溯。
- 本发布不执行真实云部署或 PyPI 上传。
- [详细变更记录](https://github.com/Fuzzy-Technologies/F-Layer/blob/v1.2.1/CHANGELOG.md)
- [发布里程碑](https://github.com/Fuzzy-Technologies/F-Layer/milestone/3)
