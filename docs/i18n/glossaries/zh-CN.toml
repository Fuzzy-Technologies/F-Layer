[[terms]]
id = "concept:infrastructure.public-intent"
english = "public intent"
preferred = "不含凭据的目标配置"
avoid = []
note = "Public contrasts with secret material in VPN models; it does not authorize publishing the project configuration. Public APIs and public IP addresses retain their own meanings."
references = ["docs/architecture/amneziawg.md", "docs/adr/0019-private-vpn-project-workflow.md"]

[[terms]]
id = "concept:infrastructure.packet-forwarding"
english = "packet forwarding"
preferred = "数据包转发"
avoid = []
note = "Distinguish IP packet forwarding from Python package distribution and SSH local port forwarding."
