id = "concept:infrastructure.cli-profile"
english = "CLI profile"
preferred = "CLI 命名配置（profile）"
avoid = []
note = "A named CLI settings collection, distinct from a configuration file path and a deployment profile. Use 命名配置 after defining profile on the page."
