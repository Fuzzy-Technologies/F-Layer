      <stop offset="0" stop-color="#66d9ef"/>
      <stop offset="0.52" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <linearGradient id="fl-echo" x1="39" y1="35" x2="53" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66d9ef"/>
      <stop offset="0.5" stop-color="#bd7aff"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#101316" stroke="#2a343d" stroke-width="2"/>
  <path d="M12 14H31V20H19V28H29V34H19V50H12Z" fill="#e7f8ff"/>
  <path d="M35 14V49H53" fill="none" stroke="url(#fl-spectrum)" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M40 35V43H53" fill="none" stroke="url(#fl-echo)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>
  <path d="M45 35V38H53" fill="none" stroke="#66d9ef" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>
