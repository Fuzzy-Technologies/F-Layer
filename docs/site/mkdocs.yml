site_name: F-Layer
site_description: Deploy cloud servers, manage their resources and check availability with F-Layer.
site_url: https://fuzzy-technologies.github.io/F-Layer/en/
repo_url: https://github.com/Fuzzy-Technologies/F-Layer
repo_name: Fuzzy-Technologies/F-Layer
edit_uri: edit/develop/docs/site/content/en/
docs_dir: content/en
site_dir: ../../_build/api-reference/site/en
strict: true
use_directory_urls: true
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  logo: assets/brand/flayer-horizontal.svg
  favicon: assets/brand/flayer-sign.svg
  font: false
  palette:
    scheme: slate
    primary: black
    accent: deep purple
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Overview: index.md
  - User guide:
      - Install: guide/installation.md
      - Quick Start: guide/index.md
      - Configuration: guide/configuration.md
      - CLI: guide/cli.md
      - First deployment: guide/first-deployment.md
  - Architecture: architecture.md
  - Development: development.md
  - Documentation contracts: documentation.md
  - Project identity: brand.md
  - API reference: api/index.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - !ENV FLAYER_INSTALLED_PACKAGES
          options:
            allow_inspection: false
            force_inspection: false
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            heading_level: 2
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            signature_crossrefs: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra:
  alternate:
    - name: English
      link: https://fuzzy-technologies.github.io/F-Layer/en/
      lang: en
    - name: Русский
      link: https://fuzzy-technologies.github.io/F-Layer/ru/
      lang: ru
    - name: 简体中文
      link: https://fuzzy-technologies.github.io/F-Layer/zh-CN/
      lang: zh-CN

extra_css:
  - assets/stylesheets/flayer.css
copyright: Technologies · Knowledge · Science
