[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "f-layer"
dynamic = ["version"]
description = "Modular infrastructure automation platform for secure cloud environments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Fuzzy Technologies" }]
keywords = ["infrastructure", "cloud", "automation", "security", "yandex-cloud"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Fuzzy-Technologies/F-Layer"
Repository = "https://github.com/Fuzzy-Technologies/F-Layer"
Issues = "https://github.com/Fuzzy-Technologies/F-Layer/issues"
Changelog = "https://github.com/Fuzzy-Technologies/F-Layer/releases"

[project.scripts]
flayer = "flayer.__main__:Main"

[project.optional-dependencies]
dev = [
    "hatchling==1.32.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flayer"]

[tool.hatch.version]
source = "regex"
path = "src/flayer/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/tools", "/docs", "/examples", "/.github",
    "/README.md", "/LICENSE", "/AGENTS.md", "/DEVELOPMENT_PROTOCOL.md",
    "/SECURITY.md", "/CONTRIBUTING.md", "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-config --strict-markers --cov=flayer --cov-branch --cov-report=term-missing"
markers = [
    "unit: isolated module behavior using deterministic local fixtures",
    "contract: shared interfaces and persisted data compatibility",
    "functional: complete local workflows without real infrastructure",
    "integration: adapter composition using isolated fakes or mocks",
    "e2e: end-to-end local scenarios without real cloud mutation",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
strict = true

[tool.coverage.run]
branch = true
source = ["flayer"]
relative_files = true

[tool.coverage.report]
fail_under = 80
exclude_lines = []
partial_branches = []
