[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "f-layer"
version = "0.0.0"
description = "Modular infrastructure automation platform for secure cloud environments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flayer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/tools", "/docs", "/.github",
    "/README.md", "/LICENSE", "/AGENTS.md", "/DEVELOPMENT_PROTOCOL.md",
    "/SECURITY.md", "/CONTRIBUTING.md", "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-config --strict-markers --cov=flayer --cov-branch --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
strict = true

[tool.coverage.run]
branch = true
source = ["flayer"]
relative_files = true

[tool.coverage.report]
fail_under = 80
exclude_lines = []
partial_branches = []
